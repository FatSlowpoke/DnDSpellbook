,"custom":true},{"id":"cmqwltwbma9b","name":"Водяная сфера","level":4,"classes":["druid","sorcerer","wizard"],"time":"1 действие","range":"18","dur":"До 1 минуты","conc":true,"rit":false,"desc":["Вы создаёте сферу воды с радиусом 1 клетки в указанной точке в пределах дистанции. Сфера может парить в воздухе, однако не выше, чем в 2 клетках над землёй. Сфера существует до тех пор, пока действует заклинание.","Все существа, оказавшиеся внутри сферы, должны совершить спасбросок Силы. В случае успеха существо выталкивается из сферы в ближайшее свободное пространство по выбору существа. Существа как минимум Огромного размера автоматически преуспевают в этом спасброске, а существа меньшего размера могут добровольно провалить спасбросок. При провале существо становится опутанным сферой и погружённым в воду. В конце каждого своего хода опутанная цель может повторять спасбросок, оканчивая на себе эффект заклинания при успехе.","Сфера может опутать до четырёх существ Среднего или меньшего размера или одно Большое существо. Если сфера опутывает существо, превышая при этом данное ограничение, то случайное из уже захваченных существ выпадает из сферы и падает ничком в 1 клетке от неё.","Вы можете действием переместить сферу на расстояние до 6 клеток по прямой. Если на её пути оказывается яма, обрыв или другой провал, она безопасно спускается до тех пор, пока не достигнет высоты в 2 клетки над полом. Все захваченные существа перемещаются вместе со сферой. Вы можете направить сферу в существ, заставляя их совершить спасбросок.","Когда заклинание заканчивается, сфера падает на землю и гасит все источники огня немагического происхождения в пределах 6 клеток. Все существа, которые находились в ней, ничком падают на землю. После этого вода исчезает."],"higher":[],"custom":true},{"id":"cmqwlu139x4l","name":"Гигантское насекомое","level":4,"classes":["druid"],"time":"1 действие","range":"6","dur":"До 10 минут","conc":true,"rit":false,"desc":["Вы превращаете на время действия заклинания до десяти многоножек, трёх пауков, пяти ос или одного скорпиона, находящихся в пределах дистанции, в гигантские версии своих сородичей. Многоножка становится гигантской многоножкой, паук становится гигантским пауком, оса становится гигантской осой, а скорпион становится гигантским скорпионом.","Все существа повинуются вашим устным командам, и в бою они в каждом раунде действуют в ваш ход. Характеристики этих чудовищ есть у Мастера, и их действия и перемещения контролирует он.","Существо сохраняет гигантский размер всю длительность заклинания, пока его хиты не опустятся до 0, или пока вы не окончите действием эффект на нём.","Мастер может позволить вам выбирать другие цели. Например, если вы превращаете жука, его гигантская версия может обладать теми же характеристиками, что и гигантская оса."],"higher":[],"custom":true},{"id":"cmqwlu5y0skv","name":"Дух смерти","level":4,"classes":["sorcerer","warlock","wizard"],"time":"1 действие","range":"12","dur":"До 1 часа","conc":true,"rit":false,"desc":["Вы вызываете дух, воплощающий саму смерть. Дух проявляется в свободном пространстве, которое вы можете видеть в пределах дистанции. Дух использует блок статистики духа жнеца [reaper spirit]. Дух исчезает, когда его хиты опускаются до 0 или когда заклинание заканчивается.","Дух жнеца — дружественен к вам и вашим спутникам. В бою дух получает вашу инициативу и ходит сразу же после вас. Он подчиняется вашим вербальным командам (никаких действий от вас не требуется). Если вы не отдаете духу никаких команд, он совершает действие Уклонение и использует своё движение, чтобы избежать опасности."],"higher":["Когда вы накладываете это заклинание, используя ячейку заклинаний 5-го уровня или выше, характеристики призываемого существа изменяются в соответствии с описанием в блоке статистики"],"custom":true},{"id":"cmqwluaff1g4","name":"Едкий шар","level":4,"classes":["sorcerer","wizard"],"time":"1 действие","range":"30","dur":"Мгновенная","conc":false,"rit":false,"desc":["В указанной вами точке в пределах дистанции появляется сияющий шар изумрудно-зелёной кислоты диаметром 1 фут, взрывающийся сферой с радиусом 4 клеток. Все существа в этой области должны совершить спасбросок Ловкости. При провале существо получает 10d4 урона кислотой и ещё 5d4 урона кислотой в конце своего следующего хода. В случае успешного спасброска существо получает половину первичного урона и не получает урона в конце своего следующего хода."],"higher":["Если вы накладываете это заклинание, используя ячейку 5-го уровня или выше, то первичный урон увеличивается на 2d4 за каждый уровень ячейки выше 4-го."],"custom":true},{"id":"cmqwluevq2qg","name":"Запечатывание врат","level":4,"classes":["sorcerer","warlock","wizard"],"time":"1 минута","range":"12","dur":"24 часа","conc":false,"rit":false,"desc":["Вы укрепляете ткань плана в 6-клеточном кубе, который вы можете видеть в пределах досягаемости. Внутри этой области порталы закрываются и не могут быть открыты в течение длительности. Заклинания и другие эффекты, позволяющие путешествовать по планам или открывать порталы, такие как врата [gate] или уход в иной мир [plane shift], проваливаются, если используются для входа в эту область или для выхода из неё. Куб неподвижен."],"higher":["Когда вы накладываете это заклинание, используя ячейку заклинания 6-го уровня или выше, заклинание длится до тех пор, пока не будет рассеяно."],"custom":true},{"id":"cmqwlujddjoc","name":"Изгнание","level":4,"classes":["cleric","paladin","sorcerer","warlock","wizard"],"time":"1 действие","range":"12","dur":"До 1 минуты","conc":true,"rit":false,"desc":["Вы пытаетесь послать одно существо, которое видите в пределах дистанции, на другой план существования. Цель должна преуспеть в спасброске Харизмы, иначе будет изгнана.","Если цель родом с того плана существования, на котором находитесь вы, вы изгоняете её в безопасный демиплан. Находясь там, цель недееспособна. Она остается там, пока активно заклинание, после чего возвращается в пространство, из которого исчезла, или ближайшее свободное пространство, если то место занято.","Если цель родом не с того плана существования, на котором находитесь вы, цель изгоняется с негромким хлопком, возвращаясь на свой родной план. Если заклинание окончится раньше чем через 1 минуту, цель возвращается в пространство, из которого исчезла, или ближайшее свободное пространство, если то место занято. В противном случае цель не возвращается."],"higher":["Если вы накладываете это заклинание, используя ячейку 5-го уровня или выше, вы можете сделать целью одно дополнительное существо за каждый уровень ячейки выше четвертого."],"custom":true},{"id":"cmqwluofflgv","name":"зготовление","level":4,"classes":["artificer","wizard"],"time":"10 минут","range":"24","dur":"Мгновенная","conc":false,"rit":false,"desc":["Вы превращаете сырьё в готовое изделие из этого материала. Например, вы можете создать деревянный мост из нескольких деревьев, верёвку из груды пеньки или одежду изо льна или шерсти.","Выберите сырьё, которое видите в пределах дистанции. Вы можете создать предмет Большого или меньшего размера (помещающийся в куб с длиной ребра 2 клетки или восемь соединённых кубов с длиной ребра 1 клетка) при условии, что сырья хватит. Если вы работаете с металлом, камнем или другим минеральным материалом, создаваемый предмет не может быть больше Среднего размера (должен помещаться в один куб с длиной ребра 1 клетка). Качество предметов, изготавливаемых этим заклинанием, напрямую зависит от качества сырья.","Этим заклинанием нельзя создавать и изменять существ и магические предметы. Вы также не можете создавать с его помощью предметы, обычно требующие высокого мастерства, такие как ювелирные изделия, оружие, стекло или доспехи, если только вы не владеете ремесленным инструментом, необходимым для создания таких предметов."],"higher":[],"custom":true},{"id":"cmqwlutvzghb","name":"Кабинет Морденкайнена","level":4,"classes":["artificer","wizard"],"time":"10 минут","range":"24","dur":"24 часа","conc":false,"rit":false,"desc":["Вы создаёте в пределах дистанции защищенное магией место. Это куб с длиной ребра от 5 до 20 клеток. Заклинание длится, пока не окончится, или вы не окончите его действием.","Когда вы накладываете это заклинание, вы решаете, какую именно безопасность обеспечивает заклинание, выбирая все или некоторые из следующих свойств:","Звуки не проходят сквозь границу защищенного пространства.","Граница защищенного пространства выглядит темной и затуманенной, блокируя обзор (в том числе и тёмное зрение) сквозь неё.","Сенсоры, создаваемые заклинаниями школы Прорицания, не могут появляться в защищенной области и проходить сквозь её периметр.","Существа в области не могут становиться целями заклинаний школы Прорицания.","Ничто не может телепортироваться в охраняемую область или из неё.","В охраняемой области блокируются планарные перемещения.","Накладывание этого заклинания на одно и то же место в течение года делает этот эффект постоянным."],"higher":["Если вы накладываете это заклинание, используя ячейку 5-го уровня или выше, вы можете увеличить размер куба на 20 клеток за каждый уровень ячейки выше 4-го. Таким образом, это заклинание, использованное ячейкой 5-го уровня, может создать куб с длиной ребра 40 клеток."],"custom":true},{"id":"cmqwluybxp6n","name":"Леомундов потайной сундук","level":4,"classes":["artificer","wizard"],"time":"1 действие","range":"Касание","dur":"Мгновенная","conc":false,"rit":false,"desc":["Вы прячете сундук вместе со всем его содержимым на Эфирном плане. Вы должны касаться и сундука, и его миниатюрной копии, служащей материальным компонентом для заклинания. Сундук может содержать до 12 кубических футов неживой материи (3×2×2 фута).","Пока сундук остаётся на Эфирном плане, вы можете действием прикоснуться к копии, чтобы вернуть сундук. Он появляется в свободном пространстве на полу в пределах 1 клетки от вас. Вы можете отослать сундук обратно на Эфирный план, прикоснувшись действием к сундуку и его копии.","Спустя 60 дней появляется накопительный шанс 5% в день, что эффект заклинания окончится. Эффект оканчивается, если вы наложите это заклинание ещё раз, если копия сундука будет уничтожена или если вы окончите это заклинание действием. Если заклинание оканчивается, а сундук находится на Эфирном плане, он безвозвратно теряется."],"higher":[],"custom":true},{"id":"cmqwlv2w43z5","name":"Магический глаз","level":4,"classes":["artificer","wizard"],"time":"1 действие","range":"6","dur":"До 1 часа","conc":true,"rit":false,"desc":["Вы в пределах дистанции создаёте невидимый магический глаз, который парит в воздухе на время длительности.","Вы мысленно воспринимаете зрительную информацию с глаза, у которого обычное зрение и тёмное зрение в пределах 6 клеток. Глаз смотрит во всех направлениях.","Вы можете действием переместить глаз на 6 клеток в любом направлении. Глаз может удаляться от вас на любое расстояние, но не может уходить на другие планы существования. Сплошные препятствия блокируют движение глаза, но он может проходить через отверстия диаметром в 1 дюйм (2,5 сантиметра)."],"higher":[],"custom":true},{"id":"cmqwlv7ne274","name":"Облачение тени","level":4,"classes":["warlock"],"time":"1 действие","range":"На себя","dur":"До 1 минуты","conc":true,"rit":false,"desc":["Пламевидные тени окутывают ваше тело на всё время действия заклинания, в результате чего вы становитесь сильно заслонённым для других. Тени превращают тусклый свет в пределах 2 клеток от вас в темноту, а яркий свет в той же области — в тусклый свет.","Вы получаете сопротивление урону излучением до окончания действия заклинания. Кроме того, всякий раз, когда существо, находящееся в пределах 2 клеток от вас, попадает по вам атакой, тени атакуют его, причиняя 2d8 урона некротической энергией."],"higher":[],"custom":true},{"id":"cmqwlvc6abj7","name":"Оглушающая кара","level":4,"classes":["paladin"],"time":"1 бонусное действие","range":"На себя","dur":"До 1 минуты","conc":true,"rit":false,"desc":["В следующий раз, когда вы попадёте по существу рукопашной атакой оружием, пока активно это заклинание, ваша атака пронзает не только его тело, но и сознание, и атака дополнительно наносит цели 4d6 урона психической энергией. Цель должна совершить спасбросок Мудрости. При провале она до конца своего следующего хода совершает с помехой броски атаки и проверки характеристик, а также не может совершать реакции."],"higher":[],"custom":true},{"id":"cmqwlvgfe1me","name":"Огненная стена","level":4,"classes":["druid","sorcerer","wizard"],"time":"1 действие","range":"24","dur":"До 1 минуты","conc":true,"rit":false,"desc":["Вы создаете стену из огня на твердой поверхности в пределах дистанции. Вы можете создать стену до 12 клеток в длину, 4 клетки в высоту и 1 фут толщиной, или замкнутой кольцом стеной до 4 клетки диаметром, 4 клетки высотой и толщиной 1 фут. Стена непрозрачная и существует, пока активно заклинание.","Когда стена появляется, все существа в её области должны совершить спасбросок Ловкости. При провале они получают урон огнём 5d8 или половину этого урона при успехе.","Одна сторона стены, выбранная при накладывании заклинания, причиняет урон огнём 5d8 всем существам, оканчивающим ход в пределах 2 клеток от этой стороны или внутри стены. Существа получают такой же урон когда впервые за ход входят в стену или оканчивают там ход. Другая сторона стены не причиняет урон."],"higher":["Если вы накладываете это заклинание, используя ячейку 5 уровня или выше, урон увеличивается на 1d8 за каждый уровень ячейки выше четвертого."],"custom":true},{"id":"cmqwlvkpdi5l","name":"Переносящая дверь","level":4,"classes":["bard","sorcerer","warlock","wizard"],"time":"1 действие","range":"100","dur":"Мгновенная","conc":false,"rit":false,"desc":["Вы телепортируетесь в другое пространство в пределах дистанции. Вы оказываетесь точно в выбранном месте. Это может быть место, которое вы видели, которое вы представляете, или которое вы можете описать указаниями направления и расстояния, например, «40 клеток подо мной» или «на северо-запад, вверх под углом 45 градусов, на 60 клеток».","Вы можете взять с собой предметы, если их вес позволяет вам их нести. Вы также можете взять с собой одно согласное существо, с размером не больше вашего, которое тоже может нести дозволенный вес предметов. При накладывании заклинания существо должно находиться в пределах 1 клетки от вас.","Если вы должны оказаться в месте, уже занятом существом или предметом, вы и все перемещающиеся с вами существа получаете 4d6 урона силовым полем, и заклинание вас не телепортирует."],"higher":[],"custom":true},{"id":"cmqwlvr15yd7","name":"Подчинение зверя","level":4,"classes":["druid","ranger","sorcerer"],"time":"1 действие","range":"12","dur":"До 1 минуты","conc":true,"rit":false,"desc":["Вы пытаетесь взять под контроль Зверя, которого видите в пределах дистанции. Зверь должен преуспеть в спасброске Мудрости, иначе он станет очарован вами на время действия заклинания. Если вы или дружественные вам существа сражаются с ним, он совершает спасбросок с преимуществом.","Пока Зверь очарован, вы обладаете телепатической связью с ним, пока вы оба находитесь на одном плане существования. При помощи этой связи вы можете отдавать ему команды, пока находитесь в сознании (действие не требуется), и он должен будет их выполнять. Вы можете указать общее действие, такое как «атакуй вон то существо», «беги отсюда» или «принеси вот это». Если существо выполняет приказ и не получает дальнейших указаний от вас, оно в меру своих сил обороняется и защищает себя.","Вы можете действием захватить полный контроль над целью. До конца вашего следующего хода существо совершает только выбранные вами действия, и не делает ничего, что вы ему не позволяете. В это время вы можете заставлять существо совершать реакции, но при этом вы тратите и свою реакцию тоже.","Каждый раз, когда цель получает урон, она совершает новый спасбросок Мудрости от этого заклинания. В случае успеха заклинание оканчивается."],"higher":["Если вы накладываете это заклинание ячейкой 5-го уровня, длительность становится «Концентрация, вплоть до 10 минут». Если вы накладываете это заклинание ячейкой 6-го уровня, длительность становится «Концентрация, вплоть до 1 часа». Если вы накладываете это заклинание ячейкой 7-го уровня или выше, длительность становится «Концентрация, вплоть до 8 часов»."],"custom":true},{"id":"cmqwlw0um92d","name":"Поиск высшего скакуна","level":4,"classes":["paladin"],"time":"10 минут","range":"6","dur":"Мгновенная","conc":false,"rit":false,"desc":["Вы призываете духа, который принимает форму верного величественного скакуна. Появляясь в свободном пространстве в пределах дистанции, дух принимает форму, которую вы выбираете: грифон [griffon], пегас [pegasus], перитон [peryton], лютый волк [dire wolf], носорог [rhinoceros] или саблезубый тигр [saber-toothed tiger].","Статистика существа соответствует статистике выбранной формы, хотя на самом деле оно является Исчадием, Небожителем или Феей (по вашему выбору), а не его обычным существом. Кроме того, если его Интеллект равен 5 или меньше, его Интеллект становится равен 6, и он получает возможность понимать один язык на ваш выбор, на котором вы разговариваете.","Вы контролируете скакуна в бою. Пока он находится в пределах 1 мили от вас, вы можете общаться с ним телепатически. Находясь верхом на скакуне, вы можете делать так, что наложенные вами заклинания, нацеливающиеся только на вас, будут нацелены ещё и на скакуна.","Когда хиты скакуна опускаются до 0, он исчезает, не оставляя физического тела. Вы можете также в любое время отпустить скакуна действием, заставляя его исчезнуть. В любом случае, повторное использование этого заклинания призывает этого же скакуна, восстанавливая хиты до максимума и снимая с него все состояния.","У вас не может быть больше одного скакуна, призванного этим заклинанием или заклинанием поиск скакуна [find steed], одновременно. Вы можете действием навсегда отпустить скакуна, освободив его от уз и заставляя исчезнуть.","Каждый раз, когда скакун исчезает, он оставляет предметы, которые нёс или которые были надеты на него."],"higher":[],"custom":true},{"id":"cmqwlw4vvqsm","name":"Поиск существа","level":4,"classes":["bard","cleric","druid","paladin","ranger","wizard"],"time":"1 действие","range":"На себя","dur":"До 1 часа","conc":true,"rit":false,"desc":["Опишите или назовите известное вам существо. Вы чувствуете направление к этому существу, пока оно находится в пределах 1 000 футов от вас. Если существо перемещается, вы узнаете, в какую сторону оно направляется.","Это заклинание может искать конкретное известное вам существо, или ближайшее существо конкретного вида (например, человек или единорог), если вы хотя бы раз видели такое существо вблизи (в пределах 6 клеток). Если описанное или названное вами существо находится в другом обличье, например, под эффектом заклинания превращение [polymorph], это заклинание не найдет это существо.","Это заклинание не может обнаружить существ, если прямой путь между вами перерезан текущей водой шириной как минимум 2 клетки."],"higher":[],"custom":true},{"id":"cmqwlw9d3b65","name":"Превращение","level":4,"classes":["bard","druid","sorcerer","wizard"],"time":"1 действие","range":"12","dur":"До 1 часа","conc":true,"rit":false,"desc":["Это заклинание придаёт новый облик существу, которое вы видите в пределах дистанции. Несогласное существо должно совершить спасбросок Мудрости, чтобы избежать эффекта. Перевёртыши автоматически преуспевают в этом спасброске. Это заклинание не может подействовать на цель, у которой 0 хитов.","Превращение длится, пока активно заклинание, пока хиты цели не опустятся до 0, или пока она не умрёт. Новый облик может принадлежать Зверю, чей показатель опасности не превышает показатель опасность цели (или уровень цели, если у неё нет показателя опасности). Игровая статистика цели, включая значения ментальных характеристик, заменяются статистикой выбранного Зверя. У цели остаются мировоззрение и личность.","Цель принимает хиты нового облика. При возвращении в обычный облик количество её хитов будет как до превращения. Если она возвращается в свой облик от того, что хиты опустились до 0, весь излишний урон перенесётся на обычный облик. Если излишний урон не опускает хиты обычного облика существа до 0, оно не теряет сознание.","Действия существа в новом облике ограничены теми, что доступны его новому облику, и оно не может говорить, накладывать заклинания и совершать другие действия, требующие рук или речи.","Снаряжение цели сливается с её новым обликом. Существо не может активировать, использовать, надевать своё снаряжение или получать от него какие-то иные преимущества."],"higher":[],"custom":true},{"id":"cmqwlwdl7aas","name":"Предсказание","level":4,"classes":["cleric","druid","wizard"],"time":"1 действие","range":"На себя","dur":"Мгновенная","conc":false,"rit":true,"desc":["Ваша магия и жертвоприношение связывают вас с богом или его слугой. Вы задаёте один вопрос о конкретной цели, событии, или деятельности, которая произойдёт в течение следующих 7 дней. Мастер даёт на это честный ответ. Это может быть короткая фраза, загадочный стих или знамение.","Это заклинание не учитывает всевозможные обстоятельства, способные изменить исход событий, такие как накладывание дополнительных заклинаний и потеря и приобретение спутников.","Если вы накладываете это заклинание несколько раз до окончания продолжительного отдыха, существует накопительный шанс 25 процентов за каждое накладывание, начиная со второго, что вы получите случайный ответ. Мастер совершает этот бросок скрытно."],"higher":[],"custom":true},{"id":"cmqwlwk5u6u7","name":"Призыв высшего демона","level":4,"classes":["warlock","wizard"],"time":"1 действие","range":"12","dur":"До 1 часа","conc":true,"rit":false,"desc":["Вы произносите инфернальные слова, призывая одного демона из хаоса Бездны. Вы выбираете тип демона, показатель опасности которого равен 5 или ниже, например, теневой демон [shadow demon] или барлгура [barlgura]. Он появляется в свободном пространстве, которое вы можете видеть в пределах дистанции. Демон исчезает, когда его хиты опускаются до 0 или когда заклинание заканчивается.","Совершите бросок инициативы за демона, который будет совершать свои собственные ходы. Когда вы призываете его и в каждый свой ход после этого, вы можете дать вербальную команду (действий не требуется), сообщая ему, что он должен делать в свой следующий ход. Если вы не даёте никаких команд, демон тратит свой ход, атакуя любое существо в пределах досягаемости, которое атаковало его.","В конце каждого своего хода демон совершает спасбросок Харизмы. Он совершает этот спасбросок с помехой, если вы назовёте его истинное имя. В случае провала демон продолжает подчиняться вам.","При успехе, демон освобождается из-под вашего контроля на всё оставшееся время и тратит свои последующие ходы, преследуя и атакуя ближайших не-демонов в меру своих способностей. Если вы перестанете удерживать концентрацию на заклинании до того, как оно подойдёт к концу своей длительности, неконтролируемый демон не исчезнет в течение 1d6 раундов, если его хиты ещё не равны 0.","Частью заклинания вы можете начертить на земле круг кровью, используемой в качестве материального компонента. Круг должен быть достаточного размера, чтобы описать занимаемое вами пространство. Пока заклинание длится, призванный демон не может пересечь круг или разрушить его, и он не может атаковать никого в нём. Если материальный компонент использован подобным образом, он расходуется при окончании заклинания."],"higher":["Если вы накладываете это заклинание, используя ячейку заклинания 5-го уровня или выше, показатель опасности увеличивается на 1 за каждый уровень ячейки выше четвёртого."],"custom":true},{"id":"cmqwlwp09qm3","name":"Призыв духа аберрации","level":4,"classes":["warlock","wizard"],"time":"1 действие","range":"18","dur":"До 1 часа","conc":true,"rit":false,"desc":["Вы призываете духа аберрации [aberrant spirit]. Он проявляется в свободном пространстве, которое вы можете видеть в пределах дистанции. Воплощённая форма духа использует блок статистики духа аберрации [aberrant spirit]. Выберите тип духа при накладывании заклинания: бехолдер, слаад или звёздное порождение. Дух принимает форму выбранной Аберрации и имеет соответствующие признаки, описанные в блоке статистики. Существо исчезает, когда его хиты опускаются до 0 или когда заклинание заканчивается.","Это существо дружелюбно к вам и вашим товарищам. В бою существо получает вашу инициативу, и ходит сразу же после вас. Оно подчиняется вашим вербальным командам (никаких действий от вас не требуется). Если вы ничего не приказываете, то оно использует действие Уклонение и перемещается, избегая опасностей."],"higher":["Когда вы накладываете это заклинание, используя ячейку 5-го уровня или выше, характеристики призываемого существа изменяются в соответствии с описанием в блоке статистики."],"custom":true},{"id":"cmqwlwtg8tso","name":"Свобода перемещения","level":4,"classes":["artificer","bard","cleric","druid","ranger"],"time":"1 действие","range":"Касание","dur":"1 час","conc":false,"rit":false,"desc":["Вы касаетесь согласного существа. Пока заклинание активно, на перемещения цели не влияет труднопроходимая местность, а заклинания и прочие магические эффекты не могут ни уменьшить её скорость, ни сделать её парализованной или опутанной.","Цель может также потратить 1 клетка перемещения, чтобы автоматически высвободиться из немагических оков, таких как кандалы или захват другого существа. Более того, нахождение под водой не накладывает штрафы на перемещение и атаки цели."],"higher":[],"custom":true},{"id":"cmqwlxjgjfhv","name":"Смятение","level":4,"classes":["bard","druid","sorcerer","wizard"],"time":"1 действие","range":"18","dur":"До 1 минуты","conc":true,"rit":false,"desc":["Это заклинание атакует и скручивает сознание существ, порождая галлюцинации и провоцируя на необдуманные действия. Все существа в сфере с радиусом 2 клеток с центром на точке, выбранной в пределах дистанции, должны преуспеть в спасброске Мудрости, иначе попадут под действие эффекта.","Попавшая под эффект цель не может совершать реакции и должна бросать d10 в начале каждого своего хода, чтобы определить свое поведение в этом ходу.","d10 - Поведение\n1 - Существо использует все свое перемещение на движение в случайном направлении. Для определения направления бросьте 1d8, назначив каждой грани свое направление. Действие в этом ходу существо не совершает.\n2-6 - Существо в этом ходу не перемещается и не совершает действий.\n7-8 - Существо действием совершает рукопашную атаку по случайным образом выбранному существу в пределах досягаемости. Если в пределах досягаемости нет других существ, существо в этот ход ничего не делает.\n9-10 - Существо может действовать и перемещаться как обычно.","В конце каждого своего хода цель может совершать спасбросок Мудрости. При успехе на этой цели эффект оканчивается."],"higher":["Если вы накладываете это заклинание, используя ячейку 5-го уровня или выше, радиус сферы увеличивается на 1 клетка за каждый уровень ячейки выше четвертого."],"custom":true},{"id":"cmqwlxps2akj","name":"Страж веры","level":4,"classes":["cleric"],"time":"1 действие","range":"6","dur":"8 часов","conc":false,"rit":false,"desc":["В выбранной и видимой вами свободной клетке в пределах дистанции появляется и начинает парить Большой призрачный страж. Страж занимает своё пространство, и его контуры плохо видны за исключением сверкающего меча и щита, украшенного символом вашего божества.","Все существа, враждебные вам, перемещающиеся впервые за ход в пространство, находящееся в пределах 2 клеток от стража, должны преуспеть в спасброске Ловкости. При провале такое существо получает урон излучением 20, или половину этого урона при успехе. Страж исчезает, когда причинит суммарно 60 урона."],"higher":[],"custom":true},{"id":"cmqwlxuihc2z","name":"Усыхание","level":4,"classes":["druid","sorcerer","warlock","wizard"],"time":"1 действие","range":"6","dur":"Мгновенная","conc":false,"rit":false,"desc":["Некротическая энергия омывает выбранное вами существо, которое вы видите в пределах дистанции, забирая из него жидкость и жизненные силы. Цель должна совершить спасбросок Телосложения. Цель получает 8d8 урона некротической энергией в случае провала или половину этого урона в случае успеха. Это заклинание не оказывает никакого эффекта на Нежить и Конструктов.","Если цель — существо-Растение или магическое растение, оно совершает спасбросок с помехой, и заклинание причиняет ему максимальный урон.","Если цель — немагическое растение, не являющееся существом, например, дерево или куст, оно не совершает спасбросок; а просто засыхает и умирает."],"higher":["Если вы накладываете это заклинание, используя ячейку 5-го уровня или выше, урон увеличивается на 1d8 за каждый уровень ячейки выше четвертого."],"custom":true},{"id":"cmqwlxyemrz5","name":"Центр притяжения","level":4,"classes":[],"time":"1 действие","range":"24","dur":"Мгновенная","conc":false,"rit":false,"desc":["Сфера разрушительной силы радиусом 4 клеток появляется в видимой вами точке пространства, резко притягивая существ к своему центру. Каждое существо в области сферы должно совершить спасбросок Телосложения. При провале существо получает 5d10 урона силовым полем, и притягивается к центру сферы по прямой, заканчивая передвижение в свободном пространстве как можно ближе к центру (даже если он находится в воздухе). При успехе существо получает половину урона и не притягивается."],"higher":["Если вы накладываете это заклинание, используя ячейку 5-го уровня или выше, урон увеличивается на 1d10 за каждый уровень выше четвертого."],"custom":true},{"id":"cmqwly4iufho","name":"Эвардовы чёрные щупальца","level":4,"classes":["wizard"],"time":"1 действие","range":"18","dur":"До 1 минуты","conc":true,"rit":false,"desc":["Чёрные извивающиеся щупальца заполняют квадрат на полу с длиной стороны 4 клетки, который вы видите в пределах дистанции. Пока заклинание активно, эти щупальца делают местность труднопроходимой.","Когда существо впервые за ход входит в область заклинания или начинает там ход, оно должно преуспеть в спасброске Ловкости, иначе получит дробящий урон 3d6 и станет опутанным щупальцами до окончания заклинания. Существо, начинающее ход в этой области, уже опутанное щупальцами, получает дробящий урон 3d6.","Опутанное щупальцами существо может действием совершить проверку Силы или Ловкости (на свой выбор) против Сл ваших заклинаний. В случае успеха оно высвобождается."],"higher":[],"custom":true},{"id":"cmqwlynymxjh","name":"Аура очищения","level":4,"classes":["cleric","paladin"],"time":"1 действие","range":"На себя (30-футовый радиус)","dur":"До 10 минут","conc":true,"rit":false,"desc":["От вас исходит очищающая аура с радиусом 6 клеток. Пока заклинание активно, аура перемещается вместе с вами, оставаясь с центром на вас. Все невраждебные существа в ауре (включая вас) не могут заболеть, имеют сопротивление урону ядом и совершают с преимуществом спасброски от эффектов, вызывающих следующие состояния: глухота, испуг, ослепление, отравление, очарование, ошеломление и паралич."],"higher":[],"custom":true},{"id":"cmqwlytnndvr","name":"Быстрый гонец Гальдера","level":4,"classes":["warlock","wizard"],"time":"1 действие","range":"2","dur":"10 минут","conc":false,"rit":false,"desc":["-06","Вы вызываете Маленького воздушного Элементаля в точке в пределах дистанции. Воздушный Элементаль бесформенен, почти прозрачен, имеет иммунитет к урону всех видов и не может взаимодействовать с другими существами или объектами. Он несёт пустой открытый сундук, внутренние размеры которого составляют 3 фута с каждой стороны. Пока заклинание активно, вы можете положить в сундук столько предметов, сколько поместится, после чего можете назвать живое существо, которое вы раньше встречали и видели хотя бы один раз, или любое существо, часть тела которого у вас есть (прядь волос, кусочек ногтя или иная подобная часть).","Как только крышка сундука закрывается, Элементаль и сундук исчезают, а затем снова появляются рядом с целевым существом. Если целевое существо находится на другом плане бытия, или если оно защищено от магического обнаружения или определения местоположения, содержимое сундука снова появляется на земле у ваших ног.","Целевое существо узнаёт о содержимом сундука до того, как решит, открывать ли его, и знает, сколько времени осталось до окончания заклинания, в течение действия которого оно может забрать содержимое сундука. Ни одно другое существо не может открыть сундук и забрать его содержимое. Когда заклинание оканчивается или когда всё содержимое сундука изъято, Элементаль и сундук исчезают. Элементаль также исчезает, если целевое существо приказывает ему вернуть вам предметы. Когда Элементаль исчезает, все предметы, не взятые из сундука, снова появляются на земле у ваших ног."],"higher":["Если вы накладываете это заклинание, используя ячейку заклинания 8-го уровня, вы можете отправить сундук существу, находящемуся на другом плане существования."],"custom":true},{"id":"cmqwlyyl0sb9","name":"Воображаемый убийца","level":4,"classes":["bard","wizard"],"time":"1 действие","range":"24","dur":"До 1 минуты","conc":true,"rit":false,"desc":["Вы заглядываете в кошмары существа, видимого в пределах дистанции, и создаете иллюзорное проявление его страхов, видимое только ему. Цель должна совершить спасбросок Мудрости. При провале цель становится испуганной до конца действия заклинания. В конце каждого своего хода, пока заклинание активно, цель должна преуспевать в спасброске Мудрости, иначе она получает урон психической энергией 4d10. При успехе заклинание заканчивается."],"higher":["Если вы накладываете это заклинание, используя ячейку 5-го уровня или выше, урон увеличивается на 1d10 за каждый уровень ячейки выше четвертого."],"custom":true},{"id":"cmqwlz2w0z9i","name":"Высшая невидимость","level":4,"classes":["bard","sorcerer","wizard"],"time":"1 действие","range":"Касание","dur":"До 1 минуты","conc":true,"rit":false,"desc":["Вы или существо, которого вы касаетесь, становитесь невидимым, пока активно заклинание. Все, что цель носит и несёт, становится невидимым, пока находится у этой личности."],"higher":[],"custom":true},{"id":"cmqwlz739nad","name":"Град","level":4,"classes":["druid","sorcerer","wizard"],"time":"1 действие","range":"60","dur":"Мгновенная","conc":false,"rit":false,"desc":["На землю в цилиндре с радиусом 4 клеток и высотой 8 клеток с центром на точке в пределах дистанции падают куски льда. Все существа в цилиндре должны совершить спасбросок Ловкости. Существо получает 2d8 дробящего урона и 4d6 урона холодом при провале или половину этого урона при успехе.","Град превращает область воздействия в труднопроходимую местность до конца вашего следующего хода."],"higher":["Если вы накладываете это заклинание, используя ячейку 5-го уровня или выше, дробящий урон увеличивается на 1d8 за каждый уровень ячейки выше четвертого."],"custom":true},{"id":"cmqwlzb5pyc7","name":"Защита от смерти","level":4,"classes":["cleric","paladin"],"time":"1 действие","range":"Касание","dur":"8 часов","conc":false,"rit":false,"desc":["Вы касаетесь существа и даруете ему некоторую защиту от смерти.","Когда хиты цели впервые опускаются до 0 из-за получения урона, хиты цели опускаются всего лишь до 1, и заклинание оканчивается.","Если заклинание ещё действует, а цель попадает под действие эффекта, убивающего её мгновенно, не причиняя урона, то этот эффект игнорируется, и заклинание заканчивается."],"higher":[],"custom":true},{"id":"cmqwlzf40etg","name":"Изменение формы камня","level":4,"classes":["artificer","cleric","druid","wizard"],"time":"1 действие","range":"Касание","dur":"Мгновенная","conc":false,"rit":false,"desc":["Вы касаетесь каменного предмета с размером не больше Среднего, или участка камня, не превышающего ни по одному из измерений более 1 клетка, и придаете ему любую форму. Так, например, вы можете превратить большой камень в оружие, статую или гроб, или создать небольшой проход в стене, если эта стена толщиной меньше 1 клетка. Вы можете также скорректировать каменную дверь или её обрамление, чтобы запереть наглухо. У создаваемого вами предмета могут быть две дверные петли и щеколда, но более мелкие механические детали невозможны."],"higher":[],"custom":true},{"id":"cmqwlzjcgzl4","name":"Каменная кожа","level":4,"classes":["artificer","druid","ranger","sorcerer","wizard"],"time":"1 действие","range":"Касание","dur":"До 1 часа","conc":true,"rit":false,"desc":["Это заклинание делает плоть согласного существа, которого вы коснулись, твёрдой как камень. Пока заклинание активно, цель получает сопротивление немагическому дробящему, колющему и рубящему урону."],"higher":[],"custom":true},{"id":"cmqwlzn4wz7h","name":"Мираж","level":4,"classes":["bard","druid","warlock","wizard"],"time":"10 минут","range":"60","dur":"24 часа","conc":false,"rit":false,"desc":["Вы заставляете природную местность в пределах куба с длиной ребра 30 клеток, находящегося в пределах дистанции, выглядеть, звучать и пахнуть как другая природная местность. Таким образом, поле или дорогу можно сделать похожей на болото, холм, расселину или другую труднопроходимую или непроходимую местность. Пруд можно сделать похожим на травяную лужайку, пропасть сделать пологим спуском, а каменистый овраг — широкой и ровной дорогой. Рукотворные строения, снаряжение и существа в области не меняют облик.","Тактильные ощущения местности не меняются, поэтому существа, входящие в нее, скорее всего, поймут обман. Если на прикосновение разница не очевидна, существо, тщательно исследующее иллюзию, может предпринять проверку Интеллекта (Расследование) против Сл ваших заклинаний, чтобы не поверить. Существо, способное распознавать иллюзии, видит полупрозрачный образ, наложенный на местность."],"higher":[],"custom":true},{"id":"cmqwlzryn80o","name":"Огненный щит","level":4,"classes":["druid","sorcerer","wizard"],"time":"1 действие","range":"На себя","dur":"10 минут","conc":false,"rit":false,"desc":["На время длительности заклинания ваше тело покрывается тонким слоем пламени, испускающим яркий свет в пределах 2-клеточного радиуса и тусклый свет в пределах ещё 2 клетки. Вы можете досрочно окончить это заклинание действием.","Это пламя предоставляет вам либо теплый щит, либо прохладный щит, на ваш выбор. Теплый щит даёт вам сопротивление урону холодом, а прохладный щит даёт сопротивление урону огнём.","Кроме того, каждый раз, когда существо, находящееся в пределах 1 клетки от вас, попадает по вам рукопашной атакой, щит испускает пламя. Атакующий получает 2d8 урона огнём в случае теплого щита или 2d8 урона холодом в случае прохладного щита."],"higher":[],"custom":true},{"id":"cmqwlzwyj19z","name":"Отилюков упругий шар","level":4,"classes":["artificer","wizard"],"time":"1 действие","range":"6","dur":"До 1 минуты","conc":true,"rit":false,"desc":["Сфера из мерцающей силы окружает находящееся в пределах дистанции существо или предмет с размером не больше Большого. Нежелающее существо должно совершить спасбросок Ловкости. При провале существо окружается сферой на время действия заклинания.","Ничто — ни физические предметы, ни энергия, ни эффекты прочих заклинаний — не могут проходить через этот барьер, как внутрь, так и наружу, хотя существо в сфере может дышать нормально. Сфера обладает иммунитетом к урону всех видов, и находящееся внутри существо или предмет не может получать урон от атак и эффектов, исходящих снаружи, но и находящееся в сфере существо не может причинить урон ничему, что находится снаружи.","Сфера ничего не весит, и она достаточно велика, чтобы вместить существо или предмет. Окружённое существо может действием толкать стены сферы и таким образом перемещаться со скоростью, уменьшенной вдвое. Точно так же, сферу могут поднять и переносить другие существа.","Заклинание распад [disintegrate], нацеленное на сферу, уничтожает её, не причиняя вреда тому, что находится внутри."],"higher":[],"custom":true},{"id":"cmqwm01fk7nq","name":"Очарование чудовища","level":4,"classes":["bard","druid","sorcerer","warlock","wizard"],"time":"1 действие","range":"6","dur":"1 час","conc":false,"rit":false,"desc":["Вы пытаетесь очаровать существо, которое вы можете видеть в пределах дистанции. Оно должно совершить спасбросок Мудрости. Бросок совершается с преимуществом, если вы или ваши спутники сражаетесь с ним. Если оно проваливает спасбросок, оно очаровано вами до тех пор, пока заклинание активно или пока вы или ваши спутники не причиняете ему вред. Очарованное существо считает вас своим другом. Когда заклинание оканчивается, существо знает, что было очаровано вами."],"higher":["Если вы накладываете это заклинание, используя ячейку 5 уровня или выше, вы можете сделать целью одно дополнительное существо за каждый уровень ячейки выше 4. Выбранные существа должны находиться в пределах 6 клеток друг от друга."],"custom":true},{"id":"cmqwm05l2yar","name":"Призыв духа конструкта","level":4,"classes":["artificer","wizard"],"time":"1 действие","range":"18","dur":"До 1 часа","conc":true,"rit":false,"desc":["Вы призываете духа конструкта [construct spirit]. Он проявляется в свободном пространстве, которое вы можете видеть в пределах дистанции. Воплощённая форма духа использует блок статистики духа конструкта [construct spirit]. Когда вы накладываете заклинание, выберите материал: глина, металл или камень. Существо принимает форму голема или модрона (на ваш выбор), изготовленного из выбранного материала, который определяет особенности существа, описанные в блоке статистики. Существо исчезает, когда его хиты опускаются до 0 или когда заклинание заканчивается.","Это существо дружелюбно к вам и вашим товарищам. В бою существо получает вашу инициативу, и ходит сразу же после вас. Оно подчиняется вашим вербальным командам (никаких действий от вас не требуется). Если вы ничего не приказываете, то оно применяет действие Уклонение и перемещается, избегая опасностей."],"higher":["Когда вы накладываете это заклинание, используя ячейку 4-го уровня или выше, характеристики призываемого существа изменяются в соответствии с описанием в блоке статистики."],"custom":true},{"id":"cmqwm09qsjfp","name":"Призыв духа стихии","level":4,"classes":["druid","ranger","wizard"],"time":"1 действие","range":"18","dur":"До 1 часа","conc":true,"rit":false,"desc":["Вы призываете духа стихии [elemental spirit]. Он проявляется в свободном пространстве, которое вы можете видеть в пределах дистанции. Воплощённая форма духа использует блок статистики духа стихии [elemental spirit]. Когда вы накладываете заклинание, выберите стихию: воздух, земля, огонь или вода. Существо принимает форму чего-то двуногого, сплетённого из выбранной стихии, которая определяет особенности существа, описанные в блоке статистики. Существо исчезает, когда его хиты опускаются до 0 или когда заклинание заканчивается.","Это существо дружелюбно к вам и вашим товарищам. В бою оно получает вашу инициативу и ходит сразу же после вас. Оно подчиняется вашим вербальным командам (никаких действий от вас не требуется). Если вы ничего не приказываете, то оно совершает действие Уклонение и перемещается, избегая опасностей."],"higher":["Когда вы накладываете это заклинание, используя ячейку 5-го уровня или выше, характеристики призываемого существа изменяются в соответствии с описанием в блоке статистики."],"custom":true},{"id":"cmqwm0epa2xh","name":"Призыв лесных обитателей","level":4,"classes":["druid","ranger"],"time":"1 действие","range":"12","dur":"До 1 часа","conc":true,"rit":false,"desc":["Вы призываете фейских существ, которые появляются в свободном пространстве, которое вы видите в пределах дистанции. Выберите один из вариантов того, кто появляется:","Одно фейское существо с показателем опасности 2 или ниже","Два фейских существа с показателем опасности 1 или ниже","Четыре фейских существа с показателем опасности 1/2 или ниже","Восемь фейских существ с показателем опасности 1/4 или ниже.","Призванное существо исчезает, когда его хиты опускаются до 0, или когда заклинание оканчивается.","Призванные существа дружественны к вам и вашим спутникам. Совершите проверку инициативы за призванных существ как за одну группу, и они будут совершать свои собственные ходы. Они подчиняются вашим вербальным командам (действие не требуется). Если вы не отдаёте команду, они защищаются от враждебных существ, но в иных случаях действий не совершают.","Параметры существ есть у Мастера."],"higher":["Если вы накладываете это заклинание, используя ячейки большего уровня, вы выбираете один из описанных выше вариантов, но появляется в два раза больше существ при ячейке 6-го уровня, и в три раза больше при ячейке 8-го уровня."],"custom":true},{"id":"cmqwm0jaoosl","name":"Призыв малых элементалей","level":4,"classes":["druid","wizard"],"time":"1 минута","range":"18","dur":"До 1 часа","conc":true,"rit":false,"desc":["Вы призываете Элементалей, которые появляются в свободном пространстве, которое вы видите в пределах дистанции. Выберите один из вариантов того, кто появляется:","Один Элементаль с показателем опасности 2 или ниже.","Два Элементаля с показателем опасности 1 или ниже.","Четыре Элементаля с показателем опасности 1/2 или ниже.","Восемь Элементалей с показателем опасности 1/4 или ниже.","Элементаль исчезает, когда его хиты опускаются до 0, или когда заклинание оканчивается.","Призванные существа дружественны к вам и вашим спутникам. Совершите проверку инициативы за призванных существ как за одну группу, и они будут совершать свои собственные ходы. Они подчиняются вашим вербальным командам (действие не требуется). Если вы не отдаете команду, они защищаются от враждебных существ, но в иных случаях действий не совершают.","Статистика существ есть у Мастера."],"higher":["Если вы накладываете это заклинание, используя ячейки большего уровня, вы выбираете один из описанных выше вариантов, но появляется в два раза больше существ при ячейке 6-го уровня, и в три раза больше при ячейке 8-го уровня."],"custom":true},{"id":"cmqwm0o46z4c","name":"Принуждение","level":4,"classes":["bard"],"time":"1 действие","range":"6","dur":"До 1 минуты","conc":true,"rit":false,"desc":["Выбранные вами существа, которых вы видите в пределах дистанции, и которые слышат вас, должны совершить спасбросок Мудрости. Цель автоматически преуспевает, если не может быть очарована. При провале спасброска цель попадает под действие этого заклинания. Пока заклинание активно, вы можете в каждом своём ходу бонусным действием указать направление, горизонтальное для вас. Все попавшие под действие цели должны в свой следующий ход максимально возможно перемещаться в том направлении. Перед перемещением они могут совершить свои действия. После перемещения из-за заклинания они могут совершить ещё один спасбросок Мудрости, чтобы окончить этот эффект.","Цель не обязана перемещаться в очевидно опасное место, такое как огонь или костёр, но она провоцирует атаки, когда идёт в указанном направлении."],"higher":[],"custom":true},{"id":"cmqwm0spmh9n","name":"Проклятие стихии","level":4,"classes":["artificer","druid","warlock","wizard"],"time":"1 действие","range":"18","dur":"До 1 минуты","conc":true,"rit":false,"desc":["Выберите одно существо, которое вы можете видеть в пределах дистанции, а затем выберите один из следующих видов урона: звук, кислота, огонь, холод или электричество. Цель должна преуспеть в спасброске Телосложения, иначе будет подвержена эффекту заклинания в течение времени его действия. Когда цель впервые за ход получает урон выбранного вида, она также получает дополнительно 2d6 урона этого вида. Кроме того, цель теряет любые сопротивления урону этого вида, пока заклинание не окончится."],"higher":["Если вы накладываете это заклинание, используя ячейку 5-го уровня или выше, вы можете выбрать одну дополнительную цель за каждый уровень ячейки выше 4-го. Выбранные существа должны находиться в пределах 6 клеток друг от друга."],"custom":true},{"id":"cmqwm0xcp0ds","name":"Психическое копьё Раулотима","level":4,"classes":["bard","sorcerer","warlock","wizard"],"time":"1 действие","range":"24","dur":"Мгновенная","conc":false,"rit":false,"desc":["Вы выпускаете мерцающее копьё психической силы из своего лба в существо, которое вы можете видеть в пределах дистанции. В качестве альтернативы вы можете произнести имя существа. Если названная цель находится в пределах дистанции, она становится целью заклинания, даже если вы её не видите. Если названная цель не находится в пределах дистанции, копьё исчезает без эффекта.","Цель должна совершить спасбросок Интеллекта. При провале она получает 7d6 урона психической энергией и становится недееспособной до начала вашего следующего хода. При успехе она получает половину этого урона и остаётся дееспособной."],"higher":["Если вы накладываете это заклинание, используя ячейку 5-го уровня или выше, урон увеличивается на 1d6 за каждый уровень ячейки выше 4-го."],"custom":true},{"id":"cmqwm15zcd3x","name":"Страж природы","level":4,"classes":["druid","ranger"],"time":"1 бонусное действие","range":"На себя","dur":"До 1 минуты","conc":true,"rit":false,"desc":["Дух природы отвечает на ваш призыв и превращает вас в могущественного стража. Превращение длится до тех пор, пока заклинание не закончится. Вы выбираете одну из следующих форм: «Первобытный зверь» или «Великое древо».","Первобытный зверь. Мягкий мех покрывает ваше тело, ваши черты лица становятся дикими, и вы получаете следующие преимущества:","Скорость ходьбы увеличивается на 2 клетки.","Вы получаете тёмное зрение в пределах 24 клеток.","Вы совершаете броски атаки, основанные на Силе, с преимуществом.","Рукопашные атаки оружием наносят дополнительно 1d6 урона силовым полем.","Великое древо. Ваша кожа покрывается корой, листья прорастают из ваших волос, и вы получаете следующие преимущества:","Вы получаете 10 временных хитов.","Вы совершаете с преимуществом спасброски Телосложения.","Вы совершаете броски атаки, основанные на Ловкости и Мудрости, с преимуществом.","Земля, на которой вы находитесь, в радиусе 3 клеток от вас становится труднопроходимой местностью для врагов."],"higher":[],"custom":true},{"id":"cmqwm1cwbwkp","name":"Сфера бури","level":4,"classes":["sorcerer","wizard"],"time":"1 действие","range":"30","dur":"До 1 минуты","conc":true,"rit":false,"desc":["В указанной вами точке в пределах дистанции заклинания возникает сфера завихряющегося воздуха радиусом 4 клеток. Сфера существует, пока действует заклинание. Все существа, оказавшиеся внутри сферы в момент появления или оканчивающие свой ход внутри сферы, должны совершить спасбросок Силы, иначе получат 2d6 дробящего урона. Пространство сферы считается труднопроходимой местностью.","Пока действует заклинание, вы можете бонусным действием вызвать разряд молнии, который устремится из центра сферы к выбранному вами существу в пределах 12 клеток от центра сферы. Совершите дальнобойную атаку заклинанием. Атака совершается с преимуществом, если цель находится внутри сферы. При попадании цель получает 4d6 урона электричеством.","Существа в пределах 6 клеток от сферы совершают с помехой проверки Мудрости (Восприятие), связанные со слухом."],"higher":["Если вы накладываете это заклинание, используя ячейку 5-го уровня или выше, то урон каждого эффекта увеличивается на 1d6 за каждый уровень ячейки выше 4-го."],"custom":true},{"id":"cmqwm1hedfvm","name":"Цепкая лоза","level":4,"classes":["druid","ranger"],"time":"1 бонусное действие","range":"6","dur":"До 1 минуты","conc":true,"rit":false,"desc":["Вы создаёте лозу, вырастающую из земли в свободном пространстве на ваш выбор, видимом вами в пределах дистанции. Когда вы накладываете это заклинание, вы можете приказать лозе ухватить видимое вами существо, находящееся в пределах 6 клеток от неё. Это существо должно преуспеть в спасброске Ловкости, иначе его подтянет на 4 клетки к лозе.","Пока заклинание активно, вы можете в каждом своём ходу бонусным действием приказывать лозе ухватить то же самое или другое существо."],"higher":[],"custom":true},{"id":"cmqx8idy6el9","name":"Быстрый колчан","level":5,"classes":["ranger"],"time":"1 бонусное действие","range":"Касание","dur":"До 1 минуты","conc":true,"rit":false,"desc":["Вы так модифицируете свой колчан, что он начинает производить бесконечный запас немагических боеприпасов, которые сами прыгают в вашу руку, когда вы тянетесь за ними.","Пока заклинание активно, вы в каждом своём ходу можете бонусным действием совершить две атаки оружием, использующим боеприпасы из колчана. Каждый раз, когда вы совершаете такую дальнобойную атаку, ваш колчан при помощи магии заменяет использованный вами боеприпас таким же немагическим боеприпасом. Все боеприпасы, созданные этим заклинанием, распадаются, когда заклинание оканчивается. Если колчан перестаёт быть вашей собственностью, заклинание оканчивается."],"higher":[],"custom":true},{"id":"cmqx8inmak5n","name":"Вещий сон","level":5,"classes":["bard","warlock","wizard"],"time":"1 минута","range":"Особая","dur":"8 часов","conc":false,"rit":false,"desc":["Это заклинание формирует сон другого существа. Выберите целью этого заклинания известное вам существо. Цель должна находиться на одном плане существования с вами. Этим заклинанием нельзя связаться с существами, которые не спят, например, с эльфами. Вы или согласное существо, которого вы касаетесь, входите в транс, становясь посыльным. Находясь в трансе, посыльный осознаёт своё окружение, но не может совершать действий и перемещаться.","Если цель спит, посыльный появляется в её сне и может беседовать с ней, пока та спит, и пока заклинание активно. Посыльный также может формировать окружение сна, создавая местность, предметы и прочие образы. Посыльный может в любое время выйти из транса, окончив эффект этого заклинания. После пробуждения цель прекрасно помнит сон. Если в момент накладывания заклинания цель бодрствует, посыльный это узнаёт, и может либо окончить транс (и заклинание), либо подождать, пока цель заснёт, и тогда он появится во сне цели.","Вы можете сделать посыльного кошмарным для цели. В этом случае посыльный может передать послание не длиннее десяти слов, и цель обязана совершить спасбросок Мудрости. При провале отголоски кошмара длятся весь сон, и цель не получает преимуществ от этого отдыха. Кроме того, когда цель просыпается, она получает 3d6 урона психической энергией.","Если у вас есть часть тела, клок волос, обрезки ногтей или другая подобная часть тела цели, она совершает спасбросок с помехой."],"higher":[],"custom":true},{"id":"cmqx8j0hub3w","name":"Власть над ветрами","level":5,"classes":["druid","sorcerer","wizard"],"time":"1 действие","range":"60","dur":"До 1 часа","conc":true,"rit":false,"desc":["Вы можете контролировать ветер в кубе с длиной ребра 20 клеток, который вы можете видеть в пределах дистанции. В момент накладывания заклинания выберите один из нижеперечисленных эффектов. Этот эффект продолжается до тех пор, пока действует заклинание, если вы действием не переключитесь на другой эффект. Вы также можете действием временно отменить эффект или вновь возобновить его.","Шквал. Ветер усиливается, постоянно дуя горизонтально в направлении, которое вы выбрали. Вы можете выбрать интенсивность ветра: спокойный, умеренный или сильный. Если ветер умеренный или сильный, то дальнобойные атаки оружием, траектория которых входит в куб, выходит из куба или проходит через него, совершаются с помехой. Все существа, идущие против сильного ветра, расходуют дополнительный фут передвижения за каждый пройдённый фут.","Нисходящий поток. Вы создаёте постоянный поток сильного ветра, который направлен сверху вниз. Атаки дальнобойным оружием совершаются с помехой, если их траектория проходит через область действия заклинания или целью является существо в кубе. Если летающее существо впервые за ход оказывается в этой области или начинает свой ход в ней, оно должно преуспеть в спасброске Силы, иначе будет сбито с ног.","Восходящий поток. Вы создаёте постоянный поток ветра, который направлен снизу вверх. Существа, которые падают на землю внутри куба, получают лишь половину урона от падения. Если существо в кубе совершает вертикальный прыжок, высота прыжка увеличивается на 2 клетки."],"higher":[],"custom":true},{"id":"cmqx8j7b4476","name":"Водоворот","level":5,"classes":["druid"],"time":"1 действие","range":"24","dur":"До 1 минуты","conc":true,"rit":false,"desc":["В точке, которую вы можете видеть в пределах дистанции, возникает воронка воды радиусом 6 клеток и глубиной 1 клетка. Точка должна находиться на поверхности земли или в толще воды. Пока действует заклинание, эта область считается труднопроходимой местностью, и все существа, начинающие в ней ход, должны преуспеть в спасброске Силы, иначе получат 6d6 дробящего урона и будут подтянуты на 2 клетки в направлении центра."],"higher":[],"custom":true},{"id":"cmqx8je8sjep","name":"Гнев природы","level":5,"classes":["druid","ranger"],"time":"1 действие","range":"24","dur":"До 1 минуты","conc":true,"rit":false,"desc":["Вы взываете к духам природы, чтобы обратить их против ваших врагов. Выберите точку, которую вы можете видеть в пределах дистанции. Духи оживляют деревья, камни и травы в кубе с длиной ребра в 12 клеток с центром в этой точке на все время действия заклинания.","Травы и подлесок. Любая область земли в кубе, покрытая травой или подлеском, является труднопроходимой местностью для ваших врагов.","Деревья. В начале каждого вашего хода каждый из ваших врагов в пределах 2 клеток от любого дерева внутри куба должен преуспеть в спасброске Ловкости, иначе получит 4d6 рубящего урона от хлещущих его ветвей.","Корни и лозы. В конце каждого вашего хода одно существо по вашему выбору, которое находится на земле внутри куба, должно преуспеть в спасброске Силы, иначе станет опутанным до тех пор, пока заклинание не закончится. Опутанное существо может действием совершить проверку Силы (Атлетика) против Сл спасброска от ваших заклинаний, оканчивая на себе эффект заклинания при успехе.","Камни. Бонусным действием в свой ход вы можете призвать камень внутри куба, чтобы запустить его в существо, которое вы можете видеть внутри куба. Совершите дальнобойную атаку заклинанием против этой цели. При попадании цель получает 3d8 немагического дробящего урона и должна преуспеть в спасброске Силы, иначе будет сбита с ног."],"higher":[],"custom":true},{"id":"cmqx8jkf2knf","name":"Далёкий шаг","level":5,"classes":["sorcerer","warlock","wizard"],"time":"1 бонусное действие","range":"На себя","dur":"До 1 минуты","conc":true,"rit":false,"desc":["Вы телепортируетесь до 12 клеток в свободное пространство, видимое вами. Вы можете каждый ваш ход до окончания действия заклинания бонусным действием телепортироваться таким образом снова."],"higher":[],"custom":true},{"id":"cmqx8jtwxb6z","name":"Длань Бигби","level":5,"classes":["artificer","sorcerer","wizard"],"time":"1 действие","range":"24","dur":"До 1 минуты","conc":true,"rit":false,"desc":["Вы создаёте мерцающую руку Большого размера из полупрозрачного силового поля в свободном пространстве, которое видите в пределах дистанции. Рука существует, пока активно заклинание, и она перемещается по вашей команде, подражая движениям вашей собственной руки. Эта рука является предметом, у которого КД 20, а количество хитов равно максимуму ваших хитов. Когда хиты руки опускаются до 0, заклинание оканчивается. У руки Сила 26 (+8), а Ловкость 10 (+0). Рука не заполняет своё пространство.","Когда вы накладываете это заклинание, а также в последующие ходы, но уже бонусным действием, вы можете переместить руку на расстояние до 12 клеток, а затем создать с её помощью один из следующих эффектов:","Могучая длань. Рука пытается толкнуть существо, находящееся в пределах 1 клетки от неё, в выбранном вами направлении. Совершите проверку Силы руки, противопоставленную проверке Силы (Атлетика) цели. Если цель Среднего размера или меньше, вы совершаете проверку с преимуществом. В случае успеха рука толкает цель на 1 клетка плюс количество футов, равное модификатору базовой характеристики, умноженному на 5. Рука перемещается вместе с целью, оставаясь в пределах 1 клетки от неё.","Преграждающая длань. Рука встаёт между вами и выбранным вами существом, пока вы не отдадите руке другую команду. Рука перемещается так, что находится между вами и целью, предоставляя вам от цели укрытие на половину. Цель не может пройти сквозь пространство руки, если её значение Силы не больше значения Силы руки. Если значение Силы у цели больше, чем у руки, она может подойти к вам сквозь руку, но пространство руки для цели считается труднопроходимой местностью.","Сжатый кулак. Рука ударяет одно существо или предмет в пределах 1 клетки от себя. Совершите рукопашную атаку заклинанием за руку, используя свои параметры. При попадании цель получает 4d8 урона силовым полем.","Сжимающая длань. Рука пытается схватить существо с размером Огромное или меньше, находящееся в пределах 1 клетки от неё. При проверке захвата вы используете значение Силы руки. Если размер цели Средний или меньше, вы совершаете проверку с преимуществом. Пока рука держит цель в захвате, вы можете бонусным действием сдавливать её рукой. Цель при этом получает дробящий урон в размере 2d6 + модификатор вашей базовой характеристики."],"higher":["Если вы накладываете это заклинание, используя ячейку 6-го уровня или выше, за каждый уровень ячейки выше пятого урон от сжатого кулака увеличивается на 2d8, а урон от сжимающей длани увеличивается на 2d6."],"custom":true},{"id":"cmqx8k2iswqu","name":"Заражение","level":5,"classes":["cleric","druid"],"time":"1 действие","range":"Касание","dur":"7 дней","conc":false,"rit":false,"desc":["Ваше касание вызывает болезнь. Совершите рукопашную атаку заклинанием по существу, находящемуся в пределах вашей досягаемости. При попадании существо становится отравленным.","В конце каждого своего хода отравленная цель должна совершать спасбросок Телосложения. Преуспев в трёх спасбросках, существо перестаёт быть отравленным, и заклинание оканчивается. После провала трёх таких спасбросков существо перестаёт быть отравленным и на время длительности заклинания заражается болезнью из списка ниже по вашему выбору.","Поскольку это заклинание вызывает у цели настоящую болезнь, все эффекты, исцеляющие болезни и влияющие на течение болезней, применимы.","Воспаление разума. Сознание существа лихорадит. Существо совершает с помехой проверки и спасброски Интеллекта, и в бою существо ведёт себя так, будто находится под действием заклинания смятение [confusion].","Гниение плоти. Плоть существа начинает разлагаться. Существо совершает с помехой проверки Харизмы и получает уязвимость к урону всех видов.","Грязевая лихорадка. Грязевая лихорадка охватывает тело существа. Существо совершает с помехой проверки Силы, спасброски Силы и броски атаки, использующие Силу.","Припадок. Существо сотрясают неостановимые судороги. Существо совершает с помехой проверки Ловкости, спасброски Ловкости и броски атаки, использующие Ловкость.","Склизкая смерть. Существо начинает неконтролируемо кровоточить. Существо совершает с помехой проверки и спасброски Телосложения. Кроме того, каждый раз, когда цель получает урон, она становится ошеломлённой до конца своего следующего хода.","Слепотуха. Боль заволакивает сознание существа, а его глаза становятся молочно-белыми. Существо совершает с помехой проверки и спасброски Мудрости, и становится ослеплённым."],"higher":[],"custom":true},{"id":"cmqx8k9vkic1","name":"Изгоняющая кара","level":5,"classes":["paladin"],"time":"1 бонусное действие","range":"На себя","dur":"До 1 минуты","conc":true,"rit":false,"desc":["В следующий раз, когда вы попадёте по существу атакой оружием, пока активно это заклинание, ваше оружие покрывается силовым полем, и атака причиняет цели дополнительный урон силовым полем 5d10. Кроме того, если эта атака опустила хиты цели до 50 или ниже, вы изгоняете её. Если цель родом не с того плана существования, на котором сейчас находитесь вы, цель исчезает, возвращаясь на свой родной план. Если цель родом с того плана, на котором находитесь вы, она исчезает в безопасном демиплане. Находясь там, цель недееспособна. Она остаётся там, пока активно заклинание, после чего возвращается в пространство, из которого исчезла, или ближайшее свободное пространство, если то место занято."],"higher":[],"custom":true},{"id":"cmqx8khpguom","name":"Изменение памяти","level":5,"classes":["bard","wizard"],"time":"1 действие","range":"6","dur":"До 1 минуты","conc":true,"rit":false,"desc":["Вы пытаетесь изменить воспоминания другого существа. Одно существо, которое вы видите, должно совершить спасбросок Мудрости. Если вы с ним сражаетесь, оно совершает спасбросок с преимуществом. При провале цель становится очарованной вами на время действия заклинания. Очарованная цель недееспособна и не осознаёт окружение, но всё ещё может слышать вас. Если она получит урон или станет целью другого заклинания, это заклинание оканчивается, и воспоминания цели не изменяются.","Пока длится это очарование, вы можете повлиять на воспоминание цели, произошедшее за последние 24 часа и длящееся не больше 10 минут. Вы можете полностью стереть память об этом событии, позволить цели вспомнить всё с потрясающей точностью, изменить детали этого события, или заменить это воспоминание на что-то совершенно иное.","Вы должны произнести цели её новые воспоминания, и она должна понимать ваш язык, чтобы изменённые воспоминания заняли место. Её сознание само заполнит пробелы в деталях вашего описания. Если заклинание оканчивается до того как вы закончите описывать новые воспоминания, память существа не будет затронута. В противном случае изменённые воспоминания вступают в силу в конце действия заклинания.","Изменённая память не обязательно будет влиять на поведение существа, особенно если она противоречит его наклонностям, мировоззрению или вере. Нелогичная изменённая память, такая как внедрение воспоминаний о том, как существу нравится купаться в кислоте, отбрасываются, как дурной сон. Мастер может посчитать, что изменённая память слишком абсурдная, чтобы влиять на существо в значительной степени.","Заклинания снятие проклятия [remove curse] и высшее восстановление [greater restoration], наложенные на цель, восстанавливают её истинную память."],"higher":["Если вы накладываете это заклинание, используя ячейку 6-го уровня или выше, вы можете изменить воспоминания о событиях, произошедших до 7 дней назад (6-й уровень), 30 дней назад (7-й уровень), 1 года назад (8-й уровень), или в любой момент в жизни существа (9-й уровень)."],"custom":true},{"id":"cmqx8ko2dy8j","name":"Каменная стена","level":5,"classes":["artificer","druid","sorcerer","wizard"],"time":"1 действие","range":"24","dur":"До 10 минут","conc":true,"rit":false,"desc":["В точке, выбранной вами в пределах дистанции, появляется немагическая стена из камня. Стена толщиной 6 дюймов (15 сантиметров) и составлена из десяти плит 10 × 2 клетки. Каждая плита должна соседствовать как минимум с одной другой плитой. В качестве альтернативы, вы можете создать плиты 10 × 4 клетки, но толщиной только 3 дюйма (7,5 сантиметров). Если стена при появлении проходит по пространству существа, это существо выталкивается по одну из сторон стены (на ваш выбор). Если существо со всех сторон окружается стеной (или стеной и другой сплошной поверхностью), это существо может совершить спасбросок Ловкости. При успехе оно может реакцией переместиться на расстояние, равное своей скорости, чтобы не быть окружённым стеной. Стена может иметь любую форму, хотя и не может занимать одно пространство с существами и предметами. Стена не обязана быть вертикальной, и не обязана целиком покоиться на твёрдом основании. Однако, она должна сливаться с существующим камнем, опираясь на него.","Таким образом, вы можете создать этим заклинанием мост через пропасть или наклонный спуск. Если вы создаёте пролёт длиной больше 4 клетки, вы должны уменьшить вдвое размер каждой плиты, чтобы создать поддержку. Вы можете придавать стене грубую форму, создавая бойницы, зубцы, и так далее. Стена является предметом, изготовленным из камня, которому можно причинить урон и, тем самым, пробить. У каждой плиты КД 15 и по 30 хитов за каждый 1 дюйм (2,5 сантиметра) толщины. Уменьшение хитов плиты до 0 уничтожает её, и по решению Мастера, может вызвать обвал смежных плит. Если вы поддерживаете концентрацию на этом заклинании в течение всей длительности, стена становится постоянной, и с этого момента её уже нельзя будет рассеять. В противном случае стена исчезает, когда заклинание будет окончено."],"higher":[],"custom":true},{"id":"cmqx8kubeqsj","name":"Конус холода","level":5,"classes":["druid","sorcerer","wizard"],"time":"1 действие","range":"На себя (60-футовый конус)","dur":"Мгновенная","conc":false,"rit":false,"desc":["Из ваших рук вырывается волна холодного воздуха. Все существа в 12-клеточном конусе должны совершить спасбросок Телосложения. Существа получают 8d8 урона холодом при провале или половину этого урона при успехе. Существа, убитые этим заклинанием, становятся замороженными статуями, пока не растают."],"higher":["Если вы накладываете это заклинание, используя ячейку 6-го уровня или выше, урон увеличивается на 1d8 за каждый уровень ячейки выше пятого."],"custom":true},{"id":"cmqx8l15ze1f","name":"Ментальная связь Рэри","level":5,"classes":["bard","wizard"],"time":"1 действие","range":"6","dur":"1 час","conc":false,"rit":true,"desc":["Вы создаёте телепатическую связь между восемью согласными существами на ваш выбор в пределах дистанции. Существа с Интеллектом 2 и ниже не попадают под действие этого заклинания. Пока заклинание активно, цели могут телепатически общаться посредством этой связи, даже если у них нет общего языка. Общение возможно на любом расстоянии, но оно не может простираться на другие планы существования."],"higher":[],"custom":true},{"id":"cmqx8movbtw4","name":"Наблюдение","level":5,"classes":["bard","cleric","druid","warlock","wizard"],"time":"10 минут","range":"На себя","dur":"До 10 минут","conc":true,"rit":false,"desc":["Вы можете видеть и слышать конкретное выбранное вами существо, находящееся на том же плане существования, что и вы. Цель должна совершить спасбросок Мудрости, модифицируемый тем, как хорошо вы знаете цель, и тем, какая связь с этим существом у вас есть. Если цель знает, что вы накладываете это заклинание, она может добровольно провалить спасбросок, если хочет, чтобы за ней следили.","Знание - Модификатор спасброска","Через посредников (вы только слышали о цели) - +5","Из первых рук (вы встречались с целью) - +0","Знакомые (вы хорошо знаете цель) - -5","Связь - Модификатор спасброска","Образ или рисунок - -2","Вещь или одежда - -4","Часть тела, прядь волос, кусок ногтя и т.п. - -10","При успехе цель не попадает под действие, и вы не можете использовать на ней это заклинание в течение 24 часов.","При провале заклинание создаёт невидимый сенсор в пределах 2 клеток от цели. Вы можете видеть и слышать через него, как если бы вы там находились. Сенсор перемещается вместе с целью, оставаясь в пределах 2 клеток от неё, пока активно заклинание. Существа, способные видеть невидимые предметы, видят сенсор как светящийся шарик размером с ваш кулак.","Вместо того чтобы нацеливаться на существо, вы можете выбрать целью место, уже виденное вами. В этом случае сенсор появляется в этом месте и не перемещается."],"higher":[],"custom":true},{"id":"cmqx8n07b7oo","name":"Нашествие насекомых","level":5,"classes":["cleric","druid","sorcerer"],"time":"1 действие","range":"60","dur":"До 10 минут","conc":true,"rit":false,"desc":["Рой кусачей саранчи заполняет сферу с радиусом 4 клеток с центром на точке, выбранной вами в пределах дистанции. Сфера огибает углы. Сфера существует, пока активно заклинание, и её местность слабо заслонена. Пространство сферы является труднопроходимой местностью. Когда сфера появляется, все находящиеся в ней существа должны совершить спасбросок Телосложения. Существо получает колющий урон 4d10 при провале, или половину урона при успехе. Существа должны также совершать этот спасбросок когда впервые за ход входят в область заклинания или оканчивают там ход."],"higher":["Если вы накладываете это заклинание, используя ячейку 6-го уровня или выше, урон увеличивается на 1d10 за каждый уровень ячейки выше пятого."],"custom":true},{"id":"cmqx8n6dydn7","name":"Обессиливание","level":5,"classes":["sorcerer","warlock","wizard"],"time":"1 действие","range":"12","dur":"До 1 минуты","conc":true,"rit":false,"desc":["Из вас тянется отросток чернильной тьмы, касаясь существа, которое вы можете видеть в пределах дистанции, и вытягивая его жизненные силы. Цель должна совершить спасбросок Ловкости. При успехе цель получает 2d8 урона некротической энергией, и заклинание заканчивается. При провале цель получает 4d8 урона некротической энергией, и до тех пор, пока заклинание не закончится, вы можете в каждый свой ход действием наносить цели 4d8 урона некротической энергией. Заклинание заканчивается, если вы используете свое действие, чтобы делать что-либо ещё, если цель окажется за пределами дистанции заклинания или получит от вас полное укрытие.","Всякий раз, когда заклинание наносит урон цели, вы восстанавливаете хиты, равные половине количества урона некротической энергией, наносимого цели."],"higher":["Если вы накладываете это заклинание, используя ячейку заклинания 6-го уровня или выше, урон увеличивается на 1d8 за каждый уровень ячейки выше 5-го."],"custom":true},{"id":"cmqx8nc6wbww","name":"Обет","level":5,"classes":["bard","cleric","druid","paladin","wizard"],"time":"1 минута","range":"12","dur":"30 дней","conc":false,"rit":false,"desc":["Вы отдаёте магическую команду существу, видимому в пределах дистанции, заставляя его оказать некую услугу или наоборот, не совершать чего-либо. Если существо может вас понять, оно должно преуспеть в спасброске Мудрости, иначе оно станет очарованным вами на время действия заклинания. Пока существо очаровано вами, оно получает урон психической энергией 5d10 каждый раз, когда действует, противореча вашим инструкциям, но не чаще одного раза за день. Существо, не способное вас понять, не попадает под действие этого заклинания.","Вы можете отдать любую команду, кроме той, что однозначно будет самоубийственной. Если вы отдадите такую команду, заклинание оканчивается.","Вы можете окончить заклинание преждевременно, потратив действие на его рассеивание. Заклинания снятие проклятия [remove curse], высшее восстановление [greater restoration] и исполнение желаний [wish] тоже его оканчивают."],"higher":["Если вы накладываете это заклинание, используя ячейку 7-го или 8-го уровня, длительность равна 1 году. Если вы накладываете это заклинание, используя ячейку 9-го уровня, заклинание длится, пока не будет окончено одним из упомянутых выше заклинаний."],"custom":true},{"id":"cmqx8nhvcsph","name":"Облако смерти","level":5,"classes":["sorcerer","wizard"],"time":"1 действие","range":"24","dur":"До 10 минут","conc":true,"rit":false,"desc":["Вы создаете сферу с радиусом 4 клеток из ядовитого жёлто-зелёного тумана с центром на точке, выбранной вами в пределах дистанции. Этот туман огибает углы. Он существует, пока активно заклинание, или пока сильный ветер его не развеет, окончив длительность. Его пространство — сильно заслонённая местность. Когда существо впервые за ход входит в область заклинания или начинает там ход, оно должно совершить спасбросок Телосложения. Существо получает 5d8 урона ядом при провале или половину этого урона в случае успеха. Существо попадает под действие заклинания даже если задерживает дыхание или вообще не должно дышать. Облако в начале каждого вашего хода перемещается на 2 клетки прочь от вас, катясь по поверхности. Испарения, будучи тяжелее воздуха, стекаются вниз и даже могут проникать в отверстия."],"higher":["Если вы накладываете это заклинание, используя ячейку 6-го уровня или выше, урон увеличивается на 1d8 за каждый уровень ячейки выше пятого."],"custom":true},{"id":"cmqx8nohhkz7","name":"Общение","level":5,"classes":["cleric"],"time":"1 минута","range":"На себя","dur":"1 минута","conc":false,"rit":true,"desc":["Вы связываетесь со своим божеством или божественным посредником и задаёте три вопроса, на которые можно ответить «да» или «нет». Вы должны задать вопросы пока заклинание активно. На каждый вопрос вы получаете правильный ответ.","Божественные создания не всегда всеведущи, поэтому вы можете получить ответ «неясно», если вопрос находится вне компетенции божества. Если односложный ответ может ввести в заблуждение или противоречит интересам божества, Мастер может выдать короткую фразу.","Если вы накладываете это заклинание два или более раза до того, как вы закончите продолжительный отдых, существует накопительный шанс 25 процентов за каждое накладывание, начиная со второго, что вы не получите ответ. Мастер совершает этот бросок скрытно."],"higher":[],"custom":true},{"id":"cmqx8nx17j3e","name":"Планарные узы","level":5,"classes":["bard","cleric","druid","warlock","wizard"],"time":"1 час","range":"12","dur":"24 часа","conc":false,"rit":false,"desc":["При помощи этого заклинания вы можете попытаться подчинить Исчадие, Небожителя, Фею или Элементаля. Существо должно находиться в пределах дистанции в течение всего времени накладывания заклинания (обычно для этого существо призывается в центр вывернутого магического круга [magic circle]). В конце накладывания заклинания цель должна совершить спасбросок Харизмы. При провале она должна служить вам, пока заклинание активно. Если существо было призвано или создано другим заклинанием, то длительность того заклинания увеличивается, чтобы совпадать с длительностью этого заклинания.","Подчинённое существо должно выполнять ваши инструкции. Вы можете приказать ему сопровождать вас в приключении, охранять место, или передать послание. Существо выполняет ваши инструкции буквально, и если оно враждебно по отношению к вам, оно будет искать возможность помешать вам. Если существо выполняет ваши инструкции до того как заклинание оканчивается, оно отправляется к вам, чтобы сообщить об этом, если вы с ним находитесь на одном плане существования. Если вы находитесь на разных планах, оно возвращается к месту, где вы подчинили его, и остаётся там, пока заклинание не окончится."],"higher":["Если вы накладываете это заклинание, используя ячейку большего уровня, длительность увеличивается до 10 дней при использовании ячейки 6-го уровня, 30 дней при использовании ячейки 7-го уровня, 180 дней при использовании ячейки 8-го уровня, и года и одного дня при использовании ячейки 9-го уровня."],"custom":true},{"id":"cmqx8o62w6vt","name":"Пляска смерти","level":5,"classes":["warlock","wizard"],"time":"1 действие","range":"12","dur":"До 1 часа","conc":true,"rit":false,"desc":["Нити темной силы срываются с ваших пальцев, чтобы пронзить до пяти Маленьких или Средних трупов, которые вы можете видеть в пределах дистанции. Каждый труп немедленно встает и становится Нежитью. Вы решаете, становится ли он зомби [zombie] или скелетом [skeleton], и он получает бонус к атаке и броскам урона, равный модификатору вашей заклинательной характеристики.","Вы можете использовать бонусное действие, чтобы мысленно управлять существами, которых вы создали этим заклинанием, назначая одну команду сразу всем им. Чтобы получить команду, существо должно находиться в пределах 12 клеток от вас. Вы решаете, какие действия предпримут существа и куда они будут двигаться в следующий ход, или вы можете выдать команду общего характера, например, охранять помещение или проход от ваших врагов.","Если вы не выдаете никаких команд, существа ничего не предпринимают, кроме самозащиты от враждебных существ. После получения команды существа продолжают следовать им, пока их задача не будет выполнена.","Существа находятся под вашим контролем до тех пор, пока заклинание не закончится, после чего они снова станут трупами."],"higher":["Если вы накладываете это заклинание, используя ячейку заклинания 6-го уровня или выше, вы можете оживить до двух дополнительных трупов для каждого уровня ячейки выше 5-го."],"custom":true},{"id":"cmqx8oirarjm","name":"Подчинение личности","level":5,"classes":["bard","sorcerer","wizard"],"time":"1 действие","range":"12","dur":"До 1 минут
