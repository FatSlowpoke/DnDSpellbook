ы","conc":true,"rit":false,"desc":["Вы пытаетесь взять под контроль Гуманоида, которого видите в пределах дистанции. Он должен преуспеть в спасброске Мудрости, иначе станет очарованным вами на время действия заклинания. Если вы или дружественные вам существа сражаются с ним, он совершает спасбросок с преимуществом.","Пока существо очаровано, вы обладаете телепатической связью с ним, пока вы оба находитесь на одном плане существования. При помощи этой связи вы можете отдавать ему команды, пока находитесь в сознании (действие не требуется), и оно должно будет их выполнять. Вы можете указать общее действие, такое как «атакуй вон то существо», «беги отсюда» или «принеси вот это». Если существо выполняет приказ и не получает дальнейших указаний от вас, оно в меру своих сил обороняется и защищает себя.","Вы можете действием захватить полный контроль над целью. До конца вашего следующего хода существо совершает только выбранные вами действия и не делает ничего, что вы ему не позволяете. В это время вы можете заставлять существо совершать реакции, но при этом вы тратите и свою реакцию тоже.","Каждый раз, когда цель получает урон, она совершает новый спасбросок Мудрости от этого заклинания. При успехе заклинание оканчивается."],"higher":["Если вы накладываете это заклинание ячейкой 6-го уровня, длительность становится «Концентрация, вплоть до 10 минут». Если вы накладываете это заклинание ячейкой 7-го уровня, длительность становится «Концентрация, вплоть до 1 часа». Если вы накладываете это заклинание ячейкой 8-го уровня или выше, длительность становится «Концентрация, вплоть до 8 часов»."],"custom":true},{"id":"cmqx8oou89qp","name":"Поток негативной энергии","level":5,"classes":["warlock","wizard"],"time":"1 действие","range":"12","dur":"Мгновенная","conc":false,"rit":false,"desc":["Вы посылаете ленты негативной энергии в одно существо, которое видите в пределах дистанции. Если цель не является Нежитью, она должна совершить спасбросок Телосложения, получая 5d12 урона некротической энергией при провале или половину этого урона при успехе. Цель, убитая этим уроном, восстает в виде зомби [zombie] в начале вашего следующего хода. Зомби [zombie] преследует любое существо, которое может видеть и которое ближе всего к нему.","Если вы нацеливаете это заклинание на Нежить, цель не совершает спасбросок. Вместо этого бросьте 5d12. Цель получает половину выпавшего значения в качестве временных хитов."],"higher":[],"custom":true},{"id":"cmqx8ovbsjjx","name":"Преграда жизни","level":5,"classes":["druid"],"time":"1 действие","range":"На себя (10-футовый радиус)","dur":"До 1 часа","conc":true,"rit":false,"desc":["От вас исходит мерцающий барьер с радиусом 2 клеток, перемещающийся вместе с вами, остающийся с центром на вас, и защищающий вас от всех существ, кроме Нежити и Конструктов.","Барьер существует всё время, пока активно заклинание. Этот барьер не даёт указанным существам проходить и тянуться через него. Указанные существа могут накладывать заклинания и совершать атаки сквозь преграду дальнобойным оружием и оружием со свойством «досягаемость».","Если вы перемещаетесь так, что указанное существо будет вынуждено пройти сквозь барьер, заклинание оканчивается."],"higher":[],"custom":true},{"id":"cmqx8p20vnrh","name":"Преобразование камня","level":5,"classes":["artificer","druid","wizard"],"time":"1 действие","range":"24","dur":"Пока не рассеяно","conc":false,"rit":false,"desc":["Вы выбираете область камня или грязи в кубе с длиной ребра 8 клеток, которую вы можете видеть в пределах дистанции, а затем выбираете один из следующих эффектов:","Преобразование камня в грязь. Любой камень немагического происхождения в области превращается в равный объём густой, текучей грязи, которая остаётся в таком состоянии, пока действует заклинание.","Если вы накладываете это заклинание на землю, она становится достаточно зыбкой, чтобы существа могли в ней утонуть. Каждый фут перемещения в этой области обходится в 4 фута. Все существа, стоявшие в этой области в момент накладывания заклинания, должны совершить спасбросок Силы. Существа также должны совершать этот спасбросок, когда впервые за ход входят в эту область или заканчивают свой ход в ней. При провале существо погружается в грязь и считается опутанным, но может действием освободиться и перестать быть опутанным.","Если вы накладываете это заклинание на потолок, грязь обваливается вниз. Все существа, оказавшиеся внизу, должны совершить спасбросок Ловкости, получая 4d8 дробящего урона при провале или половину этого урона при успехе.","Преобразование грязи в камень. Любая грязь или зыбучий песок немагического происхождения глубиной не более 2 клетки превращаются в мягкий камень на время действия заклинания. Все существа, находившиеся в грязи в момент накладывания заклинания, должны совершить спасбросок Ловкости. При провале застывший камень делает существо опутанным. Опутанное существо может действием попытаться освободиться, если совершит успешную проверку Силы (Сл 20) или причинит 25 урона камню вокруг себя. В случае успешного спасброска существо выбирается из камня в ближайшее свободное пространство. Опутанное существо или иное существо в пределах досягаемости могут действием попытаться разломать камень, совершив успешную проверку Силы Сл 20, или нанося камню урон. У камня 25 хитов и КД 15, а также иммунитет к урону психической энергией и урону ядом."],"higher":[],"custom":true},{"id":"cmqx8p84tfe4","name":"Разрушительная волна","level":5,"classes":["paladin"],"time":"1 действие","range":"На себя (30-футовый радиус)","dur":"Мгновенная","conc":false,"rit":false,"desc":["Вы топаете по полу, создавая волну божественной энергии, исходящей от вас. Все существа, выбранные вами в пределах 6 клеток, должны преуспеть в спасброске Телосложения, иначе они получат 5d6 урона звуком, а также 5d6 урона излучением или некротической энергией (по вашему выбору), и будут сбиты с ног. Существо, преуспевшее в спасброске, получает половину урона и не сбивается с ног."],"higher":[],"custom":true},{"id":"cmqx8peaba05","name":"Рассвет","level":5,"classes":["cleric","wizard"],"time":"1 действие","range":"12","dur":"До 1 минуты","conc":true,"rit":false,"desc":["Рассветные лучи освещают место, которое вы указали в пределах дистанции. Пока заклинание активно, в этом месте ярким светом мерцает цилиндр с радиусом 6 клеток и высотой 8 клеток. Этот свет считается солнечным.","Когда этот цилиндр появляется, каждое существо в нём должно совершить спасбросок Телосложения, получая 4d10 урона излучением при провале или половину этого урона при успехе. Существо также должно совершать этот спасбросок, каждый раз, когда заканчивает свой ход в границах цилиндра.","Если вы находитесь в пределах 12 клеток от цилиндра, в свой ход вы можете бонусным действием переместить его на расстояние до 12 клеток."],"higher":[],"custom":true},{"id":"cmqx8pkxk0i3","name":"Связь с иным миром","level":5,"classes":["warlock","wizard"],"time":"1 минута","range":"На себя","dur":"1 минута","conc":false,"rit":true,"desc":["Вы мысленно связываетесь с полубогом, духом давно умершего мудреца или другой таинственной сущностью с другого плана существования. Контакт с иномировой сущностью может ослабить или даже повредить ваш рассудок. Накладывая это заклинание, вы совершаете спасбросок Интеллекта Сл 15. При провале вы получаете урон психической энергией 6d6 и становитесь безумным до окончания продолжительного отдыха. Будучи безумным, вы не можете совершать действия, не можете понимать речь других существ, не можете читать и можете только неразборчиво бормотать. Заклинание высшее восстановление [greater restoration], наложенное на вас, оканчивает этот эффект.","При успешном спасброске вы можете задать сущности до пяти вопросов. Вы должны задать вопросы до того как окончится заклинание. На все вопросы Мастер отвечает односложно, например, «да», «нет», «может быть», «никогда» или «не ясно» (если сущность не знает ответ). Если односложный ответ может ввести в заблуждение, Мастер может произнести короткую фразу."],"higher":[],"custom":true},{"id":"cmqx8pt95yt8","name":"Святилище","level":5,"classes":["cleric"],"time":"24 часа","range":"Касание","dur":"Пока не рассеяно","conc":false,"rit":false,"desc":["Вы касаетесь точки и наполняете область вокруг неё святой (или нечестивой) силой. Радиус области может быть до 12 клеток, и заклинание проваливается, если в этот радиус попадает область, уже находящаяся под действием заклинания святилище.","Наполненная область подвергается следующим эффектам:","Во-первых, Исчадия, Небожители, Нежить, Феи и Элементали не могут войти в эту область, и не могут делать существ, находящихся внутри, очарованными, испуганными и одержимыми. Все существа, очарованные, испуганные или одержимые такими существами, перестают быть очарованными, испуганными и одержимыми, входя в эту область. Вы можете исключить из эффекта один или несколько видов существ.","Во-вторых, вы можете привязать к области дополнительный эффект. Выберите один эффект из прилагающегося списка, или выберите эффект, предложенный Мастером. Некоторые из этих эффектов применяются к существам, находящимся в области; вы можете указать, будет ли он применяться ко всем существам, существам, служащим определенному божеству или лидеру, или существам определенного вида, например, оркам и троллям. Когда существо, попадающее под действие эффекта, входит в область заклинания впервые за ход или начинает там ход, оно может совершить спасбросок Харизмы. В случае успеха существо игнорирует дополнительный эффект, пока не покинет эту область.","Вечный покой. Мёртвые тела, похороненные в области, не могут стать Нежитью.","Вмешательство в путешествия между измерениями. Затронутые существа не могут перемещаться и путешествовать, используя телепортацию или перемещение между измерениями и планами.","Дневной свет. Область освещается ярким светом. Магическая тьма, созданная заклинаниями с уровнем меньше уровня ячейки, использованной вами для накладывания этого заклинания, не может затмить свет.","Защита от энергии. Затронутые существа в области получают сопротивление одному виду урона на ваш выбор кроме дробящего, колющего и рубящего.","Страх. Затронутые существа испуганы, пока находятся в области.","Темнота. Область заполняется темнотой. Обычный свет, а также магический свет, созданный заклинаниями, с уровнем меньше уровня ячейки, использованной вами для накладывания этого заклинания, не могут осветить область.","Тишина. Звуки не покидают границы области, и не проникают снаружи внутрь.","Уязвимость энергии. Затронутые существа в области получают уязвимость к одному виду урона на ваш выбор кроме дробящего, колющего и рубящего.","Храбрость. Затронутые существа не могут быть испуганы, пока находятся в области.","Языки. Затронутые существа могут общаться с любыми другими существами, находящимися в области, даже если они не знают Общий язык."],"higher":[],"custom":true},{"id":"cmqx8q05xbzb","name":"Священное оружие","level":5,"classes":["cleric","paladin"],"time":"1 бонусное действие","range":"Касание","dur":"До 1 часа","conc":true,"rit":false,"desc":["Вы наполняете оружие, которого касаетесь, святой силой. Пока заклинание активно, оружие излучает яркий свет в пределах 6 клеток и тусклый свет в пределах ещё 6 клеток. Кроме того, атаки, совершенные этим оружием, наносят дополнительно 2d8 урона излучением при попадании. Если оружие ещё не является магическим, оно становится таковым на время действия заклинания.","Бонусным действием вы можете отменить это заклинание и создать вспышку света, исходящую из оружия. Каждое существо по вашему выбору, которое вы видите в пределах 6 клеток от оружия, должно совершить спасбросок Телосложения. При неудачном спасброске существо получает 4d8 урона излучением, и становится ослеплённым на 1 минуту.","При успешном спасброске существо получает половину урона и не ослепляется. В конце каждого своего хода ослеплённое существо может повторить спасбросок Телосложения, оканчивая эффект на себе при успехе."],"higher":[],"custom":true},{"id":"cmqx8q5vbfgs","name":"Силовая стена","level":5,"classes":["wizard"],"time":"1 действие","range":"24","dur":"До 10 минут","conc":true,"rit":false,"desc":["Невидимая стена из силового поля появляется в точке, выбранной вами в пределах дистанции. Стена появляется, будучи ориентированной в любом направлении: горизонтальном, вертикальном или наклонённом. Она может свободно парить, а может опираться на твёрдую поверхность. Вы можете создать её полусферой-куполом или сферой с радиусом до 2 клетки, или можете сформировать плоскую поверхность, состоящую из плит 10 × 2 клетки, количество которых может доходить до десяти. Каждая плита должна соседствовать как минимум с одной другой плитой. Какая бы форма ни была у стены, её толщина всегда 1/4 дюйма (6 миллиметров). Она существует, пока активно заклинание. Если стена при появлении проходит по пространству существа, это существо выталкивается по одну из сторон стены (на ваш выбор).","Ничто не может физически пройти сквозь эту стену. Она обладает иммунитетом ко всем видам урона, и не может быть рассеяна заклинанием рассеивание магии [dispel magic]. Заклинание распад [disintegrate] полностью уничтожает стену. Стена простирается и на Эфирный план, блокируя эфирные перемещения сквозь себя."],"higher":[],"custom":true},{"id":"cmqx8qbxo2km","name":"Синаптический разряд","level":5,"classes":["bard","sorcerer","warlock","wizard"],"time":"1 действие","range":"24","dur":"Мгновенная","conc":false,"rit":false,"desc":["Вы выбираете точку в пределах дистанции и вызываете в ней взрыв психической энергии. Каждое существо в сфере с радиусом 4 клеток с центром в этой точке должно совершить спасбросок Интеллекта. Существа, у которых Интеллект равен 2 или ниже, не попадают под действие этого заклинания. Цель получает 8d6 урона психической энергией при провале или половину этого урона при успехе.","После провала спасброска цель начинает путаться в мыслях в течение 1 минуты. В течение этого времени она бросает d6 и вычитает получившееся число из всех её бросков атаки и проверок характеристики, а также из её спасбросков Телосложения на сохранение концентрации. В конце каждого своего хода цель может совершать спасбросок Интеллекта, оканчивая эффект на себе при успехе."],"higher":[],"custom":true},{"id":"cmqx8qj3shuh","name":"Телекинез","level":5,"classes":["sorcerer","wizard"],"time":"1 действие","range":"12","dur":"До 10 минут","conc":true,"rit":false,"desc":["Вы получаете способность перемещать силой мысли существ и предметы, а также манипулировать ими. Когда вы накладываете это заклинание, а также в каждом последующем раунде новым действием вы можете воздействовать на одно существо или предмет, видимый в пределах дистанции, вызывая один из описанных ниже эффектов. Вы можете действовать на одну и ту же цель, а можете каждый раз выбирать новую. Если вы меняете цель, предыдущая перестаёт быть под действием этого заклинания.","Предмет. Вы можете попытаться переместить предмет, весящий до 1000 фунтов (450 кг). Если предмет не несут и не носят, вы автоматически перемещаете его на 6 клеток в любом направлении, но не за пределы дистанции заклинания. Если предмет несёт или носит существо, вы должны совершить проверку базовой характеристики, противопоставив её проверке Силы существа. Если вы выиграете проверку, вы вырываете предмет у этого существа, и можете переместить его на 6 клеток в любом направлении, но не за пределы дистанции заклинания. Вы очень хорошо контролируете предмет телекинетической хваткой, так что можете манипулировать простыми инструментами, открывать двери и контейнеры, доставать и убирать предметы из открытых контейнеров, а также выливать содержимое сосудов.","Существо. Вы можете попытаться переместить существо с размером не больше Огромного. Совершите проверку своей базовой характеристики, противопоставив её проверке Силы существа. Если вы выиграете проверку, вы перемещаете существо на 6 клеток в любом направлении, включая вверх, но не за пределы дистанции заклинания. До конца вашего следующего хода существо становится опутанным телекинетической хваткой. Существо, поднятое вверх, висит в воздухе. В последующих раундах вы можете действием пытаться поддерживать телекинетическую хватку существа, повторяя встречную проверку."],"higher":[],"custom":true},{"id":"cmqx8qpu2k8v","name":"Удар стального ветра","level":5,"classes":["ranger","wizard"],"time":"1 действие","range":"6","dur":"Мгновенная","conc":false,"rit":false,"desc":["Вы взмахиваете оружием, используемым для заклинания, а затем исчезаете, чтобы ударить, подобно ветру. Выберите до пяти существ в пределах дистанции, которых вы можете видеть. Совершите рукопашную атаку заклинанием по каждой цели. При попадании цель получает 6d10 урона силовым полем.","После этого вы можете телепортироваться в свободное пространство, которое вы можете видеть в пределах 1 клетки от одной из целей, которую вы атаковали, независимо от того, попали вы по ней или нет."],"higher":[],"custom":true},{"id":"cmqx8qvraiev","name":"Удержание чудовища","level":5,"classes":["bard","sorcerer","warlock","wizard"],"time":"1 действие","range":"18","dur":"До 1 минуты","conc":true,"rit":false,"desc":["Выберите существо, которое видите в пределах дистанции. Цель должна преуспеть в спасброске Мудрости, иначе станет парализованной на период действия заклинания. Это заклинание не оказывает эффекта на Нежити. В конце каждого своего хода цель может совершать новые спасброски Мудрости. В случае успеха заклинание на этой цели оканчивается."],"higher":["Если вы накладываете это заклинание, используя ячейку 6-го уровня или выше, вы можете сделать целью одно дополнительное существо за каждый уровень ячейки выше пятого. Эти существа должны находиться в пределах 6 клеток друг от друга, когда вы нацеливаетесь на них."],"custom":true},{"id":"cmqx8r39it5h","name":"Фальшивый двойник","level":5,"classes":["bard","warlock","wizard"],"time":"1 действие","range":"На себя","dur":"До 1 часа","conc":true,"rit":false,"desc":["Вы становитесь невидимым, и в то же время в том месте, где вы были, появляется ваш иллюзорный двойник. Двойник существует, пока заклинание активно, но невидимость оканчивается, если вы атакуете или накладываете заклинание.","Вы можете действием переместить своего иллюзорного двойника на расстояние, вдвое превышающее вашу скорость, и заставить его жестикулировать, говорить и вести себя так, как вам хочется. Вы можете видеть его глазами и слышать его ушами, как если бы вы находились там же, где он. В каждом своём ходу вы можете бонусным действием переключиться с его чувств на свои, или обратно. Пока вы используете его чувства, вы ослеплены и глухи для своего окружения."],"higher":[],"custom":true},{"id":"cmqx8rsnmjal","name":"Временной сдвиг","level":5,"classes":[],"time":"Реакция","range":"24","dur":"1 раунд","conc":false,"rit":false,"desc":["Вы нацеливаетесь на спровоцировавшее реакцию существо, и оно должно преуспеть в спасброске Мудрости, иначе оно исчезает, оказываясь в ином временном промежутке, в котором его атака промахивается, а заклинание не оказывает никакого эффекта. В начале своего следующего хода цель появляется в том же месте или ближайшем к нему свободном пространстве. Цель не помнит как вы накладывали заклинание и как она была подвержена эффекту этого заклинания."],"higher":["Если вы накладываете это заклинание, используя ячейку 6-го уровня или выше, вы можете выбрать в качестве цели одно дополнительное существо за каждый уровень выше пятого. Все цели должны быть в пределах 6 клеток друг от друга."],"custom":true},{"id":"cmqx8sdiayba","name":"Высшее восстановление","level":5,"classes":["artificer","bard","cleric","druid","ranger"],"time":"1 действие","range":"Касание","dur":"Мгновенная","conc":false,"rit":false,"desc":["Вы наделяете существо, которого касаетесь, позитивной энергией, отменяющей ослабляющие эффекты. Вы можете уменьшить количество степеней истощения цели на 1 или окончить на ней один из следующих эффектов:","- Один эффект, делающий цель очарованной или окаменевшей.","- Одно проклятие, включая настройку на проклятый магический предмет.","- Любое уменьшение одной из характеристик цели.","- Один эффект, уменьшающий максимум хитов цели."],"higher":[],"custom":true},{"id":"cmqx8sllrvrk","name":"Древесный путь","level":5,"classes":["druid","ranger"],"time":"1 действие","range":"На себя","dur":"До 1 минуты","conc":true,"rit":false,"desc":["Вы получаете способность входить в дерево и перемещаться через него в другое дерево того же вида, находящееся в пределах 100 клеток. Оба дерева должны быть живыми, и размер обоих должен быть не меньше вашего. Вы должны использовать 1 клетка перемещения, чтобы войти в дерево. Вы мгновенно узнаёте местоположение всех других деревьев этого вида в пределах 100 клеток, и частью этого же перемещения можете либо перейти в одно из этих деревьев, либо выйти из дерева, в котором вы находитесь. Вы появляетесь в пространстве на свой выбор в пределах 1 клетки от текущего дерева, используя ещё 1 клетка перемещения. Если у вас не осталось перемещения, вы появляетесь в пределах 1 клетки от дерева, в которое входили.","Вы можете использовать эту перемещающую способность один раз в раунд, пока активно заклинание. Каждый ход вы должны заканчивать вне дерева."],"higher":[],"custom":true},{"id":"cmqx8srbfl06","name":"Знание легенд","level":5,"classes":["bard","cleric","wizard"],"time":"10 минут","range":"На себя","dur":"Мгновенная","conc":false,"rit":false,"desc":["Назовите или опишите личность, место или вещь. Заклинание создаёт в вашем сознании краткое описание важных знаний о данном предмете. Это могут быть текущие разговоры, забытые истории, или даже тайные знания, никогда не выходящие за рамки определённого круга посвящённых. Если названный предмет не обладает легендарной значимостью, вы не получаете информацию.","Чем больше информации о выбранном предмете у вас уже есть, тем точнее и детальнее будет полученная вами информация. Полученная информация правдива, но может быть завуалирована. Например, если вы нашли таинственный топор, заклинание может выдать такую информацию: «Горе злодею, коснувшемуся этого топора, ибо даже древко его способно отрубить руки негодяю. Только истинный Сын Камня, почитатель и любимец Морадина, может пробудить истинную силу этого топора, и то только если назовёт священное слово Рудногг»."],"higher":[],"custom":true},{"id":"cmqx8syo1k9l","name":"Инфернальный зов","level":5,"classes":["warlock","wizard"],"time":"1 минута","range":"18","dur":"До 1 часа","conc":true,"rit":false,"desc":["Произнося темное заклинание, вы вызываете дьявола из Девяти Преисподних. Вы выбираете тип дьявола, который должен иметь показатель опасности 6 или ниже, например, шипастый [barbed devil] или бородатый дьявол [bearded devil]. Дьявол появляется в свободном пространстве, которое вы видите в радиусе действия. Дьявол исчезает, когда его хиты опускаются до 0 или когда заклинание заканчивается.","Дьявол недружелюбен к вам и вашим спутникам. Совершите проверку инициативы за дьявола, который будет совершать свои собственные ходы. Он находится под контролем Мастера и в каждом своем ходу действует в соответствии со своей природой. Дьявол может атаковать вас, если считает, что может победить, или он попытается искусить вас, чтобы вы совершили злой поступок в обмен на небольшую услугу. Параметры существа есть у Мастера.","Каждый ваш ход вы можете попытаться дать вербальную команду дьяволу (действие не требуется).Он подчиняется команде, если вероятный результат соответствует его желаниям, особенно если результат приведет вас ко злу. В противном случае вы должны совершить проверку Харизмы (Обман, Запугивание или Убеждение) против его проверки Мудрости (Проницательность).","Вы совершаете проверку с преимуществом, если произносите истинное имя дьявола. При провале дьявол становится невосприимчивым к вашим вербальным командам на всё время действия заклинания, хотя он всё равно может выполнять ваши команды, если захочет. При успехе дьявол будет выполнять вашу команду, например, — «атакуй моих врагов», «исследуй комнату впереди» или «отнеси это сообщение королеве», — пока он не завершит это дело, после чего вернется к вам, чтобы сообщить о выполнении.","Если вы теряете концентрацию до того, как заклинание закончится, дьявол не исчезает, если он стал невосприимчив к вашим вербальным командам. Вместо этого он действует по своему желанию в течение 3d6 минут и только потом исчезает.","Если у вас есть талисман конкретного дьявола, вы можете призвать этого дьявола, если он имеет соответствующий показатель опасности плюс 1, и он подчиняется всем вашим командам без каких-либо проверок Харизмы."],"higher":["Если вы накладываете это заклинание, используя ячейку 6-го уровня или выше, показатель опасности увеличивается на 1 за каждый уровень ячейки выше 5-го."],"custom":true},{"id":"cmqx8t5nxon9","name":"Испепеление","level":5,"classes":["sorcerer","wizard"],"time":"1 действие","range":"18","dur":"До 1 минуты","conc":true,"rit":false,"desc":["Одно существо, которое вы можете видеть в пределах дистанции, охватывает пламя. Цель должна совершить спасбросок Ловкости. Существо получает 8d6 урона огнём при провале или половину этого урона при успехе. Кроме того, при провале цель воспламеняется на время действия заклинания. Горящая цель испускает яркий свет в пределах 6 клеток и тусклый свет в пределах ещё 6 клеток. В конце каждого своего хода цель повторяет спасбросок. При провале цель получает 4d6 урона огнём. При успехе заклинание оканчивается. Этот магический огонь не может быть погашен немагическими средствами.","Если урон от этого заклинания убивает цель, то она превращается в пепел."],"higher":[],"custom":true},{"id":"cmqx8tbdjmfi","name":"Круг силы","level":5,"classes":["paladin"],"time":"1 действие","range":"На себя (30-футовый радиус)","dur":"До 10 минут","conc":true,"rit":false,"desc":["От вас исходит божественная энергия, искажающая и рассеивающая магическую энергию в пределах 6 клеток от вас. Пока заклинание активно, сфера перемещается вместе с вами, оставаясь с центром на вас. Все дружественные существа в этой области (включая вас) получают преимущество к спасброскам от заклинаний и других магических эффектов.","Кроме того, когда такое существо преуспевает в спасброске от заклинания или магического эффекта, позволяющего совершить спасбросок для получения всего лишь половины урона, оно не получает урон вообще."],"higher":[],"custom":true},{"id":"cmqx8tiqx7r1","name":"Круг телепортации","level":5,"classes":["bard","sorcerer","warlock","wizard"],"time":"1 минута","range":"2","dur":"1 раунд","conc":false,"rit":false,"desc":["В процессе накладывания заклинания вы рисуете на полу круг диаметром 2 клетки, исписанный знаками, связывающими ваше местоположение с постоянным кругом телепортации на ваш выбор, чью последовательность знаков вы знаете, и находящимся на том же плане существования, что и вы. В нарисованном круге появляется мерцающий портал, остающийся открытым до конца вашего следующего хода. Все существа, входящие в портал, мгновенно появляются в пределах 1 клетки от места назначения или в ближайшем свободном пространстве, если то место занято.","Во многих основных храмах, гильдиях и прочих важных местах есть постоянные круги телепортации, начертанные где-то на их территории. У каждого такого круга есть уникальная последовательность знаков — серия рун, начертанных в определённом узоре. Когда вы впервые получаете возможность накладывать это заклинание, вы изучаете последовательность знаков двух местонахождений на Материальном плане, выбранных Мастером. Вы можете узнать дополнительные последовательности знаков во время приключений. Вы можете запомнить новую последовательность, изучая её 1 минуту.","Вы можете создать постоянный круг телепортации, накладывая это заклинание в одном и том же месте каждый день в течение одного года. При этом вы не обязаны тут же использовать свежесозданный круг."],"higher":[],"custom":true},{"id":"cmqx8tp9lp1p","name":"Множественное лечение ран","level":5,"classes":["bard","cleric","druid"],"time":"1 действие","range":"12","dur":"Мгновенная","conc":false,"rit":false,"desc":["Волна целительной энергии исходит из точки, выбранной вами в пределах дистанции. Выберите до шести существ в сфере с радиусом 6 клеток с центром на этой точке. Все цели восстанавливают хиты в количестве, равном 3d8 + модификатор вашей базовой характеристики. Это заклинание не оказывает никакого эффекта на Нежить и Конструктов."],"higher":["Если вы накладываете это заклинание, используя ячейку 6-го уровня или выше, восстанавливается дополнительно 1d8 хитов за каждый уровень ячейки выше пятого."],"custom":true},{"id":"cmqx8tunsh34","name":"Небесный огонь","level":5,"classes":["cleric"],"time":"1 действие","range":"12","dur":"Мгновенная","conc":false,"rit":false,"desc":["В указанном вами месте возникает вертикальная колонна божественного пламени. Все существа в цилиндре с радиусом 2 клеток и высотой 8 клеток с центром на точке в пределах дистанции должны совершить спасбросок Ловкости. При провале существо получает 4d6 урона излучением и 4d6 урона огнём, а при успехе половину этого урона."],"higher":["Если вы накладываете это заклинание, используя ячейку 6-го уровня или выше, урон излучением или урон огнём (на ваш выбор) увеличивается на 1d6 за каждый уровень ячейки выше пятого."],"custom":true},{"id":"cmqx8ufnj9df","name":"Общение с природой","level":5,"classes":["druid","ranger"],"time":"1 минута","range":"На себя","dur":"Мгновенная","conc":false,"rit":true,"desc":["Вы ненадолго сливаетесь с природой и получаете знание об окружающей территории. На открытом воздухе заклинание даёт вам знание о землях в пределах 3 миль. В пещерах и естественном подземном окружении радиус 60 клеток. Заклинание не действует там, где природа заменена конструкциями, например, в городах и подвалах. Вы мгновенно получаете знание о трёх фактах на ваш выбор о следующих особенностях местности:","- Местность и водоёмы.","- Преобладающие растения, минералы, животные и разумные существа.","- Мощные Исчадия, Небожители, Нежить, Феи или Элементали.","- Влияние с других планов существования.","- Строения.","Например, вы можете определить местонахождение мощной Нежити, местонахождение чистой воды для питья и местонахождение окрестных поселений."],"higher":[],"custom":true},{"id":"cmqx8yg13ydh","name":"Оживление вещей","level":5,"classes":["artificer","bard","sorcerer","wizard"],"time":"1 действие","range":"24","dur":"До 1 минуты","conc":true,"rit":false,"desc":["По вашему приказу оживают предметы. Выберите до десяти немагических предметов в пределах дистанции, которые никто не несёт и не носит. Цели Среднего размера считаются за два предмета, Большие цели считаются за четыре предмета, Огромные цели считаются за восемь предметов. Оживлять предметы с размером больше Огромного нельзя. Все цели оживают и становятся существами под вашим контролем до окончания действия заклинания или пока их хиты не уменьшатся до 0.","Вы можете бонусным действием мысленно отдать приказ существу, созданному этим заклинанием, если оно находятся в пределах 100 клеток от вас (если вы контролируете несколько существ, вы можете отдавать один и тот же приказ любому количеству из них одновременно). Вы решаете, какое действие совершит это существо, и куда оно переместится в следующем ходу, или вы можете отдать общий приказ, например, охранять комнату или коридор. Если вы не отдадите команду, существо будет всего лишь защищаться от врагов. Получив приказ, существо продолжает его выполнять, пока задача не будет выполнена.","Размер - Хиты - КД - Атака - Сила - Ловкость\nКрошечный\t20\t18\t+8 к атаке, урон 1d4 + 4\t4\t18\nМаленький\t25\t16\t+6 к атаке, урон 1d8 + 2\t6\t14\nСредний\t40\t13\t+5 к атаке, урон 2d6 + 1\t10\t12\nБольшой\t50\t10\t+6 к атаке, урон 2d10 + 2\t14\t10\nОгромный\t80\t10\t+8 к атаке, урон 2d12 + 4\t18\t6","Оживлённый предмет является Конструктом с КД, хитами, атаками, Силой и Ловкостью, зависящими от его размера. Его Телосложение 10, Интеллект и Мудрость 3, а Харизма 1. Его скорость 6 клеток; если у предмета нет ног или других придатков, которые можно использовать для перемещения, то он получает скорость полёта 6 клеток и может парить. Если предмет прикреплён к поверхности или большему предмету, например, это цепь, прикреплённая к стене, его скорость равна 0. Он обладает слепым зрением в радиусе 6 клеток и ничего не воспринимает за этими пределами. Когда хиты оживлённого предмета опускаются до 0, он возвращает себе свой обычный облик, а излишний урон переносится на оригинальный облик.","Если вы приказываете предмету атаковать, он может совершить одну рукопашную атаку по существу в пределах 1 клетки от него. Он совершает размашистую атаку с бонусом атаки и дробящим уроном, зависящим от его размера. Мастер может постановить, что этот предмет причиняет рубящий или колющий урон."],"higher":["Если вы накладываете это заклинание, используя ячейку 6-го уровня или выше, вы можете оживить два дополнительных предмета за каждый уровень ячейки выше пятого."],"custom":true},{"id":"cmqx8ynhnuul","name":"Призыв духа дракона","level":5,"classes":["druid","sorcerer","wizard"],"time":"1 действие","range":"12","dur":"До 1 часа","conc":true,"rit":false,"desc":["Вы призываете духа дракона. Он проявляется в свободном пространстве, которое вы можете видеть в пределах дистанции.","Воплощённая форма духа использует блок статистики дух дракона [draconic spirit]. Когда вы накладываете заклинание, выберите род Дракона: цветной, самоцветный или металлический. Существо напоминает Дракона выбранного рода, что определяет особенности духа, описанные в блоке статистики. Существо исчезает, когда его хиты опускаются до 0 или когда заклинание заканчивается.","Это существо дружелюбно к вам и вашим товарищам. В бою существо получает вашу инициативу и ходит сразу же после вас. Оно подчиняется вашим вербальным командам (никаких действий от вас не требуется). Если вы ничего не приказываете, то оно применяет действие Уклонение и перемещается, избегая опасностей."],"higher":["Когда вы накладываете это заклинание, используя ячейку 6-го уровня или выше, характеристики призываемого существа изменяются в соответствии с описанием в блоке статистики."],"custom":true},{"id":"cmqx8yt55awo","name":"Призыв духа небожителя","level":5,"classes":["cleric","paladin"],"time":"1 действие","range":"18","dur":"До 1 часа","conc":true,"rit":false,"desc":["Вы призываете духа небожителя [celestial spirit]. Он проявляется в форме ангела в свободном пространстве, которое вы можете видеть в пределах дистанции заклинания. Воплощённая форма духа использует блок статистики духа небожителя [celestial spirit]. Выберите тип духа во время наложения заклинания: мститель или защитник. Ваш выбор определяет атаку существа в блоке статистики. Существо исчезает, когда его хиты опускаются до 0 или когда заклинание заканчивается.","Это существо дружелюбно к вам и вашим товарищам. В бою существо получает вашу инициативу и ходит сразу же после вас. Оно подчиняется вашим вербальным командам (никаких действий от вас не требуется). Если вы ничего не приказываете, то оно применяет действие Уклонение и перемещается, избегая опасностей."],"higher":["Когда вы накладываете это заклинание, используя ячейку 6-го уровня или выше, характеристики призываемого существа изменяются в соответствии с описанием в блоке статистики."],"custom":true},{"id":"cmqx8yypt9wg","name":"Призыв залпа","level":5,"classes":["ranger"],"time":"1 действие","range":"30","dur":"Мгновенная","conc":false,"rit":false,"desc":["Вы метаете немагическое оружие или выстреливаете немагический боеприпас в воздух и выбираете точку в пределах дистанции. Сотни экземпляров такого же оружия или боеприпаса падают залпом и потом исчезают. Все существа в цилиндре с радиусом 8 клеток и высотой 4 клетки должны совершить спасбросок Ловкости. При провале существо получает урон 8d8, а при успехе половину этого урона. Вид урона такой же, как у оружия или боеприпаса, использованного в качестве компонента."],"higher":[],"custom":true},{"id":"cmqx8z55wlnn","name":"Призыв элементаля","level":5,"classes":["druid","wizard"],"time":"1 минута","range":"18","dur":"До 1 часа","conc":true,"rit":false,"desc":["Вы вызываете служащего вам Элементаля. Выберите область воды, воздуха, земли или огня, помещающуюся в куб с длиной ребра 2 клетки. В свободном пространстве в пределах 2 клеток от выбранной области появляется соответствующий этой области Элементаль с показателем опасности 5 или меньше. Например, из костра выходит огненный элементаль [fire elemental], а из-под земли выбирается земляной элементаль [earth elemental]. Элементаль исчезает, когда его хиты опускаются до 0, или когда заклинание оканчивается.","Элементаль дружественен к вам и вашим спутникам, пока заклинание активно. Совершите проверку инициативы за Элементаля, и он будет совершать свои собственные ходы. Он подчиняется вашим вербальным командам (действие не требуется). Если вы не отдаёте команду, он защищается от враждебных существ, но в иных случаях действий не совершает.","Если ваша концентрация нарушена, Элементаль не исчезает. Вместо этого вы теряете над ним контроль, и он становится враждебным к вам и вашим спутникам, и может напасть. Неуправляемый Элементаль не может быть отпущен вами, но он исчезает через 1 час после того, как был призван. Статистика Элементаля есть у Мастера."],"higher":["Если вы накладываете это заклинание, используя ячейку 6-го уровня или выше, показатель опасности увеличивается на 1 за каждый уровень ячейки выше пятого."],"custom":true},{"id":"cmqx8zatdq8w","name":"Притворство","level":5,"classes":["bard","sorcerer","wizard"],"time":"1 действие","range":"6","dur":"8 часов","conc":false,"rit":false,"desc":["Это заклинание позволяет вам менять облик любого количества существ, видимых вами в пределах дистанции. Вы даёте каждой выбранной цели новый, иллюзорный облик. Несогласная цель может совершить спасбросок Харизмы, и в случае успеха заклинание на неё не действует.","Это заклинание маскирует внешний облик, а также одежду, доспехи, оружие и снаряжение. Вы можете сделать каждое существо на 1 фут (30 сантиметров) ниже или выше, и сделать его худого, толстого или обычного сложения. Вы не можете менять вид тела цели, так что у неё должен быть такой же набор конечностей. Во всём остальном иллюзию определяете вы. Заклинание действует всю свою длительность, но вы можете действием окончить действие заклинания досрочно.","Изменения, внесённые этим заклинанием, не проходят проверку физическим исследованием. Например, если заклинание добавит шляпу к снаряжению персонажа, предметы будут проходить сквозь неё, и все, кто коснутся её, либо не почувствуют ничего, либо почувствуют голову и волосы. Если вы сделаете себя более худым, то рука того, кто захочет к вам прикоснуться, ударится о вас, не дойдя до видимых очертаний.","Существо может действием осмотреть цель и совершить проверку Интеллекта (Расследование) против Сл ваших заклинаний. В случае успеха оно поймёт, что облик ненатурален."],"higher":[],"custom":true},{"id":"cmqx8zgq2rag","name":"Пробуждение разума","level":5,"classes":["bard","druid"],"time":"8 часов","range":"Касание","dur":"Мгновенная","conc":false,"rit":false,"desc":["Потратив время на прокладывание магических каналов в драгоценном камне, вы касаетесь им Зверя или Растения с размером не больше Огромного. У цели либо не должно быть значения Интеллекта, либо Интеллект должен быть не больше 3. Цель получает Интеллект 10. Цель также получает способность говорить на одном известном вам языке. Если цель — Растение, оно получает возможность шевелить ветками, корнями, лианами, и так далее, и получает чувства, подобные человеческим. Мастер подбирает статистику для пробуждённого Растения, будь то куст или дерево.","Пробуждённый Зверь или Растение очарован вами 30 дней, либо пока вы или ваши спутники не причините ему вред. Когда очарование спадает, пробуждённое существо решает, останется ли оно к вам дружелюбно, в зависимости от того, как вы с ним обращались."],"higher":[],"custom":true},{"id":"cmqx8znl1fco","name":"Рассеивание зла и добра","level":5,"classes":["cleric","paladin"],"time":"1 действие","range":"На себя","dur":"До 1 минуты","conc":true,"rit":false,"desc":["Вас окружает мерцающая энергия, защищающая от Нежити, Фей и существ, происходящих не с Материального плана. Пока заклинание активно, Исчадия, Небожители, Нежить, Феи и Элементали совершают по вам броски атаки с помехой. Вы можете закончить заклинание преждевременно, выбрав один из представленных ниже вариантов:","Изгнание. Вы совершаете действием рукопашную атаку заклинанием по Исчадию, Небожителю, Нежити, Фее или Элементалю в пределах досягаемости. При попадании вы пытаетесь изгнать существо на его родной план. Существо должно преуспеть в спасброске Харизмы, иначе оно будет отправлено на свой родной план (если только оно уже не находится там). Нежить отправляется в Царство Теней, а Феи — в Страну Фей.","Поломка чар. Вы касаетесь действием существа, до которого можете дотянуться, и которое очаровано, испугано или одержимо Исчадием, Небожителем, Нежитью, Феей или Элементалем. Это существо перестаёт быть очарованным, испуганным или одержимым такими существами."],"higher":[],"custom":true},{"id":"cmqx8zz9jmv9","name":"Создание прохода","level":5,"classes":["wizard"],"time":"1 действие","range":"6","dur":"1 час","conc":false,"rit":false,"desc":["В точке, которую вы видите в пределах дистанции на деревянной, оштукатуренной или каменной поверхности (такой как стена, потолок или пол) появляется проход, существующий, пока активно заклинание. Вы сами определяете габариты прохода: до 1 клетка в ширину, до 2 клетки в высоту и до 4 клетки в глубину. Этот проход не дестабилизирует само строение.","Когда проход исчезает, все существа и предметы, всё ещё находящиеся в нём, безопасно выталкиваются в свободное пространство, ближайшее к поверхности, на которой вы активировали это заклинание."],"higher":[],"custom":true},{"id":"cmqx90q5f8p8","name":"Сотворение","level":5,"classes":["artificer","sorcerer","wizard"],"time":"1 минута","range":"6","dur":"","conc":false,"rit":false,"desc":["Вы зачерпываете теневую материю в Царстве Теней и создаёте в пределах дистанции неживой предмет из растительного вещества: ткань, верёвку, дерево, или что-то подобное. Этим заклинанием вы также можете создавать предметы из минералов, таких как камни, кристаллы и металлы. Создаваемый предмет должен помещаться в куб с длиной ребра 1 клетка и должен иметь форму и материал, которые вы раньше видели.","Материал\tДлительность\nРастительное вещество\t1 день\nКамень или кристалл\t12 часов\nДрагоценные металлы\t1 час\nДрагоценные камни\t10 минут\nАдамантин или мифрил\t1 минута","Использование материала, созданного этим заклинанием, в качестве материального компонента для другого заклинания вызывает провал того заклинания."],"higher":["Если вы накладываете это заклинание, используя ячейку 6-го уровня или выше, длина ребра куба увеличивается на 1 клетка за каждый уровень ячейки выше пятого."],"custom":true},{"id":"cmqx90yp5xxf","name":"Сотворение магического руля","level":5,"classes":["artificer","wizard"],"time":"1 действие","range":"Касание","dur":"Мгновенная","conc":false,"rit":false,"desc":["Удерживая жезл, используемый для накладывания заклинания, вы касаетесь незанятого сиденья не более Большого размера. Жезл исчезает, а сиденье превращается в магический руль [spelljamming helm]."],"higher":[],"custom":true},{"id":"cmqx914up3p1","name":"Стена света","level":5,"classes":["sorcerer","warlock","wizard"],"time":"1 действие","range":"24","dur":"До 10 минут","conc":true,"rit":false,"desc":["Мерцающая стена яркого света появляется в точке, которую вы выбираете в пределах дистанции. Стена появляется в любой выбранной вами ориентации: по горизонтали, вертикали или диагонали. Она может свободно парить или же опираться на твёрдую поверхность. Стена может иметь длину до 12 клеток, высоту до 2 клетки и толщину до 1 клетка. Стена блокирует линию обзора, но существа и объекты могут проходить через неё. Она излучает яркий свет на 24 клетки и тусклый свет в пределах ещё 24 клетки.","Когда стена появляется, каждое существо в её области должно сделать спасбросок Телосложения. При провале существо получает 4d8 урона излучением и становится ослеплённым на 1 минуту. При успехе оно получает только половину урона и не ослеплено. Ослеплённое существо может совершать спасбросок Телосложения в конце каждого своего хода, при успехе оканчивая эффект на себе.","Существо, которое заканчивает свой ход в пространстве стены, получает 4d8 урона излучением.","Пока заклинание не закончится, вы можете действием направить сияющий луч от стены на одно существо, которое вы можете видеть на расстоянии 12 клеток от неё. Для этого совершите дальнобойную атаку заклинанием. При попадании цель получает 4d8 урона излучением. Независимо от того, попали вы или промахнулись, длина стены уменьшается на 2 клетки. Если длина стены уменьшается до 0 футов, заклинание заканчивается."],"higher":["Если вы накладываете это заклинание, используя ячейку заклинания 6-го уровня или выше, урон увеличивается на 1d8 для каждого уровня ячейки выше 5."],"custom":true},{"id":"cmqx91akjtut","name":"Усиление навыка","level":5,"classes":["artificer","bard","sorcerer","wizard"],"time":"1 действие","range":"Касание","dur":"До 1 часа","conc":true,"rit":false,"desc":["Ваша магия углубляет понимание существом собственного таланта. Вы касаетесь одного согласного существа и наделяете его специальными познаниями в одном навыке по вашему выбору. Пока заклинание активно, существо удваивает свой бонус мастерства для всех совершаемых им проверок характеристик, использующих выбранный навык.","Вы должны выбрать навык, которым существо уже владеет и который ещё не получает преимуществ от подобных эффектов, удваивающих его бонус мастерства, таких как «Компетентность»."],"higher":[],"custom":true},{"id":"cmqx946y5yg3","name":"Волшебный сосуд","level":6,"classes":["wizard"],"time":"1 минута","range":"На себя","dur":"Пока не рассеяно","conc":false,"rit":false,"desc":["Ваше тело впадает в кататоническое состояние, так как душа покидает его и входит в контейнер, выбранный материальным компонентом. Пока ваша душа обитает в контейнере, вы воспринимаете своё окружение, как если бы находились в пространстве контейнера. Вы не можете перемещаться и использовать реакции. Единственное действие, которое вы можете совершать, — это проецирование души на 20 клеток от контейнера, чтобы либо вернуться в своё тело (окончив этим заклинание), либо попытаться овладеть телом другого Гуманоида.","Вы можете попытаться овладеть Гуманоидом, которого вы можете видеть в пределах 20 клеток от вас (нельзя овладевать существами, защищёнными заклинаниями защита от зла и добра [protection from evil and good] и магический круг [magic circle]). Цель должна совершить спасбросок Харизмы. При провале ваша душа перемещается в тело цели, а её душа становится запертой в контейнере. При успехе цель сопротивляется вашим попыткам овладеть ею, и вы не можете повторно пытаться овладеть ею в течение 24 часов.","Овладев телом существа, вы начинаете его контролировать. Ваша игровая статистика заменяется статистикой существа, но вы сохраняете своё мировоззрение и значения Интеллекта, Мудрости и Харизмы. Вы сохраняете преимущества от своих классовых умений. Если у цели есть уровни в классах, вы не можете использовать её классовые умения.","Тем временем душа одержимого существа может воспринимать своё окружение из контейнера при помощи своих чувств, но не может перемещаться и не может совершать никаких действий.","Захватив тело, вы можете действием вернуться из него в контейнер, если он находится в пределах 20 клеток, возвращая душу существа в его тело. Если тело носителя умирает, пока вы в нём находитесь, существо умирает, а вы должны совершить спасбросок Харизмы Сл своего же заклинания. При успехе вы возвращаетесь в контейнер, если он находится в пределах 20 клеток. В противном случае вы умираете.","Если контейнер уничтожается или заклинание оканчивается, ваша душа мгновенно возвращается в ваше тело. Если ваше тело находится далее чем в 20 клетках, или если ваше тело мертво, когда вы пытаетесь в него вернуться, вы умираете. Если в контейнере, который был уничтожен, находилась душа другого существа, эта душа возвращается в своё тело, если оно живо и находится в пределах 20 клеток. В противном случае это существо умирает.","Когда заклинание оканчивается, контейнер уничтожается."],"higher":[],"custom":true},{"id":"cmqx94bwnwxm","name":"Гравитационный разлом","level":6,"classes":[],"time":"1 действие","range":"На себя (100-футовая линия)","dur":"Мгновенная","conc":false,"rit":false,"desc":["Вы создаёте червоточину, обладающую огромным притяжением. Червоточина исходит от вас на 20 клеток в длину и 1 клетка в ширину. Все существа, попавшие в эту линию, должны совершить спасбросок Телосложения, получая 8d8 урона силовым полем при провале и половину этого урона при успехе. Все существа в пределах 2 клеток от линии, не находящиеся в ней, должны преуспеть в спасброске Телосложения, иначе получат 8d8 урона силовым полем и притянутся по прямой к линии, пока не окажутся в её пространстве."],"higher":["Если вы накладываете это заклинание, используя ячейку 7-го уровня или выше, урон увеличивается на 1d8 за каждый уровень выше шестого."],"custom":true},{"id":"cmqx94h6xqob","name":"Движение почвы","level":6,"classes":["druid","sorcerer","wizard"],"time":"1 действие","range":"24","dur":"До 2 часов","conc":true,"rit":false,"desc":["Выберите в пределах дистанции область с длиной стороны не больше 8 клеток. Пока заклинание активно, вы можете менять поверхность земли, песка или глины. Вы можете увеличить или уменьшить высоту, создать или засыпать ров, поднять или сравнять стены, и даже формировать колонны. Высота таких изменений не может превышать половины самой большой стороны области. Таким образом, если вы воздействуете на квадрат с длиной стороны 8 клеток, вы можете создать колонну высотой до 4 клетки, поднять или опустить землю на расстояние до 4 клетки, выкопать траншею глубиной до 4 клетки, и так далее. Изменения вступают в силу в течение 10 минут.","В конце каждых 10 минут концентрации на этом заклинании вы можете выбрать новую область, чтобы подействовать на неё.","Из-за того, что трансформация местности происходит медленно, обычно, существа не могут попасть в плен или получить урон из-за движений почвы.","Это заклинание не может манипулировать естественным камнем и каменными строениями. Камни и строения сдвигаются, приспосабливаясь к новой местности. Если изменение местности сделает строение неустойчивым, оно может разрушиться.","Это заклинание также не действует на растения. Перемещаемая почва уносит с собой и растения."],"higher":[],"custom":true},{"id":"cmqx94nldwgs","name":"Дромиджево появление","level":6,"classes":["wizard"],"time":"1 минута","range":"Касание","dur":"Пока не рассеяно","conc":false,"rit":true,"desc":["Вы касаетесь предмета, весящего не более 10 фунтов (4,5 кг), и достигающего в длину не более 1 клетка (183 см). Заклинание оставляет невидимую метку на его поверхности и невидимое название предмета на сапфире, использованном в качестве материального компонента. При каждом накладывании этого заклинания вы должны использовать новый сапфир.","В любой момент впоследствии вы можете действием произнести название предмета и раздавить сапфир. Предмет мгновенно появляется в вашей руке, вне зависимости от расстояния и планов, разделяющих вас, а заклинание оканчивается.","Если этот предмет несёт или держит другое существо, уничтожение сапфира не переносит предмет к вам, но вы узнаёте, кто им сейчас владеет, и где это существо сейчас примерно находится.","Рассеивание магии [dispel magic] и аналогичные эффекты, успешно наложенные на сапфир, оканчивают эффект заклинания."],"higher":[],"custom":true},{"id":"cmqx94t8uhhs","name":"Заданная иллюзия","level":6,"classes":["bard","wizard"],"time":"1 действие","range":"24","dur":"Пока не рассеяно","conc":false,"rit":false,"desc":["Вы создаёте иллюзию предмета, существа или другого видимого явления в пределах дистанции, активирующуюся при выполнении особых условий. Пока условия не выполнены, иллюзия будет неразличима. Она должна помещаться в куб с длиной ребра 6 клеток, и вы при накладывании заклинания определяете, как иллюзия будет себя вести, и какие звуки она будет издавать. Заготовленные действия могут длиться до 5 минут.","Когда указанное вами условие будет выполнено, иллюзия проявляется и выполняет описанные вами действия. Как только иллюзия закончит действовать, она исчезает и остаётся спящей 10 минут. После этого иллюзия может быть снова активирована.","Условие может быть простым или замысловатым, но оно должно основываться на видимом или слышимом событии, способном произойти в пределах 6 клеток от области. Например, вы можете создать иллюзию себя, появляющегося и предупреждающего тех, кто попытается открыть дверь с ловушкой, или же иллюзия может проявляться только когда существо произносит правильное слово или фразу.","Физическое взаимодействие с образом даёт понять, что это иллюзия, потому что сквозь него всё проходит. Существа, исследующие образ действием, могут определить, что это иллюзия, совершив успешную проверку Интеллекта (Расследование) против Сл ваших заклинаний. Если существо распознаёт иллюзию, оно может видеть сквозь неё, и издаваемые ей звуки тоже становятся незначащими."],"higher":[],"custom":true},{"id":"cmqx94ygpbfl","name":"Запрет","level":6,"classes":["cleric"],"time":"10 минут","range":"Касание","dur":"1 день","conc":false,"rit":true,"desc":["Вы создаёте защиту от магического перемещения, покрывающую до 40 000 квадратных футов пола и 6 клеток над полом. Пока заклинание активно, существа не могут телепортироваться в эту область и использовать порталы, например, созданные заклинанием врата [gate], чтобы входить в эту область. Это заклинание предотвращает и перемещения между планами, поэтому защищает от перемещений с Астрального плана, Эфирного плана, из Страны Фей, Царства Теней, а также от заклинания уход в иной мир [plane shift].","Кроме того, это заклинание причиняет урон всем существам вида, выбираемого вами при его накладывании. Выберите один или несколько видов существ: Исчадия, Небожители, Нежить, Феи и Элементали. Когда существо выбранного вида впервые за ход входит в пространство заклинания или начинает в нём ход, оно получает урон излучением или некротической энергией 5d10 (вид урона выбираете вы при накладывании заклинания).","Когда вы накладываете это заклинание, можете указать пароль. Существо, произносящее пароль при входе в эту местность, не получает урон от этого заклинания.","Пространство этого заклинания не может перекрываться с пространством другого заклинания запрет. Если вы накладываете заклинание запрет каждый день в течение 30 дней в одном и том же месте, заклинание длится, пока не будет рассеяно, и материальные компоненты последнего накладывания тратятся."],"higher":[],"custom":true},{"id":"cmqx952piqgg","name":"Истинное зрение","level":6,"classes":["bard","cleric","sorcerer","warlock","wizard"],"time":"1 действие","range":"Касание","dur":"1 час","conc":false,"rit":false,"desc":["Заклинание даёт согласному существу, которого вы коснулись, способность видеть вещи такими, какими они являются на самом деле. Пока заклинание активно, это существо обладает истинным зрением, видит потайные двери, сокрытые магией, и его зрение простирается на Эфирный план, и всё это в пределах 24 клеток."],"higher":[],"custom":true},{"id":"cmqx958qp6a2","name":"Клетка душ","level":6,"classes":["warlock","wizard"],"time":"Реакция","range":"12","dur":"8 часов","conc":false,"rit":false,"desc":["Это заклинание захватывает душу Гуманоида, когда он умирает, и запирает её внутри крошечной клетки, которую вы используете в качестве материального компонента. Украденная душа остаётся внутри клетки до тех пор, пока заклинание не закончится или пока вы не уничтожите клетку, что также окончит заклинание. Пока у вас есть душа внутри клетки, вы можете использовать её любым из способов, описанных ниже. Вы можете использовать захваченную душу до шести раз.","Как только вы используете душу в шестой раз, она высвобождается, и заклинание заканчивается. Пока душа находится в клетке, мёртвый Гуманоид, которому она принадлежит, не может быть возрождён.","Кража жизни. Вы можете бонусным действием впитать жизненную силу души и восстановить себе 2d8 хитов.","Вопрос душе. Вы задаёте душе вопрос (действие не требуется) и получаете короткий телепатический ответ, который можете понять независимо от используемого языка. Душа знает только то, что она знала при жизни, но она должна отвечать вам максимально правдиво, ничего не скрывая. Ответ должен состоять не более чем из одного-двух предложений и может звучать загадочно.","Заимствование опыта. Вы можете бонусным действием усилить себя жизненным опытом души, чтобы совершить свой следующий бросок атаки, проверку характеристик или спасбросок с преимуществом. Если вы не используете это преимущество до начала своего следующего хода, оно будет потеряно.","Глаза мертвеца. Вы можете использовать действие, чтобы назвать место, которое Гуманоид видел при жизни, что создаст в этом месте невидимый сенсор, если оно находится на одном плане существования с вами. Сенсор остаётся до тех пор, пока вы удерживаете концентрацию, вплоть до 10 минут (как если бы вы концентрировались на заклинании). Вы можете видеть и слышать с помощью этого сенсора, как будто бы вы сами находитесь в том месте и используете свои собственные органы чувств.","Существо, которое может видеть сенсор (например, если оно использует видение невидимого [see invisibility] или истинное зрение [true seeing]), видит полупрозрачный образ истерзанного Гуманоида, чью душу вы заперли в клетке."],"higher":[],"custom":true},{"id":"cmqx95dxs6z0","name":"Кости земли","level":6,"classes":["druid"],"time":"1 действие","range":"24","dur":"Мгновенная","conc":false,"rit":false,"desc":["Вы вызываете до шести каменных столбов, вырывающихся из земли в тех местах, которые вы можете видеть в пределах дистанции. Каждый столб представляет собой цилиндр диаметром 1 клетка и высотой до 6 клеток. Земля, на которой появляется столб, должна быть достаточно широкой для этого диаметра, и вы можете сделать целью землю под существом, если это существо Среднего размера или меньше. У каждого столба КД 5 и 30 хитов. При уменьшении хитов до 0 столб крошится на камни, что создает труднопроходимую местность в радиусе 2 клеток. Местность остается труднопроходимой, пока камни не будут убраны. Для очистки вручную области диаметром 1 клетка требуется не менее 1 минуты.","Если столб создан под существом, то это существо должно преуспеть в спасброске Ловкости, иначе будет поднято столбом. Существо может добровольно провалить спасбросок.","Если столбу не удается достичь полной высоты из-за потолка или другого препятствия, существо на столбе получает 6d6 дробящего урона и становится опутанным, будучи зажатым между столбом и препятствием. Опутанное существо может действием совершить проверку Силы или Ловкости (по своему выбору) против Сл спасброска от ваших заклинаний. При успехе существо перестаёт быть опутанным и должно либо слезть со столба, либо упасть с него."],"higher":["Если вы накладываете это заклинание, используя ячейку 7-го уровня или выше, вы можете создать два дополнительных столба за каждый уровень ячейки выше 6-го."],"custom":true},{"id":"cmqx95kpvjdj","name":"Круг смерти","level":6,"classes":["sorcerer","warlock","wizard"],"time":"1 действие","range":"30","dur":"Мгновенная","conc":false,"rit":false,"desc":["Из точки в пределах дистанции расходится сфера негативной энергии с радиусом 12 клеток. Все существа в этой области должны совершить спасбросок Телосложения. Цель получает 8d6 урона некротической энергией при провале или половину этого урона при успехе."],"higher":["Если вы накладываете это заклинание, используя ячейку 7-го уровня или выше, урон увеличивается на 2d6 за каждый уровень ячейки выше шестого."],"custom":true},{"id":"cmqx95r15n37","name":"Ледяная стена","level":6,"classes":["wizard"],"time":"1 действие","range":"24","dur":"До 10 минут","conc":true,"rit":false,"desc":["Вы создаёте стену изо льда на твёрдой поверхности в пределах дистанции. Вы можете сформировать её в виде купола полусферы или сферы с радиусом до 2 клетки, или же вы можете создать плоскую поверхность, состоящую из десяти квадратных плит с длиной ребра 2 клетки. Каждая плита должна быть смежна с другой плитой. Какая бы форма ни была у стены, у неё толщина 1 фут (30 сантиметров), и существует она пока активно заклинание.","Если стена при появлении проходит по пространству существа, это существо выталкивается по одну из сторон стены и совершает спасбросок Ловкости. Существо получает 10d6 урона холодом при провале или половину этого урона при успехе.","Стена является предметом, которому можно причинить урон и тем самым пробить. У каждой 2-клеточной секции КД 12 и по 30 хитов, а также уязвимость к урону огнём. Уменьшение хитов плиты до 0 уничтожает её и охлаждает воздух. Существо, впервые за ход перемещающееся через область холодного воздуха, должно совершить спасбросок Телосложения. Это существо получает 5d6 урона холодом при провале или половину этого урона при успехе."],"higher":["Если вы накладываете это заклинание, используя ячейку 7-го уровня или выше, урон, причиняемый стеной при возникновении, увеличивается на 2d6, а урон от прохождения через область холодного воздуха увеличивается на 1d6 за каждый уровень ячейки выше шестого."],"custom":true},{"id":"cmqx95wg0hn2","name":"Магические врата","level":6,"classes":["sorcerer","warlock","wizard"],"time":"1 действие","range":"100","dur":"До 10 минут","conc":true,"rit":false,"desc":["Вы создаёте связанные порталы для телепортации, остающиеся открытыми на время длительности. Выберите две точки на земле, которые вы видите: одну в пределах 2 клеток от себя и вторую в пределах 100 клеток. В каждой точке появляется круглый портал диаметром 2 клетки. Если портал должен открыться в пространстве, занятом существом, заклинание проваливается.","Порталы представляют собой двумерные светящиеся круги, заполненные туманом, парящие в паре сантиметров над землёй и перпендикулярные выбранной вами точке. Круги видны только с одной стороны (на ваш выбор), которая и функционирует как портал.","Все существа и предметы, входящие в портал, выходят из другого портала, как если бы они были смежны друг с другом; прохождение сквозь портал с неактивной стороны не оказывает никакого эффекта. Туман, заполняющий порталы, непрозрачный, и блокирует зрение. Вы в свой ход можете бонусным действием повернуть кольца, чтобы активные стороны поменялись местами с неактивными."],"higher":[],"custom":true},{"id":"cmqx9610kany","name":"Ментальная тюрьма","level":6,"classes":["sorcerer","warlock","wizard"],"time":"1 действие","range":"12","dur":"До 1 минуты","conc":true,"rit":false,"desc":["Вы пытаетесь поймать одно существо в иллюзорную клетку, которую может воспринимать только оно само. Существо, которое вы можете видеть в пределах дистанции, должно совершить спасбросок Интеллекта. Цель автоматически преуспевает в спасброске, если она имеет иммунитет к очарованию. При успехе цель получает 5d10 урона психической энергией, и заклинание оканчивается. При провале цель получает 5d10 урона психической энергией, и область непосредственно вокруг занимаемого целью пространства начинает по какой-либо причине казаться ей опасной.","Вы можете заставить цель ощущать себя окружённой огнём, парящими лезвиями, или отвратительными, брызжущими слюной зубастыми пастями. Вне зависимости от формы иллюзии, цель не может видеть или слышать ничего за её пределами и становится опутанной, пока заклинание не окончится. Если цель выталкивается из области действия иллюзии, совершает рукопашную атаку сквозь неё или высовывает какую-либо часть тела сквозь иллюзию, она получает 10d10 урона психической энергией, и заклинание оканчивается."],"higher":[],"custom":true},{"id":"cmqx9685g79e","name":"Множественное внушение","level":6,"classes":["bard","sorcerer","warlock","wizard"],"time":"1 действие","range":"12","dur":"24 часа","conc":false,"rit":false,"desc":["Вы внушаете определённый курс действий (ограниченный одной-двумя фразами) и магически влияете до двенадцати существ на свой выбор, видимых в пределах дистанции, которые могут слышать и понимать вас. Существа, которые не могут быть очарованы, обладают иммунитетом к этому эффекту. Внушение должно быть сформировано так, чтобы действие звучало разумным. Просьбы ударить себя мечом, броситься на копьё, сжечь себя, или как-то иначе причинить себе вред отменяют эффект заклинания.","Каждая цель должна совершить спасбросок Мудрости. При провале она следует заданному курсу действий. Внушённые действия могут продолжаться всю длительность заклинания. Если внушённую деятельность можно выполнить за меньший срок, заклинание оканчивается, когда субъект оканчивает порученную задачу.","Вы можете также указать условие, которое запустит особое действие во время действия заклинания. Например, вы можете внушить группе солдат, чтобы они отдали все свои деньги первому встреченному нищему.","Если до окончания действия условие не будет выполнено, деятельность не совершается. Если вы или кто-то из ваших спутников причиняют урон существу, находящемуся под действием этого заклинания, для этого существа заклинание оканчивается."],"higher":["Если вы накладываете это заклинание, используя ячейку 7-го уровня, длительность равна 10 дням. Если вы используете ячейку 8-го уровня, длительность равна 30 дням. Если вы используете ячейку 9-го уровня, длительность равна 1 году и 1 дню."],"custom":true},{"id":"cmqx96e24ktp","name":"Неудержимая пляска Отто","level":6,"classes":["bard","wizard"],"time":"1 действие","range":"6","dur":"До 1 минуты","conc":true,"rit":false,"desc":["Выберите одно существо, видимое в пределах дистанции. Цель начинает смешно танцевать на месте, шаркая ногами, притоптывая и подпрыгивая. Существа, которые не могут быть очарованы, обладают иммунитетом к этому заклинанию.","Танцующее существо должно использовать всё своё перемещение на танец, не покидая своё пространство и получая помеху к спасброскам Ловкости и броскам атаки. Пока цель находится под действием этого заклинания, другие существа совершают с преимуществом броски атаки по нему. Танцующее существо действием совершает спасбросок Мудрости, чтобы вернуть контроль над телом. При успехе заклинание заканчивается."],"higher":[],"custom":true},{"id":"cmqx96ja3b5u","name":"Облачение ветра","level":6,"classes":["druid","sorcerer","warlock","wizard"],"time":"1 действие","range":"На себя","dur":"До 10 минут","conc":true,"rit":false,"desc":["Пока действует заклинание, вас окружает ветер, и вы получаете следующие преимущества:","Дальнобойные атаки оружием по вам совершаются с помехой.","Вы получаете скорость полёта 12 клеток. Если вы находитесь в воздухе, когда заклинание заканчивается, то вы падаете, если не можете каким-либо образом предотвратить это.","Вы можете действием создать область ураганного ветра в кубе с длиной ребра 3 клетки с центром в точке, которую вы можете видеть в пределах 12 клеток. Все существа в этой области должны совершить спасбросок Телосложения. При провале существо получает 2d10 дробящего урона или половину этого урона при успехе. Если существо с размером не больше Большого проваливает спасбросок, его отталкивает на 2 клетки от центра куба."],"higher":[],"custom":true},{"id":"cmqx96o7z9w0","name":"Облачение камня","level":6,"classes":["druid","sorcerer","warlock","wizard"],"time":"1 действие","range":"На себя","dur":"До 10 минут","conc":true,"rit":false,"desc":["Пока действует заклинание, кусочки камня покрывают ваше тело, и вы получаете следующие преимущества:","Вы получаете сопротивление дробящему, колющему и рубящему урону от немагического оружия.","Вы можете действием вызвать небольшое землетрясение в радиусе 3 клеток с центром на вас. Другие существа в этой области должны преуспеть в спасброске Ловкости, иначе будут сбиты с ног.","Вы можете передвигаться по труднопроходимой местности, состоящей из земли или камня, не тратя дополнительное перемещение. Вы можете проходить сквозь твёрдую землю или камень так, словно это воздух, не разрушая их, однако не можете закончить там перемещение. Если вы заканчиваете перемещение, находясь внутри земли или камня, вас выталкивает в ближайшее свободное пространство, заклинание заканчивается, и вы становитесь ошеломлённым до конца своего следующего хода."],"higher":[],"custom":true},{"id":"cmqx96t0edj8","name":"Облачение льда","level":6,"classes":["druid","sorcerer","warlock","wizard"],"time":"1 действие","range":"На себя","dur":"До 10 минут","conc":true,"rit":false,"desc":["Пока действует заклинание, ваше тело покрывается инеем, и вы получаете следующие преимущества:","Вы получаете иммунитет к урону холодом, а также сопротивление урону огнём.","Вы можете передвигаться по труднопроходимой местности, состоящей из льда или снега, не тратя дополнительное перемещение.","Земля в радиусе 2 клеток вокруг вас покрывается льдом и является труднопроходимой местностью для всех существ, кроме вас. Эта область перемещается вместе с вами.","Вы можете действием создать 3-клеточный конус морозного ветра, исходящий из вашей руки в выбранном направлении. Все существа в конусе должны совершить спасбросок Телосложения, получая 4d6 урона холодом при провале или половину этого урона при успехе. Скорость существа, провалившего спасбросок, снижается вдвое до начала вашего следующего хода."],"higher":[],"custom":true},{"id":"cmqx96y78in5","name":"Облачение огня","level":6,"classes":["druid","sorcerer","warlock","wizard"],"time":"1 действие","range":"На себя","dur":"До 10 минут","conc":true,"rit":false,"desc":["Пока действует заклинание, ваше тело охватывают языки пламени, испускающие яркий свет в пределах 6 клеток и тусклый свет в пределах ещё 6 клеток. Этот огонь не причиняет вам никакого вреда, а вы получаете следующие преимущества:","Вы получаете иммунитет к урону огнём, а также сопротивление урону холодом.","Все существа, впервые за ход перемещающиеся в пределах 1 клетки от вас или заканчивающие там свой ход, получают 1d10 урона огнём.","Вы можете действием создать линию огня длиной 3 клетки и шириной 1 клетка, исходящую от вас в выбранном направлении. Все существа в этой линии должны совершить спасбросок Ловкости, получая 4d8 урона огнём при провале или половину этого урона при успехе."],"higher":[],"custom":true},{"id":"cmqx9736w0zw","name":"Окаменение","level":6,"classes":["druid","sorcerer","warlock","wizard"],"time":"1 действие","range":"12","dur":"До 1 минуты","conc":true,"rit":false,"desc":["Вы пытаетесь сделать каменным одно существо, которое видите в пределах дистанции. Если тело цели состоит из плоти, она должна совершить спасбросок Телосложения. При провале она становится опутанной, так как плоть начинает отвердевать. При успехе существо не попадает под действие заклинания.","Существо, опутанное этим заклинанием, должно совершать спасброски Телосложения в конце каждого своего хода. Если оно преуспело в спасброске от этого заклинания три раза, оно оканчивается. Если оно провалит спасбросок три раза, оно превращается в камень и получает состояние окаменевшее на время длительности заклинания. Успехи и провалы не обязаны быть последовательными; отслеживайте их отдельно, пока не накопится три вида чего-то одного.","Если существо физически ломается, будучи окаменевшим, при возвращении в обычное тело оно сохраняет все полученные деформации.","Если вы сохраняете концентрацию на этом заклинании до максимально возможного времени, существо становится окаменевшим до снятия эффекта."],"higher":[],"custom":true},{"id":"cmqx978gtr3r","name":"Отилюков ледяной шар","level":6,"classes":["sorcerer","wizard"],"time":"1 действие","range":"60","dur":"Мгновенная","conc":false,"rit":false,"desc":["Шарик холодной энергии слетает с ваших пальцев и устремляется к точке на ваш выбор в пределах дистанции, где взрывается сферой с радиусом 12 клеток. Все существа в этой области должны совершить спасбросок Телосложения. Существо получает 10d6 урона холодом при провале и половину этого урона при успехе.","Если шар попадает в воду или жидкость, состоящую в основном из воды (исключая водных существ), он замораживает жидкость на глубину 6 дюймов (15 см) в пределах квадрата с длиной стороны 6 клеток. Лёд существует 1 минуту. Существа, плававшие по поверхности замороженной воды, сковываются льдом. Скованное существо может действием совершать проверки Силы против Сл ваших заклинаний, чтобы высвободиться.","Если хотите, можете не метать шар после накладывания этого заклинания. В этом случае в вашей руке появляется маленький прохладный шарик размером со снаряд для пращи. В любое время вы или существо, которому вы отдадите шарик, можете метнуть его рукой (дистанция 8 клеток) или из пращи (обычная дистанция пращи). При столкновении он взрывается с тем же эффектом, что и при обычном использовании этого заклинания. Вы можете уничтожить шарик, не взрывая его. Через 1 минуту, если шарик ещё не взорвался, он взрывается."],"higher":["Если вы накладываете это заклинание, используя ячейку 7-го уровня или выше, урон увеличивается на 1d6 за каждый уровень ячейки выше шестого."],"custom":true},{"id":"cmqx97djz1cw","name":"Первородный страж","level":6,"classes":["druid"],"time":"1 действие","range":"На себя","dur":"До 1 минуты","conc":true,"rit":false,"desc":["Вы получаете сопротивление урону звуком, кислотой, огнём, холодом и электричеством на время действия заклинания.","Когда вы получаете урон одного из этих видов, вы можете реакцией получить иммунитет к этому виду урона, включая тот урон, который спровоцировал эту реакцию. В этом случае вы теряете сопротивление к остальным видам урона, а иммунитет пропадает в конце вашего следующего хода, после чего заклинание заканчивается."],"higher":[],"custom":true},{"id":"cmqx97iw8vw4","name":"Пир героев","level":6,"classes":["bard","cleric","druid"],"time":"10 минут","range":"6","dur":"Мгновенная","conc":false,"rit":false,"desc":["Вы организовываете шикарный пир, включая великолепные пищу и питьё. Пир совершается в течение 1 часа, и исчезает по прошествии этого времени, но положительные эффекты не вступают в силу, пока этот час не пройдёт. В пире могут принимать участие до двенадцати существ.","Существо, принявшее участие в пиршестве, получает несколько преимуществ. Оно излечивается от всех болезней и ядов, приобретает иммунитет к ядам и состоянию испуга, совершает спасброски Мудрости с преимуществом. Максимум его хитов увеличивается на 2d10, и оно получает такое же количество хитов. Все эти преимущества длятся 24 часа."],"higher":[],"custom":true},{"id":"cmqx97p84odz","name":"Планарный союзник","level":6,"classes":["cleric"],"time":"10 минут","range":"12","dur":"Мгновенная","conc":false,"rit":false,"desc":["Вы просите иномировую сущность оказать помощь. Сущность должна быть известна вам: это может быть бог, предтеча, демонический повелитель или другая сущность космического масштаба. Эта сущность посылает вам своего верного Исчадия, Небожителя или Элементаля, создавая его в свободном пространстве в пределах дистанции. Если вы знаете имя конкретного существа, вы можете произнести его в момент накладывания заклинания, чтобы попросить прислать его, но вы всё равно можете получить другое существо (на выбор Мастера).","Когда существо появляется, оно не обязано что-либо делать. Вы можете просить его выполнить услугу в обмен на некую плату, но оно не обязано соглашаться. Услуга может быть как простой (перелёт над пропастью, помощь в сражении), так и комплексной (слежка за врагом, защита во время исследования подземелья). Для заключения сделки вы должны иметь возможность как-то общаться с существом.","Плата может быть разной. Небожитель может потребовать пожертвования золота или магических предметов для храма, а Исчадие может потребовать жертвоприношение существа или сокровища в дар. Некоторые существа могут обменивать свои услуги на ваши услуги.","Обычно задание, длительность которого можно измерить минутами, стоит по 100 зм за минуту. Задание, измеряемое часами, требует 1 000 за час. Задача, измеряемая днями (не более 10 дней) требует 10 000 зм за каждый день. Мастер может корректировать размер оплаты, основываясь на обстоятельствах, в которых вы используете это заклинание. Если задача связана с характером существа, оплата может быть уменьшена вдвое или вообще устранена. Неопасные задачи обычно требуют половину оплаты, а особо опасные поручения могут требовать увеличенной награды. Существа редко соглашаются на самоубийственные задания.","Выполнив поручение, или после оговорённого срока существо возвращается на свой домашний план после отчёта вам, если это не противоречит задаче и вообще возможно. Если вы не сошлись в цене, существо мгновенно возвращается на домашний план.","Существо, которому поручено войти в состав вашей группы, считается её членом и получает свою долю опыта."],"higher":[],"custom":true},{"id":"cmqx98c4ev3a","name":"Платиновый щит Физбана","level":6,"classes":["sorcerer","wizard"],"time":"1 бонусное действие","range":"12","dur":"До 1 минуты","conc":true,"rit":false,"desc":["Вы создаёте поле серебристого света, окружающее существо по вашему выбору в пределах дистанции (включая себя). Поле испускает тусклый свет в радиусе 1 клетки. Находясь в поле, существо получает следующие преимущества:","Укрытие. Существо получает укрытие на половину.","Сопротивление урону. Существо получает сопротивление урону кислотой, огнём, холодом, электричеством и ядом.","Увёртливость. Если существо попадает под действие эффекта, который позволяет ему совершить спасбросок Ловкости, чтобы получить только половину урона, вместо этого существо не получает никакого урона вовсе, если спасбросок был успешен, и только половину урона, если он был провален.","Бонусным действием в последующие ходы вы можете переместить поле к другому существу находящемуся в 12 клетках от поля."],"higher":[],"custom":true},{"id":"cmqx98hhfmxb","name":"Пляшущая молния","level":6,"classes":["sorcerer","wizard"],"time":"1 действие","range":"30","dur":"Мгновенная","conc":false,"rit":false,"desc":["Вы создаёте разряд молнии, которая дугой бьёт цель, выбранную и видимую вами в пределах дистанции. Затем три разряда перепрыгивают с неё на другие цели, которых может быть не больше трёх, каждая из которых должна находиться в пределах 6 клеток от первой цели. Цель может быть существом или предметом и может быть целью только одного разряда.","Цель должна совершить спасбросок Ловкости, получая 10d8 урона электричеством при провале или половину этого урона в случае успеха."],"higher":["Если вы накладываете это заклинание, используя ячейку 7-го уровня или выше, из первой цели бьёт дополнительный разряд в другую цель за каждый уровень ячейки выше шестого."],"custom":true},{"id":"cmqx98m754km","name":"Поиск пути","level":6,"classes":["bard","cleric","druid"],"time":"1 минута","range":"На себя","dur":"До 1 дня","conc":true,"rit":false,"desc":["Это заклинание позволяет найти кратчайший и самый прямой путь к определённому месту, знакомому вам, находящемуся на том же плане существования. Если искомое место находится на другом плане существования, если это место перемещается (например, это передвижная крепость), или это не конкретное место (например, «логово зелёного дракона»), заклинание проваливается.","Пока заклинание активно, и пока вы находитесь на одном плане существования с искомым местом, вы знаете, как далеко, и в каком направлении оно находится. Пока вы направляетесь туда, каждый раз, когда у вас появляются разные варианты направления, вы автоматически определяете, какой путь самый короткий и прямой (но не обязательно самый безопасный) к искомому месту."],"higher":[],"custom":true},{"id":"cmqx98r7l3wl","name":"Полное исцеление","level":6,"classes":["cleric","druid"],"time":"1 действие","range":"12","dur":"Мгновенная","conc":false,"rit":false,"desc":["Выберите существо, видимое в пределах дистанции. Поток положительной энергии омывает его, во
