sc":["Вы создаёте призрачный шар вокруг головы согласного существа, которого вы можете видеть в пределах дистанции. Шар наполняется свежим воздухом, существующим, пока заклинание активно. Если у существа больше одной головы, шар появляется только вокруг одной из голов (этого достаточно, чтобы избежать удушения, при условии, что у всех голов одинаковая дыхательная система)."],"higher":["Если вы накладываете это заклинание, используя ячейку 3-го уровня или выше, вы можете создать два дополнительных шара свежего воздуха за каждый уровень ячейки выше 2-го."],"custom":true},{"id":"cmqwl5hqkusu","name":"Волшебные уста","level":2,"classes":["artificer","bard","wizard"],"time":"1 минута","range":"6","dur":"Пока не рассеяно","conc":false,"rit":true,"desc":["Вы внедряете в предмет, находящийся в пределах дистанции, послание, которое будет произнесено, когда будут выполнены условия. Выберите видимый предмет, который не несет и не носит другое существо. Произнесите послание, которое может состоять не более чем из 25 слов, хотя его можно произносить в течение 10 минут. Затем определите условие, выполнение которого заставит заклинание передать ваше послание.","Когда условие будет выполнено, на предмете появляется магический рот, зачитывающий послание вашим голосом с той же самой громкостью. Если у выбранного вами предмета есть рот или что-то похожее на рот (например, рот статуи), магический рот появляется на его месте, и кажется, что слова исходят оттуда. При накладывании заклинания вы можете сделать так, что заклинание окончится, передав сообщение, или же останется активным и будет повторять сообщение при каждом срабатывании условия.","Вызывающее срабатывание условие может быть как общим, так и детализированным, но должно основываться на зрительных или слышимых условиях, происходящих в пределах 6 клеток от предмета. Например, вы можете заставить рот говорить, когда в пределах 6 клеток от него пройдет существо, или когда в пределах 6 клеток от него зазвенит серебряный колокольчик."],"higher":[],"custom":true},{"id":"cmqwl5m2k5ie","name":"Волшебный замок","level":2,"classes":["artificer","wizard"],"time":"1 действие","range":"Касание","dur":"Пока не рассеяно","conc":false,"rit":false,"desc":["Вы касаетесь закрытой двери, окна, ворот, сундука или другого входа, и он становится запертым. Вы и указанные при накладывании этого заклинания существа можете открывать предмет как обычно. Вы можете также установить пароль, произношение которого в пределах 1 клетки от предмета подавляет заклинание на 1 минуту. В противном случае предмет не открывается, пока его не сломают, или пока заклинание не рассеют или не подавят. Накладывание заклинания открывание [knock] на предмет подавляет волшебный замок на 10 минут.","Находящийся под действием этого заклинания предмет гораздо сложнее взломать и открыть силой. Сл выламывания и взлома замков увеличивается на 10."],"higher":[],"custom":true},{"id":"cmqwl5roa9bc","name":"Воображаемая сила","level":2,"classes":["bard","sorcerer","wizard"],"time":"1 действие","range":"12","dur":"До 1 минуты","conc":true,"rit":false,"desc":["Вы создаете иллюзию в сознании существа, видимого в пределах дистанции. Цель должна совершить спасбросок Интеллекта. При провале вы создаете воображаемый предмет, существо или другое видимое явление на свой выбор, помещающееся в куб с длиной ребра 2 клетки, и воспринимаемое только целью, пока действует заклинание. Это заклинание не оказывает никакого эффекта на Нежить и Конструктов.","Иллюзия включает звуки, температуру и прочие раздражители, очевидные только для этого же существа.","Цель может действием исследовать иллюзию проверкой Интеллекта (Расследование) против Сл ваших заклинаний. Если проверка была успешной, цель понимает, что перед ней иллюзия, и заклинание оканчивается.","Пока цель находится под действием этого заклинания, она считает иллюзию настоящей. Она сама придумывает объяснения нелогичности взаимодействия с иллюзией. Например, попытавшись пройти по вымышленному мосту над провалом, она упадет вниз. Если цель выживет, она все равно будет считать, что мост существует, а пройти ей помешало что-то другое — её толкнули, она поскользнулась, или её сбил сильный порыв ветра.","Цель настолько уверена в существовании иллюзии, что даже будет получать от неё урон. Иллюзия в форме существа может атаковать цель. Иллюзия, выглядящая как огонь, бассейн с кислотой или лава, могут сжечь цель. Каждый раунд в ваш ход иллюзия может причинить цели 1d6 урона психической энергией, если та находится в области иллюзии или в пределах 1 клетки от иллюзии существа или опасности, способной причинять урон, например, атаковав. Цель воспринимает урон того вида, что соответствует иллюзии."],"higher":[],"custom":true},{"id":"cmqwl5whfr43","name":"Горящий клинок","level":2,"classes":["druid","sorcerer"],"time":"1 бонусное действие","range":"На себя","dur":"До 10 минут","conc":true,"rit":false,"desc":["Вы создаёте горящий клинок в свободной руке. Этот клинок похож размерами и формой на скимитар, и он существует, пока заклинание активно. Если вы выпустите клинок из рук, он исчезает, но вы можете вернуть его в руку бонусным действием.","Действием вы можете совершить рукопашную атаку заклинанием с использованием этого клинка. При попадании цель получает 3d6 урона огнём.","Горящий клинок испускает яркий свет в пределах 2 клеток и тусклый свет в пределах ещё 2 клетки."],"higher":["Если вы накладываете это заклинание, используя ячейку 4-го уровня или выше, урон увеличивается на 1d6 за каждые два уровня ячейки выше 2-го."],"custom":true},{"id":"cmqwl61b5tsj","name":"Дыхание дракона","level":2,"classes":["sorcerer","wizard"],"time":"1 бонусное действие","range":"Касание","dur":"До 1 минуты","conc":true,"rit":false,"desc":["Вы касаетесь одного согласного существа и наделяете его силой изрыгать магическую энергию изо рта, при условии, что у существа есть рот. Выберите кислоту, огонь, холод, электричество или яд. Пока заклинание активно, существо может действием выдыхать энергию выбранного типа в 3-клеточном конусе.","Каждое существо в области должно совершить спасбросок Ловкости, получая 3d6 урона выбранного типа при провале или вдвое меньший урон при успехе."],"higher":["Если вы накладываете это заклинание, используя ячейку заклинания 3-го уровня или выше, урон увеличивается на 1d6 за каждый уровень ячейки выше 2-го."],"custom":true},{"id":"cmqwl65v4z48","name":"Защитный ветер","level":2,"classes":["bard","druid","sorcerer","wizard"],"time":"1 действие","range":"На себя","dur":"До 10 минут","conc":true,"rit":false,"desc":["Сильный ветер (20 миль в час) окружает область с радиусом 2 клеток вокруг вас. Он перемещается вместе с вами так, что вы остаётесь в центре. Ветер существует на протяжении длительности заклинания.","Ветер обладает следующими эффектами:","Все существа в области действия, включая вас, становятся оглохшими.","Гасит все незащищённые источники огня размером с факел и меньше.","Для всех существ, кроме вас, область считается труднопроходимой местностью.","Броски атаки для атак дальнобойным оружием совершаются с помехой, если атака исходит из области ветра или заходит в неё.","Препятствует распространению пара, газов и тумана, которые могут быть развеяны сильным ветром."],"higher":[],"custom":true},{"id":"cmqwl6cb65wn","name":"Земляная хватка Максимилиана","level":2,"classes":["sorcerer","wizard"],"time":"1 действие","range":"6","dur":"До 1 минуты","conc":true,"rit":false,"desc":["Вы выбираете свободное пространство в пределах квадрата с длиной ребра 1 клетка, видимое в пределах дистанции. Область должна находиться на поверхности земли. В указанном месте вырастает рука Среднего размера, созданная из спрессованной земли. Рука хватает одно существо, которое вы можете видеть, и которое находится в пределах 1 клетки от руки. Цель должна совершить спасбросок Силы. При провале цель получает 2d6 дробящего урона и становится опутанной на время действия заклинания.","Вы можете действием приказать руке сдавить опутанную цель. В этом случае цель должна совершить спасбросок Силы. При провале она получает 2d6 дробящего урона, а при успехе — половину урона.","Чтобы освободиться, цель должна действием преуспеть в проверке Силы против Сл спасброска от ваших заклинаний. При успехе цель освобождается и больше не считается опутанной рукой.","Вы можете действием приказать руке схватить другое существо или переместиться в любое свободное пространство в пределах дистанции заклинания. В этих случаях рука отпускает предыдущую цель."],"higher":[],"custom":true},{"id":"cmqwl6gui4ob","name":"Корона безумия","level":2,"classes":["bard","sorcerer","warlock","wizard"],"time":"1 действие","range":"24","dur":"До 1 минуты","conc":true,"rit":false,"desc":["Один Гуманоид на ваш выбор, видимый вами в пределах дистанции, должен преуспеть в спасброске Мудрости, иначе он станет очарованным вами на время действия заклинания. Пока цель очарована таким образом, на её голове появляется изогнутая железная корона, а в глазах светится безумие.","Очарованная цель должна в каждый свой ход перед перемещением действием совершать рукопашную атаку по любому существу, кроме себя, которое вы мысленно выбираете. Цель может действовать в свой ход как обычно, если вы не выбрали существо или в пределах его досягаемости нет других существ.","В последующие ходы вы должны действием поддерживать контроль над целью, иначе заклинание оканчивается. Кроме того, цель в конце каждого своего хода может совершать спасброски Мудрости. При успехе заклинание оканчивается."],"higher":[],"custom":true},{"id":"cmqwl6lecb68","name":"Луч слабости","level":2,"classes":["warlock","wizard"],"time":"1 действие","range":"12","dur":"До 1 минуты","conc":true,"rit":false,"desc":["Чёрный луч вылетает из вашего пальца к существу, находящемуся в пределах дистанции. Совершите по цели дальнобойную атаку заклинанием. При попадании цель до конца действия заклинания причиняет только половину урона атаками оружием, использующими Силу.","В конце каждого своего хода цель может совершать спасбросок Телосложения от этого заклинания. При успехе заклинание оканчивается."],"higher":[],"custom":true},{"id":"cmqwl8sfdt5o","name":"Мельфова кислотная стрела","level":2,"classes":["wizard"],"time":"1 действие","range":"18","dur":"Мгновенная","conc":false,"rit":false,"desc":["К цели, находящейся в пределах дистанции, устремляется мерцающая зелёная стрела, разлетающаяся кислотными брызгами. Совершите по цели дальнобойную атаку заклинанием. При попадании цель получает единовременно 4d4 урона кислотой и 2d4 урона кислотой в конце своего следующего хода. При промахе стрела немного задевает цель и наносит половину единовременного урона, а в конце своего следующего хода цель урона не получает."],"higher":["Если вы накладываете это заклинание, используя ячейку 3-го уровня или выше, урон (и единовременный и последующий) увеличивается на 1d4 за каждый уровень ячейки выше второго."],"custom":true},{"id":"cmqwl8wivt92","name":"Молебен лечения","level":2,"classes":["cleric","paladin"],"time":"10 минут","range":"6","dur":"Мгновенная","conc":false,"rit":false,"desc":["Каждое из шести существ на ваш выбор, видимых в пределах дистанции, восстанавливает количество хитов, равное 2d8 + модификатор вашей базовой характеристики. Это заклинание не оказывает никакого эффекта на Нежить и Конструктов."],"higher":["Если вы накладываете это заклинание, используя ячейку 3-го уровня или выше, лечение увеличивается на 1d8 за каждый уровень ячейки выше второго."],"custom":true},{"id":"cmqwl91mpwqx","name":"Неподвижный предмет","level":2,"classes":[],"time":"1 действие","range":"Касание","dur":"1 час","conc":false,"rit":false,"desc":["Вы касаетесь предмета, вес которого не превышает 10 фунтов (4,5 кг), и магическим образом фиксируете его в пространстве. Вы и указанные вами существа можете перемещать предмет как обычно. Кроме того, вы можете указать пароль, который при его произнесении в 1 клетка от объекта подавляет эффект заклинания на 1 минуту.","Если предмет находится в воздухе, он может выдержать нагрузку до 4 000 фунтов, при превышении которой заклинание заканчивается. Существо может действием совершить проверку Силы против Сл ваших заклинаний. При успехе оно может сдвинуть предмет на расстояние до 2 клетки."],"higher":["Если вы накладываете заклинание, используя ячейку 4-го или 5-го уровня, то максимальная нагрузка увеличивается до 8 000 фунтов, Сл сдвига увеличивается на 5, а длительность заклинания увеличивается до 24 часов. Если вы накладываете заклинание, используя ячейку 6-го уровня или выше, то максимальная нагрузка увеличивается до 20 000 фунтов, Сл сдвига увеличивается на 10, а заклинание длится, пока не будет рассеяно."],"custom":true},{"id":"cmqwl96qte4u","name":"Нетленные останки","level":2,"classes":["cleric","paladin","wizard"],"time":"1 действие","range":"Касание","dur":"10 дней","conc":false,"rit":true,"desc":["Вы касаетесь трупа или других останков. Пока заклинание активно, цель защищена от разложения и не может стать Нежитью.","Это заклинание также увеличивает ограничение по времени, в течение которого труп можно воскресить, так как дни, проведенные под воздействием этого заклинания, не учитываются при подсчёте времени со дня смерти для таких заклинаний как оживление [raise dead]."],"higher":[],"custom":true},{"id":"cmqwl9csrkpq","name":"Нистулова ложная аура","level":2,"classes":["wizard"],"time":"1 действие","range":"Касание","dur":"24 часа","conc":false,"rit":false,"desc":["Вы помещаете иллюзию на существо или предмет, которого касаетесь, чтобы заклинания школы Прорицания получали о нем ложную информацию. Целью может быть согласное существо или предмет, не несомый и не носимый другим существом.","При накладывании этого заклинания выберите один из описанных ниже эффектов или сразу оба. Эффект длится, пока активно заклинание. Если вы накладываете это заклинание на одно и то же существо или предмет каждый день в течение 30 дней, используя один и тот же эффект, иллюзия начинает длиться, пока не будет рассеяна.","Ложная аура. Вы меняете то, как цель представляется для заклинаний и магических эффектов, таких как обнаружение магии [detect magic], сканирующих магическую ауру. Вы можете немагический предмет заставить выглядеть магическим, магический предмет заставить выглядеть немагическим, или изменить магическую ауру предмета, чтобы казалось, что находящаяся в нем магия принадлежит другой школе магии, выбранной вами. Если вы использовали этот эффект на предмете, можете сделать так, что новая магия будет сразу видна существу, держащему его в руках.","Маскировка. Вы меняете то, как цель представляется для заклинаний и магических эффектов, определяющих вид существ, таких как «Божественное чувство» паладина и триггер заклинания знак [symbol]. Вы выбираете вид существа, и все заклинания и магические эффекты будут считать, что цель принадлежит этому виду или имеет это мировоззрение."],"higher":[],"custom":true},{"id":"cmqwl9hueofi","name":"Открывание","level":2,"classes":["bard","sorcerer","wizard"],"time":"1 действие","range":"12","dur":"Мгновенная","conc":false,"rit":false,"desc":["Выберите предмет, видимый в пределах дистанции. Это может быть дверь, ящик, сундук, кандалы, навесной замок, или другой предмет, содержащий обычное или магическое средство, предотвращающее доступ.","Цель, запертая обычным замком, заклинившая или запертая на засов, становится незапертой, не заклинившей, а засовы сами открываются. Если на предмете было несколько замков, открывается только один из них.","Если вы выбрали цель, запертую волшебным замком [arcane lock], это заклинание подавляется на 10 минут, во время которых цель может открываться и закрываться как обычно.","Когда вы накладываете это заклинание, от цели исходит громкий стук, слышимый с расстояния в 60 клеток."],"higher":[],"custom":true},{"id":"cmqwl9m563g8","name":"Отражения","level":2,"classes":["bard","sorcerer","warlock","wizard"],"time":"1 действие","range":"На себя","dur":"1 минута","conc":false,"rit":false,"desc":["В вашем пространстве появляются три ваших иллюзорных копии. Пока заклинание активно, копии перемещаются вместе с вами и подражают вашим действиям, двигаясь так, что невозможно понять, кто из вас настоящий. Вы можете действием развеять свои копии.","Каждый раз, когда существо нацеливается на вас атакой, пока заклинание активно, бросайте d20, чтобы определить, не попала ли атака вместо вас по одной из ваших копий.","Если у вас три копии, вы должны выбросить «6» или больше, чтобы сделать целью копию. Если копий две, выбросить нужно «8» или больше. Если копия одна, вы должны выбросить «11» или больше.","КД копии равен 10 + ваш модификатор Ловкости. Если атака попала по копии, она уничтожается. Копию может уничтожить только атака, попавшая по ней. Она игнорирует остальной урон и эффекты. Заклинание оканчивается, если все три копии будут уничтожены.","Существо не попадает под действие этого заклинания, если не может видеть, если полагается на другие чувства кроме зрения, например, на слепое зрение, или если может видеть сквозь иллюзию, например, при помощи истинного зрения."],"higher":[],"custom":true},{"id":"cmqwl9qv6q6u","name":"Охраняющая связь","level":2,"classes":["cleric","paladin"],"time":"1 действие","range":"Касание","dur":"1 час","conc":false,"rit":false,"desc":["Это заклинание защищает согласное существо, которого вы касаетесь, и создаёт мистическую связь между вами. Пока цель находится в пределах 12 клеток от вас, она получает бонус +1 к КД и спасброскам, а также сопротивление урону всех типов. Кроме того, каждый раз, когда она получает урон, вы получаете такое же количество урона.","Это заклинание оканчивается, если ваши хиты опускаются до 0 или если расстояние между вами и целью становится больше 12 клеток. Оно также оканчивается, если это заклинание наложить повторно на одно из связанных существ. Вы также можете окончить это заклинание действием."],"higher":[],"custom":true},{"id":"cmqwl9vost1t","name":"Поиск предмета","level":2,"classes":["bard","cleric","druid","paladin","ranger","wizard"],"time":"1 действие","range":"На себя","dur":"До 10 минут","conc":true,"rit":false,"desc":["Опишите или назовите известный вам предмет. Вы чувствуете направление к этому предмету, пока он находится в пределах 1 000 футов от вас. Если предмет перемещается, вы узнаете его направление.","Это заклинание может искать конкретный известный вам предмет, если вы хотя бы раз видели его вблизи (в пределах 6 клеток). В качестве альтернативы, это заклинание может искать ближайший предмет определенного вида, например, особый предмет одежды, ювелирное украшение, мебель, инструмент или оружие.","Это заклинание не может обнаружить предмет, если прямой путь между вами перерезан свинцом, пусть даже самым тонким листом."],"higher":[],"custom":true},{"id":"cmqwla0flyyp","name":"Поиск скакуна","level":2,"classes":["paladin"],"time":"10 минут","range":"6","dur":"Мгновенная","conc":false,"rit":false,"desc":["Вы вызываете дух, принимающий облик невероятно умного, сильного и верного скакуна, создавая долгосрочную связь с ним. Появляясь в свободном пространстве в пределах дистанции, скакун принимает выбранный вами облик, такой как боевой конь, пони, верблюд, лось или мастиф (Мастер может позволить призывать в качестве скакунов других животных). Скакун приобретает характеристики выбранной формы, хотя на самом деле он является Исчадием, Небожителем или Феей (по вашему выбору). Кроме того, если у вашего скакуна Интеллект 5 или меньше, его Интеллект становится равен 6, и он получает способность понимать один язык на ваш выбор, на котором вы разговариваете.","Ваш скакун служит вам как в бою, так и вне его, и у вас с ним есть инстинктивная связь, позволяющая сражаться как единое целое. Находясь верхом на скакуне, вы можете делать так, что наложенные вами заклинания, нацеливающиеся только на вас, будут нацелены ещё и на скакуна.","Когда хиты скакуна опускаются до 0, он исчезает, не оставляя физического тела. Вы можете также в любое время отпустить скакуна действием, заставляя его исчезнуть. В любом случае, повторное использование этого заклинания призывает этого же скакуна, восстанавливая хиты до максимума.","Пока скакун находится в пределах 1 мили от вас, вы можете общаться друг с другом телепатически.","У вас не может быть больше одного скакуна, призванного этим заклинанием, одновременно. Вы можете действием навсегда отпустить скакуна, освободив его от уз и заставляя исчезнуть."],"higher":[],"custom":true},{"id":"cmqwla58xcz0","name":"Порыв ветра","level":2,"classes":["druid","ranger","sorcerer","wizard"],"time":"1 действие","range":"На себя (60-футовая линия)","dur":"До 1 минуты","conc":true,"rit":false,"desc":["Порыв сильного ветра длиной 12 клеток и шириной 2 клетки исходит от вас в выбранном направлении, пока заклинание активно. Все существа, начинающие ход в этой линии, должны преуспеть в спасброске Силы, иначе их оттолкнет на 3 клетки от вас в направлении движения ветра.","Все существа в линии должны тратить 2 фута перемещения за каждый 1 фут, на который они перемещаются в вашу сторону.","Ветер рассеивает газы и испарения, а также тушит свечи, факелы и другие незащищённые источники огня. Защищённый огонь, например, в фонарях, он заставляет трепетать, и существует шанс 50%, что потухнут и они.","Пока заклинание активно, вы можете в каждом своём ходу бонусным действием менять направление, в котором дует ветер."],"higher":[],"custom":true},{"id":"cmqwla9r5i8a","name":"Почтовое животное","level":2,"classes":["bard","druid","ranger"],"time":"1 действие","range":"6","dur":"24 часа","conc":false,"rit":true,"desc":["При помощи этого заклинания вы передаёте через животное сообщение. Выберите Крошечного Зверя, которого видите в пределах дистанции, такого как белку, сойку или летучую мышь. Вы указываете место, которое когда-то уже посещали, и получателя, описывая его признаки, такие как «мужчина или женщина в униформе городской стражи» или «рыжий дварф в остроконечной шляпе». Вы также произносите сообщение длиной не более 25 слов. Зверь в течение длительности заклинания двигается в указанное место, покрывая примерно 50 миль за 24 часа при полёте или 25 миль при других видах перемещения.","Прибыв на место, Зверь передаёт ваше сообщение описанному вами существу, изображая звук вашего голоса. Зверь передаст послание только существу, подходящему данному вами описанию. Если Зверь не достигнет места до окончания действия заклинания, сообщение будет утеряно, а Зверь начнёт возвращаться к тому месту, где вы наложили на него заклинание."],"higher":["Если вы накладываете это заклинание, используя ячейку 3-го уровня или выше, его длительность увеличивается на 48 часов за каждый уровень ячейки выше второго."],"custom":true},{"id":"cmqwlae77ihe","name":"Призыв духа зверя","level":2,"classes":["druid","ranger"],"time":"1 действие","range":"18","dur":"До 1 часа","conc":true,"rit":false,"desc":["Вы призываете духа зверя [bestial spirit]. Он проявляется в свободном пространстве, которое вы можете видеть в пределах дистанции. Воплощённая форма духа использует блок статистики духа зверя [bestial spirit]. Когда вы накладываете заклинание, выберите среду обитания: воздух, земля или вода. Существо принимает форму животного по вашему выбору, обитающего в этой среде, которая определяет особенности духа, описанные в блоке статистики. Существо исчезает, когда его хиты опускаются до 0 или когда заклинание заканчивается.","Это существо дружелюбно к вам и вашим товарищам. В бою существо получает вашу инициативу, и ходит сразу же после вас. Оно подчиняется вашим вербальным командам (никаких действий от вас не требуется). Если вы ничего не приказываете, то оно применяет действие Уклонение и перемещается, избегая опасностей."],"higher":["Когда вы произносите это заклинание, используя ячейку 3-го уровня или выше, характеристики призываемого существа изменяются в соответствии с описанием в блоке статистики."],"custom":true},{"id":"cmqwlais94pa","name":"Пронзание разума","level":2,"classes":["sorcerer","warlock","wizard"],"time":"1 действие","range":"12","dur":"До 1 часа","conc":true,"rit":false,"desc":["Вы достигаете разума одного существа, которое видите в пределах дистанции. Цель должна совершить спасбросок Мудрости, получая 3d8 урона психической энергией при провале или половину этого урона при успехе. При провале вы также всегда знаете местоположение цели до тех пор, пока заклинание активно, но только пока вы оба находитесь на одном и том же плане существования. Пока у вас есть это знание, цель не может стать спрятанной от вас, и если она невидима, она не получает никакой выгоды от этого состояния против вас."],"higher":["Когда вы накладываете это заклинание, используя ячейку заклинания 3-го уровня или выше, урон увеличивается на 1d8 для каждого уровня ячейки выше 2-го."],"custom":true},{"id":"cmqwlaq5aaze","name":"Пылающий шар","level":2,"classes":["druid","sorcerer","wizard"],"time":"1 действие","range":"12","dur":"До 1 минуты","conc":true,"rit":false,"desc":["В свободном пространстве на ваш выбор в пределах дистанции появляется шар из огня с диаметром 1 клетка, существующий, пока активно заклинание. Все существа, оканчивающие ход в пределах 1 клетки от шара, должны совершать спасбросок Ловкости. Существа получают урон огнём 2d6 при провале или половину этого урона при успехе.","Вы можете бонусным действием переместить шар на 6 клеток. Если вы тараните шаром существо, это существо должно совершить спасбросок от урона шара, и шар останавливается до конца этого хода.","Когда вы перемещаете шар, вы можете поднимать его над препятствиями до 1 клетка в высоту и перепрыгивать им разломы до 2 клетки в длину. Шар поджигает горючие предметы, которые никто не несет и не носит, и испускает яркий свет в пределах 4 клеток и тусклый свет в пределах ещё 4 клетки."],"higher":["Если вы накладываете это заклинание, используя ячейку 3-го уровня или выше, урон увеличивается на 1d6 за каждый уровень ячейки выше второго."],"custom":true},{"id":"cmqwlauvn93b","name":"Пылевой вихрь","level":2,"classes":["druid","sorcerer","wizard"],"time":"1 действие","range":"12","dur":"До 1 минуты","conc":true,"rit":false,"desc":["Выберите свободный куб воздуха с длиной ребра 1 клетка, который вы можете видеть в пределах дистанции. На время действия заклинания в этой области возникает стихийная сила, похожая на пылевой вихрь.","Все существа, которые заканчивают свой ход в пределах 1 клетки от пылевого вихря, должны совершить спасбросок Силы. При провале существо получает 1d8 дробящего урона и отталкивается на 2 клетки от пылевого вихря. При успешном спасброске существо получает половину урона и не отталкивается.","Вы можете бонусным действием переместить пылевой вихрь на расстояние до 6 клеток в любом направлении. Если он перемещается по песку, пыли, рыхлой грязи или гравию, то он всасывает часть вещества, создавая вокруг себя облако мусора радиусом 2 клеток до начала вашего следующего хода. Облако является сильно заслонённой местностью."],"higher":["Если вы накладываете это заклинание, используя ячейку 3-го уровня или выше, то урон увеличивается на 1d8 за каждый уровень ячейки выше 2-го."],"custom":true},{"id":"cmqwlaz72liq","name":"Раскалённый металл","level":2,"classes":["artificer","bard","druid"],"time":"1 действие","range":"12","dur":"До 1 минуты","conc":true,"rit":false,"desc":["Выберите рукотворный металлический предмет, такой как металлическое оружие или комплект тяжелого или среднего доспеха, видимый в пределах дистанции. Вы делаете его раскаленным докрасна. Все существа, находящиеся в физическом контакте с этим предметом, получают урон огнём 2d8, когда вы накладываете это заклинание. Пока заклинание активно, вы можете бонусным действием в каждом последующем ходу вновь причинять этот урон. Если существо держит или носит предмет, и получает от него урон, оно должно преуспеть в спасброске Телосложения, иначе оно роняет этот предмет, если может. Если оно не может уронить предмет, то до начала вашего следующего хода совершает с помехой броски атаки и проверки характеристик."],"higher":["Если вы накладываете это заклинание, используя ячейку 3-го уровня или выше, урон увеличивается на 1d8 за каждый уровень ячейки выше второго."],"custom":true},{"id":"cmqwlb48nlou","name":"Речь златоуста","level":2,"classes":["bard","warlock"],"time":"1 действие","range":"12","dur":"1 минута","conc":false,"rit":false,"desc":["Вы произносите отвлекающую речь, заставляя выбранных вами существ, которых вы видите в пределах дистанции, и которые при этом могут слышать вас, совершить спасбросок Мудрости. Существа, которые не могут быть очарованными, автоматически преуспевают в спасброске, и если вы или ваши спутники сражаетесь с существом, оно совершает спасбросок с преимуществом. При провале цель получает помеху к проверкам Мудрости (Восприятие), совершённым для обнаружения других существ кроме вас, пока заклинание активно или пока цель не перестанет вас слышать. Заклинание оканчивается, если вы становитесь недееспособны или теряете возможность говорить."],"higher":[],"custom":true},{"id":"cmqwlb93yrer","name":"Снежный шквал Сниллока","level":2,"classes":["sorcerer","wizard"],"time":"1 действие","range":"18","dur":"Мгновенная","conc":false,"rit":false,"desc":["На выбранную вами точку в пределах дистанции обрушивается снежный шквал. Все существа в сфере с радиусом 1 клетки и центром в выбранной точке должны совершить спасбросок Ловкости. При провале существо получает 3d6 урона холодом, а при успехе — половину этого урона."],"higher":["Если вы накладываете это заклинание, используя ячейку 3-го уровня или выше, то урон увеличивается на 1d6 за каждый уровень ячейки выше второго."],"custom":true},{"id":"cmqwlbffh96y","name":"Стая фамильяров","level":2,"classes":["warlock","wizard"],"time":"1 минута","range":"Касание","dur":"До 1 часа","conc":true,"rit":false,"desc":["-06","Вы временно призываете трёх фамильяров — духов, которые принимают вид животных по вашему выбору. Каждый фамильяр следует правилам и опциям из заклинания поиск фамильяра [find familiar]. Все фамильяры, призванные этим заклинанием, должны быть одного выбранного вами вида (Исчадие, Небожитель или Фея). Если вы уже призвали фамильяра заклинанием поиск фамильяра или другим подобным заклинанием, то заклинание стая фамильяров призывает на одного фамильяра меньше.","Призванные этим заклинанием фамильяры могут телепатически общаться с вами и делиться с вами видимой и слышимой информацией, пока они находятся в пределах 1 мили от вас.","Если вы накладываете заклинание с дистанцией «касание», его может передать фамильяр по правилам заклинания поиск фамильяра. Однако вы можете передавать заклинание только через одного фамильяра за ход."],"higher":["Если вы накладываете это заклинание, используя ячейку 3-го уровня или выше, вы вызываете дополнительного фамильяра за каждый уровень ячейки выше второго."],"custom":true},{"id":"cmqwlbkbzjib","name":"Трюк с верёвкой","level":2,"classes":["artificer","wizard"],"time":"1 действие","range":"Касание","dur":"1 час","conc":false,"rit":false,"desc":["Вы касаетесь верёвки длиной до 12 клеток. Один её конец поднимается в воздух, а остальная часть висит перпендикулярно полу. На верхнем конце верёвки появляется невидимый вход в межпространство, существующий, пока заклинание активно.","В межпространство можно попасть забравшись по верёвке наверх. В этом межпространстве может поместиться восемь существ с размером не больше Среднего. Верёвку можно затянуть внутрь, после чего снаружи её не будет видно.","Атаки и заклинания не могут проходить через вход внутрь межпространства и наружу, но те, кто находятся внутри, могут все видеть как через окно 3 × 1 клетка с центром на верёвке.","Всё, что находится в межпространстве, вываливается наружу, когда заклинание оканчивается."],"higher":[],"custom":true},{"id":"cmqwlboqbis5","name":"Туманный шаг","level":2,"classes":["sorcerer","warlock","wizard"],"time":"1 бонусное действие","range":"На себя","dur":"Мгновенная","conc":false,"rit":false,"desc":["Окутавшись серебристым туманом, вы телепортируетесь на расстояние до 6 клеток в свободное пространство, видимое вами."],"higher":[],"custom":true},{"id":"cmqwlbt2s5x8","name":"Тьма","level":2,"classes":["sorcerer","warlock","wizard"],"time":"1 действие","range":"12","dur":"До 10 минут","conc":true,"rit":false,"desc":["Из точки, выбранной вами в пределах дистанции, расползается магическая тьма сферой с радиусом 3 клеток. Тьма огибает углы. Существа с тёмным зрением не могут видеть сквозь эту тьму, и немагический свет не может её осветить.","Если выбранная вами точка находится на предмете, который вы держите или который никто не несёт и не носит, тьма исходит из предмета и перемещается вместе с ним. Если полностью накрыть источник тьмы непрозрачным предметом, например, чашей или шлемом, тьма будет заблокирована.","Если часть зоны этого заклинания перекрывает часть зоны света, созданного заклинанием с уровнем не выше 2-го, заклинание, создавшее свет, рассеивается."],"higher":[],"custom":true},{"id":"cmqwlbx8j9go","name":"Узы земли","level":2,"classes":["druid","sorcerer","warlock","wizard"],"time":"1 действие","range":"60","dur":"До 1 минуты","conc":true,"rit":false,"desc":["Выберите одно существо, видимое в пределах дистанции. Жёлтые полосы магической энергии обвиваются вокруг этого существа. Цель должна преуспеть в спасброске Силы, иначе её скорость полёта (если есть) будет снижена до 0 на время действия заклинания. Существо, которое находится в воздухе, снижается со скоростью 12 клеток за раунд, пока не окажется на земле или не закончится заклинание."],"higher":[],"custom":true},{"id":"cmqwlc2cya99","name":"Улучшение характеристики","level":2,"classes":["artificer","bard","cleric","druid","ranger","sorcerer","wizard"],"time":"1 действие","range":"Касание","dur":"До 1 часа","conc":true,"rit":false,"desc":["Вы касаетесь существа и улучшаете его при помощи магии. Выберите один из следующих эффектов. Цель получает выбранный эффект на время действия заклинания.","Бычья сила. Цель совершает с преимуществом проверки Силы, а грузоподъёмность удваивается.","Кошачья ловкость. Цель совершает с преимуществом проверки Ловкости. Кроме того, она не получает урон за падение с высоты 4 клетки или меньше, если она не недееспособна.","Лисья хитрость. Цель совершает с преимуществом проверки Интеллекта.","Медвежья выносливость. Цель совершает с преимуществом проверки Телосложения. Она также получает 2d6 временных хитов, которые исчезают в конце заклинания.","Орлиное великолепие. Цель совершает с преимуществом проверки Харизмы.","Совиная мудрость. Цель совершает с преимуществом проверки Мудрости."],"higher":["Если вы накладываете это заклинание, используя ячейку 3-го уровня или выше, вы можете сделать целью одно дополнительное существо за каждый уровень ячейки выше второго."],"custom":true},{"id":"cmqwlc7f7cb2","name":"Умиротворение","level":2,"classes":["bard","cleric"],"time":"1 действие","range":"12","dur":"До 1 минуты","conc":true,"rit":false,"desc":["Вы пытаетесь подавить сильные эмоции у группы существ. Все Гуманоиды в сфере с радиусом 4 клеток с центром в точке, выбранной в пределах дистанции, должны совершить спасбросок Харизмы; существо может добровольно провалить этот спасбросок, если пожелает. Если существо проваливает спасбросок, выберите один из двух описанных ниже эффектов:","Вы можете подавить все эффекты, делающие цель очарованной или испуганной. Когда это заклинание оканчивается, все подавленные эффекты восстанавливаются, при условии, что за это время их действие не окончилось.","В качестве альтернативы, вы можете сделать цель безразличной к выбранным вами существам, к которым она относилась враждебно. Это безразличие оканчивается, если цель атакована или ей причинён вред заклинанием, или если она станет свидетелем того, как причиняют вред её друзьям. Когда заклинание оканчивается, существо становится вновь враждебным, если Мастер не решит по-другому."],"higher":[],"custom":true},{"id":"cmqwlcgtzg0f","name":"Психическая плеть Таши","level":2,"classes":["sorcerer","wizard"],"time":"1 действие","range":"18","dur":"1 раунд","conc":false,"rit":false,"desc":["Вы психически хлещете одно существо, которое видите в пределах дистанции. Цель должна совершить спасбросок Интеллекта. При провале цель получает 3d6 урона психической энергией и не может использовать реакцию до конца своего следующего хода. Кроме того, на своём следующем ходу цель должна выбрать, что она будет делать: передвигаться, совершать действие или совершать бонусное действие — цель может совершить лишь что-то одно. При успехе цель получает половину урона и не получает других эффектов заклинания."],"higher":["Когда вы накладываете это заклинание, используя ячейку 3-го уровня или выше, вы можете нацелиться на одно дополнительное существо за каждый уровень ячейки выше второго. Все цели заклинания должны быть в пределах 6 клеток друг от друга во время накладывания заклинания."],"custom":true},{"id":"cmqwljgpjsl4","name":"Аура живучести","level":3,"classes":["cleric","druid","paladin"],"time":"1 действие","range":"На себя (30-футовый радиус)","dur":"До 1 минуты","conc":true,"rit":false,"desc":["От вас исходит аура живительной энергии с радиусом 6 клеток. Пока заклинание активно, аура перемещается вместе с вами, оставаясь с центром на вас. Вы можете бонусным действием восстанавливать одному любому существу в ауре (включая себя) 2d6 хитов."],"higher":[],"custom":true},{"id":"cmqwljo2sgv4","name":"Быстрые друзья","level":3,"classes":["bard","cleric","wizard"],"time":"1 действие","range":"6","dur":"До 1 часа","conc":true,"rit":false,"desc":["Когда вам нужно убедиться, что что-то сделано, вы не можете полагаться на чьи-то обещания, клятвы или обязательные трудовые договоры. Когда вы накладываете это заклинание, выберите одного Гуманоида в пределах дистанции, который может видеть и слышать вас, и который может вас понять. Существо должно преуспеть в спасброске Мудрости, иначе станет очарованным вами, пока заклинание активно. Когда существо очаровано таким образом, оно обязуется выполнять любые распоряжения, которые вы попросите его выполнить в дружеской манере, в меру своих возможностей.","Вы можете дать существу новую задачу, когда предыдущая задача будет завершена, или, если вы решите, окончить действие заклинания. Если ваши распоряжения могут причинить вред очарованному существу или если они противоречат обычной деятельности и желаниям существа, то существо может сделать ещё один спасбросок Мудрости, чтобы попытаться досрочно окончить действие эффекта. Спасбросок совершается с преимуществом, если вы или ваши товарищи сражаетесь с этим существом. Если существо умирает, действие заклинания оканчивается.","После окончания действия данного заклинания существо точно знает, кем оно было очаровано."],"higher":["Когда вы накладываете это заклинание, используя ячейку заклинаний 4-го уровня или выше, вы можете нацелиться на одно дополнительное существо для каждого уровня ячейки выше 3-го."],"custom":true},{"id":"cmqwlju77ndl","name":"Водяная стена","level":3,"classes":["druid","sorcerer","wizard"],"time":"1 действие","range":"12","dur":"До 10 минут","conc":true,"rit":false,"desc":["Вы создаёте стену воды в точке, которую можете видеть, в пределах дистанции. Точка должна располагаться на земле. Стена может быть длиной до 6 клеток, высотой до 2 клетки и толщиной до 1 фута. В качестве альтернативы, вы можете создать кольцо диаметром до 4 клетки, высотой до 4 клетки и толщиной до 1 фута. Стена существует, пока действует заклинание. Стена считается труднопроходимой местностью.","Все атаки дальнобойным оружием, траектория которых проходит через пространство стены, совершаются с помехой. Огненный урон от эффектов, которые прошли через стену, уменьшается вдвое. Заклинания, которые причиняют урон холодом, при прохождении через стену замораживают ту область стены, сквозь которую прошли (минимум секция площадью 5×1 клетка). Каждая замёрзшая секция площадью 5×1 клетка имеет КД 5 и 15 хитов. Если хиты секции уменьшаются до 0, она разрушается. Разрушенные секции стены не заполняются водой повторно."],"higher":[],"custom":true},{"id":"cmqwlka669e0","name":"Газообразная форма","level":3,"classes":["sorcerer","warlock","wizard"],"time":"1 действие","range":"Касание","dur":"До 1 часа","conc":true,"rit":false,"desc":["Вы превращаете на время действия заклинания согласное существо, которого касаетесь, а также всё, что оно носит и несёт, в туманное облако. Заклинание оканчивается, если хиты существа опускаются до 0. Бестелесные существа не попадают под действие этого заклинания.","Пока цель находится в этой форме, единственной её скоростью перемещения становится скорость полёта 2 клетки. Цель может входить в пространство других существ и оставаться там. Существо получает сопротивление немагическому урону и совершает с преимуществом спасброски Силы, Ловкости и Телосложения. Цель может проходить через небольшие отверстия и узкие щели, но жидкости для неё считаются твёрдыми поверхностями. Цель не может упасть и остается парить, даже если становится ошеломлённой или недееспособной.","Находясь в форме туманного облака, цель не может говорить и манипулировать предметами, и все предметы, которые она несёт или носит, нельзя ронять, использовать и вообще как-либо с ними взаимодействовать. Цель не может атаковать и накладывать заклинания."],"higher":[],"custom":true},{"id":"cmqwlkg9u9pc","name":"Гальдерова башня","level":3,"classes":["wizard"],"time":"10 минут","range":"6","dur":"24 часа","conc":false,"rit":false,"desc":["-06","Вы создаёте двухэтажную башню из камня, дерева или подобных прочных материалов. По форме башня может быть круглой или квадратной. Каждый этаж башни имеет высоту 2 клетки (3 метра) и площадь до 100 квадратных футов. Перемещаться между этажами можно по простой лестнице через люки. Каждый этаж принимает одну из следующих форм, выбранных вами при накладывании заклинания:","Спальня с кроватью, стульями, сундуком и волшебным камином.","Кабинет с письменными столами, книгами, книжными полками, пергаментами, тушью и чернильными ручками.","Обеденная зона со столом, стульями, волшебным камином, посудой и кухонными принадлежностями.","Гостиная с диванами, креслами, тумбочками и скамейками для ног.","Санузел с туалетами, умывальниками, волшебной жаровней и скамейками для сауны.","Обсерватория с телескопом и картами ночного неба.","Пустая комната без мебели.","Внутри башни тепло и сухо независимо от внешних условий. Любое оборудование или предметы интерьера, созданные с башней, превращаются в дым, если их вынести из неё. По окончании действия заклинания все существа и объекты в башне, которые не были созданы заклинанием, безопасно появляются на земле, и все следы башни и её обстановки исчезают.","Вы можете наложить это заклинание ещё раз, пока оно активно, чтобы башня просуществовала ещё 24 часа. Вы можете создать постоянную башню, накладывая это заклинание в одном и том же месте и с одинаковой конфигурацией каждый день в течение одного года."],"higher":["Если вы накладываете это заклинание, используя ячейку 4-го уровня или выше, у башни появляется один дополнительный этаж за каждый уровень ячейки выше третьего."],"custom":true},{"id":"cmqwll1cer9r","name":"Гипнотический узор","level":3,"classes":["bard","sorcerer","warlock","wizard"],"time":"1 действие","range":"24","dur":"До 1 минуты","conc":true,"rit":false,"desc":["Вы создаете хитрый разноцветный узор, переплетающийся в воздухе внутри куба с длиной ребра 6 клеток, находящегося в пределах дистанции. Узор появляется на краткий миг и исчезает. Все существа в этой области, видящие узор, должны совершить спасбросок Мудрости. При провале существо становится очарованным на время действия заклинания. Будучи очарованным этим заклинанием, существо недееспособно, и его скорость равна 0. Заклинание заканчивается для отдельного существа, если оно получает урон или если кто-то другой действием потрясет его, чтобы вывести из ступора."],"higher":[],"custom":true},{"id":"cmqwll5tnzkx","name":"Дневной свет","level":3,"classes":["cleric","druid","paladin","ranger","sorcerer"],"time":"1 действие","range":"12","dur":"1 час","conc":false,"rit":false,"desc":["Из точки, выбранной вами в пределах дистанции, распространяется сфера света с радиусом 12 клеток. Сфера излучает яркий свет и тусклый свет в пределах ещё 12 клеток.","Если выбранная вами точка находится на предмете, который вы держите или который никто не несёт или носит, свет исходит из предмета и перемещается вместе с ним. Если полностью накрыть источник света непрозрачным предметом, например, чашей или шлемом, свет будет заблокирован.","Если часть области этого заклинания накрывает область тьмы, созданной заклинанием с уровнем не выше 3-го, заклинание, создавшее тьму, рассеивается."],"higher":[],"custom":true},{"id":"cmqwllahz4q1","name":"Дрёма","level":3,"classes":["artificer","bard","sorcerer","wizard"],"time":"1 действие","range":"6","dur":"10 минут","conc":false,"rit":false,"desc":["Вы делаете успокаивающий жест, и до трёх согласных существ по вашему выбору, которых вы можете видеть в пределах дистанции, падают без сознания на время действия заклинания. Заклинание оканчивается на цели раньше, если она получает урон или если кто-то действием потрясёт её или даст пощёчину. Если цель остается без сознания в течение всего времени действия заклинания, она получает все преимущества короткого отдыха и не может быть подвержена этому заклинанию снова, пока не закончит продолжительный отдых."],"higher":["Если вы накладываете это заклинание, используя ячейку 4-го уровня или выше, вы можете сделать целью дополнительно ещё одно существо за каждый уровень ячейки выше 3-го."],"custom":true},{"id":"cmqwllf19qut","name":"Замедление","level":3,"classes":["bard","sorcerer","wizard"],"time":"1 действие","range":"24","dur":"До 1 минуты","conc":true,"rit":false,"desc":["Вы изменяете время для не более шести существ по вашему выбору, находящихся в кубе с длиной ребра 8 клеток в пределах дистанции. Все цели должны преуспеть в спасброске Мудрости, иначе они попадут под действие заклинания на время его длительности.","Скорость попавшего под действие существа уменьшается вдвое, оно получает штраф -2 к КД и спасброскам Ловкости, и оно не может совершать реакции. В свой ход оно может использовать либо действие, либо бонусное действие, и не может использовать сразу оба. Вне зависимости от умений и магических предметов, оно не может в свой ход совершать более одной рукопашной или дальнобойной атаки.","Если существо попытается наложить заклинание со временем накладывания «1 действие», бросьте d20. Если выпадет «11» или больше, заклинание не вступит в силу до его следующего хода, и в том ходу оно должно будет использовать действие для завершения заклинания. Если оно этого не сделает, заклинание будет потрачено.","Существо, находящееся под действием этого заклинания, совершает новые спасброски Мудрости в конце каждого своего хода. При успехе эффект на нём оканчивается."],"higher":[],"custom":true},{"id":"cmqwlljat3tq","name":"Защита от энергии","level":3,"classes":["artificer","cleric","druid","ranger","sorcerer","wizard"],"time":"1 действие","range":"Касание","dur":"До 1 часа","conc":true,"rit":false,"desc":["Пока заклинание активно, согласное существо, которого вы коснулись, получает сопротивление урону одного вида по вашему выбору: звук, кислота, огонь, холод или электричество."],"higher":[],"custom":true},{"id":"cmqwllnshup9","name":"Извержение земли","level":3,"classes":["druid","sorcerer","wizard"],"time":"1 действие","range":"24","dur":"Мгновенная","conc":false,"rit":false,"desc":["Выберите точку на поверхности земли, видимую в пределах дистанции. В этой точке из поверхности вырывается фонтан земли и камня. Все существа в кубе с длиной ребра 4 клетки с центром на этой точке должны совершить спасбросок Ловкости. При провале существо получает 3d12 дробящего урона, а при успехе — половину этого урона. Кроме того, земля в области действия заклинания становится труднопроходимой местностью, пока её не расчистят. Расчистка квадрата с длиной стороны 1 клетка вручную займёт не менее 1 минуты."],"higher":["Если вы накладываете это заклинание, используя ячейку 4-го уровня или выше, то урон увеличивается на 1d12 за каждый уровень ячейки выше 3-го."],"custom":true},{"id":"cmqwlo0py2hn","name":"Контрзаклинание","level":3,"classes":["sorcerer","warlock","wizard"],"time":"Реакция","range":"12","dur":"Мгновенная","conc":false,"rit":false,"desc":["Вы пытаетесь прервать процесс накладывания заклинания. Если существо накладывает заклинание 3-го уровня или ниже, его заклинание проваливается, и не оказывает никакого эффекта. Если оно накладывало заклинание 4-го уровня или выше, совершите проверку базовой характеристики. Сл равна 10 + уровень заклинания. В случае успеха заклинание проваливается и не оказывает никакого эффекта."],"higher":["Если вы накладываете это заклинание, используя ячейку 4-го уровня или выше, прерванное заклинание автоматически не оказывает эффекта, если его уровень не превышает уровень использованной вами ячейки."],"custom":true},{"id":"cmqwlo56lr22","name":"Крепость интеллекта","level":3,"classes":["artificer","bard","sorcerer","warlock","wizard"],"time":"1 действие","range":"6","dur":"До 1 часа","conc":true,"rit":false,"desc":["В течение длительности заклинания вы или одно согласное существо, которое вы можете видеть в пределах дистанции, имеете сопротивление урону психической энергией, а также совершаете с преимуществом спасброски Интеллекта, Мудрости и Харизмы."],"higher":["Когда вы накладываете это заклинание, используя ячейку 4-го уровня или выше, вы можете сделать целью заклинания дополнительных существ, по одному за каждый уровень ячейки выше третьего. Все цели заклинания должны быть в пределах 6 клеток друг от друга во время накладывания заклинания."],"custom":true},{"id":"cmqwlo9uhrcy","name":"Леомундова хижина","level":3,"classes":["bard","wizard"],"time":"1 минута","range":"На себя (полусфера с радиусом 10 футов)","dur":"8 часов","conc":false,"rit":true,"desc":["Над вами и вокруг вас появляется купол из силового поля радиусом 2 клеток, остающийся неподвижным всё время существования. Заклинание оканчивается, если вы покидаете его область.","Под куполом вместе с вами могут поместиться девять существ с размером не больше Среднего. Заклинание срывается, если в его области находится существо большего размера или более девяти существ. Существа и предметы, находившиеся под куполом, когда вы наложили это заклинание, могут свободно проходить сквозь него. Все остальные существа и предметы не могут пройти сквозь него. Заклинания и прочие магические эффекты не могут простираться сквозь купол и не могут быть наложены сквозь него. Атмосфера под ним сухая и комфортная, какой бы ни была погода снаружи.","Пока заклинание активно, вы можете сделать пространство под ним тускло освещённым или погруженным во тьму. Купол снаружи матовый, любого цвета, но изнутри он прозрачный."],"higher":[],"custom":true},{"id":"cmqwloesrj8d","name":"Магический круг","level":3,"classes":["cleric","paladin","warlock","wizard"],"time":"1 минута","range":"2","dur":"1 час","conc":false,"rit":false,"desc":["Вы создаёте из магической энергии цилиндр с радиусом 2 клеток и высотой 4 клетки с центром на точке на полу, видимой в пределах дистанции. Там, где цилиндр пересекает пол или другую поверхность, появляются светящиеся руны.","Выберите один или несколько видов существ из следующего списка: Исчадия, Небожители, Нежить, Феи или Элементали. Круг действует на выбранных существ следующим образом:","Существа не могут добровольно войти в цилиндр немагическими средствами. Если существо пытается использовать телепортацию или межпланарное путешествие, оно должно вначале преуспеть в спасброске Харизмы.","Существо совершает с помехой броски атаки по целям, находящимся в пределах цилиндра.","Целей в цилиндре нельзя сделать очарованными, испуганными или одержимыми.","При накладывании этого заклинания вы можете обратить его магию, чтобы существа выбранного вида не могли покинуть цилиндр, а защищены были цели, находящиеся снаружи."],"higher":["Если вы накладываете это заклинание, используя ячейку 4-го уровня или выше, его длительность увеличивается на 1 час за каждый уровень ячейки выше третьего."],"custom":true},{"id":"cmqwlok1q12q","name":"Мантия крестоносца","level":3,"classes":["paladin"],"time":"1 действие","range":"На себя","dur":"До 1 минуты","conc":true,"rit":false,"desc":["От вас начинает исходить святая сила аурой с радиусом 6 клеток, пробуждающая в дружественных существах отвагу. Пока заклинание активно, аура перемещается вместе с вами, оставаясь с центром на вас. Находясь в ауре, все невраждебные существа (включая вас) при попадании атакой оружием причиняют дополнительно 1d4 урона излучением."],"higher":[],"custom":true},{"id":"cmqwloojmaqr","name":"Маяк надежды","level":3,"classes":["cleric"],"time":"1 действие","range":"6","dur":"До 1 минуты","conc":true,"rit":false,"desc":["Это заклинание дарует надежду и живучесть. Выберите любое количество существ в пределах дистанции. Пока заклинание активно, все цели совершают спасброски Мудрости и спасброски от смерти с преимуществом, а также восстанавливают от любого лечения максимально возможное количество хитов."],"higher":[],"custom":true},{"id":"cmqwlotdz8nh","name":"Мельфовы маленькие метеоры","level":3,"classes":["sorcerer","wizard"],"time":"1 действие","range":"На себя","dur":"До 10 минут","conc":true,"rit":false,"desc":["Вы создаёте вокруг себя шесть маленьких метеоров. Они парят в воздухе и вращаются вокруг вас, пока действует заклинание. Когда вы накладываете заклинание (а также в следующих ходах бонусным действием) вы можете отправить один или два метеора в точки, выбранные в пределах 24 клеток. Долетев до цели или столкнувшись с твёрдой поверхностью, метеор взрывается. Все существа в пределах 1 клетки от точки взрыва должны совершить спасбросок Ловкости. При провале существо получает 2d6 урона огнём, а при успехе — половину урона."],"higher":["Если вы накладываете это заклинание, используя ячейку 4-го уровня или выше, число призываемых метеоров увеличивается на 2 за каждый уровень ячейки выше 3-го."],"custom":true},{"id":"cmqwloy8lmj0","name":"Мерцание","level":3,"classes":["artificer","sorcerer","wizard"],"time":"1 действие","range":"На себя","dur":"1 минута","conc":false,"rit":false,"desc":["Пока заклинание активно, бросайте d20 в конце каждого своего хода. Если выпадет «11» или выше, вы исчезаете на текущем плане существования и появляетесь на Эфирном плане (заклинание проваливается, если вы уже находитесь на этом плане). В начале своего следующего хода, а также если заклинание окончится, когда вы будете на Эфирном плане, вы возвращаетесь в свободное пространство на свой выбор, которое вы видите в пределах 2 клеток от места, из которого вы исчезли. Если в пределах дистанции нет свободного пространства, вы появляетесь в ближайшем свободном пространстве (выбранном случайным образом, если есть несколько подходящих мест). Вы можете остановить заклинание действием.","Находясь на Эфирном плане, вы можете видеть и слышать на плане, с которого пришли, видя все в оттенках серого и не видя того, что происходит за пределами 12 клеток. Вы можете воздействовать только на существ, находящихся на Эфирном плане, и только такие существа могут воздействовать на вас. Существа, не находящиеся там, не могут вас воспринимать и взаимодействовать с вами, если у них нет таких возможностей."],"higher":[],"custom":true},{"id":"cmqwlp2qacn6","name":"Необнаружимость","level":3,"classes":["bard","ranger","wizard"],"time":"1 действие","range":"Касание","dur":"8 часов","conc":false,"rit":false,"desc":["Пока заклинание активно, цель, которой вы коснулись, сокрыта от заклинаний школы Прорицания. Целью может быть согласное существо, место или предмет, не превышающий 2 клетки ни по одному из линейных размеров. Цель не может стать целью магии школы Прорицания, и её не воспринимают магические наблюдательные сенсоры."],"higher":[],"custom":true},{"id":"cmqwlp7u8nt3","name":"Образ","level":3,"classes":["bard","sorcerer","warlock","wizard"],"time":"1 действие","range":"24","dur":"До 10 минут","conc":true,"rit":false,"desc":["Вы создаёте образ предмета, существа или другого видимого явления, помещающийся в объёме в куб с длиной ребра 4 клетки. Образ появляется в точке, которую вы видите в пределах дистанции, и существует, пока заклинание активно. Он выглядит абсолютно реальным, включая звук, запах и температуру, соответствующую образу. Вы не можете создать жар или холод, достаточный для получения урона; звук, громкость которого может причинить урон звуком или оглушить существо, или запах, способный вызвать тошноту (такую как вонь троглодита).","Пока вы находитесь в пределах дистанции от иллюзии, вы можете действием заставить образ переместиться в любое место в пределах дистанции. Пока образ меняет местоположение, вы можете изменять его внешность, чтобы перемещение выглядело естественным. Например, если вы создаёте образ существа и перемещаете его, вы можете изменить образ, чтобы казалось, что оно идёт. Точно так же вы можете заставить иллюзию издавать в разное время разные звуки и даже, например, заставлять её принимать участие в беседе.","Физическое взаимодействие с образом даёт понять, что это иллюзия, потому что сквозь него всё проходит. Существа, исследующие образ действием, могут определить, что это иллюзия, преуспев в проверке Интеллекта (Расследование) против Сл ваших заклинаний. Если существо распознаёт иллюзию, оно может видеть сквозь неё, и все прочие сенсорные эффекты иллюзии тоже притупляются."],"higher":["Если вы накладываете это заклинание, используя ячейку 6-го уровня или выше, то оно будет длиться, пока не будет рассеяно, не требуя от вас концентрацию."],"custom":true},{"id":"cmqwlpcsske3","name":"Огненный шар","level":3,"classes":["sorcerer","wizard"],"time":"1 действие","range":"30","dur":"Мгновенная","conc":false,"rit":false,"desc":["Яркий луч вылетает из вашего указательного пальца в точку, выбранную вами в пределах дистанции, где и происходит взрыв пламени с гулким ревом. Все существа в пределах сферы с радиусом 4 клеток с центром в этой точке должны совершить спасбросок Ловкости. Цель получает 8d6 урона огнём при провале или половину этого урона при успехе. Этот огонь огибает углы. Он воспламеняет горючие предметы, которые никто не несет и не носит."],"higher":["Если вы накладываете это заклинание, используя ячейку 4-го уровня или выше, урон увеличивается на 1d6 за каждый уровень ячейки выше третьего."],"custom":true},{"id":"cmqwlpj6moyb","name":"Передача жизни","level":3,"classes":["cleric","wizard"],"time":"1 действие","range":"6","dur":"Мгновенная","conc":false,"rit":false,"desc":["Вы жертвуете своим здоровьем, чтобы излечить травмы другого существа. Вы получаете 4d8 урона некротической энергией, который никак нельзя уменьшить, и одно существо по вашему выбору, которое вы видите в пределах дистанции, восстанавливает хиты в количестве, равном удвоенному полученному вами урону."],"higher":["Если вы накладываете это заклинание, используя ячейку заклинания 4-го уровня или выше, урон увеличивается на 1d8 для каждого уровня ячейки выше 3-го."],"custom":true},{"id":"cmqwlpnmlq8g","name":"Песчаная стена","level":3,"classes":["wizard"],"time":"1 действие","range":"18","dur":"До 10 минут","conc":true,"rit":false,"desc":["Вы создаёте стену из кружащегося песка в видимой точке на земле в пределах дистанции. Точка должна располагаться на поверхности. Стена может быть длиной до 6 клеток, высотой до 2 клетки и толщиной до 2 клетки. Она существует до тех пор, пока действует заклинание. Стена блокирует линию обзора, но не блокирует движение. Находясь внутри стены, существо считается ослеплённым, и тратит 3 фута перемещения за каждый пройденный фут."],"higher":[],"custom":true},{"id":"cmqwlpsc0x6q","name":"Подводное дыхание","level":3,"classes":["artificer","druid","ranger","sorcerer","wizard"],"time":"1 действие","range":"6","dur":"24 часа","conc":false,"rit":true,"desc":["Это заклинание дарует на время своего действия до десяти согласным существам, видимым вами в пределах дистанции, способность дышать под водой. Эти существа сохраняют и обычное дыхание."],"higher":[],"custom":true},{"id":"cmqwlpz5d7de","name":"Подсматривание","level":3,"classes":["bard","cleric","sorcerer","wizard"],"time":"10 минут","range":"1 миля","dur":"До 10 минут","conc":true,"rit":false,"desc":["Вы создаёте невидимый сенсор в пределах дистанции в известном вам месте (месте, которое вы уже видели или посещали) или очевидном месте, незнакомом вам (например, за дверью, за углом, или в роще деревьев). Сенсор остаётся на месте, и его нельзя атаковать, а также с ним нельзя как-то взаимодействовать.","Накладывая заклинание, вы выбираете зрение или слух. Вы можете использовать выбранное чувство через сенсор, как если бы вы находились на его месте. Вы можете действием переключаться между зрением и слухом.","Существо, способное увидеть сенсор (например, находящееся под заклинанием видение невидимого [see invisibility] или с истинным зрением), видит светящийся нематериальный шарик размером с ваш кулак."],"higher":[],"custom":true},{"id":"cmqwlq7tg9xn","name":"Покров духа","level":3,"classes":["cleric","paladin","warlock","wizard"],"time":"1 бонусное действие","range":"На себя","dur":"До 1 минуты","conc":true,"rit":false,"desc":["Вы взываете к духам умерших, и они окружают вас на протяжении длительности заклинания. Духи неосязаемы и неуязвимы.","До окончания действия заклинания любая ваша атака наносит дополнительно 1d8 урона, если вы атакуете существо в пределах 2 клеток от вас. Вы выбираете вид урона в момент накладывания этого заклинания из следующих вариантов: излучение, некротическая энергия или холод. Любое существо, получившее этот урон, не сможет восстанавливать хиты до начала вашего следующего хода.","Также скорость каждого видимого вами существа по вашему выбору, начинающего ход в пределах 2 клеток от вас, будет уменьшена на 2 клетки до начала вашего следующего хода."],"higher":["Когда вы накладываете это заклинание, используя ячейку 4-го уровня или выше, дополнительный урон увеличивается на 1d8 за каждые два уровня ячейки выше третьего."],"custom":true},{"id":"cmqwlqcim95z","name":"Полёт","level":3,"classes":["artificer","sorcerer","warlock","wizard"],"time":"1 действие","range":"Касание","dur":"До 10 минут","conc":true,"rit":false,"desc":["Вы касаетесь согласного существа. Пока заклинание активно, цель получает скорость полёта 12 клеток. Когда заклинание оканчивается, цель падает, если всё ещё находится в полёте и ничем не может остановить падение."],"higher":["Если вы накладываете это заклинание, используя ячейку 4-го уровня или выше, вы можете сделать целью одно дополнительное существо за каждый уровень ячейки выше 3-го."],"custom":true},{"id":"cmqwlqh2t6jj","name":"Послание","level":3,"classes":["bard","cleric","wizard"],"time":"1 действие","range":"Неограниченная","dur":"1 раунд","conc":false,"rit":false,"desc":["Вы отправляете короткое послание длиной не больше 25 слов существу, с которым вы знакомы. Это существо слышит послание в своём сознании, распознает вас в качестве отправителя, если оно вас знает, и может тут же ответить аналогичным образом. Это заклинание позволяет существам с Интеллектом как минимум 1 понимать смысл вашего послания.","Вы можете передать послание на любое расстояние, и даже на другие планы существования, но если цель находится на ином плане, существует 5-процентный шанс, что послание не будет доставлено."],"higher":[],"custom":true},{"id":"cmqwlqm1bi7p","name":"Призрачный скакун","level":3,"classes":["wizard"],"time":"1 минута","range":"6","dur":"1 час","conc":false,"rit":true,"desc":["На полу в свободном пространстве на ваш выбор в пределах дистанции появляется Большое полуреальное похожее на лошадь существо. Вы сами определяете его внешность, но у него есть седло, удила и уздечка. Все снаряжение, созданное этим заклинанием, исчезает в клубах дыма, если его отнести на 2 клетки от скакуна.","Пока заклинание активно, вы или выбранное вами существо можете ехать на скакуне верхом. Используется статистика ездовой лошади [riding horse], за исключением того, что скорость существа — 20 клеток, и оно может проскакать 10 миль за час или 13 миль в быстром темпе. Когда заклинание оканчивается, скакун медленно исчезает, давая ездоку 1 минуту на спешивание. Заклинание оканчивается, если вы окончите его действием или если скакун получит какой-либо урон."],"higher":[],"custom":true},{"id":"cmqwlqqk2v44","name":"Призыв духа нежити","level":3,"classes":["warlock","wizard"],"time":"1 действие","range":"18","dur":"До 1 часа","conc":true,"rit":false,"desc":["Вы призываете духа нежити [undead spirit]. Он проявляется в свободном пространстве, которое вы можете видеть в пределах дистанции. Воплощённая форма духа использует блок статистики духа нежити [undead spirit]. Когда вы накладываете заклинание, выберите форму духа: призрачный, гнилой или скелетный. Дух принимает выбранную форму Нежити, которая определяет особенности, описанные в блоке статистики. Существо исчезает, когда его хиты опускаются до 0 или когда заклинание заканчивается.","Это существо дружелюбно к вам и вашим товарищам. В бою существо получает вашу инициативу и ходит сразу же после вас. Оно подчиняется вашим вербальным командам (никаких действий от вас не требуется). Если вы ничего не приказываете, то оно применяет действие Уклонение и перемещается, избегая опасностей."],"higher":["Когда вы накладываете это заклинание, используя ячейку 4-го уровня или выше, характеристики призываемого существа изменяются в соответствии с описанием в блоке статистики."],"custom":true},{"id":"cmqwlqvcsrzh","name":"Призыв духа тени","level":3,"classes":["warlock","wizard"],"time":"1 действие","range":"18","dur":"До 1 часа","conc":true,"rit":false,"desc":["Вы призываете духа тени [shadow spirit]. Он проявляется в свободном пространстве, которое вы можете видеть в пределах дистанции. Воплощённая форма духа использует блок статистики духа тени [shadow spirit]. Когда вы накладываете заклинание, выберите эмоцию: ярость, уныние или страх. Существо принимает форму бесформенного двуногого с отчётливыми проявлениями выбранной эмоции, которая определяет особенности существа, описанные в блоке статистики. Существо исчезает, когда его хиты опускаются до 0 или когда заклинание заканчивается.","Это существо дружелюбно к вам и вашим товарищам. В бою существо получает вашу инициативу и ходит сразу же после вас. Оно подчиняется вашим вербальным командам (никаких действий от вас не требуется). Если вы ничего не приказываете, то оно применяет действие Уклонение и перемещается, избегая опасностей."],"higher":["Когда вы накладываете это заклинание, используя ячейку 4-го уровня или выше, характеристики призываемого существа изменяются в соответствии с описанием в блоке статистики."],"custom":true},{"id":"cmqwlqzrx31z","name":"Разговор с мёртвыми","level":3,"classes":["bard","cleric","wizard"],"time":"1 действие","range":"2","dur":"10 минут","conc":false,"rit":false,"desc":["Вы даёте подобие жизни и сознания трупу, выбранному в пределах дистанции, позволяя ему отвечать на задаваемые вами вопросы. У трупа должен быть рот, и он не может быть Нежитью. Заклинание проваливается, если этот труп был целью этого заклинания в течение последних 10 дней.","Пока заклинание не окончится, вы можете задать трупу пять вопросов. Труп знает только то, что знал при жизни, включая известные языки. Ответы обычно короткие, загадочные или невыразительные, и труп не обязан давать правдивый ответ, если вы враждебны к нему или он распознает в вас врага. Это заклинание не возвращает душу в тело существа, а только оживляет дух. Таким образом, труп не может узнавать новую информацию, не осознаёт того, что происходило после его смерти, и не может размышлять о будущих событиях."],"higher":[],"custom":true},{"id":"cmqwlr5c60s6","name":"Разговор с растениями","level":3,"classes":["bard","druid","ranger"],"time":"1 действие","range":"На себя (30-футовый радиус)","dur":"10 минут","conc":false,"rit":false,"desc":["Вы наделяете растения в пределах 6 клеток от себя ограниченным сознанием и подобием жизни, позволяя им общаться с вами и выполнять ваши простые инструкции. Вы можете спрашивать их о событиях, происходивших в области заклинания за последний день, получая информацию о проходивших существах, погоде и прочих обстоятельствах.","Вы можете также превратить на время действия заклинания труднопроходимую местность, вызванную растениями (кусты и заросли), в обычную местность. Вы можете превратить на время действия заклинания обычную местность в труднопроходимую, если там есть растения, например, заставляя ветки и лианы хватать преследователей.","На усмотрение Мастера, растения могут выполнять и другие задачи. Это заклинание не позволяет растениям выкапываться и перемещаться, но они могут свободно двигать ветками, ростками и стеблями.","Если в области заклинания есть растительное существо, вы можете общаться с ним, как если бы у вас был общий язык, но вы не получаете магическую способность влиять на него.","Это заклинание может заставить растения, созданные заклинанием опутывание [entangle], отпустить существо."],"higher":[],"custom":true},{"id":"cmqwlr9ra9kb","name":"Силовая волна","level":3,"classes":[],"time":"1 действие","range":"На себя (30-футовый конус)","dur":"Мгновенная","conc":false,"rit":false,"desc":["Вы создаёте сильное давление, выпускаемое в форме 6-клеточного конуса, и определяете направление волны. Каждое существо в пределах конуса должно совершить спасбросок Телосложения, получая 6d6 урона силовым полем при провале или половину этого урона при успехе. Все существа, провалившие спасбросок, в зависимости от вашего решения либо притягиваются к вам, либо отталкиваются от вас на 3 клетки. Кроме того, все незакреплённые предметы в соответствующей области перемещаются на 3 клетки."],"higher":["Если вы накладываете это заклинание, используя ячейку 4-го уровня или выше, урон увеличивается на 1d6, а расстояние толчка — на 1 клетка за каждый уровень ячейки выше третьего."],"custom":true},{"id":"cmqwlrefie7l","name":"Слияние с камнем","level":3,"classes":["cleric","druid","ranger"],"time":"1 действие","range":"Касание","dur":"8 часов","conc":false,"rit":true,"desc":["Вы входите в каменный предмет или поверхность, достаточно большую, чтобы там поместилось ваше тело, и сливаетесь на время действия заклинания вместе со всем снаряжением с камнем. Используя перемещение, вы входите в камень в точке, которой можете коснуться. Ваше присутствие абсолютно незаметно, и без помощи магии обнаружить вас невозможно.","Слившись с камнем, вы не можете видеть, что происходит вокруг, и все проверки Мудрости (Восприятие), совершённые, чтобы слушать, совершаются с помехой. Вы осознаёте ход времени и можете в камне накладывать заклинания на себя. Вы можете перемещением выйти из камня в том месте, где вы входили, что оканчивает это заклинание. Иначе вы перемещаться не можете.","Небольшие физические повреждения камня не причиняют вам вреда, но частичное разрушение или изменение его формы (так, что вы больше внутри не поместитесь) изгоняют вас и причиняют дробящий урон 6d6. Полное разрушение камня (или превращение его в другую субстанцию) изгоняет вас и причиняет дробящий урон 50. Если вас изгоняют, вы падаете ничком в свободном пространстве, ближайшем к месту, в котором вы входили в камень."],"higher":[],"custom":true},{"id":"cmqwlrjggbki","name":"Снятие проклятия","level":3,"classes":["cleric","paladin","warlock","wizard"],"time":"1 действие","range":"Касание","dur":"Мгновенная","conc":false,"rit":false,"desc":["После вашего касания все проклятия, действующие на одно существо или предмет, оканчиваются. Если предмет был проклятым магическим предметом, проклятие остаётся, но заклинание разрывает настройку владельца на него, поэтому предмет можно снять или выбросить."],"higher":[],"custom":true},{"id":"cmqwlrofw3k8","name":"Сотворение пищи и воды","level":3,"classes":["artificer","cleric","paladin"],"time":"1 действие","range":"6","dur":"Мгновенная","conc":false,"rit":false,"desc":["Вы создаёте 45 фунтов еды и 30 галлонов (100 литров) воды на земле или в контейнере в пределах дистанции, которых достаточно для питания пятнадцати Гуманоидов или пятерых скакунов на 24 часа. Еда безвкусная, но сытная, и портится, если её не съесть за 24 часа. Вода чистая, и она не портится."],"higher":[],"custom":true},{"id":"cmqwlrtdtq41","name":"Ужас","level":3,"classes":["bard","sorcerer","warlock","wizard"],"time":"1 действие","range":"На себя (30-футовый конус)","dur":"До 1 минуты","conc":true,"rit":false,"desc":["Вы проецируете призрачное изображение худших кошмаров других существ. Все существа в 6-клеточном конусе должны преуспеть в спасброске Мудрости, иначе они бросают всё, что держат в руках, и становятся испуганными на время действия заклинания.","Будучи испуганным этим заклинанием, существо должно каждый свой ход совершать действие Рывок, и перемещаться прочь от вас по самому безопасному маршруту, пока у неё есть, куда перемещаться. Если существо оканчивает ход в месте, откуда у него нет линии обзора до вас, оно может совершить спасбросок Мудрости. При успехе заклинание перестает действовать на этом существе."],"higher":[],"custom":true},{"id":"cmqwlrxshdiu","name":"Хождение по воде","level":3,"classes":["artificer","cleric","druid","ranger","sorcerer"],"time":"1 действие","range":"6","dur":"1 час","conc":false,"rit":true,"desc":["Это заклинание дарует способность перемещаться по жидкой поверхности — такой как вода, кислота, грязь, снег, зыбучий песок или лава — как если бы это была безвредная твёрдая поверхность (существа, идущие по жидкой лаве, всё равно получают урон от жара). До десяти согласных существ, видимых вами в пределах дистанции, получают эту способность на время действия заклинания.","Если вы делаете целью существо, погружённое в жидкость, заклинание поднимает его на поверхность со скоростью 12 клеток в раунд."],"higher":[],"custom":true},{"id":"cmqwls2apz8s","name":"Языки","level":3,"classes":["bard","cleric","sorcerer","warlock","wizard"],"time":"1 действие","range":"Касание","dur":"1 час","conc":false,"rit":false,"desc":["Это заклинание дарует существу, которого вы касаетесь, способность понимать все языки, которые оно слышит. Более того, когда цель говорит, все существа, знающие хотя бы один язык, и слышащие цель, понимают, что она сказала."],"higher":[],"custom":true},{"id":"cmqwltatnuzy","name":"Аура жизни","level":4,"classes":["cleric","paladin"],"time":"1 действие","range":"На себя (30-футовый радиус)","dur":"До 10 минут","conc":true,"rit":false,"desc":["От вас исходит защищающая жизнь аура с радиусом 6 клеток. Пока заклинание активно, аура перемещается вместе с вами, оставаясь с центром на вас. Все невраждебные существа в ауре (включая вас) обладают сопротивлением урону некротической энергией, и максимум их хитов не может уменьшаться. Кроме того, когда невраждебное живое существо с 0 хитов начинает ход в этой ауре, оно восстанавливает 1 хит."],"higher":[],"custom":true},{"id":"cmqwltfc4hml","name":"Болезненное сияние","level":4,"classes":["sorcerer","warlock","wizard"],"time":"1 действие","range":"24","dur":"До 10 минут","conc":true,"rit":false,"desc":["Из точки, выбранной вами в пределах дистанции, распространяется сфера тусклого зеленоватого света с радиусом 6 клеток. Свет огибает углы и существует до тех пор, пока заклинание не закончится.","Если существо впервые за раунд входит в область заклинания или начинает в ней свой ход, оно должно преуспеть в спасброске Телосложения, иначе получит 4d10 урона излучением, одну степень истощения и само начинает испускать тусклый зеленоватый свет в радиусе 1 клетки. Этот свет делает невозможным получение преимуществ от невидимости. Свет и любые степени истощения, вызванные этим заклинанием, проходят, когда заклинание оканчивается."],"higher":[],"custom":true},{"id":"cmqwltjtmah2","name":"Верный пёс Морденкайнена","level":4,"classes":["artificer","wizard"],"time":"1 действие","range":"6","dur":"8 часов","conc":false,"rit":false,"desc":["Вы создаёте призрачного сторожевого пса в свободном пространстве, видимом в пределах дистанции, где он и остаётся на время длительности заклинания, пока вы не отпустите его действием или не отойдёте от него более чем на 20 клеток.","Пёс невидим для всех существ кроме вас, и ему нельзя причинить вред. Если в пределах 6 клеток от него оказывается существо с размером Маленькое или больше, не произнося при этом пароль, указанный вами при накладывании этого заклинания, пёс начинает громко лаять. Пёс видит невидимых существ, и его зрение простирается на Эфирный план. Он игнорирует иллюзии.","В начале каждого вашего хода пёс пытается укусить одно враждебное вам существо в пределах 1 клетки от себя. Бонус атаки пса равен вашему модификатору базовой характеристики + ваш бонус мастерства. При попадании он причиняет 4d8 колющего урона."],"higher":[],"custom":true},{"id":"cmqwltqrsu09","name":"Власть над водами","level":4,"classes":["cleric","druid","wizard"],"time":"1 действие","range":"60","dur":"До 10 минут","conc":true,"rit":false,"desc":["Пока это заклинание активно, вы контролируете свободно текущую или стоячую воду в кубе с длиной ребра 20 клеток. Вы можете выбрать один эффект из перечисленных ниже. Вы можете в свой ход действием повторить тот же эффект или выбрать другой.","Водоворот. Для этого эффекта требуется объём воды в квадрате с длиной стороны 10 клеток и глубиной 5 клеток. В центре области вы формируете водоворот. Водоворот создает воронку шириной 1 клетка в основании, 10 клеток в верхней части, и высотой 5 клеток. Все существа и предметы, находящиеся в воде в пределах 5 клеток от водоворота, подтягиваются к нему на 2 клетки. Существа могут плыть прочь от водоворота, совершая проверку Силы (Атлетика) против Сл ваших заклинаний.","Если существо впервые за раунд входит в пространство воронки или начинает в ней ход, оно должно совершить спасбросок Силы. При провале существо получает дробящий урон 2d8 и становится пойманным воронкой, пока заклинание активно. В случае успеха существо получает половину урона, и не становится пойманным воронкой. Пойманное воронкой существо может действием пытаться уплыть от водоворота, как описано выше, но проверка Силы (Атлетика) совершается с помехой.","В каждом ходу в первый раз, когда предмет оказывается в области воронки, он получает дробящий урон 2d8; этот же урон причиняется за каждый раунд, проведенный предметом в воронке.","Наводнение. Вы увеличиваете уровень стоячей воды в области на высоту до 4 клетки. Если в область попадает берег, вода выливается на землю.","Если вы выбрали область посреди другого водного пространства, то вы вместо этого создаете волну высотой 4 клетки, проходящую с одного края области до другого, где она и опадает. Все транспортные средства Огромного размера и меньше по ходу волны уносятся вместе с волной на противоположную сторону. Все транспортные средства Огромного размера и меньше, ударенные волной, получают 25 процентный шанс опрокинуться.","Уровень воды остается повышенным, пока заклинание не окончится или вы не выберете другой эффект. Если этот эффект создал волну, волна будет повторяться в начале вашего следующего хода, пока длится эффект «наводнение».","Перенаправление потока. Вы заставляете текущую воду в области перемещаться в выбранном вами направлении, даже если воде придется течь через препятствия, вверх по стенам или в другом неугодном ей направлении. В области заклинания вода течет так, как укажете вы, но оказавшись за пределами зоны заклинания, она возвращается к естественному течению. Вода продолжает течь в указанном вами направлении, пока заклинание активно или пока вы не выберете другой эффект.","Разделение воды. Вы заставляете воду в области разойтись в стороны, формируя проход. Проход простирается в области заклинания, а разделенные воды формируют стены с обеих сторон. Проход существует, пока заклинание активно, или пока вы не выберете другой эффект. После этого вода в течение раунда медленно заполняет проход, восстанавливаясь до нормального уровня."],"higher":[]
