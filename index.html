сстанавливая 70 хитов. Это заклинание также отменяет слепоту, глухоту и все болезни, действующие на цель. Это заклинание не оказывает эффекта на Конструктов и Нежить."],"higher":["Если вы накладываете это заклинание, используя ячейку 7-го уровня или выше, количество восстанавливаемых хитов увеличивается на 10 за каждый уровень ячейки выше шестого."],"custom":true},{"id":"cmqx98vwr6mo","name":"Поражение","level":6,"classes":["cleric"],"time":"1 действие","range":"12","dur":"Мгновенная","conc":false,"rit":false,"desc":["Вы насылаете смертельную болезнь на существо, которое видите в пределах дистанции. Цель должна совершить спасбросок Телосложения. При провале она получает 14d6 урона некротической энергией или половину этого урона при успехе. Этот урон не может опустить хиты цели ниже 1. Если цель проваливает спасбросок, максимум её хитов уменьшается, на 1 час, на количество, равное полученному урону некротической энергией. Все эффекты, лечащие болезнь, позволяют досрочно вернуть максимум хитов."],"higher":[],"custom":true},{"id":"cmqx9927uz0e","name":"Потусторонний облик Таши","level":6,"classes":["sorcerer","warlock","wizard"],"time":"1 бонусное действие","range":"На себя","dur":"До 1 минуты","conc":true,"rit":false,"desc":["Накладывая заклинание, вы обращаетесь к магии Нижних или Верхних планов (по вашему выбору), чтобы преобразовать себя. Вы получаете следующие преимущества до тех пор, пока заклинание не окончится:","Вы имеете иммунитет к урону огнём и ядом (Нижние планы) или к урону излучением и некротической энергией (Верхние планы).","Вы имеете иммунитет к состоянию «отравленный» (Нижние планы) или к состоянию «очарованный» (Верхние планы).","За вашей спиной появляются призрачные крылья, дарующие вам скорость полёта 8 клеток.","Вы получаете бонус +2 к КД.","Все ваши атаки оружием считаются магическими, и, когда вы совершаете атаку оружием, вы можете использовать свой модификатор базовой характеристики вместо Силы или Ловкости для бросков атаки и урона.","Действием Атака вы можете совершить две атаки вместо одной. Вы не получаете это преимущество, если у вас уже есть подобное умение (например «Дополнительная атака»), которое позволяет атаковать более одного раза за действие Атака."],"higher":[],"custom":true},{"id":"cmqx997b4rpz","name":"Предосторожность","level":6,"classes":["wizard"],"time":"10 минут","range":"На себя","dur":"10 дней","conc":false,"rit":false,"desc":["Выберите заклинание 5-го уровня или ниже, которое вы можете наложить, у которого время накладывания «1 действие», и которое может нацеливаться на вас. Вы накладываете это заклинание частью накладывания предосторожности, тратя ячейки заклинаний для обоих, но эффект заготовленного заклинания не проявляется. Этот эффект вступает в силу, когда произойдёт определённое условие. Вы описываете это условие когда накладываете оба заклинания. Например, предосторожность, наложенная в паре с подводным дыханием [water breathing], может сделать так, что подводное дыхание [water breathing] начнёт действовать, когда вы окажетесь в воде или подобной жидкости.","Заготовленное заклинание вступает в действие мгновенно после того как условие впервые будет выполнено, хотите вы того или нет, и после этого предосторожность оканчивается.","Заготовленное заклинание оказывает эффект только на вас, даже если в обычных обстоятельствах может нацеливаться на других. Вы можете использовать только одно заклинание предосторожность одновременно. Если вы накладываете это заклинание ещё раз, эффект предыдущей предосторожности оканчивается. Кроме того, предосторожность оканчивается, если материальный компонент перестанет быть в вашем распоряжении."],"higher":[],"custom":true},{"id":"cmqx99btoig8","name":"Призыв духа исчадия","level":6,"classes":["warlock","wizard"],"time":"1 действие","range":"18","dur":"До 1 часа","conc":true,"rit":false,"desc":["Вы призываете духа исчадия [fiendish spirit]. Он проявляется в свободном пространстве, которое вы можете видеть в пределах дистанции. Воплощённая форма духа использует блок статистики духа исчадия [fiendish spirit]. Когда вы накладываете заклинание, выберите тип духа: демон, дьявол или юголот. Существо принимает форму выбранного Исчадия и имеет соответствующие особенности, описанные в блоке статистики. Существо исчезает, когда его хиты опускаются до 0 или когда заклинание заканчивается.","Это существо дружелюбно к вам и вашим товарищам. В бою существо получает вашу инициативу, и ходит сразу же после вас. Оно подчиняется вашим вербальным командам (никаких действий от вас не требуется). Если вы ничего не приказываете, то оно применяет действие Уклонение и перемещается, избегая опасностей."],"higher":["Когда вы накладываете это заклинание, используя ячейку 7-го уровня или выше, характеристики призываемого существа изменяются в соответствии с описанием в блоке статистики."],"custom":true},{"id":"cmqx99gxfbe7","name":"Призыв феи","level":6,"classes":["druid","warlock"],"time":"1 минута","range":"18","dur":"До 1 часа","conc":true,"rit":false,"desc":["Вы призываете фейское существо с показателем опасности 6 или меньше, или фейского духа, который принимает облик Зверя с показателем опасности 6 или меньше. Существо появляется в свободном месте, которое вы видите в пределах дистанции. Оно исчезает, когда его хиты опускаются до 0, или когда заклинание оканчивается.","Фейское существо дружественно к вам и вашим спутникам, пока заклинание активно. Совершите проверку инициативы за существо, и оно будет совершать свои собственные ходы. Оно подчиняется вашим вербальным командам (действие не требуется), если они не противоречат его мировоззрению. Если вы не отдаёте команду, оно защищается от враждебных существ, но в иных случаях действий не совершает.","Если ваша концентрация нарушена, существо не исчезает. Вместо этого вы теряете над ним контроль, и оно становится враждебным к вам и вашим спутникам, и может напасть. Неуправляемое существо не может быть отпущено вами, но оно исчезает через 1 час после того, как оно было призвано.","Статистика фейского существа есть у Мастера."],"higher":["Если вы накладываете это заклинание, используя ячейку 7-го уровня или выше, показатель опасности увеличивается на 1 за каждый уровень ячейки выше шестого."],"custom":true},{"id":"cmqx99lhendz","name":"Путешествие через растения","level":6,"classes":["druid"],"time":"1 действие","range":"2","dur":"1 раунд","conc":false,"rit":false,"desc":["Это заклинание создаёт магическую связь между неоживлённым растением с размером не меньше Большого, находящимся в пределах дистанции, и другим растением, находящимся на любом расстоянии на том же плане существования. Вы должны до этого хотя бы раз видеть или касаться растения, служащего местом назначения. Пока заклинание активно, все существа могут входить в целевое растение и выходить из растения, служащего местом назначения, использовав всего 1 клетка перемещения."],"higher":[],"custom":true},{"id":"cmqx99qdiimc","name":"Разящее око","level":6,"classes":["bard","sorcerer","warlock","wizard"],"time":"1 действие","range":"На себя","dur":"До 1 минуты","conc":true,"rit":false,"desc":["Пока заклинание активно, ваши глаза становятся абсолютно чёрными, наполнившись жуткой энергией. Одно существо на ваш выбор в пределах 12 клеток от вас, которое вы видите, должно преуспеть в спасброске Мудрости, иначе на время длительности заклинания оно попадает под действие одного из выбранных вами эффектов. В каждый свой ход, пока заклинание активно, вы можете действием нацелиться на другое существо, если только оно не совершило успешный спасбросок от этого разящего ока.","Паника. Цель испугана вами. В каждый свой ход испуганное существо должно совершать действие Рывок и перемещаться прочь от вас по самому безопасному и короткому из возможных маршруту, если ей есть куда перемещаться. Если цель окажется на расстоянии как минимум 12 клеток от вас, в месте, в котором ей вас не видно, этот эффект заканчивается.","Слабость. Цель совершает с помехой броски атаки и проверки характеристик. В конце каждого своего хода она сможет совершить ещё один спасбросок Мудрости. В случае успеха эффект заканчивается.","Сон. Цель теряет сознание. Она просыпается, если получает урон или другое существо действием потрясёт его, чтобы разбудить."],"higher":[],"custom":true},{"id":"cmqx99yiamiw","name":"Раскидывание","level":6,"classes":["sorcerer","warlock","wizard"],"time":"1 действие","range":"6","dur":"Мгновенная","conc":false,"rit":false,"desc":["Воздух начинает дрожать вокруг пяти существ по вашему выбору, которых вы можете видеть в пределах дистанции. Несогласное существо должно преуспеть в спасброске Мудрости, чтобы противостоять этому заклинанию. Вы телепортируете каждую затронутую цель в свободное пространство, которое вы можете видеть в пределах 24 клеток от вас. Это пространство должно быть на земле или на полу."],"higher":[],"custom":true},{"id":"cmqx9a3s12nd","name":"Распад","level":6,"classes":["sorcerer","wizard"],"time":"1 действие","range":"12","dur":"Мгновенная","conc":false,"rit":false,"desc":["Тонкий зелёный луч вылетает из вашего указательного пальца в цель, которую вы видите в пределах дистанции. Цель может быть существом, предметом или творением из магической силы, например, стеной, созданной заклинанием силовая стена [wall of force].","Существо, ставшее целью этого заклинания, должно преуспеть в спасброске Ловкости, иначе получит 10d6 + 40 урона силовым полем. Если после получения этого урона у цели остаётся 0 хитов, то она распадается.","Распавшееся существо, а также всё, что оно несло и носило, кроме магических предметов, превращается в кучку мелкого серого порошка. Такое существо можно вернуть к жизни только посредством заклинания истинное воскрешение [true resurrection] или исполнение желаний [wish].","Это заклинание вызывает автоматический распад немагических предметов и творений из магической силы с размером не больше Большого. Если цель — предмет или творение из магической силы с размером Огромное или больше, заклинание вызывает распад его части в кубе с длиной ребра 2 клетки. На магические предметы это заклинание не действует."],"higher":["Если вы накладываете это заклинание, используя ячейку 7-го уровня или выше, урон увеличивается на 3d6 за каждый уровень ячейки выше шестого."],"custom":true},{"id":"cmqx9al40n44","name":"Роща друида","level":6,"classes":["druid"],"time":"10 минут","range":"Касание","dur":"24 часа","conc":false,"rit":false,"desc":["Вы призываете духов природы для защиты области на открытом воздухе или под землёй. Эта область может быть кубом с длиной ребра от 30 до 18 клеток. Здания и другие сооружения исключаются из этой области. Если вы накладываете это заклинание в одном и том же месте каждый день в течение года, заклинание длится до тех пор, пока не будет рассеяно.","Заклинание создает следующие эффекты в пределах области. Когда вы накладываете это заклинание, вы можете указать существ как друзей, которые будут невосприимчивы к эффектам заклинания. Вы также можете указать кодовое слово, которое, при произношении, делает говорящего невосприимчивым к этим эффектам.","Вся защищённая область источает магию. Рассеивание магии [Dispel magic], наложенное на область, при успехе удаляет только один из нижеследующих эффектов, а не всю область. Заклинатель выбирает, какой эффект окончить. Только когда все эффекты окончены, заклинание рассеивается.","Непроглядный туман. Вы можете заполнить любое количество квадратов с длиной ребра 1 клетка на земле густым туманом, делая их сильно заслонённой областью. Туман достигает 2 клетки в высоту. Кроме того, каждый фут движения через туман стоит 2 дополнительных фута. Для существа, невосприимчивого к данному эффекту, туман ничего не скрывает и выглядит как лёгкая дымка с песчинками зеленого света, плавающими в воздухе.","Цепкий подлесок. Вы можете заполнить любое количество квадратов с длиной ребра 1 клетка на земле, которые не заполнены туманом, цепкими сорняками и лозой, как если бы они были созданы заклинанием опутывание [entangle]. Для существа, невосприимчивого к данному эффекту, сорняки и лоза ощущаются мягкими и меняют свою форму, чтобы служить временными сидениями или постелями.","Хранители рощи. Вы можете оживить до четырех деревьев в этой области, заставляя их выкорчевать себя из земли. Эти деревья имеют блок статистики пробуждённого дерева [awakened tree], за исключением того, что они не могут говорить, и их кора покрыта друидическими символами. Если любое существо, не иммунное к этому эффекту, заходит в защищаемую область, хранители рощи сражаются, пока не прогонят или не убьют вторженцев. Хранители рощи также подчиняются устным командам (действие не требуется), которые вы произносите в этой области. Если вы не даёте им команд, и в области нет незваных гостей, хранители рощи бездействуют. Хранители рощи не могут покинуть охраняемую область. Когда заклинание оканчивается, магия, оживляющая их, исчезает, и деревья снова укореняются, если это возможно.","Дополнительный эффект от заклинания. Вы можете выбрать один из следующих магических эффектов в защищенной области:","- Постоянный порыв ветра [gust of wind] в двух местах по вашему выбору","- Шипы [spike growth] в одном месте по вашему выбору","- Стена ветров [wind wall] в двух местах по вашему выбору","Для существа, невосприимчивого к данному эффекту, ветры – это приятный легкий бриз, а шипы безвредны."],"higher":[],"custom":true},{"id":"cmqx9aqapp1c","name":"Слово возврата","level":6,"classes":["cleric"],"time":"1 действие","range":"1","dur":"Мгновенная","conc":false,"rit":false,"desc":["Вы и до пяти согласных существ в пределах 1 клетки от вас мгновенно телепортируетесь в заранее подготовленное святилище. Вы и телепортирующиеся с вами существа появляетесь в свободном пространстве, ближайшем к месту, указанному вами при подготовке святилища (смотрите ниже). Если вы накладываете это заклинание, не подготовив святилище, заклинание не оказывает никакого эффекта.","Вы должны подготовить святилище, наложив это же заклинание в таком месте как храм, посвящённом или сильно связанном с вашим божеством. Если вы попытаетесь наложить это заклинание в месте, не связанном с вашим божеством, заклинание не окажет никакого эффекта."],"higher":[],"custom":true},{"id":"cmqx9ausbsr5","name":"Солнечный луч","level":6,"classes":["cleric","druid","sorcerer","wizard"],"time":"1 действие","range":"На себя (60-футовая линия)","dur":"До 1 минуты","conc":true,"rit":false,"desc":["Луч ярчайшего света исходит из вашей ладони линией шириной 1 клетка и длиной 12 клеток. Все существа в этой линии должны совершить спасбросок Телосложения. При провале существо получает 6d8 урона излучением и становится ослеплённым до вашего следующего хода. При успехе оно получает половину урона и не ослепляется. Нежить и Слизи совершают этот спасбросок с помехой.","Пока заклинание активно, вы можете действием создавать новые линии света.","Пока заклинание активно, в вашей руке светится яркая искра. Она испускает яркий свет в пределах 6 клеток и тусклый свет в пределах ещё 6 клеток. Это свет идентичен солнечному."],"higher":[],"custom":true},{"id":"cmqx9azzhpu0","name":"Сотворение гомункула","level":6,"classes":["wizard"],"time":"1 час","range":"Касание","dur":"Мгновенная","conc":false,"rit":false,"desc":["Произнося замысловатое заклинание, вы режете себя кинжалом, украшенным драгоценными камнями, и получаете 2d4 колющего урона, который никак не может быть уменьшен. Затем вы капаете свою кровь на другие компоненты заклинания и прикасаетесь к ним, превращая их в особого Конструкта, называемого гомункулом [homunculus].","Это ваш преданный спутник, и он умирает, если умираете вы. Каждый раз, когда вы заканчиваете продолжительный отдых, вы можете потратить до половины своих Костей Хитов, если гомункул находится на том же плане существования, что и вы. Когда вы это делаете, бросьте каждую Кость Хитов и добавьте к ней свой модификатор Телосложения.","Максимум ваших хитов понижается на получившуюся сумму, а максимум хитов гомункула вместе с текущим количеством хитов увеличивается на это же значение. Этот процесс не может понизить ваши хиты ниже 1, и этот обмен хитами между вами и гомункулом заканчивается после того как вы завершите следующий продолжительный отдых. До этого момента понижение максимума ваших хитов не может быть убрано никаким другим образом, кроме смерти гомункула.","Вы можете иметь только одного гомункула в каждый момент времени. Если вы накладываете это заклинание, пока ваш гомункул жив, заклинание проваливается."],"higher":[],"custom":true},{"id":"cmqx9b5r2mdp","name":"Сотворение нежити","level":6,"classes":["cleric","warlock","wizard"],"time":"1 минута","range":"2","dur":"Мгновенная","conc":false,"rit":false,"desc":["Вы можете накладывать это заклинание только ночью. Выберите до трёх трупов Гуманоидов Среднего или Маленького размера в пределах дистанции. Все трупы становятся упырями под вашим контролем (параметры этих существ есть у Мастера).","В каждом своём ходу вы можете бонусным действием мысленно приказать любому существу, оживлённому этим заклинанием, если оно находится в пределах 24 клеток от вас (если вы контролируете сразу несколько существ, можете отдать одну и ту же команду сразу нескольким из них). Вы решаете, какое действие это существо совершит, и куда оно переместится в свой следующий ход, или же вы можете отдать общий приказ, например, охранять конкретную комнату или коридор. Если вы не отдадите команду, существо будет всего лишь защищаться от врагов. Получив приказ, существо продолжает его выполнять, пока задача не будет выполнена.","Существо находится под вашим контролем 24 часа, после чего перестаёт слушаться команд. Для поддержания контроля ещё на 24 часа вы должны активировать это заклинание на него ещё раз до окончания 24-часового периода. Такое использование заклинания только поддерживает контроль над уже созданными существами, количество которых не может быть больше трёх, и не оживляет новых."],"higher":["Если вы накладываете это заклинание, используя ячейку 7-го уровня, вы оживляете или продлеваете контроль над четырьмя упырями. Если вы накладываете это заклинание, используя ячейку 8-го уровня, вы оживляете или продлеваете контроль над пятью упырями или двумя вурдалаками или умертвиями. Если вы накладываете это заклинание, используя ячейку 9-го уровня, вы оживляете или продлеваете контроль над шестью упырями, тремя вурдалаками или умертвиями, или двумя мумиями."],"custom":true},{"id":"cmqx9bamgxov","name":"Стена клинков","level":6,"classes":["cleric"],"time":"1 действие","range":"18","dur":"До 10 минут","conc":true,"rit":false,"desc":["Вы создаёте вертикальную стену из крутящихся бритвенно-острых клинков из магической энергии. Стена появляется в пределах дистанции и существует столько, сколько активно это заклинание. Вы можете создать прямую стену длиной 20 клеток, высотой 4 клетки и толщиной 1 клетка, или закольцованную стену диаметром 12 клеток, высотой 4 клетки и толщиной 1 клетка. Стена предоставляет существам, находящимся за ней, укрытие на три четверти, и её пространство является труднопроходимой местностью.","Когда существо впервые за ход входит в пространство стены или начинает там ход, оно должно совершить спасбросок Ловкости. При провале существо получает рубящий урон 6d10. При успешном спасброске существо получает половину урона."],"higher":[],"custom":true},{"id":"cmqx9ca19cft","name":"Стражи","level":6,"classes":["bard","wizard"],"time":"10 минут","range":"Касание","dur":"24 часа","conc":false,"rit":false,"desc":["Вы создаёте защиту, охраняющую 2 500 квадратных футов пола (квадрат с длиной стороны 10 клеток, сто клеток 5 × 1 клетка или двадцать пять квадратов с длиной стороны 2 клетки). Охраняемая область может быть до 4 клетки в высоту и может иметь любую форму. Вы можете защитить несколько этажей крепости, поделив их на части, при условии, что во время накладывания этого заклинания вы можете туда попасть.","При накладывании заклинания вы можете указать тех, кто не будет попадать под действие одного или всех выбранных вами эффектов. Вы можете также указать пароль, произношение которого дарует иммунитет к этим эффектам.","Заклинание стражи создаёт в охраняемой местности следующие эффекты:","Двери. Все двери в охраняемой области запираются магией, как если бы они были закрыты заклинанием волшебный замок. Кроме того, вы можете покрыть до десяти дверей иллюзией (эквивалентной функции «иллюзорный предмет» заклинания малая иллюзия), заставляя их выглядеть как гладкая стена.","Коридоры. Коридоры заполняются туманом, делающим местность сильно заслонённой. Кроме того, на каждом перекрёстке или развилке, где есть выбор направления, есть 50% шанс того, что существо (но не вы) будет считать, что идёт в сторону, противоположную той, в которую она на самом деле идёт.","Лестницы. Все лестницы в охраняемой области сверху донизу заполняются паутиной, как от одноимённого заклинания. Нити восстанавливаются через 10 минут, если их сожгут или разрежут, а заклинание стражи ещё активно.","Прочие эффекты заклинания. Вы можете добавить к охраняемой области один из следующих эффектов:","- Поместите пляшущие огоньки в четыре коридора. Вы можете задать простую последовательность, которую огоньки будут выполнять, пока активно заклинание стражи.","- Поместите волшебные уста в два места.","- Поместите зловонное облако в два места. Испарения появляются в указанных вами местах; они возвращаются через 10 минут, если рассеются ветром, а заклинание стражи ещё будет активно.","- Поместите постоянный порыв ветра в один коридор или комнату.","- Поместите внушение в одно место. Выберите область с размером не больше клетки 5 × 1 клетка, и все существа, входящие в эту область или проходящие по ней, мысленно воспринимают внушение.","Вся охраняемая область излучает магию. Рассеивание магии, наложенное на конкретный эффект, в случае успеха устраняет только этот эффект.","Вы можете сделать эту магию постоянной, накладывая это заклинание каждый день в течение одного года."],"higher":[],"custom":true},{"id":"cmqx9cecdkn7","name":"Сфера неуязвимости","level":6,"classes":["sorcerer","wizard"],"time":"1 действие","range":"На себя (10-футовый радиус)","dur":"До 1 минуты","conc":true,"rit":false,"desc":["Вокруг вас возникает неподвижный слабо мерцающий барьер с радиусом 2 клеток, существующий, пока активно заклинание.","Все заклинания 5-го уровня и ниже, наложенные снаружи барьера, не могут подействовать на существ и предметы, находящиеся внутри, даже если заклинание наложено с помощью ячейки большего уровня. Такие заклинания могут быть нацелены на существ и предметы, находящиеся внутри барьера, но не будут на них воздействовать. Пространство, защищённое барьером, тоже не включается в область действия таких заклинаний."],"higher":["Если вы накладываете это заклинание, используя ячейку 7-го уровня или выше, барьер защищает от заклинаний с уровнем на 1 больше за каждый уровень ячейки выше шестого."],"custom":true},{"id":"cmqx9ck5oqrn","name":"Терновая стена","level":6,"classes":["druid"],"time":"1 действие","range":"24","dur":"До 10 минут","conc":true,"rit":false,"desc":["Вы создаёте стену из крепких, гибких, перевитых кустов с острыми как иглы шипами. Стена появляется в пределах дистанции на твёрдой поверхности и существует, пока активно заклинание. Вы можете сделать стену до 12 клеток в длину, до 2 клетки в высоту и толщиной 1 клетка или кругом с диаметром 4 клетки, высотой до 4 клетки и толщиной 1 клетка. Эта стена блокирует линию обзора.","Когда стена появляется, все существа, находящиеся в ней, должны совершить спасбросок Ловкости. При провале существо получает колющий урон 7d8, или половину этого урона при успехе.","Существа могут проходить сквозь стену, но медленно и болезненно. За каждый 1 фут перемещения через стену существо должно потратить 4 фута перемещения. Кроме того, в первый раз за ход, когда существо входит в стену или оканчивает там ход, оно должно совершать спасбросок Ловкости. Оно получает рубящий урон 7d8 при провале, или половину этого урона при успехе."],"higher":["Если вы накладываете это заклинание, используя ячейку 7-го уровня или выше, оба вида урона увеличиваются на 1d8 за каждый уровень ячейки выше шестого."],"custom":true},{"id":"cmqx9cpgsl99","name":"Трансформация Тензера","level":6,"classes":["wizard"],"time":"1 действие","range":"На себя","dur":"До 10 минут","conc":true,"rit":false,"desc":["Вы наделяете себя выносливостью и воинской доблестью, подпитываемыми магией. Пока заклинание активно, вы не можете накладывать заклинания, но получаете следующие преимущества:","Вы получаете 50 временных хитов. Если какое-либо их количество остаётся, когда заклинание оканчивается, они теряются.","Вы совершаете с преимуществом все броски атаки простым или воинским оружием.","Когда вы попадаете по цели атакой оружием, она получает дополнительно 2d12 урона силовым полем.","Вы получаете владение всеми видами доспехов и щитов, а также простого и воинского оружия.","Вы получаете владение спасбросками Силы и Телосложения.","Если вы в свой ход совершаете действие Атака, вы можете совершить две атаки вместо одной. Вы игнорируете это преимущество, если у вас уже есть подобное умение, которое даёт вам дополнительные атаки (например, умение «Дополнительная атака»).","Сразу после того, как заклинание оканчивается, вы должны преуспеть в спасброске Телосложения Сл 15, иначе получите одну степень истощения."],"higher":[],"custom":true},{"id":"cmqx9cunqqrg","name":"Хождение по ветру","level":6,"classes":["druid"],"time":"1 минута","range":"6","dur":"8 часов","conc":false,"rit":false,"desc":["Вы и до десяти согласных существ, видимых вами в пределах дистанции, на время длительности заклинания принимаете газообразную форму, становясь лёгкими облачками. Находясь в форме облака, существо получает скорость полёта 60 клеток и сопротивление урону от немагического оружия. Единственное действие, которое существо может совершать в этой форме, это Рывок или возвращение в естественную форму. Возврат занимает 1 минуту, во время которой существо недееспособно и не может перемещаться. Пока заклинание активно, существо может вернуться в форму облака, для чего снова требуется преображение в течение 1 минуты.","Если существо находится в форме облака и летит, когда оканчивается эффект, существо в течение 1 минуты снижается на 12 клеток в раунд, пока не приземлится безопасно. Если через 1 минуту оно не сможет приземлиться, оно падает на оставшуюся дистанцию."],"higher":[],"custom":true},{"id":"cmqxek6hpva3","name":"Божественное слово","level":7,"classes":["cleric"],"time":"1 бонусное действие","range":"6","dur":"Мгновенная","conc":false,"rit":false,"desc":["Вы произносите божественное слово, наделённое силой, сформировавшей мир на заре творения. Выберите любое количество существ, которых вы видите в пределах дистанции. Все эти существа, слышащие вас, должны совершить спасбросок Харизмы. При провале существо попадает под действие эффекта, основанного на текущем количестве хитов:","- 50 хитов или меньше: глухота на 1 минуту.","- 40 хитов или меньше: глухота и слепота на 10 минут.","- 30 хитов или меньше: слепота, глухота и ошеломление на 1 час.","- 20 хитов или меньше: моментальная смерть.","Вне зависимости от текущих хитов, Исчадия, Небожители, Феи и Элементали, провалившие спасбросок, изгоняются на свой родной план (если только они уже там не находятся), и не могут вернуться на ваш текущий план в течение 24 часов кроме как посредством заклинания исполнение желаний [wish]."],"higher":[],"custom":true},{"id":"cmqxekfsoax0","name":"Великолепный особняк Морденкайнена","level":7,"classes":["bard","wizard"],"time":"1 минута","range":"60","dur":"24 часа","conc":false,"rit":false,"desc":["Вы создаёте межпространственное жилище в пределах дистанции, существующее, пока заклинание активно. Вы выбираете, где будет находиться единственный вход. Вход слабо светится; он 1 клетка в ширину и 2 клетки в высоту. Вы и все существа, указанные вами при накладывании заклинания, можете входить в это жилище, пока дверь открыта. Вы можете открывать и закрывать дверь, если находитесь в пределах 6 клеток от неё. Дверь невидима, когда закрыта.","За дверью находится великолепная прихожая с многочисленными комнатами. Там свежий и тёплый воздух.","Вы можете создать любую планировку, но пространство не может превышать 50 кубов с длиной ребра в 2 клетки. Это место украшено и обставлено мебелью так, как вы пожелаете. Там достаточно еды для 100 человек с девятью переменами блюд. Вошедшим прислуживают 100 практически прозрачных слуг. Внешний облик и одежду этих слуг определяете вы. Они послушно исполняют все приказы. Каждый слуга может исполнять задачи, которые доступны любому человеческому слуге, но они не могут атаковать и совершать действия, причиняющие вред другому существу. Таким образом, слуги могут подавать вещи, чистить, штопать, гладить одежду, зажигать огни, подавать пищу, наливать вино и так далее. Слуги могут перемещаться по особняку, но не могут выходить из него. Мебель и другие предметы, созданные этим заклинанием, превращаются в дым, если их вынесут из особняка. Когда заклинание заканчивается, все существа и оставленные объекты, находящиеся в межпространстве, изгоняются в свободное пространство, ближайшее к входу."],"higher":[],"custom":true},{"id":"cmqxeko108hc","name":"Драконоподобное превращение","level":7,"classes":["druid","sorcerer","wizard"],"time":"1 бонусное действие","range":"На себя","dur":"До 1 минуты","conc":true,"rit":false,"desc":["Издав громкий рык, вы прибегаете к драконьей магии, чтобы преобразить себя подобно драконам. Пока заклинание активно, вы получаете следующие преимущества:","Слепое зрение. Вы получаете слепое зрение в пределах 6 клеток. В пределах этой дистанции вы можете видеть всё, что не находится за полным укрытием, даже если вы ослеплены или находитесь в темноте. Более того, вы можете увидеть невидимое существо в пределах этой дистанции, если только оно не преуспело в попытке спрятаться от вас.","Оружие дыхания. Когда вы накладываете это заклинание, а также бонусным действием в последующие ходы вы можете выдыхать переливающуюся энергию 12-клеточном конусом. Каждое существо в этой области должно совершить спасбросок Ловкости, получая 6d8 урона силовым полем при провале и половину этого урона при успехе.","Крылья. За вашей спиной расправляются бесплотные крылья, дарующие вам скорость полёта 12 клеток."],"higher":[],"custom":true},{"id":"cmqxeksfblwc","name":"Единство сущностей","level":7,"classes":[],"time":"1 действие","range":"12","dur":"До 1 часа","conc":true,"rit":false,"desc":["Два существа, видимых в пределах дистанции, должны совершить спасбросок Телосложения. Бросок совершается с помехой, если существа находятся не дальше 6 клеток друг от друга. Оба существа могут по желанию провалить этот бросок. Если хотя бы одно существо преуспевает в спасброске, заклинание не имеет эффекта. Если оба существа проваливают спасбросок, существа магически соединяются друг с другом на время действия заклинания, вне зависимости от расстояния между ними. Если одно существо получает урон, второе существо получает тот же урон. Если одно существо восстанавливает хиты, другое существо восстанавливает то же самое количество хитов. Когда хиты одного из существ опускается до 0, заклинание оканчивается на обоих. Если заклинание оканчивается на одном существе, оно оканчивается на другом."],"higher":[],"custom":true},{"id":"cmqxekypkpa0","name":"Замедленный огненный шар","level":7,"classes":["sorcerer","wizard"],"time":"1 действие","range":"30","dur":"До 1 минуты","conc":true,"rit":false,"desc":["Из вашего указательного пальца вылетает луч жёлтого света, концентрирующийся в светящемся шарике в пределах дистанции. Когда заклинание оканчивается, либо из-за того, что вы теряете концентрацию, либо когда вы сами это решите, шарик взрывается с гулким рокотом вспышкой пламени, огибающего углы. Все существа в сфере с радиусом 4 клеток с центром в этой точке должны совершить спасбросок Ловкости. При провале существо получает урон огнём, равный сумме накопленного урона, или половине этого урона в случае успеха.","Базовый урон этого заклинания 12d6. В конце каждого вашего хода, пока шарик не сдетонировал, урон увеличивается на 1d6.","Если светящегося шарика кто-то коснётся до того как он взорвётся, коснувшееся существо должно совершить спасбросок Ловкости. При провале заклинание мгновенно оканчивается, а шарик взрывается. В случае успеха существо может отбросить шарик на 8 клеток. Ударившись о существо или твёрдый предмет, шарик взрывается, оканчивая заклинание.","Огонь причиняет урон предметам и воспламеняет горючие предметы, которые никто не несёт и не носит."],"higher":["Если вы накладываете это заклинание, используя ячейку 8-го уровня или выше, базовый урон увеличивается на 1d6 за каждый уровень ячейки выше седьмого."],"custom":true},{"id":"cmqxel619wio","name":"Знак","level":7,"classes":["bard","cleric","druid","wizard"],"time":"1 минута","range":"Касание","dur":"Пока не рассеяно или не сработает","conc":false,"rit":false,"desc":["Когда вы накладываете это заклинание, вы рисуете губительный знак на любой поверхности (такой как пол, стена или стол) или внутри предмета, который можно закрыть, чтобы скрыть знак (например, в книге, свитке или сундуке). Если вы выбрали поверхность, знак может покрыть площадь не больше 2 клетки диаметром. Если вы выбрали предмет, он должен оставаться на месте; если предмет перенесут более чем на 2 клетки от того места, где было активировано это заклинание, знак будет сломан, и заклинание окончится, не сработав.","Знак практически невидим, для его обнаружения требуется успешная проверка Интеллекта (Расследование) против Сл ваших заклинаний.","При накладывании заклинания вы определяете, что вызовет срабатывание знака. Для знаков, написанных на поверхности, чаще всего используют касание или наступание на знак, снятие другого предмета, закрывающего знак, приближение к нему на определённое расстояние, или манипулирование предметом, содержащим его. Для знаков, написанных внутри предмета, чаще всего используют открывание предмета, приближение к нему на определённое расстояние, осмотр или прочтение знака.","Вы можете уточнить условие, чтобы заклинание активировалось только при определённых условиях или в зависимости от физических характеристик существа (таких как рост и вес), или его вида (например, можно выставить защиту от карг или от перевёртышей). Вы можете также определить существ, которые не будут активировать знак, например, тех, кто произнесёт пароль.","Когда вы рисуете знак, выберите из приведённого списка один эффект. Сработав, знак вспыхивает, заполняя на 10 минут сферу с радиусом 12 клеток тусклым светом, после чего заклинание оканчивается. Все существа, находящиеся в сфере, когда знак активируется, становятся целью эффекта заклинания, так же как существа, впервые за ход входящие в сферу или оканчивающие в ней ход.","Безнадёжность. Все цели должны совершить спасбросок Харизмы. При провале цель охватывается отчаянием на 1 минуту. В это время она не может атаковать и нацеливаться на существ вредоносными умениями, заклинаниями и прочими магическими эффектами.","Безумие. Все цели должны совершить спасбросок Интеллекта. При провале цель становится безумной на 1 минуту. Безумное существо не может совершать действия, не понимает ничего, что говорят другие существа, не может читать, и произносит только неразборчивую чушь. Мастер контролирует его перемещения, которые весьма хаотичны.","Боль. Все цели должны совершить спасбросок Телосложения, становясь недееспособными от мучительной боли на 1 минуту при провале.","Ошеломление. Все цели должны совершить спасбросок Мудрости, становясь ошеломлёнными на 1 минуту при провале.","Разногласие. Все цели должны совершить спасбросок Телосложения. При провале цель спорит и ругается с другими существами в течение 1 минуты. В это время она не способна осмысленно общаться и совершает броски атаки и проверки характеристик с помехой.","Смерть. Все цели должны совершить спасбросок Телосложения, получая урон некротической энергией 10d10 при провале, или половину этого урона при успехе.","Сон. Все цели должны совершить спасбросок Мудрости, теряя сознание на 10 минут при провале. Существо пробуждается, если получает урон или если кто-то действием потрясёт его или даст пощёчину.","Страх. Все цели должны совершить спасбросок Мудрости, становясь испуганными на 1 минуту при провале. Будучи испуганной, цель бросает всё, что держит, и должна в каждом своём ходу перемещаться как минимум на 6 клеток от знака, если это возможно."],"higher":[],"custom":true},{"id":"cmqxelavhkhz","name":"Изменение тяготения","level":7,"classes":["druid","sorcerer","wizard"],"time":"1 действие","range":"20","dur":"До 1 минуты","conc":true,"rit":false,"desc":["Это заклинание обращает гравитацию в цилиндре с радиусом 10 клеток и высотой 20 клеток с центром на точке в пределах дистанции. Все существа и предметы, не прикреплённые к полу, падают вверх до верхушки цилиндра, когда вы накладываете это заклинание. Существо может совершить спасбросок Ловкости, чтобы схватиться за закреплённый предмет, и тем самым избежать падения.","Если в процессе падения на пути встречается твёрдый предмет (такой как потолок), ударившиеся об него существа и предметы получают обычный урон как от падения вниз. Если существо или предмет достигают верха, ничего не встретив, они остаются там, немного покачиваясь, на период действия заклинания.","В конце длительности заклинания существа и предметы падают вниз."],"higher":[],"custom":true},{"id":"cmqxelfk70gn","name":"Изоляция","level":7,"classes":["wizard"],"time":"1 действие","range":"Касание","dur":"Пока не рассеяно","conc":false,"rit":false,"desc":["При помощи этого заклинания согласное существо или предмет можно защитить от обнаружения на время действия заклинания. Когда вы накладываете это заклинание и касаетесь цели, она становится невидимой и не может стать целью заклинаний школы Прорицания, а также не обнаруживается сенсорами, созданными заклинаниями школы Прорицания.","Если цель — существо, оно входит в состояние приостановленной жизнедеятельности. Время для него не течёт, и оно не стареет.","Вы можете определить условия, при которых заклинание окончится. Это может быть что угодно, но оно должно произойти в пределах 1 мили от цели. Примерами могут служить «через 1000 лет» или «когда проснётся тараск». Это заклинание также оканчивается, если цель получает урон."],"higher":[],"custom":true},{"id":"cmqxelkzwnfc","name":"Корона звёзд","level":7,"classes":["sorcerer","warlock","wizard"],"time":"1 действие","range":"На себя","dur":"1 час","conc":false,"rit":false,"desc":["Пока заклинание действует, вокруг вашей головы вращаются 7 похожих на звёзды частиц света. Вы можете бонусным действием отправить одну из частиц к одному существу или объекту в пределах 24 клеток от вас. Если вы так делаете, совершите дальнобойную атаку заклинанием. При попадании цель получает 4d12 урона излучением.","Независимо от того, попали вы или нет, частица света исчезает. Действие заклинания оканчивается раньше, когда исчезает последняя частица света.","Пока у вас остаётся хотя бы 4 частицы, они испускают яркий свет в пределах 6 клеток и тусклый свет в пределах ещё 6 клеток. Если у вас осталось меньше 4 частиц, то они испускают тусклый свет в пределах 6 клеток."],"higher":["Если вы накладываете это заклинание, используя ячейку заклинания 8-го уровня или выше, количество создаваемых частиц света увеличивается на две за каждый уровень ячейки выше 7-го."],"custom":true},{"id":"cmqxelpvu1et","name":"Меч Морденкайнена","level":7,"classes":["bard","wizard"],"time":"1 действие","range":"12","dur":"До 1 минуты","conc":true,"rit":false,"desc":["Вы создаёте сгусток силового поля в форме меча, парящий в пределах дистанции. Он существует, пока активно заклинание.","Когда меч появляется, вы совершаете рукопашную атаку заклинанием по цели на ваш выбор, находящейся в пределах 1 клетки от меча. При попадании цель получает урон силовым полем 3d10. Пока заклинание активно, вы можете в каждом своём ходу бонусным действием перемещать меч на 4 клетки в видимое место, и повторять эту атаку по той же самой или другой цели."],"higher":[],"custom":true},{"id":"cmqxelupfkzi","name":"Огненная буря","level":7,"classes":["cleric","druid","sorcerer"],"time":"1 действие","range":"30","dur":"Мгновенная","conc":false,"rit":false,"desc":["В выбранном вами в пределах дистанции пространстве начинается огненная буря. Область бури состоит из вплоть до 10 кубов с длиной ребра 2 клетки, которые вы можете располагать как вам захочется. Каждый куб должен иметь хотя бы одну общую грань с другим кубом. Все существа в этом пространстве должны совершить спасбросок Ловкости. Они получают 7d10 урона огнём при провале или половину этого урона при успехе.","Этот урон повреждает предметы и воспламеняет горючие предметы, которые никто не несёт и не носит. Если хотите, растения не будут затронуты этим заклинанием."],"higher":[],"custom":true},{"id":"cmqxelz4db7z","name":"Перст смерти","level":7,"classes":["sorcerer","warlock","wizard"],"time":"1 действие","range":"12","dur":"Мгновенная","conc":false,"rit":false,"desc":["Вы посылаете негативную энергию в видимое вами существо в пределах дистанции, вызывая у него сильную боль. Цель должна совершить спасбросок Телосложения. При провале она получает 7d8 + 30 урона некротической энергией или половину этого урона при успехе. Гуманоид, убитый этим заклинанием, воскресает в начале вашего следующего хода как зомби [zombie], постоянно находящийся под вашим командованием и выполняющий ваши устные команды."],"higher":[],"custom":true},{"id":"cmqxem4013dn","name":"Подобие","level":7,"classes":["wizard"],"time":"12 часов","range":"Касание","dur":"Пока не рассеяно","conc":false,"rit":false,"desc":["Вы создаёте иллюзорную копию Зверя или Гуманоида, который находится в пределах дистанции всё время, пока накладывается заклинание. Копия является существом, частично реальным, созданным изо льда или снега, и она может совершать действия и вести себя как настоящее существо. Оно выглядит так же, как оригинал, но у него только половина от максимума хитов, и оно создаётся без снаряжения. Во всём остальном иллюзия использует все параметры копируемого существа, но иллюзия считается Конструктом.","Копия дружелюбна по отношению к вам и указанным вами существам. Она подчиняется вашим устным командам, перемещается и действует согласно вашей воле, и в сражении действует в ваш ход. Копия не может обучаться и становиться сильнее, так что она никогда не повышает уровень и характеристики, и не может восстанавливать использованные ячейки заклинаний.","Если копия получает урон, вы можете исправлять его в алхимической лаборатории, используя редкие травы и минералы стоимостью 100 зм за каждый восстанавливаемый хит. Копия существует, пока её хиты не опустятся до 0, после чего она превращается в снег и мгновенно тает.","Если вы накладываете это заклинание ещё раз, существующие активные копии, созданные вами этим заклинанием, мгновенно уничтожаются."],"higher":[],"custom":true},{"id":"cmqxem8r26xx","name":"Призыв небожителя","level":7,"classes":["cleric"],"time":"1 минута","range":"18","dur":"До 1 часа","conc":true,"rit":false,"desc":["Вы призываете Небожителя с показателем опасности 4 или меньше, появляющегося в свободном месте, которое вы видите в пределах дистанции. Небожитель исчезает, когда его хиты опускаются до 0, или когда заклинание оканчивается.","Небожитель дружественен к вам и вашим спутникам, пока заклинание активно. Совершите проверку инициативы за Небожителя, и он будет совершать свои собственные ходы. Он подчиняется вашим устным командам (действие не требуется), если они не противоречат его мировоззрению. Если вы не отдаёте команду, он защищается от враждебных существ, но в иных случаях действий не совершает."],"higher":["Если вы накладываете это заклинание, используя ячейку 9-го уровня, вы призываете Небожителя с показателем опасности 5 или меньше."],"custom":true},{"id":"cmqxeme9tqlx","name":"Проекция","level":7,"classes":["bard","wizard"],"time":"1 действие","range":"500 миль","dur":"До 1 дня","conc":true,"rit":false,"desc":["Вы создаёте иллюзорную копию себя, существующую, пока активно заклинание. Копия может появиться в любом месте в пределах дистанции, которое вы до этого видели, вне зависимости от всех возможных препятствий. Иллюзия выглядит и звучит как вы, но неосязаема. Если иллюзия получает урон, она исчезает, а заклинание оканчивается.","Вы можете действием переместить эту иллюзию на расстояние, вдвое превышающее вашу скорость, и заставить её жестикулировать, говорить и вообще, вести себя так, как решите вы. Она идеально повторяет ваши манеры.","Вы можете видеть её глазами и слышать её ушами, как если бы находились в её пространстве. Вы можете в свой ход бонусным действием переключиться с её чувств на свои или обратно. Пока вы используете её чувства, вы слепы и глухи для своего окружения.","Физическое взаимодействие с образом даёт понять, что это иллюзия, потому что сквозь него всё проходит. Существа, исследующие образ действием, могут определить, что это иллюзия, совершив успешную проверку Интеллекта (Расследование) против Сл ваших заклинаний. Если существо распознаёт иллюзию, оно может видеть сквозь неё, и издаваемые ей звуки тоже становятся незначащими."],"higher":[],"custom":true},{"id":"cmqxemktlfbd","name":"Радужные брызги","level":7,"classes":["bard","sorcerer","wizard"],"time":"1 действие","range":"На себя (60-футовый конус)","dur":"Мгновенная","conc":false,"rit":false,"desc":["Восемь разноцветных лучей света вылетают из вашей ладони. Каждый луч своего цвета, и у каждого свои особые свойства. Все существа в пределах 12-клеточного конуса должны совершить спасбросок Ловкости. Для каждой цели совершите бросок d8, чтобы определить, луч какого цвета её коснулся.","1. Красный. Цель получает 10d6 урона огнём при провале или половину этого урона при успехе.","2. Оранжевый. Цель получает 10d6 урона кислотой при провале или половину этого урона при успехе.","3. Жёлтый. Цель получает 10d6 урона электричеством при провале или половину этого урона при успехе.","4. Зелёный. Цель получает 10d6 урона ядом при провале или половину этого урона при успехе.","5. Голубой. Цель получает 10d6 урона холодом при провале или половину этого урона при успехе.","6. Синий. При провале цель становится опутанной. После этого цель в конце каждого своего хода совершает спасбросок Телосложения. Если будет совершено три успешных спасброска, заклинание оканчивается. Если накопится три провала, цель навсегда превращается в камень и становится окаменевшей. Успехи и провалы не обязаны быть последовательными; отслеживайте их отдельно друг от друга, пока не накопится три результата одного вида.","7. Фиолетовый. При провале цель становится ослепшей. В начале вашего следующего хода она совершает спасбросок Мудрости. Успех оканчивает ослепление. При провале существо перемещается на другой план существования на выбор Мастера и перестаёт быть ослепшей (обычно существа на неродных планах изгоняются домой, а остальные существа обычно выбрасываются на Астральный или Эфирный планы).","8. Особенность. По цели попадают два луча. Совершите ещё два броска кости, перебрасывая выпавшие «8»."],"higher":[],"custom":true},{"id":"cmqxempbz1wg","name":"Регенерация","level":7,"classes":["bard","cleric","druid"],"time":"1 минута","range":"Касание","dur":"1 час","conc":false,"rit":false,"desc":["Вы касаетесь существа и активируете его врождённые способности к исцелению. Цель восстанавливает 4d8 + 15 хитов. Пока заклинание активно, цель восстанавливает 1 хит в начале каждого своего хода (10 хитов в минуту).","Потерянные части тела цели (пальцы, ноги, хвосты и так далее), если они были, восстанавливаются через 2 минуты. Если у вас есть потерянная часть тела, её можно приставить к обрубку, и заклинание мгновенно их срастит."],"higher":[],"custom":true},{"id":"cmqxemugw5tk","name":"Слово силы: боль","level":7,"classes":["sorcerer","warlock","wizard"],"time":"1 действие","range":"12","dur":"Мгновенная","conc":false,"rit":false,"desc":["Вы произносите слово силы, вызывающее волны острой боли у одного существа, которое вы можете видеть в пределах дистанции. Если у цели 100 хитов или меньше, она подвергается этой ужасной боли. В противном случае заклинание не оказывает никакого эффекта. Цель также не подвержена этому заклинанию, если она имеет иммунитет к очарованию.","Пока цель подвергается ужасной боли, никакая из её скоростей не может быть больше 2 клетки. Цель также совершает с помехой все броски атаки, проверки характеристик и спасброски, за исключением спасбросков Телосложения. И, наконец, если цель пытается наложить заклинание, она должна совершить успешный спасбросок Телосложения, в противном случае заклинание тратится и не срабатывает.","Цель, страдающая от этой боли, может совершать спасбросок Телосложения в конце каждого своего хода. При успехе боль проходит."],"higher":[],"custom":true},{"id":"cmqxemzhs943","name":"Смерч","level":7,"classes":["druid","sorcerer","wizard"],"time":"1 действие","range":"60","dur":"До 1 минуты","conc":true,"rit":false,"desc":["В указанной вами точке на поверхности земли возникает ревущий смерч. Он представляет собой цилиндр с радиусом 2 клеток и высотой 6 клеток. Пока заклинание действует, вы можете действием переместить его на расстояние до 6 клеток в любом направлении вдоль земли. Смерч засасывает любые предметы с размером не больше Среднего, никем не носимые и не переносимые.","Существо должно совершить спасбросок Ловкости в момент, когда в первый раз за ход входит в область смерча или когда область смерча входит в пространство существа, включая момент первоначального возникновения смерча. При провале существо получает 10d6 дробящего урона, а при успехе — половину этого урона. Кроме того, существо с размером не больше Большого, провалившее спасбросок, должно преуспеть в спасброске Силы, иначе будет опутано смерчем на время действия заклинания. В начале каждого хода опутанное существо подтягивается на 1 клетка вверх, пока не окажется на вершине смерча. Опутанное существо перемещается вместе со смерчем и падает на землю, когда заклинание заканчивается, если у него нет возможности остаться в воздухе.","Опутанное существо может действием совершить проверку Силы или Ловкости против Сл ваших заклинаний. В случае успеха оно перестаёт быть опутанным и вылетает из смерча на 3d6 × 2 клетки в случайном направлении."],"higher":[],"custom":true},{"id":"cmqxen4e8cn2","name":"Сон синей вуали","level":7,"classes":["bard","sorcerer","warlock","wizard"],"time":"10 минут","range":"4","dur":"6 часов","conc":false,"rit":false,"desc":["Вы и до восьми согласных существ в пределах дистанции теряете сознание на время действия заклинания и испытываете видения другого мира на Материальном плане, как например Орта, Торила, Кринна или Эберрона. Если заклинание действует в течение полной длительности, то видения приводят к тому, что каждый из вас находит и отодвигает загадочный синий занавес. Заклинание заканчивается тем, что вы ментально и физически переноситесь в мир, который был в видениях.","Чтобы наложить это заклинание, у вас должен быть магический предмет, созданный в мире, в который вы хотите попасть, и вы должны знать о существовании этого мира, даже если вы не знаете его названия. Вы попадаете в безопасное место в пределах 1 мили от того места, где используемый магический предмет был создан. Вы можете наложить заклинание без магического предмета, если одно из существ под действием этого заклинания родилось в том мире. В таком случае пункт назначения будет безопасным местом в пределах 1 мили от того места, где это существо родилось.","Заклинание заканчивается раньше времени для существа, получающего какой-либо урон, и это существо не переносится. Если вы получите какой-либо урон, заклинание закончится для всех существ, и никто не будет перенесён."],"higher":[],"custom":true},{"id":"cmqxen9oejgm","name":"Сотворение магена","level":7,"classes":["wizard"],"time":"1 час","range":"Касание","dur":"Мгновенная","conc":false,"rit":false,"desc":["Накладывая заклинание, вы помещаете флакон ртути в грудь человеческой куклы в натуральную величину, наполненной пеплом или песком. Затем вы зашиваете куклу и капаете на неё своей кровью. В конце накладывания заклинания вы постукиваете по кукле хрустальным жезлом, превращая её в магена, одетого в то, что было на кукле. Тип магена выбирается вами во время накладывания заклинания. (см. магены).","Когда появляется маген, ваш максимум хитов уменьшается на величину, равную показателю опасности магена (минимальное снижение равно 1). Только заклинание исполнение желаний [wish] может отменить это уменьшение вашего максимума хитов.","Любой маген, которого вы создаёте с помощью этого заклинания, беспрекословно подчиняется вашим командам."],"higher":[],"custom":true},{"id":"cmqxene1whe1","name":"Таинственный мираж","level":7,"classes":["bard","druid","wizard"],"time":"10 минут","range":"В пределах видимости","dur":"10 дней","conc":false,"rit":false,"desc":["Вы заставляете местность в пределах 1 квадратной мили выглядеть, звучать, пахнуть и даже ощущаться как другая местность. Общая форма местности остаётся той же самой. Открытые поля и дороги можно сделать похожими на болото, холм, расселину или другую труднопроходимую или непроходимую местность. Пруд можно сделать похожим на травяную лужайку, пропасть сделать пологим склоном, а каменистый овраг — широкой и ровной дорогой.","Точно так же, вы можете изменять внешний облик строений, или создавать их там, где их не было. Это заклинание не маскирует, не скрывает и не добавляет существ.","Иллюзия включает в себя слышимые, видимые, тактильные и обонятельные элементы, так что она может сделать обычную местность труднопроходимой (и наоборот), и как-то иначе препятствовать перемещению. Все части иллюзорной местности (такие как камни и палки), вынесенные за пределы области пространства, мгновенно исчезают.","Существа с истинным зрением могут видеть сквозь иллюзию настоящую местность; однако, все элементы иллюзии для него остаются, так что хоть оно и будет знать о наличии иллюзии, оно всё ещё может взаимодействовать с ней."],"higher":[],"custom":true},{"id":"cmqxeow2iwyd","name":"Телепортация","level":7,"classes":["bard","sorcerer","wizard"],"time":"1 действие","range":"2","dur":"Мгновенная","conc":false,"rit":false,"desc":["Это заклинание мгновенно переносит вас и до восьми согласных существ на ваш выбор, видимых вами и находящихся в пределах дистанции, или один предмет, видимый в пределах дистанции, в выбранное вами место. Если целью является предмет, он должен полностью помещаться в куб с длиной ребра 2 клетки, и его не может носить или нести несогласное существо.","Выбранное место назначения должно быть известно вам, и оно должно находиться на одном плане существования с вами. Ваша ознакомленность с местом назначения определяет, успешным ли будет перемещение. Мастер бросает d100 и сверяется с таблицей.","Ознакомленность - Неудача - Похожее место - Мимо цели - Точно в цель","Постоянный круг\t—\t—\t—\t01-00","Связанный предмет\t—\t—\t—\t01-00","Очень знакомое\t01-05\t06-13\t14-24\t25-00","Изредка видимое\t01-33\t34-43\t44-53\t54-00","Виденное один раз\t01-43\t44-53\t54-73\t74-00","Описанное\t01-43\t44-53\t54-73\t74-00","Ложное описание\t01-50\t51-00\t—\t—","Ознакомленность:","«Постоянный круг» означает постоянный круг телепортации, последовательность знаков которого вам известна.","«Связанный предмет» означает, что у вас есть предмет, взятый из места назначения за последние шесть месяцев, например, книга из библиотеки волшебника, постельное бельё из королевской спальни, или кусок мрамора из потайного склепа лича.","«Очень знакомое» это место, в котором вы часто бываете, место, которое вам довелось изучить, или место, которое вы видите в процессе накладывания заклинания.","«Изредка видимое» это место, которое вы видели несколько раз, но которое вам не очень хорошо известно.","«Виденное один раз» это место, которое вы видели один раз, возможно, при помощи магии.","«Описанное» это место, чьё местоположение и внешний облик вам известно со слов других, возможно, по карте.","«Ложно описанное» это место, которое не существует. Возможно, вы пытались подсмотреть святилище врага, но на самом деле видели иллюзию, или вы пытались телепортироваться в знакомое место, которое больше не существует.","Точно в цель. Вы и ваша группа (или предмет) появляетесь там, где было задумано.","Мимо цели. Вы и ваша группа (или предмет) появляетесь на случайном расстоянии от места назначения в случайном направлении. Расстояние от цели равно (1d10​×​1d10) процентов от расстояния, на которое вы перемещались. Например, если вы пытались перенестись на 120 миль, промахиваетесь мимо цели, и на двух 1d10 у вас выпадает «5» и «3», то вы промахиваетесь мимо цели на 15 процентов, то есть на 18 миль. Мастер определяет направление случайным образом, бросая d8, где «1» означает север, «2» — северо-восток, «3» — восток, и так далее. Если вы телепортировались в город на побережье, и оказываетесь в море на расстоянии 18 миль, вы окажетесь в беде.","Похожее место. Вы и ваша группа (или предмет) оказываетесь в другом месте, визуально или тематически похожем на место назначения. Например, если вы направлялись в свою лабораторию, вы можете оказаться в лаборатории другого волшебника или алхимическом магазине с таким же оборудованием как в вашей лаборатории. Обычно вы появляетесь в ближайшем похожем месте, но так как у заклинания нет ограничений по дистанции, вы можете оказаться где угодно на текущем плане.","Неудача. Непредсказуемая магия заклинания делает перемещение опасным. Все телепортирующиеся существа (или предмет) получают урон силовым полем 3d10, и Мастер совершает новый бросок по таблице, чтобы определить место назначения (возможны несколько неудач, и каждая будет причинять урон)."],"higher":[],"custom":true},{"id":"cmqxep286coj","name":"Узилище","level":7,"classes":["bard","warlock","wizard"],"time":"1 действие","range":"20","dur":"1 час","conc":false,"rit":false,"desc":["Вокруг области, выбранной вами в пределах дистанции, возникает неподвижная, невидимая тюрьма в форме куба, созданная из магической силы. Тюрьма может быть клеткой или сплошной коробкой, на ваш выбор.","Тюрьма в форме клетки может быть с длиной ребра до 4 клетки, и состоит из сантиметровых прутьев (диаметр 1/2 дюйма), отстоящих друг от друга на 1 сантиметр (1/2 дюйма).","Тюрьма в форме коробки может быть с длиной ребра до 2 клетки, и она является сплошным барьером, останавливающим любую материю, и блокирующую заклинания, накладываемые как внутрь коробки, так и направленные из неё наружу.","Когда вы накладываете это заклинание, под его действие попадают все существа, находящиеся целиком внутри области. Существа, находящиеся в области лишь частично, или слишком большие для заточения внутри, отталкиваются от центра области, пока не окажутся снаружи.","Существо, находящееся в узилище, не может покинуть его без помощи магии. Если оно пытается использовать телепортацию или перемещение между планами, оно должно вначале преуспеть в спасброске Харизмы. В случае успеха существо может использовать эту магию для выхода из узилища. При провале существо не может покинуть узилище, и тратит впустую использование заклинания или эффект. Узилище простирается и на Эфирный план, запрещая перемещение через него.","Это заклинание нельзя рассеять рассеиванием магии [dispel magic]."],"higher":[],"custom":true},{"id":"cmqxep6z132z","name":"Уход в иной мир","level":7,"classes":["cleric","druid","sorcerer","warlock","wizard"],"time":"1 действие","range":"Касание","dur":"Мгновенная","conc":false,"rit":false,"desc":["Вы и до восьми согласных существ, взявшиеся за руки кругом, перемещаетесь на другой план существования. Вы можете указать в общих чертах точку прибытия, например, Медный город на Стихийном плане Огня или дворец Диспатера на втором уровне Девяти Преисподних, и вы появитесь возле этого места. Например, если вы хотели оказаться в Медном городе, вы можете прибыть на Стальную улицу, перед Вратами Пепла, или оказаться посреди Моря Огня, на выбор Мастера.","В качестве альтернативы, если вы знаете последовательность знаков телепортационного круга на другом плане существования, это заклинание может перенести вас в этот круг. Если круг телепортации слишком мал для переносимого количества существ, они появляются в ближайшем свободном пространстве рядом с кругом.","Вы можете использовать это заклинание, чтобы изгонять несогласных существ на другой план. Выберите существо в пределах досягаемости и совершите по нему рукопашную атаку заклинанием. При попадании существо должно совершить спасбросок Харизмы. Если существо его проваливает, оно переносится в случайным образом выбранное место на выбранном вами плане существования. Перенесённое таким образом существо должно будет самостоятельно найти дорогу на ваш текущий план существования."],"higher":[],"custom":true},{"id":"cmqxepdy9oql","name":"Храм богов","level":7,"classes":["cleric"],"time":"1 час","range":"24","dur":"24 часа","conc":false,"rit":false,"desc":["Вы создаёте храм, появляющийся из мерцающего света на земле в том месте, которое вы можете видеть в пределах дистанции. Храм должен умещаться в незанятом кубе с длиной ребра до 24 клетки. Храм остаётся до тех пор, пока заклинание не закончится. Он посвящён любому богу, пантеону или философии, которые представлены священным символом, используемым при накладывании заклинания.","Вы сами решаете, как храм должен выглядеть. Внутреннее пространство храма ограничено полом, стенами и крышей. У храма одна входная дверь, но любое количество окон. Только вы и те существа, которых вы указываете, когда накладываете заклинание, могут открыть или закрыть дверь.","Интерьер храма — это открытое пространство с идолом или алтарём у одной из стен. Вы определяете, освещается ли храм, и является ли этот свет ярким или тусклым. Внутри воздух наполнен запахом горящих благовоний, а температура комфортная.","Храм препятствует существам тех видов, которые вы выбираете, когда накладываете это заклинание. Выберите один или несколько из следующих видов: Исчадия, Небожители, Нежить, Феи или Элементали. Если существо выбранного типа пытается войти в храм, оно должно совершить спасбросок Харизмы. При провале оно не может войти в храм в течение 24 часов. Даже если существо сумело войти в храм, магия этого места является для него помехой; всякий раз, когда оно совершает бросок атаки, проверку характеристики или спасбросок внутри храма, существо должно бросить d4 и вычесть получившееся число из его броска d20.","Кроме того, сенсоры, созданные заклинаниями школы Прорицания, не могут появиться внутри храма, а существа внутри него не могут быть целями заклинаний этой школы.","Наконец, всякий раз, когда какое-либо существо в храме восстанавливает хиты заклинанием 1 уровня или выше, оно дополнительно восстанавливает хиты в количестве, равном вашему модификатору Мудрости (минимум 1 хит).","Храм сделан из светонепроницаемого магического поля, которое простирается на Эфирный план, тем самым блокируя межпланарное перемещение внутрь храма. Также ничто не может проникнуть в храм физическим путём. Он не может быть развеян рассеиванием магии [dispel magic], и преграда магии [antimagic field] не оказывает на него никакого эффекта. Заклинание распад [disintegrate] мгновенно разрушает храм.","Накладывание этого заклинания на одно и то же место каждый день в течение года делает этот эффект постоянным."],"higher":[],"custom":true},{"id":"cmqxepjkxx0t","name":"Эфирность","level":7,"classes":["bard","cleric","sorcerer","warlock","wizard"],"time":"1 действие","range":"На себя","dur":"Вплоть до 8 часов","conc":false,"rit":false,"desc":["Вы вступаете в пограничные окрестности Эфирного плана, в местность, в которой он пересекается с вашим текущим планом. Вы остаётесь в Пограничном Эфире, пока активно заклинание, или пока вы не окончите его действием. Всё это время вы можете перемещаться в любом направлении. Если вы перемещаетесь вверх или вниз, каждый фут перемещения стоит 1 дополнительный фут. Вы можете видеть и слышать то, что происходит на плане, с которого вы пришли, но всё выглядит серым, и вы не видите то, что находится за пределами 12 клеток.","Находясь на Эфирном плане, вы можете воздействовать только на существ, которые находятся там же, и только они могут воздействовать на вас. Существа, не находящиеся на Эфирном плане, не могут воспринимать вас и взаимодействовать с вами, если только у них нет особого умения или магии, позволяющей делать это.","Вы игнорируете все предметы и эффекты, не находящиеся на Эфирном плане, что позволяет вам проходить сквозь предметы, оставленные на исходном плане.","Когда заклинание заканчивается, вы мгновенно возвращаетесь на план, с которого пришли, в месте, которое занимаете в данный момент. Если вы при этом находитесь в месте, занятом предметом или существом, вас мгновенно переносит в ближайшее свободное пространство, которое вы можете занимать, и вы получаете урон силовым полем, равный удвоенному количеству футов, на которое вас телепортировало.","Это заклинание не оказывает эффекта, если вы накладываете его, уже находясь на Эфирном плане или плане, который не граничит с ним, например, на одном из Внешних планов."],"higher":["Если вы накладываете это заклинание, используя ячейку 8-го уровня или выше, вы можете сделать целью до трёх согласных существ (включая вас) за каждый уровень ячейки выше седьмого. Существа должны находиться в пределах 2 клеток от вас, когда вы накладываете это заклинание."],"custom":true},{"id":"cmqxesi38gu5","name":"Антипатия/симпатия","level":8,"classes":["bard","druid","wizard"],"time":"1 час","range":"12","dur":"10 дней","conc":false,"rit":false,"desc":["Это заклинание привлекает или отталкивает выбранных вами существ. Вы выбираете цель в пределах дистанции: либо предмет размером не больше Огромного, либо существо, либо область не больше куба с длиной ребра 40 клеток. Затем укажите вид разумных существ, такой как красные драконы, гоблины или вампиры. Вы наделяете цель аурой, которая в течение длительности либо привлекает, либо отталкивает указанных существ. Выберите либо эффект антипатии, либо эффект симпатии:","Антипатия. Эти чары вызывают у выбранных вами существ непреодолимое желание покинуть область и избегать цель. Если такое существо видит цель и оказывается в пределах 12 клеток от неё, оно должно преуспеть в спасброске Мудрости, иначе станет испуганным. Существо остаётся испуганным, пока видит цель или находится в пределах 12 клеток от неё. Будучи испуганным целью, существо должно тратить своё перемещение на побег в ближайшее безопасное место, откуда оно уже не увидит цель. Если существо отдалится от цели более чем на 12 клеток и не сможет её видеть, оно перестаёт быть испуганным, но становится испуганным вновь, если увидит цель или окажется в пределах 12 клеток от неё.","Симпатия. Эти чары вызывают у выбранных вами существ непреодолимое желание приблизиться к цели, если они находятся в пределах 12 клеток от неё или видят её. Если такое существо видит цель или оказывается в пределах 12 клеток от неё, оно должно преуспеть в спасброске Мудрости, иначе оно в каждом своём ходу тратит перемещение на то, чтобы войти в область или прикоснуться к цели. Сделав это, оно уже не может добровольно отойти от цели.","Если цель причиняет урон или как-то иначе вредит указанному существу, существо может совершить спасбросок Мудрости для окончания эффекта, как описано ниже.","Окончание эффекта. Если указанное существо окончит ход за пределами 12 клеток от цели или не сможет её видеть, оно совершает спасбросок Мудрости. В случае успеха эффект на существе заканчивается, и оно понимает, что тяга или отвращение были вызваны магией. Кроме того, попавшему под эффект заклинания существу позволяется спасбросок Мудрости каждые 24 часа, пока заклинание активно.","Совершившее успешный спасбросок существо получает иммунитет к эффекту на 1 минуту, после чего снова попадает под его действие."],"higher":[],"custom":true},{"id":"cmqxesmw2gl7","name":"Аура святости","level":8,"classes":["cleric"],"time":"1 действие","range":"На себя","dur":"До 1 минуты","conc":true,"rit":false,"desc":["Божественный свет исходит от вас мягким сиянием в радиусе 6 клеток. Пока заклинание активно, существа в этом радиусе, выбранные вами при накладывании этого заклинания, испускают тусклый свет в радиусе 1 клетки и совершают все спасброски с преимуществом, а остальные существа совершают с помехой броски атаки по ним. Кроме того, если Исчадие или Нежить попадает по такому существу рукопашной атакой, аура вспыхивает ярким светом. Атакующий должен преуспеть в спасброске Телосложения, иначе станет ослеплённым, пока это заклинание не окончится."],"higher":[],"custom":true},{"id":"cmqxessxskz9","name":"Брешь в реальности","level":8,"classes":[],"time":"1 действие","range":"12","dur":"До 1 минуты","conc":true,"rit":false,"desc":["Вы разрушаете границы между пространствами и временными линиями, погружая существо в пучину хаоса и безумия. Цель должна преуспеть в спасброске Мудрости, иначе она не может совершать реакции, пока заклинание не окончится.","В начале каждого своего хода существо под действием заклинания совершает бросок d10 и попадает под действие одного из эффектов, указанных ниже. В конце своего хода существо может повторить спасбросок Мудрости, при успехе оканчивая на себе эффект.","Эффекты бреши в реальности","d10\tЭффект","1-2\tВиденье Дальнего Предела. Цель получает 6d12 урона психической энергией и является ошеломлённым до конца хода.","3-5\tРазрыв пространства. Цель совершает спасбросок Ловкости и получает 8d12 урона силовым полем при провале и половину урона при успехе.","6-8\tЧервоточина. Цель, вместе с всем, что она несёт и носит, телепортируется до 6 клеток в незанятое видимое пространство по вашему выбору, получает 10d12 урона силовым полем и падает ничком.","9-10\tХлад пустоты. Цель получает 10d12 урона холодом и ослеплена до конца хода."],"higher":[],"custom":true},{"id":"cmqxeszs8wfp","name":"ласть над погодой","level":8,"classes":["cleric","druid","wizard"],"time":"10 минут","range":"На себя (радиус 5 миль)","dur":"До 8 часов","conc":true,"rit":false,"desc":["Вы получаете на время длительности контроль над погодой в пределах 5 миль от себя. Для накладывания этого заклинания вы должны находиться на открытом воздухе. Если вы переместитесь в место, где над головой не будет неба, заклинание тут же закончится.","Когда вы накладываете это заклинание, вы изменяете текущую погоду, которую определяет Мастер в зависимости от климата и времени года. Вы можете изменить осадки, температуру и ветер. Требуется 1d4 × 10 минут, чтобы новые условия вступили в силу. Когда новые условия вступят в силу, вы можете создать новые условия. Когда заклинание оканчивается, погода постепенно возвращается к нормальной.","Изменяя погоду, найдите текущее состояние в таблицах и измените их на одну позицию выше или ниже. Изменяя ветер, можете изменить его направление.","Осадки","Сила\tСостояние","1\tЧистое небо","2\tНебольшая облачность","3\tПасмурно или густой туман","4\tДождь, град или снег","5\tПроливной дождь, сильный град или метель","Температура","Сила\tСостояние","1\tНевыносимая жара","2\tЖара","3\tТепло","4\tПрохладно","5\tХолодно","6\tАрктическая стужа","Ветер","Сила\tСостояние","1\tШтиль","2\tУмеренный ветер","3\tСильный ветер","4\tБуря","5\tШторм"],"higher":[],"custom":true},{"id":"cmqxet57uoen","name":"Воспламеняющаяся туча","level":8,"classes":["druid","sorcerer","wizard"],"time":"1 действие","range":"30","dur":"До 1 минуты","conc":true,"rit":false,"desc":["Кружащееся облако дыма с ярко-белыми огоньками появляется в сфере с радиусом 4 клеток с центром на точке, находящейся в пределах дистанции. Облако огибает углы и является сильно заслонённой местностью. Оно существует, пока активно заклинание, или пока его не развеет умеренный или сильный ветер (как минимум 10 миль в час).","Когда облако появляется, все находящиеся в нём существа должны совершить спасбросок Ловкости. Существо получает 10d8 урона огнём при провале или половину этого урона при успехе. Существа должны также совершать этот спасбросок, когда впервые за ход входят в область заклинания или оканчивают там ход.","В начале каждого вашего хода облако перемещается на 2 клетки прочь от вас в направлении, выбираемом вами."],"higher":[],"custom":true},{"id":"cmqxetb9qyzz","name":"Двойник","level":8,"classes":["wizard"],"time":"1 час","range":"Касание","dur":"Мгновенная","conc":false,"rit":false,"desc":["Это заклинание выращивает инертную копию живого существа, которая станет гарантией бессмертия. Этот клон формируется в используемом сосуде и вырастает до полного размера за 120 дней; вы можете сделать так, что двойник будет более молодой версией этого существа. Он остаётся инертным и будет оставаться таким сколько угодно, пока сосуд остаётся целым.","В любое время после того, как двойник будет готов, когда настоящее существо умирает, его душа переносится в двойника, при условии, что она свободна и хочет вернуться. Двойник физически идентичен оригиналу и обладает той же индивидуальностью, воспоминаниями и умениями, но у него нет снаряжения оригинала. Тело исходного существа, если оно ещё существует, остаётся инертным, и его впоследствии нельзя оживить, так как душа обитает в другом месте."],"higher":[],"custom":true},{"id":"cmqxetgyyl9z","name":"Демиплан","level":8,"classes":["sorcerer","warlock","wizard"],"time":"1 действие","range":"12","dur":"1 час","conc":false,"rit":false,"desc":["Вы создаёте теневую дверь на твёрдой плоской поверхности, которую вы видите в пределах дистанции. Дверь достаточно большая, чтобы существа Среднего размера могли свободно через неё проходить. Если дверь открыть, она будет вести на демиплан, который выглядит как пустая комната по 6 клеток во всех измерениях, построенная из дерева или камня. Когда заклинание оканчивается, дверь исчезает, а существа и предметы, находящиеся на демиплане, остаются запертыми там, так как дверь исчезает и с другой стороны тоже.","Каждый раз, когда вы накладываете это заклинание, вы либо создаёте новый демиплан, либо соединяете дверь с демипланом, созданным предыдущим накладыванием этого заклинания. Кроме того, если вы знаете природу и содержимое демиплана, который был создан этим заклинанием другим существом, вы можете соединить свою дверь с этим демипланом."],"higher":[],"custom":true},{"id":"cmqxetobjphp","name":"Землетрясение","level":8,"classes":["cleric","druid","sorcerer"],"time":"1 действие","range":"100","dur":"До 1 минуты","conc":true,"rit":false,"desc":["Вы создаёте сейсмические возмущения в точке на земле, которую видите в пределах дистанции. Пока заклинание активно, на земле в круге с радиусом 20 клеток от этой точки ощущаются интенсивные толчки, сотрясающие существ и строения, находящиеся там.","Местность в этой области становится труднопроходимой. Все существа, находящиеся на земле и концентрирующиеся при этом, должны совершить спасбросок Телосложения. При провале концентрация существа нарушается.","Когда вы накладываете это заклинание, а также в конце каждого хода, когда вы на нём концентрируетесь, все существа, находящиеся на земле в области заклинания, должны совершать спасброски Ловкости. При провале существо сбивается с ног.","У этого заклинания могут быть другие эффекты, зависящие от местности, на усмотрение Мастера.","Трещины. В области заклинания в начале вашего хода, следующего за тем, в котором вы наложили это заклинание, появляются трещины. Появляется 1d6 трещин в местах, определённых Мастером. Каждая 1d10 × 2 клетки глубиной, 2 клетки в ширину, а длиной от одного края заклинания до другого. Существо, стоящее в месте, где должна появиться трещина, должно преуспеть в спасброске Ловкости, иначе упадёт внутрь. Преуспевшее в спасброске существо перемещается вместе с одним из краёв трещины.","Трещины, открывающиеся под зданиями, заставляют их автоматически обрушиться (смотрите ниже).","Здания. Толчки причиняют 50 дробящего урона строениям, находящимся в контакте с землёй, когда вы накладываете это заклинание, а также в начале каждого вашего хода, пока заклинание активно. Если хиты здания опускаются до 0, оно обрушивается, и потенциально может причинить урон существам. Существо, находящееся в пределах половины высоты здания, должно совершить спасбросок Ловкости. При провале существо получает 5d6 дробящего урона, сбивается с ног и погребается под завалами, после чего для высвобождения требуется проверка Силы (Атлетика) Сл 20, совершённая действием. Мастер может корректировать Сл, в зависимости от характера обломков. При успехе существо получает половину урона, не сбивается с ног и не погребается."],"higher":[],"custom":true},{"id":"cmqxetu2633y","name":"Иллюзорный дракон","level":8,"classes":["wizard"],"time":"1 действие","range":"24","dur":"До 1 минуты","conc":true,"rit":false,"desc":["Собирая нити теневой материи в Царстве Теней, вы создаёте Огромного теневого дракона в свободном пространстве, которое вы можете видеть в пределах дистанции. Иллюзия существует всю длительность заклинания и занимает своё пространство, как если бы это было существо.","Когда иллюзия появляется, каждый враг, который может её видеть, должен преуспеть в спасброске Мудрости, иначе становится испуганным этой иллюзией на 1 минуту. Если испуганное существо оканчивает свой ход в том месте, где у него нет прямой видимости иллюзии, оно может повторить спасбросок, оканчивая на себе эффект при успехе.","В свой ход вы можете бонусным действием переместить иллюзию на 12 клеток. В любой момент во время её движения вы можете заставить её извергнуть поток энергии в 12-клеточном конусе, исходящем от неё. Когда вы создаёте дракона, выберите вид урона: кислота, некротическая энергия, огонь, холод, электричество, или яд. Каждое существо в конусе должно совершить спасбросок Интеллекта, получая 7d6 выбранного вида урона при провале или половину этого урона при успехе.","Иллюзия осязаема из-за теневого материала, используемого при её создании, но атаки по ней проваливаются автоматически, она преуспевает во всех спасбросках и имеет иммунитет к любым урону и состояниям. Существо, которое действием изучает дракона, может определить, что это иллюзия, совершив проверку Интеллекта (Расследование) против Сл спасброска от ваших заклинаний. Если существо распознаёт иллюзию, оно может видеть сквозь неё и совершает с преимуществом спасброски от её дыхания."],"higher":[],"custom":true},{"id":"cmqxetzcfrfi","name":"Лабиринт","level":8,"classes":["wizard"],"time":"1 действие","range":"12","dur":"До 10 минут","conc":true,"rit":false,"desc":["Вы изгоняете существо, видимое в пределах дистанции, в похожий на лабиринт демиплан.","Цель остаётся там, пока заклинание активно, или пока она не найдёт выход. Цель может действием пытаться найти выход. Для этого она совершает проверку Интеллекта Сл 20. При успехе она находит выход, а заклинание оканчивается (минотавры и демоны гористро преуспевают автоматически).","Когда заклинание заканчивается, цель возвращается в пространство, которое она покинула, или, если оно занято, в ближайшее свободное пространство."],"higher":[],"custom":true},{"id":"cmqxeu5gvqtm","name":"Могучая крепость","level":8,"classes":["wizard"],"time":"1 минута","range":"1 миля","dur":"Мгновенная","conc":false,"rit":false,"desc":["Каменная крепость вырывается из квадратного участка земли, который вы можете видеть в пределах дистанции. Сторона этого квадрата составляет 24 клетки, и на ней не должно быть никаких зданий или других сооружений. Любые существа в этом участке безвредно поднимаются вместе с крепостью.","У крепости есть четыре башни с квадратными основаниями, сторонами 4 клетки и высотой 6 клеток, по одной на каждом углу. Башни соединены друг с другом каменными стенами, каждая длиной 16 клеток, создавая замкнутую область. Каждая стена имеет толщину 1 фут и состоит из блоков шириной 2 клетки и высотой 4 клетки. Каждый из них соприкасается с двумя другими блоками или одним блоком и башней. Вы можете разместить до 4 каменных дверей на внешней стене крепости.","Внутри закрытой области находится не
