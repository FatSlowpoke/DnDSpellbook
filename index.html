х вы видите, должны совершить спасброски Харизмы. Пока заклинание активно, каждый раз, когда цель, провалившая этот спасбросок, совершает бросок атаки или спасбросок, она должна бросать d4 и вычитать выпавший результат из броска атаки или спасброска."],"higher":["Если вы накладываете это заклинание, используя ячейку 2-го уровня или выше, вы можете сделать целью одно дополнительное существо за каждый уровень ячейки выше первого."],"custom":true},{"id":"cmqwcm20j3sx","name":"Разговор с животными","level":1,"classes":["bard","druid","ranger"],"time":"1 действие","range":"На себя","dur":"10 минут","conc":false,"rit":true,"desc":["Пока заклинание активно, вы получаете возможность понимать Зверей и общаться с ними устно. Знание и сознание многих Зверей ограничено их интеллектом, но они как минимум могут дать информацию о ближайших местах и чудовищах, включая тех, кого они видели за последний день. На усмотрение Мастера, вы можете попытаться убедить Зверя оказать вам небольшую помощь."],"higher":[],"custom":true},{"id":"cmqwcm8bm4za","name":"Сверкающие брызги","level":1,"classes":["bard","sorcerer","wizard"],"time":"1 действие","range":"На себя (15-футовый конус)","dur":"1 раунд","conc":false,"rit":false,"desc":["Из вашей руки вылетают яркие разноцветные лучи. Бросьте 6d10; результат покажет, сколько хитов существ попадает под эффект. Существа в 3-клеточном конусе, исходящем от вас, попадают под эффект в порядке увеличения текущих хитов (игнорируя тех, кто без сознания и не может видеть).","Начиная с существа с наименьшим числом текущих хитов, все существа, попавшие под действие заклинания, становятся ослеплёнными до конца вашего следующего хода. Вычитайте из остатка хиты уже ослеплённых существ и переходите к следующим. Хиты существа не должны превышать остаток, чтобы это существо попало под действие заклинания."],"higher":["Если вы накладываете это заклинание, используя ячейку 2-го уровня или выше, бросайте дополнительно 2d10 за каждый уровень ячейки выше первого."],"custom":true},{"id":"cmqwcmf62exm","name":"Сглаз","level":1,"classes":["warlock"],"time":"1 бонусное действие","range":"18","dur":"До 1 часа","conc":true,"rit":false,"desc":["Вы проклинаете существо, которое видите в пределах дистанции. Пока заклинание активно, вы наносите цели дополнительно 1d6 урона некротической энергией каждый раз, когда попадаете по ней атакой. Кроме того, выберите одну характеристику, когда накладываете заклинание. Цель совершает с помехой проверки выбранной характеристики.","Если хиты цели опускаются до 0, пока заклинание активно, вы можете в один из своих следующих ходов бонусным действием проклясть новое существо.","Заклинание снятие проклятия [remove curse], наложенное на цель, оканчивает это заклинание преждевременно."],"higher":["Если вы накладываете это заклинание, используя ячейку 3-го или 4-го уровня, вы можете поддерживать концентрацию на нём до 8 часов. Если вы используете ячейку заклинания 5-го уровня или выше, вы можете поддерживать концентрацию на нём до 24 часов."],"custom":true},{"id":"cmqwcmlv3rny","name":"Сигнал тревоги","level":1,"classes":["artificer","ranger","wizard"],"time":"1 минута","range":"6","dur":"8 часов","conc":false,"rit":true,"desc":["Вы устанавливаете сигнализацию на случай вторжения. Выберите дверь, окно или область в пределах дистанции не больше куба с длиной ребра 4 клетки. До окончания действия заклинания тревога уведомляет вас каждый раз, когда охраняемой области касается или входит в неё существо с размером не меньше Крошечного. При накладывании заклинания вы можете указать существ, которые не будут вызывать срабатывание тревоги. Вы также выбираете, мысленной будет тревога или слышимой.","Мысленная тревога предупреждает вас звоном в сознании, если вы находитесь в пределах 1 мили от охраняемой области. Этот звон пробуждает вас, если вы спите.","Слышимая тревога издает звон колокольчика в течение 10 секунд в пределах 12 клеток."],"higher":[],"custom":true},{"id":"cmqwcmsmappr","name":"Силок","level":1,"classes":["artificer","druid","ranger","wizard"],"time":"1 минута","range":"Касание","dur":"8 часов","conc":false,"rit":false,"desc":["Когда вы накладываете это заклинание, вы используете верёвку, чтобы создать круг с радиусом 1 клетки на земле или на полу. По завершении этого процесса верёвка исчезает, и круг становится волшебной ловушкой.","Эта ловушка почти невидима. Чтобы её заметить, требуется совершить успешную проверку Интеллекта (Расследование) против Сл вашего заклинания.","Ловушка срабатывает, когда Маленькое, Среднее или Большое существо перемещается по земле или полу в зоне действия заклинания. Это существо должно преуспеть в спасброске Ловкости, иначе будет волшебным образом поднято в воздух и останется висеть вверх ногами на высоте 3 фута над землёй или полом. Существо опутано на этом месте, пока заклинание не окончится.","Опутанное существо может совершать спасбросок Ловкости в конце каждого своего хода, оканчивая на себе эффект при успехе. В качестве альтернативы существо или кто-то другой, кто может дотянуться до него, может действием совершить проверку Интеллекта (Магия) против Сл вашего заклинания. При успехе удерживающий эффект оканчивается.","После срабатывания ловушки заклинание заканчивается, если никакое существо им больше не удерживается."],"higher":[],"custom":true},{"id":"cmqwcmzg2ad6","name":"Тензеров парящий диск","level":1,"classes":["wizard"],"time":"1 действие","range":"6","dur":"1 час","conc":false,"rit":true,"desc":["Это заклинание создает круглый горизонтальный диск из силового поля диаметром 3 фута и толщиной 1 дюйм (2,5 см), парящий в 3 футах над полом в свободном пространстве на ваш выбор, видимом в пределах дистанции. Диск существует, пока заклинание активно, и может вынести на себе 500 фунтов. Если на него поместить больший вес, заклинание окончится, и все, что было на диске, падает на пол.","Диск неподвижен, пока вы находитесь в пределах 4 клеток от него. Если вы переместитесь от него на расстояние, превышающее 4 клетки, диск следует за вами, оставаясь в пределах 4 клеток. Он может перелетать по неровной поверхности, перемещаться по лестницам, склонам и подобным препятствиям, но не может пересекать перепады по высоте в 2 клетки и более. Например, диск не сможет перелететь над 2-клеточной ямой, и не сможет из неё выбраться, если будет создан на её дне.","Если вы переместитесь более чем на 20 клеток от диска (например, если он из-за препятствия не сможет последовать за вами), заклинание оканчивается."],"higher":[],"custom":true},{"id":"cmqwcn62ee7y","name":"Убежище","level":1,"classes":["artificer","cleric"],"time":"1 бонусное действие","range":"6","dur":"1 минута","conc":false,"rit":false,"desc":["Вы защищаете одно существо в пределах дистанции от атаки. Пока заклинание активно, все существа, нацеливающиеся на защищённое существо атаками или вредоносными заклинаниями, должны вначале совершить спасбросок Мудрости. При провале существо должно выбрать новую цель или потеряет атаку или заклинание. Это заклинание не защищает от эффектов, действующих на площадь, таких как взрыв огненного шара [fireball].","Это заклинание оканчивается, если защищённое существо совершает атаку, накладывает заклинание, воздействующее на враждебное существо, или наносит урон другому существу."],"higher":[],"custom":true},{"id":"cmqwcncpktun","name":"Удар Зефира","level":1,"classes":["ranger"],"time":"1 бонусное действие","range":"На себя","dur":"До 1 минуты","conc":true,"rit":false,"desc":["Вы движетесь подобно ветру. Пока действует заклинание, ваше движение не вызывает провоцированных атак.","Единожды до окончания действия заклинания вы можете получить преимущество на одну атаку оружием в свой ход. Эта атака наносит дополнительно 1d8 урона силовым полем при попадании. Вне зависимости от того, попали вы или промахнулись, ваша скорость ходьбы увеличивается на 6 клеток до конца этого хода."],"higher":[],"custom":true},{"id":"cmqwcnj9f5d4","name":"Цветной шарик","level":1,"classes":["sorcerer","wizard"],"time":"1 действие","range":"18","dur":"Мгновенная","conc":false,"rit":false,"desc":["Вы бросаете 4-дюймовую сферу энергии в существо, которое видите в пределах дистанции. Выберите звук, кислоту, огонь, холод, электричество или яд при создании сферы, а затем совершите по цели дальнобойную атаку заклинанием. Если атака попадает, существо получает 3d8 урона выбранного вида."],"higher":["Если вы накладываете это заклинание, используя ячейку 2-го уровня или выше, урон увеличивается на 1d8 за каждый уровень ячейки выше первого."],"custom":true},{"id":"cmqwcnpoxbe6","name":"Чудо-ягоды","level":1,"classes":["druid","ranger"],"time":"1 действие","range":"Касание","dur":"Мгновенная","conc":false,"rit":false,"desc":["В вашей руке появляются до десяти ягод, наполненных магией. Любое существо может действием съесть одну ягоду. Это восстанавливает 1 хит, и ягода настолько питательна, что насыщает существо на весь день.","Ягоды теряют силу, если их не съесть через 24 часа после создания."],"higher":[],"custom":true},{"id":"cmqwcnzvj2b0","name":"Щит","level":1,"classes":["sorcerer","wizard"],"time":"Реакция","range":"На себя","dur":"1 раунд","conc":false,"rit":false,"desc":["Появляется невидимый барьер из магической силы, что вас защищает. До начала своего следующего хода вы получаете бонус +5 к КД, и в том числе против той атаки, что вызвала срабатывание заклинания. Кроме того, вы не получаете урон от заклинания волшебная стрела [magic missile]."],"higher":[],"custom":true},{"id":"cmqwctya2pgf","name":"Божественное благоволение","level":1,"classes":["paladin"],"time":"1 бонусное действие","range":"На себя","dur":"До 1 минуты","conc":true,"rit":false,"desc":["Ваша молитва наполняет вас божественной энергией. Пока заклинание активно, ваши атаки оружием причиняют при попадании дополнительный урон 1d4 излучением."],"higher":[],"custom":true},{"id":"cmqwcunzgopl","name":"Волшебная стрела Джима","level":1,"classes":["wizard"],"time":"1 действие","range":"24","dur":"Мгновенная","conc":false,"rit":false,"desc":["Вы создаете три вращающихся свистящих гипоаллергенных безглютеновых дротика из магической силы. Каждый нацелен на существо по вашему выбору, которое вы можете видеть в пределах дистанции. Совершите дальнобойную атаку заклинанием для каждого дротика. При попадании дротик наносит своей цели урон силовым полем 2d4.","Если бросок атаки критический, то цель этого дротика получает урон силовым полем 5d4 вместо того, чтобы вам дважды бросать урон за критический удар.","Если бросок атаки для любого из дротиков равен 1, то все дротики промахиваются мимо своих целей и взрываются у вас перед носом, нанося вам 1 урон силовым полем за каждый дротик."],"higher":["Если вы накладываете это заклинание, используя ячейку 2-го уровня или выше, заклинание создает по одному дополнительному дротику за каждый уровень ячейки выше первого. Также увеличивается стоимость на 1 зм, за каждую ячейку выше первого уровня."],"custom":true},{"id":"cmqwcutr7dvy","name":"Вызов на дуэль","level":1,"classes":["paladin"],"time":"1 бонусное действие","range":"6","dur":"До 1 минуты","conc":true,"rit":false,"desc":["Вы пытаетесь вызвать существо на дуэль. Одно существо, которое вы видите в пределах дистанции, должно совершить спасбросок Мудрости. При провале существо концентрирует своё внимание на вас, следуя вашему божественному требованию. Пока заклинание активно, это существо совершает с помехой броски атаки по всем существам кроме вас, и должно совершать спасброски Мудрости каждый раз, когда пытается переместиться в пространство, находящееся более чем в 6 клетках от вас; в случае успеха это заклинание не ограничивает перемещения цели в этот ход.","Заклинание оканчивается, если вы атакуете другое существо, если вы накладываете заклинание, нацеленное на враждебное существо, но не на цель, если дружественное вам существо причиняет цели урон или накладывает на неё вредоносное заклинание, или если вы оканчиваете ход далее, чем в 6 клетках от цели."],"higher":[],"custom":true},{"id":"cmqwcuyimfhj","name":"Вызов страха","level":1,"classes":["warlock","wizard"],"time":"1 действие","range":"12","dur":"До 1 минуты","conc":true,"rit":false,"desc":["Вы пробуждаете ощущение смертности у одного существа, которое можете видеть в пределах дистанции. Конструкты или Нежить имеют иммунитет к этому эффекту. Цель должна преуспеть в спасброске Мудрости, иначе становится испуганной вами пока заклинание не окончится. Испуганное существо может повторять спасброски в конце каждого своего хода, оканчивая эффект на себе при успехе."],"higher":["Когда вы накладываете это заклинание, используя ячейку 2-го уровня или выше, вы можете сделать целью дополнительно ещё одно существо за каждый уровень ячейки выше 1-й. Выбранные существа должны находиться в пределах 6 клеток друг от друга."],"custom":true},{"id":"cmqwcv3pqq07","name":"Град шипов","level":1,"classes":["ranger"],"time":"1 бонусное действие","range":"На себя","dur":"До 1 минуты","conc":true,"rit":false,"desc":["В следующий раз, когда вы попадёте по существу дальнобойной атакой оружием, пока активно это заклинание, из дальнобойного оружия или боеприпаса вылетит град шипов. В дополнение к обычному эффекту атаки, цель и все существа в пределах 1 клетки от неё, должны совершить спасбросок Ловкости. При провале существо получает колющий урон 1d10, или половину этого урона при успехе."],"higher":["Если вы накладываете это заклинание, используя ячейку 2-го уровня или выше, урон увеличивается на 1d10 за каждый уровень ячейки выше первого (до максимума 6d10)."],"custom":true},{"id":"cmqwcv8pbd5y","name":"Громовая кара","level":1,"classes":["paladin"],"time":"1 бонусное действие","range":"На себя","dur":"До 1 минуты","conc":true,"rit":false,"desc":["В первый раз, когда вы попадаете рукопашной атакой оружием, пока заклинание активно, ваше оружие издаёт громовой рокот, слышимый с расстояния 60 клеток, и атака причиняет цели дополнительный урон звуком 2d6. Кроме того, если цель — существо, она должна преуспеть в спасброске Силы, иначе она будет оттолкнута на 2 клетки от вас и сбита с ног."],"higher":[],"custom":true},{"id":"cmqwcvfb0w3r","name":"Доспехи мага","level":1,"classes":["sorcerer","wizard"],"time":"1 действие","range":"Касание","dur":"8 часов","conc":false,"rit":false,"desc":["Вы касаетесь согласного существа, не носящего доспех, и на время действия заклинания его окутывает защитное магическое поле. Базовый КД существа становится равен 13 + его модификатор Ловкости. Заклинание оканчивается, если цель надевает доспех или вы оканчиваете его действием."],"higher":[],"custom":true},{"id":"cmqwcvlsdpjb","name":"Дрожь земли","level":1,"classes":["bard","druid","sorcerer","wizard"],"time":"1 действие","range":"2","dur":"Мгновенная","conc":false,"rit":false,"desc":["Вы сотрясаете землю в пределах дистанции. Все существа, кроме вас, в этой области должны совершить спасбросок Ловкости. При провале существо получает 1d6 дробящего урона и сбивается с ног. Если поверхность представляет собой рыхлую землю или камень, то область воздействия становится труднопроходимой местностью до тех пор, пока её не расчистят. Каждая область диаметром 1 клетка требует как минимум 1 минуту на расчистку вручную."],"higher":["Если вы накладываете это заклинание, используя ячейку 2-го уровня или выше, то урон увеличивается на 1d6 за каждый уровень ячейки выше 1-го."],"custom":true},{"id":"cmqwcvqlwqep","name":"Дружба с животными","level":1,"classes":["bard","druid","ranger"],"time":"1 действие","range":"6","dur":"24 часа","conc":false,"rit":false,"desc":["Это заклинание позволяет убедить Зверя, что вы не намерены причинять ему вред. Выберите Зверя, которого вы видите в пределах дистанции. Он должен видеть и слышать вас. Если Интеллект Зверя 4 и больше, то заклинание проваливается. В противном случае Зверь должен преуспеть в спасброске Мудрости, иначе он станет очарованным на время действия заклинания. Если вы или один из ваших спутников причинит цели вред, заклинание окончится."],"higher":["Если вы накладываете это заклинание, используя ячейку 2-го уровня или выше, вы можете воздействовать на одного дополнительного Зверя за каждый уровень ячейки выше первого."],"custom":true},{"id":"cmqwcvwgjdnl","name":"Звериные узы","level":1,"classes":["druid","ranger"],"time":"1 действие","range":"Касание","dur":"До 10 минут","conc":true,"rit":false,"desc":["Вы устанавливаете телепатическую связь с одним Зверем, которого касаетесь, если он дружественен вам или очарован вами. Заклинание терпит неудачу, если Интеллект Зверя больше 3. Пока заклинание действует, связь активна, если вы и Зверь находитесь в пределах прямой видимости. Связь позволяет Зверю понимать ваши телепатические сообщения, и он может телепатически передавать простые эмоции и образы обратно вам. Пока связь активна, Зверь совершает с преимуществом броски атаки против любого существа в пределах 1 клетки от вас, которое вы можете видеть."],"higher":[],"custom":true},{"id":"cmqwcw15oqwv","name":"Искусная острота","level":1,"classes":["bard","sorcerer","wizard"],"time":"Реакция","range":"12","dur":"Мгновенная","conc":false,"rit":false,"desc":["Вы магическим образом отвлекаете спровоцировавшее реакцию существо и превращаете его секундное замешательство в ободрение другого существа. Спровоцировавшее вас существо должно повторно совершить бросок d20 и использовать меньшее значение.","После этого вы можете выбрать другое существо, которое видите в пределах дистанции (вы можете выбрать себя). Выбранное существо совершит с преимуществом следующий бросок атаки, проверку характеристики или спасбросок, который оно совершит в течение 1 минуты. Существо может иметь на себе лишь одно усиление от этого заклинания за раз."],"higher":[],"custom":true},{"id":"cmqwcw5xduqp","name":"Лечение ран","level":1,"classes":["artificer","bard","cleric","druid","paladin","ranger"],"time":"1 действие","range":"Касание","dur":"Мгновенная","conc":false,"rit":false,"desc":["Существо, которого вы касаетесь, восстанавливает количество хитов, равное 1d8 + ваш модификатор базовой характеристики. Это заклинание не оказывает никакого эффекта на Нежить и Конструктов."],"higher":["Если вы накладываете это заклинание, используя ячейку 2-го уровня или выше, лечение увеличивается на 1d8 за каждый уровень ячейки выше первого."],"custom":true},{"id":"cmqwcwckin1o","name":"Луч болезни","level":1,"classes":["sorcerer","wizard"],"time":"1 действие","range":"12","dur":"Мгновенная","conc":false,"rit":false,"desc":["Луч тошнотворно-зеленой энергии устремляется к существу, находящемуся в пределах дистанции. Совершите дальнобойную атаку заклинанием по цели. При попадании цель получает урон ядом 2d8 и должна совершить спасбросок Телосложения. При провале она становится также отравленной до конца вашего следующего хода."],"higher":["Если вы накладываете это заклинание, используя ячейку 2-го уровня или выше, урон увеличивается на 1d8 за каждый уровень ячейки выше первого."],"custom":true},{"id":"cmqwcwhrv4rk","name":"Метка охотника","level":1,"classes":["ranger"],"time":"1 бонусное действие","range":"18","dur":"До 1 часа","conc":true,"rit":false,"desc":["Вы выбираете существо, видимое в пределах дистанции, и объявляете его своей добычей. Пока заклинание активно, вы наносите цели дополнительно 1d6 урона каждый раз, когда попадаете по ней атакой оружием, и вы совершаете с преимуществом проверки Мудрости (Восприятие) и Мудрость (Выживание), совершённые для её поиска. Если хиты цели опускаются до 0, пока заклинание активно, вы можете в один из своих следующих ходов бонусным действием выбрать целью новое существо."],"higher":["Если вы накладываете это заклинание, используя ячейку 3-го или 4-го уровня, вы можете поддерживать концентрацию 8 часов. Если вы используете ячейку заклинания 5-го уровня или выше, вы можете поддерживать концентрацию 24 часа."],"custom":true},{"id":"cmqwcwmms9i8","name":"Невидимое письмо","level":1,"classes":["bard","warlock","wizard"],"time":"1 минута","range":"Касание","dur":"10 дней","conc":false,"rit":true,"desc":["Вы пишете на пергаменте, бумаге или другом подходящем материале, и накрываете его иллюзией, существующей, пока активно заклинание.","Для вас и всех существ, указанных вами при накладывании заклинания, письмена кажутся обычными, написанными вашей рукой, и передающими тот самый смысл, который вкладывали вы. Для всех остальных письмена кажутся написанными на неизвестном или магическом языке, который невозможно прочитать. В качестве альтернативы вы можете заставить письмена поменять смысл, или сделать так, чтобы они выглядели написанными другой рукой или на другом языке, но язык при этом должен быть тем, который вы знаете.","Если заклинание рассеять, исчезает и исходное письмо и иллюзия.","Существо с истинным зрением может читать скрытое послание."],"higher":[],"custom":true},{"id":"cmqwcwrs15vv","name":"Невидимый слуга","level":1,"classes":["bard","warlock","wizard"],"time":"1 действие","range":"12","dur":"1 час","conc":false,"rit":true,"desc":["Это заклинание создает невидимую, бессознательную и бесформенную силу Среднего размера, выполняющую отдаваемые вами простые поручения. Слуга появляется в свободном пространстве на земле в пределах дистанции. У него КД 10, 1 хит, Сила 2, и он не может атаковать. Если его хиты опускаются до 0, заклинание оканчивается.","Один раз в каждом своем ходу вы можете бонусным действием отдать команду слуге переместиться на 3 клетки и совершить манипуляции с каким-нибудь предметом. Слуга может выполнять простые задачи, доступные человеку, такие как подношение предметов, чистка, починка и складывание одежды, разжигание костра, подача пищи и разливание вина. Получив команду, слуга начинает её выполнять, стараясь изо всех сил, пока не выполнит, после чего начинает ждать вашу следующую команду.","Если вы отдаёте слуге поручение, из-за которого тот окажется дальше чем в 12 клетках от вас, заклинание оканчивается."],"higher":[],"custom":true},{"id":"cmqwcwwajlq9","name":"Опознание","level":1,"classes":["artificer","bard","wizard"],"time":"1 минута","range":"Касание","dur":"Мгновенная","conc":false,"rit":true,"desc":["Вы выбираете один предмет, не переставая касаться его во время всего накладывания заклинания. Если это магический предмет, вы узнаете его свойства, способ их использования, требуется ли для использования настройка на него, и сколько осталось зарядов, если они есть. Вы узнаете, действуют ли в данный момент заклинания на этот предмет, и что это за заклинания. Если предмет был создан заклинанием, вы узнаете, что это было за заклинание.","Если вы вместо этого во время накладывания заклинания касаетесь существа, вы узнаете, какие заклинания в данный момент действуют на него."],"higher":[],"custom":true},{"id":"cmqwcx0kp3bm","name":"Опутывание","level":1,"classes":["druid","ranger"],"time":"1 действие","range":"18","dur":"До 1 минуты","conc":true,"rit":false,"desc":["Из точки на земле в пределах дистанции на площади квадрата с длиной стороны в 4 клетки вырастают цепкие травы и плети. Пока заклинание активно, эти растения превращают землю в труднопроходимую местность.","Существа, находящиеся в этой области, когда вы накладываете заклинание, должны преуспеть в спасброске Силы, иначе они станут опутанными растениями до окончания действия заклинания. Опутанное растениями существо может действием совершать проверки Силы против Сл ваших заклинаний. В случае успеха оно освобождается.","Когда заклинание оканчивается, вызванные растения увядают."],"higher":[],"custom":true},{"id":"cmqwcx525vja","name":"Опутывающий удар","level":1,"classes":["ranger"],"time":"1 бонусное действие","range":"На себя","dur":"До 1 минуты","conc":true,"rit":false,"desc":["Когда вы в следующий раз попадёте по существу атакой оружием, пока заклинание активно, в точке удара появляется извивающаяся масса растений с шипами, и цель должна преуспеть в спасброске Силы, иначе она станет опутана магическими плетьми, пока заклинание активно. Существа Большого размера или более совершают этот спасбросок с преимуществом. Если цель преуспевает в спасброске, плети усыхают.","Будучи опутанной этим заклинанием, цель получает 1d6 колющего урона в начале каждого своего хода. Опутанное существо или существо, способное коснуться его, может действием совершить проверку Силы против Сл ваших заклинаний. При успехе цель освобождается."],"higher":["Если вы накладываете это заклинание, используя ячейку 2-го уровня или выше, урон увеличивается на 1d6 за каждый уровень ячейки выше первого."],"custom":true},{"id":"cmqwcx98lzkd","name":"Очарование личности","level":1,"classes":["bard","druid","sorcerer","warlock","wizard"],"time":"1 действие","range":"6","dur":"1 час","conc":false,"rit":false,"desc":["Вы пытаетесь очаровать Гуманоида, которого видите в пределах дистанции. Он должен совершить спасбросок Мудрости; с преимуществом, если вы или ваши спутники сражаетесь с ним. Если он проваливает спасбросок, он очарован вами, пока заклинание активно или пока вы или ваши спутники не причините ему вред. Очарованное существо считает вас своим другом. Когда заклинание оканчивается, существо знает, что было очаровано вами."],"higher":["Если вы накладываете это заклинание, используя ячейку 2-го уровня или выше, вы можете сделать целью одно дополнительное существо за каждый уровень ячейки выше первого. Эти существа должны находиться в пределах 6 клеток друг от друга, чтобы вы могли на них нацелиться."],"custom":true},{"id":"cmqwcxdeyynv","name":"Очищение пищи и питья","level":1,"classes":["artificer","cleric","druid","paladin"],"time":"1 действие","range":"2","dur":"Мгновенная","conc":false,"rit":true,"desc":["Вся немагическая еда и питьё в пределах сферы с радиусом 1 клетки с центром на точке, выбранной вами в пределах дистанции, очищается и избавляется от ядов и болезней."],"higher":[],"custom":true},{"id":"cmqwcxioeyj5","name":"Поспешное отступление","level":1,"classes":["artificer","sorcerer","warlock","wizard"],"time":"1 бонусное действие","range":"На себя","dur":"До 10 минут","conc":true,"rit":false,"desc":["Это заклинание позволяет перемещаться с невероятной скоростью. Когда вы накладываете это заклинание, а также бонусным действием в последующие ходы, пока активно заклинание, вы можете совершать действие Рывок."],"higher":[],"custom":true},{"id":"cmqwcxovinq1","name":"Приказ","level":1,"classes":["bard","cleric","paladin"],"time":"1 действие","range":"12","dur":"1 раунд","conc":false,"rit":false,"desc":["Вы произносите команду из одного слова существу, которое видите в пределах дистанции. Цель должна преуспеть в спасброске Мудрости, иначе в свой следующий ход будет исполнять эту команду. Заклинание не оказывает эффект, если цель — Нежить, если цель не понимает ваш язык, или если ваша команда ему напрямую вредит.","Ниже описаны самые типичные команды и их эффекты. Вы можете отдавать и другие команды. В этом случае поведение цели определяет Мастер. Если цель не может выполнить вашу команду, заклинание оканчивается.","Брось. Цель роняет то, что держит, и оканчивает ход.","Падай. Цель падает ничком и оканчивает ход.","Подойди. Цель перемещается ближе к вам по кратчайшему и самому прямому маршруту, оканчивая ход, если оказывается в пределах 1 клетки от вас.","Стой. Цель не перемещается и не совершает никаких действий. Летающее существо продолжает лететь, при условии, что может это делать. Если оно должно лететь, чтобы не упасть, то пролетает минимально необходимое расстояние.","Убегай. Цель тратит ход на то, что перемещается прочь от вас самым быстрым способом."],"higher":["Если вы накладываете это заклинание, используя ячейку 2-го уровня или выше, вы можете воздействовать на одно дополнительное существо за каждый уровень ячейки выше первого. Существа должны находиться в пределах 6 клеток друг от друга, чтобы стать целями."],"custom":true},{"id":"cmqwcxtp2bmd","name":"Притяжение","level":1,"classes":[],"time":"1 действие","range":"12","dur":"1 раунд","conc":false,"rit":false,"desc":["Сила притяжения увеличивается на некоторое время в сфере с радиусом 2 клеток, центром которой является видимая точка пространства в пределах дальности. В момент появления сферы, все существа в её пределах должны совершить спасбросок Телосложения. При провале существо получает 2d8 урона силовым полем, и его скорость уменьшена вдвое до конца его следующего хода. В случае успеха существо получает половину урона и его скорость не уменьшается.","До конца вашего следующего хода, чтобы в сфере поднять или сдвинуть предмет, который никто не несёт и не носит, необходимо преуспеть в проверке Силы Сл вашего спасброска заклинаний."],"higher":["Если вы накладываете это заклинание, используя ячейку 2-го уровня или выше, урон увеличивается на 1d8 за каждый уровень ячейки выше первого."],"custom":true},{"id":"cmqwcxxnxdvo","name":"Прыжок","level":1,"classes":["artificer","druid","ranger","sorcerer","wizard"],"time":"1 действие","range":"Касание","dur":"1 минута","conc":false,"rit":false,"desc":["Вы касаетесь существа. Пока заклинание активно, расстояние прыжка этого существа увеличивается в три раза."],"higher":[],"custom":true},{"id":"cmqwcy27wigd","name":"Псевдожизнь","level":1,"classes":["artificer","sorcerer","wizard"],"time":"1 действие","range":"На себя","dur":"1 час","conc":false,"rit":false,"desc":["Укрепив себя некромантским подобием жизни, вы получаете 1d4 + 4 временных хита на время длительности заклинания."],"higher":["Если вы накладываете это заклинание, используя ячейку 2-го уровня или выше, вы получаете 5 дополнительных временных хитов за каждый уровень ячейки выше первого."],"custom":true},{"id":"cmqwcycidl1u","name":"Руки Хадара","level":1,"classes":["warlock"],"time":"1 действие","range":"На себя (10-футовый радиус)","dur":"Мгновенная","conc":false,"rit":false,"desc":["Вы взываете к мощи Хадара, Тёмного Голода. Из вас вырываются щупальца из тёмной энергии, бьющие всех существ в пределах 2 клеток. Все существа в этой области должны совершить спасбросок Силы. При провале цель получает 2d6 урона некротической энергией и не может совершать реакции до своего следующего хода. При успехе существо получает половину урона, и других эффектов нет."],"higher":["Если вы накладываете это заклинание, используя ячейку 2-го уровня или выше, урон увеличивается на 1d6 за каждый уровень ячейки выше первого."],"custom":true},{"id":"cmqwcylnig8u","name":"Скольжение","level":1,"classes":["artificer","sorcerer","wizard"],"time":"1 действие","range":"12","dur":"1 минута","conc":false,"rit":false,"desc":["Скользкий жир покрывает пол в квадрате с длиной стороны 2 клетки с центром на точке в пределах дистанции, делая эту местность труднопроходимой, пока заклинание активно.","Когда жир появляется, все существа, стоящие в этой области, должны преуспеть в спасброске Ловкости, иначе они падают ничком. Существа, входящие в эту область или оканчивающие там ход, тоже должны преуспеть в спасброске Ловкости, чтобы не упасть."],"higher":[],"custom":true},{"id":"cmqwcyt3fuvf","name":"Скороход","level":1,"classes":["artificer","bard","druid","ranger","wizard"],"time":"1 действие","range":"Касание","dur":"1 час","conc":false,"rit":false,"desc":["Вы касаетесь существа. Пока заклинание активно, скорость существа увеличивается на 2 клетки."],"higher":["Если вы накладываете это заклинание, используя ячейку 2-го уровня или выше, вы можете сделать целью одно дополнительное существо за каждый уровень ячейки выше первого."],"custom":true},{"id":"cmqwcz81kbq7","name":"Снаряд хаоса","level":1,"classes":["sorcerer"],"time":"1 действие","range":"24","dur":"Мгновенная","conc":false,"rit":false,"desc":["Вы бросаете волнистую, трепещущую массу хаотической энергии в одно существо в радиусе действия. Совершите дальнобойную атаку заклинанием по существу. При попадании цель получает 2d8 + 1d6 урона. Выберите одну из брошенных костей d8. Выпавшее число определяет вид урона атаки, как показано ниже.","d8 - Вид урона\n1 - Звук\n2 - Кислота\n3 - Огонь\n4 - Психическая энергия\n5 - Силовое поле\n6 - Холод\n7 - Электричество\n8 - Яд","Если вы выбрасываете одинаковое значение на обоих d8, хаотическая энергия прыгает с цели на другое существо по вашему выбору в пределах 6 клеток от неё. Совершите новый бросок атаки против новой цели и совершите новый бросок урона, который может привести к тому, что хаотическая энергия снова перескочит.","Существо может быть целью только один раз за каждое накладывание этого заклинания."],"higher":["Если вы накладываете это заклинание, используя ячейку 2-го уровня или выше, каждая цель получает дополнительно 1d6 урона за каждый уровень ячейки выше 1."],"custom":true},{"id":"cmqwczehlmgm","name":"Сотворение или уничтожение воды","level":1,"classes":["cleric","druid"],"time":"1 действие","range":"6","dur":"Мгновенная","conc":false,"rit":false,"desc":["Вы либо создаёте либо уничтожаете воду.","Сотворение воды. Вы создаёте до 10 галлонов (45 литров) чистой воды в пределах дистанции в открытом контейнере. В качестве альтернативы вода выпадает дождём в кубе с длиной ребра 6 клеток в пределах дальности, туша открытое пламя.","Уничтожение воды. Вы уничтожаете до 10 галлонов (45 литров) воды в открытом контейнере в пределах дистанции. В качестве альтернативы вы уничтожаете туман в кубе с длиной ребра 6 клеток в пределах дистанции."],"higher":["Если вы накладываете это заклинание, используя ячейку 2-го уровня или выше, вы создаёте или уничтожаете 10 дополнительных галлонов (45 литров) воды, и длина ребра куба увеличивается на 1 клетка за каждый уровень ячейки выше первого."],"custom":true},{"id":"cmqwczjsnhrz","name":"Туманное облако","level":1,"classes":["druid","ranger","sorcerer","wizard"],"time":"1 действие","range":"24","dur":"До 1 часа","conc":true,"rit":false,"desc":["Вы создаете сферу с радиусом 4 клеток из тумана с центром на точке в пределах дистанции. Сфера обходит углы, и её пространство — сильно заслонённая местность. Она существует до окончания действия заклинания, или пока её не рассеет ветер (со скоростью как минимум 10 миль в час)."],"higher":["Если вы накладываете это заклинание, используя ячейку 2-го уровня или выше, радиус тумана увеличивается на 4 клетки за каждый уровень ячейки выше первого."],"custom":true},{"id":"cmqwczo9i6jp","name":"Усыпление","level":1,"classes":["bard","sorcerer","wizard"],"time":"1 действие","range":"18","dur":"1 минута","conc":false,"rit":false,"desc":["Это заклинание посылает существ в магический сон. Бросьте 5d8; результат будет количеством хитов существ, на которых это заклинание может подействовать. Существа в пределах 4 клеток от точки, выбранной вами в пределах дистанции, попадают под действие в порядке увеличения их текущих хитов (игнорируя тех, что находятся без сознания).","Начиная с существа с наименьшим количеством текущих хитов все существа, попадающие под действие этого заклинания, теряют сознание до окончания действия заклинания, пока не получат урон, или пока кто-нибудь другой не разбудит их, потратив действие на тряску или пощечину. Вычитайте хиты каждого существа из общей суммы, после чего переходите к следующему существу с наименьшим числом хитов. Для того чтобы существо попало под действие заклинания, нужно чтобы количество её текущих хитов не превышало оставшуюся сумму.","Нежить и существа, обладающие иммунитетом к очарованию, не попадают под действие этого заклинания."],"higher":["Если вы накладываете это заклинание, используя ячейку 2-го уровня или выше, бросайте дополнительно 2d8 за каждый уровень ячейки выше первого."],"custom":true},{"id":"cmqwczuiw6i3","name":"Церемония","level":1,"classes":["cleric","paladin"],"time":"1 час","range":"Касание","dur":"Мгновенная","conc":false,"rit":true,"desc":["Вы совершаете особую религиозную церемонию, наполненную магией. Когда вы накладываете заклинание, выберите один из следующих обрядов, цель которого должна находиться в пределах 2 клеток от вас во время накладывания.","Благословение воды. Вы прикасаетесь к одной фляге воды и делаете её святой водой.","Венчание. Вы касаетесь взрослых Гуманоидов, желающих связать себя узами брака. В течение следующих 7 дней каждая цель получает бонус +2 к КД пока они находятся в пределах 6 клеток друг от друга. Существо может получить преимущества от этого обряда снова, только если оно овдовело.","Заупокойный обряд. Вы касаетесь одного трупа, и в течение следующих 7 дней цель не может стать Нежитью, кроме как с помощью заклинания исполнения желаний [wish].","Искупление. Вы касаетесь одного согласного существа, чьё мировоззрение было изменено, и совершаете проверку Мудрости (Проницательность) Сл 20. При успехе вы возвращаете цели её изначальное мировоззрение.","Посвящение. Вы касаетесь одного Гуманоида, который хочет посвятить себя служению вашему богу. На следующие 24 часа, каждый раз, когда цель совершает спасбросок, она может бросить d4 и добавить выпавшее число к результату. Существо может получить преимущества от этого обряда только единожды.","Становление. Вы касаетесь одного взрослого Гуманоида, который достиг совершеннолетия. На следующие 24 часа, каждый раз, когда цель совершает проверку характеристики, она может бросить d4 и добавить выпавшее число к результату. Существо может получить преимущества от этого обряда только единожды.","Вручение (). Вы касаетесь одного согласного Гуманоида. Выберите одно заклинание 1-го уровня, которое вы подготовили, и используйте ячейку заклинаний и материальные компоненты, как если бы вы наложили это заклинание. Заклинание не возымеет эффекта. Вместо этого цель может наложить это заклинание один раз, не тратя ячейку заклинаний и не используя материальные компоненты. Если цель не наложит вложенное заклинание в течение 1 часа, оно будет утеряно."],"higher":[],"custom":true},{"id":"cmqwd0046pf5","name":"Щит веры","level":1,"classes":["cleric","paladin"],"time":"1 бонусное действие","range":"12","dur":"До 10 минут","conc":true,"rit":false,"desc":["Появляется мерцающее поле, окружающее существо, выбранное вами в пределах дистанции, даруя ему на время длительности бонус +2 к КД."],"higher":[],"custom":true},{"id":"cmqwkn0elznh","name":"Бесследное передвижение","level":2,"classes":["druid","ranger"],"time":"1 действие","range":"На себя","dur":"До 1 часа","conc":true,"rit":false,"desc":["От вас начинает исходить покров теней и тишины, скрывающий вас и ваших спутников от обнаружения. Пока заклинание активно, все существа, выбранные вами в пределах 6 клеток (включая вас) получают бонус +10 к проверкам Ловкости (Скрытность), и их нельзя выследить без помощи магии. Существо, получившее этот бонус, не оставляет за собой следов."],"higher":[],"custom":true},{"id":"cmqwkn651axg","name":"Благословение удачи","level":2,"classes":[],"time":"1 минута","range":"12","dur":"1 час","conc":false,"rit":false,"desc":["Вы даруете искру потенциала себе или другому согласному существу, которое вы можете видеть в пределах дистанции. Когда выбранное существо совершает бросок атаки, проверку характеристики или спасбросок до окончания заклинания, оно может окончить заклинание на себе и бросить дополнительный d20 и решить, какой из бросков использовать. В качестве альтернативы, когда по выбранному существу совершается бросок атаки, оно может окончить заклинание на себе и бросить дополнительный d20 и решить, какой из бросков использовать: цели или противника. Если оригинальный бросок d20 совершался с преимуществом или помехой, существо совершает дополнительный бросок d20 после того, как оригинальный бросок был совершён с преимуществом или помехой."],"higher":["Если вы накладываете это заклинание, используя ячейку 3-го уровня или выше, вы можете сделать целью одно дополнительное существо за каждую ячейку выше второго."],"custom":true},{"id":"cmqwknbdi9bt","name":"Вечный огонь","level":2,"classes":["artificer","cleric","druid","wizard"],"time":"1 действие","range":"Касание","dur":"Пока не рассеяно","conc":false,"rit":false,"desc":["Из предмета, которого вы касаетесь, исходит пламя, эквивалентное по яркости пламени факела. Эффект выглядит как обычное пламя, но не создает тепла и не использует кислород. Вечный огонь можно накрыть или спрятать, но не потушить."],"higher":[],"custom":true},{"id":"cmqwkng2hxhz","name":"Видение невидимого","level":2,"classes":["artificer","bard","sorcerer","wizard"],"time":"1 действие","range":"На себя","dur":"1 час","conc":false,"rit":false,"desc":["Пока заклинание активно, вы видите невидимых существ и предметы, как если бы они были видимы, и ваше зрение простирается на Эфирный план. Эфирные существа и предметы выглядят призрачными и полупрозрачными."],"higher":[],"custom":true},{"id":"cmqwknlaw0nq","name":"Вихрь искривления","level":2,"classes":["artificer","sorcerer","wizard"],"time":"1 действие","range":"18","dur":"Мгновенная","conc":false,"rit":false,"desc":["Вы магическим образом сворачиваете пространство вокруг другого существа, которое видите в пределах дистанции. Цель должна преуспеть в спасброске Телосложения (цель может добровольно провалить), иначе будет телепортирована в незанятое пространство по вашему выбору, которое вы можете видеть в пределах дистанции заклинания.","Выбранное пространство должно находиться на поверхности или в жидкости; поверхность или жидкость должны быть способны поддерживать цель без необходимости протискиваться."],"higher":["Если вы накладываете это заклинание, используя ячейку 3-го уровня или выше, дистанция заклинания увеличивается на 6 клеток, за каждый уровень ячейки выше второго."],"custom":true},{"id":"cmqwknricnso","name":"Внушение","level":2,"classes":["bard","sorcerer","warlock","wizard"],"time":"1 действие","range":"6","dur":"До 8 часов","conc":true,"rit":false,"desc":["Вы внушаете определенный курс действий (ограниченный одной-двумя фразами) существу, видимому в пределах дистанции, способному слышать и понимать вас. Существа, которые не могут быть очарованы, обладают иммунитетом к этому эффекту. Внушение должно быть сформировано так, чтобы действие звучало разумным. Просьбы ударить себя мечом, броситься на копьё, сжечь себя, или как-то иначе причинить себе вред оканчивают заклинание.","Цель должна совершить спасбросок Мудрости. При провале она следует заданному курсу действий. Внушённые действия могут продолжаться всю длительность заклинания. Если внушённую деятельность можно выполнить за меньший срок, заклинание оканчивается, когда субъект оканчивает порученную задачу.","Вы можете также указать условие, которое запустит особое действие во время действия заклинания. Например, вы можете внушить рыцарю, чтобы он отдал своего боевого коня первому встреченному нищему. Если до окончания действия условие не будет выполнено, деятельность не совершается.","Если вы или кто-то из ваших спутников причиняете урон цели, заклинание оканчивается."],"higher":[],"custom":true},{"id":"cmqwknxn8a58","name":"Гадание","level":2,"classes":["cleric","druid","wizard"],"time":"1 минута","range":"На себя","dur":"Мгновенная","conc":false,"rit":true,"desc":["Подбрасывая инкрустированные камнями палочки, драконьи кости, раскладывая карты или используя другие инструменты для ворожбы, вы получаете знамение от иномировой сущности о результатах определённых действий, которые вы планируете совершить в течение следующих 30 минут. Мастер выбирает одно из следующих возможных знамений:","Благо, для хороших результатов","Горе, для плохих результатов","Благо и горе, для результатов, одновременно хороших и плохих","Ничто, для результатов, которые и не хорошие и не плохие","Заклинание не принимает в расчёт обстоятельства, способные изменить исход, такие как накладывание дополнительных заклинаний или потерю или обретение спутников.","Если вы накладываете это заклинание несколько раз до завершения продолжительного отдыха, существует накопительный шанс 25 процентов за каждое использование, начиная со второго, что вы получите случайный ответ. Мастер совершает этот бросок скрытно."],"higher":[],"custom":true},{"id":"cmqwko27dxfb","name":"Глухота/слепота","level":2,"classes":["bard","cleric","sorcerer","wizard"],"time":"1 действие","range":"6","dur":"1 минута","conc":false,"rit":false,"desc":["Вы можете ослепить врага или сделать его глухим. Выберите одно существо, которое видите в пределах дистанции, которое тут же совершает спасбросок Телосложения. В случае провала цель становится на время действия заклинания ослепшей или оглохшей (на ваш выбор). В конце каждого своего хода цель может совершать спасбросок Телосложения. При случае успеха заклинание оканчивается."],"higher":["Если вы накладываете это заклинание, используя ячейку 3-го уровня или выше, вы можете сделать целью одно дополнительное существо за каждый уровень ячейки выше второго."],"custom":true},{"id":"cmqwko703s59","name":"Дребезги","level":2,"classes":["bard","sorcerer","warlock","wizard"],"time":"1 действие","range":"12","dur":"Мгновенная","conc":false,"rit":false,"desc":["Из точки, выбранной вами в пределах дистанции, исходит громкий звонкий звук. Все существа в сфере с радиусом 2 клеток с центром на этой точке должны совершить спасбросок Телосложения. Существо получает 3d8 урона звуком при провале или половину этого урона при успехе. Существа, изготовленные из неорганической материи, такой как камень, кристалл или металл, совершают этот спасбросок с помехой.","Немагические объекты в области заклинания, которые никто не несёт и не носит, тоже получают урон."],"higher":["Если вы накладываете это заклинание, используя ячейку 3-го уровня или выше, урон увеличивается на 1d8 за каждый уровень ячейки выше второго."],"custom":true},{"id":"cmqwkobp4qph","name":"Дубовая кора","level":2,"classes":["druid","ranger"],"time":"1 действие","range":"Касание","dur":"До 1 часа","conc":true,"rit":false,"desc":["Вы касаетесь согласного существа. Пока заклинание активно, кожа цели становится грубой и похожей внешне на кору дуба, а КД не может быть ниже 16, вне зависимости от надетых доспехов."],"higher":[],"custom":true},{"id":"cmqwkofzx89p","name":"Животные чувства","level":2,"classes":["druid","ranger"],"time":"1 действие","range":"Касание","dur":"До 1 часа","conc":true,"rit":true,"desc":["Вы касаетесь согласного Зверя. Пока заклинание активно, вы можете действием посмотреть глазами этого Зверя и услышать то, что слышит он. Эффект продолжается, пока вы не переключитесь действием обратно на свои чувства. Воспринимая чувствами Зверя, вы пользуетесь преимуществами всех его особых чувств, хотя для своего окружения вы считаетесь ослеплённым и оглохшим."],"higher":[],"custom":true},{"id":"cmqwkolohr44","name":"Завеса стрел","level":2,"classes":["ranger"],"time":"1 действие","range":"1","dur":"8 часов","conc":false,"rit":false,"desc":["Вы втыкаете четыре немагических боеприпаса — стрелы или арбалетные болты — в землю в пределах дистанции и накладываете на них заклинание, защищающее область. Пока заклинание активно, каждый раз, когда другое существо кроме вас впервые за ход оказывается в пределах 6 клеток от боеприпасов или оканчивает там ход, один боеприпас вылетает и атакует его. Существо должно преуспеть в спасброске Ловкости, иначе оно получит колющий урон 1d6. Боеприпас при этом уничтожается. Заклинание заканчивается, когда кончаются боеприпасы.","Накладывая это заклинание, вы можете указать любых существ, которых это заклинание будет игнорировать."],"higher":["Если вы накладываете это заклинание, используя ячейку 3-го уровня или выше, количество боеприпасов увеличивается на два за каждый уровень ячейки выше второго."],"custom":true},{"id":"cmqwkoq1srsh","name":"Заимствованные знания","level":2,"classes":["bard","cleric","warlock","wizard"],"time":"1 действие","range":"На себя","dur":"1 час","conc":false,"rit":false,"desc":["Вы черпаете знания у духов прошлого. Выберите один навык, которым вы не владеете. На время действия заклинания вы получаете владение выбранным навыком. Заклинание оканчивается раньше, если вы накладываете его снова."],"higher":[],"custom":true},{"id":"cmqwkov3urmc","name":"Защита от яда","level":2,"classes":["artificer","cleric","druid","paladin","ranger"],"time":"1 действие","range":"Касание","dur":"1 час","conc":false,"rit":false,"desc":["Вы касаетесь существа. Если оно отравлено, вы нейтрализуете яд. Если на цель действуют несколько ядов, вы нейтрализуете тот, о котором знаете, либо же один случайным образом выбранный яд.","Пока заклинание активно, цель совершает с преимуществом спасброски от отравленного состояния и получает сопротивление урону ядом."],"higher":[],"custom":true},{"id":"cmqwkp0k5kni","name":"Исцеляющий дух","level":2,"classes":["druid","ranger"],"time":"1 бонусное действие","range":"12","dur":"До 1 минуты","conc":true,"rit":false,"desc":["Вы вызываете дух природы, чтобы унять боль раненых. Нематериальный дух появляется в пространстве, представляющее собой куб с длиной ребра 1 клетка, которое вы можете видеть в пределах дистанции. Дух выглядит как прозрачный зверь или фея (по вашему выбору).","Пока заклинание активно, всякий раз, когда вы или существо, которое вы можете видеть, впервые за ход передвигаются в пространство духа или начинают в нём свой ход, вы можете заставить духа восстановить 1d6 хитов этому существу (никаких действий не требуется). Дух не может исцелять Конструктов или Нежить. Дух может исцелять количество раз, равное 1 плюс ваш модификатор базовой характеристики (минимум 2). После того, как дух исцеляет доступное количество раз, он исчезает.","Бонусным действием в ваш ход вы можете переместить дух до 6 клеток в пространство, которое вы можете видеть."],"higher":["Если вы накладываете это заклинание, используя ячейку заклинания 3-го уровня или выше, исцеление увеличивается на 1d6 для каждого уровня ячейки выше 2."],"custom":true},{"id":"cmqwkr6x23tl","name":"Карман на запястье","level":2,"classes":[],"time":"1 действие","range":"На себя","dur":"До 1 часа","conc":true,"rit":true,"desc":["Вы делаете движение кистью, заставляя один предмет в вашей руке исчезнуть. Предмет, который только вы способны держать и весящий не более 5 фунтов (2,3 кг), перемещается в карманное измерение, где остается на время действия заклинания.","До окончания заклинания, вы можете действием вернуть предмет в вашу свободную руку, и вы можете действием спрятать его обратно в карманное измерение. После окончания заклинания предмет, оставшийся в карманном измерении, падает у ваших ног."],"higher":[],"custom":true},{"id":"cmqwkrb3q9xd","name":"Клеймящая кара","level":2,"classes":["paladin"],"time":"1 бонусное действие","range":"На себя","dur":"До 1 минуты","conc":true,"rit":false,"desc":["Когда вы в следующий раз попадёте по существу атакой оружием, пока заклинание активно, ваше оружие испускает астральное сияние. Атака причиняет цели дополнительные 2d6 урона излучением. Цель становится видимой, если была невидима, начинает испускать тусклый свет в пределах 1 клетки, и не может стать невидимой, пока активно это заклинание."],"higher":["Если вы накладываете это заклинание, используя ячейку 3-го уровня или выше, дополнительный урон увеличивается на 1d6 за каждый уровень ячейки выше второго."],"custom":true},{"id":"cmqwkrfve3b0","name":"Левитация","level":2,"classes":["artificer","sorcerer","wizard"],"time":"1 действие","range":"12","dur":"До 10 минут","conc":true,"rit":false,"desc":["Одно выбранное вами существо или незакреплённый предмет, видимые в пределах дистанции, поднимается вертикально на расстояние до 4 клетки, и остается висеть там на время действия заклинания. Заклинание может заставить левитировать цель, весящую до 500 фунтов. Несогласное существо, преуспевшее в спасброске Телосложения, не попадает под действие этого заклинания.","Цель может перемещаться только отталкиваясь от твердых предметов и поверхностей (таких как стены и потолок), а также подтягиваясь за них, что позволяет перемещаться так, как если бы они лазали. В свой ход вы можете изменить высоту цели на 4 клетки в любом направлении. Если целью являетесь вы сами, вы можете частью перемещения двигаться вверх или вниз. В противном случае, вы можете действием переместить цель, которая должна оставаться при этом в пределах досягаемости заклинания.","Когда заклинание оканчивается, если цель все ещё находится в воздухе, она плавно опускается на землю."],"higher":[],"custom":true},{"id":"cmqwkrk4q2eh","name":"Лунный луч","level":2,"classes":["druid"],"time":"1 действие","range":"24","dur":"До 1 минуты","conc":true,"rit":false,"desc":["Бледный серебристый луч сияет в цилиндре с радиусом 1 клетки и высотой 8 клеток с центром на точке в пределах дистанции. Пока заклинание активно, цилиндр освещен тусклым светом. Когда существо впервые за ход входит в область заклинания или начинает там ход, оно окутывается призрачным пламенем, причиняющим настоящую боль, и должно совершить спасбросок Телосложения. Оно получает урон излучением 2d10 при провале или половину этого урона при успехе.","Перевёртыши совершают спасбросок с помехой. При провале они мгновенно принимают свой истинный облик и не могут принимать другой облик, пока не выйдут из света от заклинания.","В каждый последующий ход после накладывания заклинания вы можете действием перемещать луч на расстояние до 12 клеток в любом направлении."],"higher":["Если вы накладываете это заклинание, используя ячейку 3-го уровня или выше, урон увеличивается на 1d10 за каждый уровень ячейки выше второго."],"custom":true},{"id":"cmqwkro4oyp5","name":"Магическое оружие","level":2,"classes":["artificer","paladin","ranger","sorcerer","wizard"],"time":"1 бонусное действие","range":"Касание","dur":"До 1 часа","conc":true,"rit":false,"desc":["Вы касаетесь немагического оружия. Пока заклинание активно, это оружие становится магическим оружием с бонусом +1 к броскам атаки и урона."],"higher":["Если вы накладываете это заклинание, используя ячейку 4-го уровня или выше, бонус увеличивается до +2. Если вы используете ячейку заклинания 6-го уровня или выше, бонус увеличивается до +3."],"custom":true},{"id":"cmqwkrsgrdoh","name":"Малое восстановление","level":2,"classes":["artificer","bard","cleric","druid","paladin","ranger"],"time":"1 действие","range":"Касание","dur":"Мгновенная","conc":false,"rit":false,"desc":["Вы касаетесь существа и можете окончить одну болезнь или одно состояние, в котором оно находится. Этим состоянием может быть глухота, отравление, паралич или слепота."],"higher":[],"custom":true},{"id":"cmqwkt2b81yv","name":"Натайрово озорство","level":2,"classes":["bard","sorcerer","wizard"],"time":"1 действие","range":"12","dur":"До 1 минуты","conc":true,"rit":false,"desc":["Вы заполняете 4-клеточный куб, который видите в пределах дистанции, магией Фей и Драконов. Совершите бросок по таблице «Озорной порыв» для определения создаваемого магического эффекта, и совершайте новый бросок в начале каждого вашего хода, пока заклинание не закончится. Вы можете переместить куб на 2 клетки, прежде чем совершить бросок.","Озорной порыв\nd4 - Эффект\n1 - Запах яблочного пирога наполняет воздух и каждое существо в кубе должно преуспеть в спасброске Мудрости, иначе станет очарованным вами до начала вашего следующего хода.\n2 - Букеты цветов появляются повсюду и каждое существо в кубе должно преуспеть в спасброске Ловкости, иначе станет ослеплённым до начала вашего следующего хода, так как цветы брызгают водой им в лица.\n3 - Каждое существо в кубе должно преуспеть в спасброске Мудрости, иначе оно будет смеяться до начала вашего следующего хода. Смеющееся существо недееспособно и использует всё своё передвижение, чтобы переместиться в случайном направлении.\n4 - Капли патоки начинают парить в кубе, превращая его в труднопроходимую местность до начала вашего следующего хода."],"higher":[],"custom":true},{"id":"cmqwkyle7xpo","name":"Небесные письмена","level":2,"classes":["artificer","bard","druid","wizard"],"time":"1 действие","range":"В пределах видимости","dur":"До 1 часа","conc":true,"rit":true,"desc":["В указанной вами части неба, которую вы можете видеть, возникает до десяти слов. Слова выглядят так, словно состоят из облаков, и остаются на одном месте, пока действует заклинание, после чего рассеиваются. Сильный ветер может рассеять их и досрочно закончить заклинание."],"higher":[],"custom":true},{"id":"cmqwkyqa2p6q","name":"Невидимость","level":2,"classes":["artificer","bard","sorcerer","warlock","wizard"],"time":"1 действие","range":"Касание","dur":"До 1 часа","conc":true,"rit":false,"desc":["Существо, которого вы касаетесь, становится невидимым до окончания действия заклинания. Все, что цель несёт или носит невидимо, пока находится у неё. Заклинание оканчивается на цели, если она совершает атаку или накладывает заклинание."],"higher":["Если вы накладываете это заклинание, используя ячейку 3-го уровня или выше, вы можете сделать целью одно дополнительное существо за каждый уровень ячейки выше второго."],"custom":true},{"id":"cmqwkzobhuht","name":"Облако кинжалов","level":2,"classes":["bard","sorcerer","warlock","wizard"],"time":"1 действие","range":"12","dur":"До 1 минуты","conc":true,"rit":false,"desc":["Вы заполняете воздух крутящимися кинжалами в кубе с длиной ребра 1 клетка, с центром на точке, выбранной вами в пределах дистанции. Существо получает рубящий урон 4d4, когда впервые за ход входит в область заклинания или начинает там ход."],"higher":["Если вы накладываете это заклинание, используя ячейку 3-го уровня или выше, урон увеличивается на 2d4 за каждый уровень ячейки выше второго."],"custom":true},{"id":"cmqwkzu9gdw1","name":"Область истины","level":2,"classes":["bard","cleric","paladin"],"time":"1 действие","range":"12","dur":"10 минут","conc":false,"rit":false,"desc":["Вы создаёте магическую зону, защищающую от обмана в сфере с радиусом 3 клеток с центром на точке, выбранной вами в пределах дистанции. Пока заклинание активно, существо, впервые за ход входящее в область этого заклинания или начинающее в ней ход, должно совершить спасбросок Харизмы. При провале существо не может умышленно лгать, находясь в указанном радиусе. Вы знаете, какие существа прошли спасбросок, а какие провалили.","Попавшее под действие заклинания существо знает о заклинании, и потому может избегать ответов на вопросы, на которые оно предпочло бы солгать. Такие существа могут давать уклончивые ответы, пока вынуждены говорить правду."],"higher":[],"custom":true},{"id":"cmqwkzzvsync","name":"Обнаружение мыслей","level":2,"classes":["bard","sorcerer","wizard"],"time":"1 действие","range":"На себя","dur":"До 1 минуты","conc":true,"rit":false,"desc":["Пока заклинание активно, вы можете читать мысли некоторых существ. При накладывании заклинания, а также действием в свой ход, пока заклинание активно, вы можете сосредоточиться на одном существе, которое видите в пределах 6 клеток. Если у выбранного существа Интеллект равен 3 или ниже, или если оно не может говорить ни на одном языке, оно не попадает под действие заклинания.","Вначале вы знаете поверхностные мысли существа — то, что находится в его сознании на текущий момент. Вы можете действием либо перенести внимание на мысли другого существа, либо попытаться углубиться в мысли текущего существа. Если вы погружаетесь глубже, цель должна совершить спасбросок Мудрости. В случае провала вы получаете понимание её мыслей (если есть), её эмоционального состояния, и того, что её больше всего заботит (а также то, что она любит и ненавидит). Если существо преуспеет, заклинание оканчивается. В любом случае, цель знает, что вы прощупывали её сознание, и если вы не перевели внимание на мысли другого существа, предыдущее существо может в свой ход действием совершить проверку Интеллекта, противопоставленную вашей проверке Интеллекта; в случае успеха заклинание оканчивается.","Вопросы, задаваемые устно цели, влияют на ход её мыслей, поэтому это заклинание чрезвычайно эффективно во время допросов.","Вы можете также использовать это заклинание для обнаружения присутствия мыслящих существ, которых вы не видите. Когда вы накладываете это заклинание, или позже, пока оно активно, потратив действие, вы можете поискать мысли существ в пределах 6 клеток. Заклинание проницает большую часть барьеров, но блокируется 2 футами камня, 2 дюймами обычного металла или тонким листом свинца. Вы не можете обнаружить существ с Интеллектом 3 и ниже, а также тех, кто не говорят ни на одном языке.","Обнаружив таким методом присутствие существа, вы можете до окончания действия заклинания читать его мысли, как описано выше, даже если вы его не видите, но оно должно находиться в пределах дистанции."],"higher":[],"custom":true},{"id":"cmqwl04rovot","name":"Палящий луч","level":2,"classes":["sorcerer","wizard"],"time":"1 действие","range":"24","dur":"Мгновенная","conc":false,"rit":false,"desc":["Вы создаете три огненных луча и направляете их на цели, находящиеся в пределах дистанции. Это может быть одна цель или несколько.","Для каждого луча совершите дальнобойную атаку заклинанием. При попадании цель получает 2d6 урона огнём."],"higher":["Если вы накладываете это заклинание, используя ячейку 3-го уровня или выше, вы создаете один дополнительный луч за каждый уровень ячейки выше второго."],"custom":true},{"id":"cmqwl097uzfs","name":"Паук","level":2,"classes":["artificer","sorcerer","warlock","wizard"],"time":"1 действие","range":"Касание","dur":"До 1 часа","conc":true,"rit":false,"desc":["Пока заклинание активно, одно согласное существо, которого вы касаетесь, получает возможность перемещаться вверх, вниз и вдоль вертикальных поверхностей, а также по потолкам, оставляя руки свободными. Цель также получает скорость лазания, равную своей скорости ходьбы."],"higher":[],"custom":true},{"id":"cmqwl0ee63g1","name":"Паутина","level":2,"classes":["artificer","sorcerer","wizard"],"time":"1 действие","range":"12","dur":"До 1 часа","conc":true,"rit":false,"desc":["Вы создаете массу густой и клейкой паутины в точке на ваш выбор в пределах дистанции. Паутина заполняет куб с длиной ребра 4 клетки на время длительности заклинания. Паутина является труднопроходимой местностью и слабо заслоняет местность.","Если паутина не прикована к двум прочным структурам (таким как стены или деревья) и не разложена по полу, стене или потолку, созданная паутина опадает сама, и заклинание оканчивается в начале вашего следующего хода. Паутина, разложенная по плоской поверхности, обладает толщиной 1 клетка.","Все существа, начинающие ход в паутине, или входящие в неё в свой ход, должны совершать спасбросок Ловкости. При провале существо становится опутанным, пока остается в паутине, или пока не вырвется.","Существо, опутанное паутиной, может действием совершить проверку Силы против Сл ваших заклинаний. В случае успеха оно перестает быть опутанным.","Паутина огнеопасна. Любой 1-клеточный куб паутины, соприкоснувшийся с огнём, сгорает за 1 раунд, причиняя 2d4 урона огнём всем существам, начинающим ход в огне."],"higher":[],"custom":true},{"id":"cmqwl0j9kdx1","name":"Пекло Аганаззара","level":2,"classes":["sorcerer","wizard"],"time":"1 действие","range":"6","dur":"Мгновенная","conc":false,"rit":false,"desc":["Вы выпускаете из себя линию ревущего пламени длиной 6 клеток и шириной 1 клетка в выбранном направлении. Все существа в области действия должны совершить спасбросок Ловкости, получая 3d8 урона огнём при провале или половину этого урона при успехе."],"higher":["Если вы накладываете это заклинание, используя ячейку 3-го уровня или выше, то урон увеличивается на 1d8 за каждый уровень ячейки выше 2."],"custom":true},{"id":"cmqwl0oiq54f","name":"Пиротехника","level":2,"classes":["artificer","bard","sorcerer","wizard"],"time":"1 действие","range":"12","dur":"Мгновенная","conc":false,"rit":false,"desc":["Выберите область немагического огня в кубе с длиной ребра 1 клетка, которую вы видите в пределах дистанции. Вы можете потушить огонь в этой области, а затем сотворить фейерверки или дымовую завесу.","Дымовая завеса. Густой чёрный дым расползается в радиусе 4 клеток, огибая углы. Область становится сильно заслонённой. Дым остаётся на месте 1 минуту, или пока сильный ветер не развеет его.","Фейерверки. Область взрывается ослепительной разноцветной вспышкой. Все существа в пределах 2 клеток от области должны преуспеть в спасброске Телосложения, иначе станут ослеплёнными до конца вашего следующего хода."],"higher":[],"custom":true},{"id":"cmqwl13153ni","name":"Подарок болтуна","level":2,"classes":["bard","wizard"],"time":"Реакция","range":"На себя","dur":"Мгновенная","conc":false,"rit":false,"desc":["Когда вы накладываете это заклинание, вы умело изменяете воспоминания слушателей в вашем непосредственном окружении так, что каждое существо по вашему выбору в пределах 1 клетки от вас забывает все, что вы сказали в течение последних 6 секунд. Затем эти существа вспоминают, что вы на самом деле произнесли слова, которые вы произносите как вербальный компонент заклинания."],"higher":[],"custom":true},{"id":"cmqwl17vbgev","name":"Подмога","level":2,"classes":["artificer","bard","cleric","paladin","ranger"],"time":"1 действие","range":"6","dur":"8 часов","conc":false,"rit":false,"desc":["Ваше заклинание наделяет союзников стойкостью и решимостью. Выберите до трёх существ в пределах дистанции. На время длительности максимум хитов и текущие хиты всех целей увеличиваются на 5."],"higher":["Если вы накладываете это заклинание, используя ячейку 3-го уровня или выше, хиты целей увеличиваются ещё на 5 за каждый уровень ячейки выше второго."],"custom":true},{"id":"cmqwl1c3wnj4","name":"Поиск животных или растений","level":2,"classes":["bard","druid","ranger"],"time":"1 действие","range":"На себя","dur":"Мгновенная","conc":false,"rit":true,"desc":["Назовите определённый вид Зверя или растения. Сконцентрировавшись на голосе природы в окружении, вы узнаёте направление и расстояние до ближайшего существа или растения этого вида в пределах 5 миль, если они вообще есть."],"higher":[],"custom":true},{"id":"cmqwl1gfqtwj","name":"Поиск ловушек","level":2,"classes":["cleric","druid","ranger"],"time":"1 действие","range":"24","dur":"Мгновенная","conc":false,"rit":false,"desc":["Вы чувствуете присутствие любых ловушек в пределах дистанции, находящихся в пределах линии обзора. Для этого заклинания ловушкой считается всё, что причиняет неожиданный эффект, считающийся для вас вредным или нежелательным, и специально подготовленный таким своим создателем. Таким образом, это заклинание почувствует область, защищённую заклинанием сигнал тревоги [alarm], охранные руны [glyph of warding], или механической ловушкой, но не распознает ветхий пол, неустойчивый потолок, или промоину в земле.","Это заклинание просто даёт знать, что ловушка присутствует. Вы не узнаёте местоположение всех ловушек, но зато знаете общий характер опасности, исходящей от почувствованной вами ловушки."],"higher":[],"custom":true},{"id":"cmqwl1ld8vl6","name":"Разбрасывание карт","level":2,"classes":["bard","sorcerer","warlock","wizard"],"time":"1 действие","range":"15-футовый конус","dur":"Мгновенная","conc":false,"rit":false,"desc":["Вы высыпаете спектральные карты 3-клеточным конусом. Каждое существо в этой области должно совершить спасбросок Ловкости. При провале существо получает 2d10 урона силовым полем и становится ослеплённым до конца своего следующего хода. При успехе существо получает только половину урона без дополнительных эффектов."],"higher":["Когда вы накладываете это заклинание, используя ячейку 3-го уровня или выше, урон увеличивается на 1d10 за каждый уровень ячейки выше 2-го."],"custom":true},{"id":"cmqwl1pqyief","name":"Размытый образ","level":2,"classes":["artificer","sorcerer","wizard"],"time":"1 действие","range":"На себя","dur":"До 1 минуты","conc":true,"rit":false,"desc":["Ваше тело становится размытым и колышущимся для всех, кто видит вас. Пока заклинание активно, все существа совершают по вам броски атаки с помехой. Атакующий получает иммунитет к этому эффекту, если полагается не на зрение, а, например, на слепое зрение, или может видеть сквозь иллюзии, например, с помощью истинного зрения."],"higher":[],"custom":true},{"id":"cmqwl20mgnby","name":"Сверкающая монета Джима","level":2,"classes":["wizard"],"time":"1 действие","range":"12","dur":"1 минута","conc":false,"rit":false,"desc":["Когда вы накладываете заклинание, вы бросаете монету, которая является материальным компонентом заклинания, в любую точку в пределах дистанции. Монета зажигается, как будто под действием заклинания свет [light]. Каждое существо по вашему выбору, которое вы можете видеть в пределах 6 клеток от монеты, должно преуспеть в спасброске Мудрости, иначе отвлечётся на монетку.","Будучи отвлечённым, существо совершает с помехой проверки Мудрости (Восприятие) и бросок инициативы."],"higher":[],"custom":true},{"id":"cmqwl262hd8d","name":"Сковывающий лёд Раймы","level":2,"classes":["sorcerer","wizard"],"time":"1 действие","range":"На себя (30-футовый конус)","dur":"Мгновенная","conc":false,"rit":false,"desc":["Порыв ледяной энергии исходит от вас 6-клеточным конусом. Каждое существо в этой области должно совершить спасбросок Телосложения. При провале существо получает 3d8 урона холодом и его удерживают ледяные образования в течение 1 минуты или до тех пор, пока оно или другое существо в пределах досягаемости действием не разобьёт лёд. У существа, которое удерживается льдом, скорость уменьшается до 0. При успехе существо получает вдвое меньше урона, и оно не удерживается льдом."],"higher":["Если вы накладываете это заклинание, используя ячейку 3-го уровня или выше, урон увеличивается на 1d8 за каждый уровень ячейки выше второго."],"custom":true},{"id":"cmqwl2y66jpi","name":"Смена обличья","level":2,"classes":["artificer","sorcerer","wizard"],"time":"1 действие","range":"На себя","dur":"До 1 часа","conc":true,"rit":false,"desc":["Вы принимаете другой облик. При накладывании выберите один из представленных ниже вариантов, эффект от которого будет продолжаться всю длительность заклинания. Пока заклинание активно, вы можете действием окончить один эффект, чтобы получить преимущества другого.","Адаптация к воде. Вы приспосабливаете свое тело к существованию в воде, отращивая жабры и перепонки между пальцами. Вы можете дышать под водой и получаете скорость плавания, равную скорости ходьбы.","Естественное оружие. Вы отращиваете когти, клыки, шипы, рога или другое естественное оружие на свой выбор. Ваш безоружный удар причиняет дробящий, колющий или рубящий урон 1d6, в зависимости от выбранного вами оружия, и вы владеете безоружными ударами. Это оружие будет магическим, и вы получаете бонус +1 к броскам атаки и урона им.","Изменение внешности. Вы изменяете свою внешность. Вы сами решаете, на кого будете походить, включая рост, вес, лицо, звук голоса, длину волос, цвета и отличительные характеристики. Вы можете стать похожим на представителя другой расы, но ваши показатели не изменяются. Вы также не можете выглядеть как существо другой категории размера, и ваше тело остается примерно тем же самым; например, это заклинание не сделает вас четырёхногим. Пока заклинание активно, вы можете действием изменять свою внешность."],"higher":[],"custom":true},{"id":"cmqwl32uyoha","name":"Тёмное зрение","level":2,"classes":["artificer","druid","ranger","sorcerer","wizard"],"time":"1 действие","range":"Касание","dur":"8 часов","conc":false,"rit":false,"desc":["Вы касаетесь согласного существа и даруете ему возможность видеть в темноте. Пока заклинание активно, это существо обладает тёмным зрением в пределах 12 клеток."],"higher":[],"custom":true},{"id":"cmqwl37pjkh6","name":"Теневой клинок","level":2,"classes":["sorcerer","warlock","wizard"],"time":"1 бонусное действие","range":"На себя","dur":"До 1 минуты","conc":true,"rit":false,"desc":["Вы сплетаете воедино нити тени, чтобы создать в ваших руках меч затвердевшего мрака. Этот магический меч существует до тех пор, пока заклинание активно. Он считается простым рукопашным оружием, которым вы владеете. Он наносит 2d8 урона психической энергией при попадании и обладает свойствами «лёгкое», «метательное» (дистанция 20/60) и «фехтовальное». Кроме того, когда вы используете меч для атаки цели, которая находится в тусклом освещении или темноте, вы совершаете бросок атаки с преимуществом.","Если вы роняете оружие или метаете его, оно рассеивается в конце хода.","После этого, пока заклинание активно, вы можете бонусным действием снова вызвать меч в вашу руку."],"higher":["Когда вы накладываете это заклинание, используя ячейку заклинания 3-го или 4-го уровня, урон увеличивается до 3d8. Когда вы накладываете его с помощью ячейки заклинания 5-го или 6-го уровня, урон увеличивается до 4d8. Когда вы накладываете его с помощью ячейки заклинания 7-го уровня или выше, урон увеличивается до 5d8."],"custom":true},{"id":"cmqwl3c3xu5s","name":"Тишина","level":2,"classes":["bard","cleric","ranger"],"time":"1 действие","range":"24","dur":"До 10 минут","conc":true,"rit":true,"desc":["Пока заклинание активно, никакие звуки не могут раздаться в пределах сферы с радиусом 4 клеток с центром на точке, выбранной в пределах дистанции, а также не могут проходить сквозь неё. Все существа и предметы, полностью находящиеся в сфере, получают иммунитет к урону звуком, и существа считаются оглохшими, когда полностью находятся в ней. Там невозможно накладывать заклинания с вербальным компонентом."],"higher":[],"custom":true},{"id":"cmqwl3gfw5x6","name":"Увеличение/уменьшение","level":2,"classes":["artificer","bard","druid","sorcerer","wizard"],"time":"1 действие","range":"6","dur":"До 1 минуты","conc":true,"rit":false,"desc":["На время действия заклинания вы увеличиваете или уменьшаете существо или предмет, которые вы видите в пределах дистанции. Выберите либо существо, либо предмет, который никто не несёт и не носит. Если цель хочет, она может совершить спасбросок Телосложения. При успехе заклинание не оказывает на неё никакого влияния.","Если цель — существо, всё, что она носит и несёт, изменяет размер вместе с ней. Все, что это существо бросит, тут же обретает свой нормальный размер.","Увеличение. Размеры цели удваиваются по всем измерениям, а вес увеличивается в восемь раз. Это увеличивает размер на одну категорию — от Среднего до Большого, например. Если для цели не хватает пространства, она приобретает максимально возможный размер. Пока заклинание активно, цель совершает с преимуществом проверки и спасброски Силы. Оружие цели тоже увеличивается. Атаки увеличенным оружием дополнительно причиняют 1d4 урона.","Уменьшение. Размеры цели уменьшаются вдвое по всем измерениям, а вес уменьшается до одной восьмой от обычного. Это уменьшает размер на одну категорию — от Среднего до Маленького, например. Пока заклинание активно, цель совершает с помехой проверки и спасброски Силы. Оружие цели тоже уменьшается. Атаки уменьшенным оружием причиняют на 1d4 меньше урона (урон не может быть меньше 1)."],"higher":[],"custom":true},{"id":"cmqwl3kv3xov","name":"Увлекательная прогулка","level":2,"classes":["artificer","bard","sorcerer","wizard"],"time":"1 бонусное действие","range":"На себя","dur":"До 1 минуты","conc":true,"rit":false,"desc":["Вы магическим образом усиливаете свои движения танцевальными шагами, даруя себе следующие преимущества:","Ваша скорость ходьбы увеличивается на 2 клетки.","Вы не провоцируете атаки.","Вы можете перемещаться сквозь других существ, и они не считаются для вас труднопроходимой местностью. Если вы оканчиваете свой ход в пространстве другого существа, то вас выталкивает в последнее занимаемое вами свободное пространство и вы получаете 1d8 урона силовым полем."],"higher":[],"custom":true},{"id":"cmqwl3qcf8uv","name":"Увядание и цветение","level":2,"classes":["druid","sorcerer","wizard"],"time":"1 действие","range":"12","dur":"Мгновенная","conc":false,"rit":false,"desc":["Вы пробуждаете жизнь и смерть в сфере радиусом 2 клеток, в указанной точке в пределах дистанции заклинания. Каждое существо по вашему выбору в этой области должно совершить спасбросок Телосложения, получая 2d6 урона некротической энергией в случае провала или половину этого урона в случае успеха. Немагическая растительность в этой области увядает.","Кроме того, одно существо по вашему выбору в этой области может потратить и бросить одну из своих неизрасходованных Костей Хитов, восстанавливая себе количество хитов, равное результату броска + модификатор вашей базовой характеристики."],"higher":["Если вы накладываете это заклинание, используя ячейку 3-го уровня или выше, урон увеличивается на 1d6 за каждый уровень ячейки выше второго, а количество Костей Хитов, которые существо может потратить и добавить к броску восстановления хитов увеличивается на 1 каждый уровень ячейки выше второго."],"custom":true},{"id":"cmqwl3ul9kpr","name":"Удержание личности","level":2,"classes":["bard","cleric","druid","sorcerer","warlock","wizard"],"time":"1 действие","range":"12","dur":"До 1 минуты","conc":true,"rit":false,"desc":["Выберите Гуманоида, которого видите в пределах дистанции. Цель должна преуспеть в спасброске Мудрости, иначе станет парализованной на время действия заклинания. В конце каждого своего хода цель может совершать новые спасброски Мудрости. При успехе заклинание на этой цели оканчивается."],"higher":["Если вы накладываете это заклинание, используя ячейку 3-го уровня или выше, вы можете сделать целью одно дополнительное существо за каждый уровень ячейки выше 2-го. Эти Гуманоиды должны находиться в пределах 6 клеток друг от друга, когда вы нацеливаетесь на них."],"custom":true},{"id":"cmqwl3zndvfv","name":"Чувство искажения","level":2,"classes":["sorcerer","warlock","wizard"],"time":"1 действие","range":"На себя","dur":"До 1 минуты","conc":true,"rit":false,"desc":["На время действия вы ощущаете присутствие порталов, даже неактивных, в пределах 6 клеток от себя.","Если вы обнаружите портал таким образом, вы сможете действием изучить его. Совершите проверку базовой характеристики Сл 15. В случае успеха вы узнаёте план, привязанный к этому порталу и какой ключ портала для него требуется, после чего заклинание оканчивается. В случае провала вы ничего не узнаёте и не сможете снова изучить этот портал с помощью этого заклинания, пока не примените его снова.","Заклинание может проникнуть через большинство барьеров, но блокируется 1 футом камня, 1 дюймом обычного металла, тонким листом свинца или 3 футами дерева или земли."],"higher":[],"custom":true},{"id":"cmqwl43vh6cd","name":"Шипы","level":2,"classes":["druid","ranger"],"time":"1 действие","range":"30","dur":"До 10 минут","conc":true,"rit":false,"desc":["Пол в пределах 4-клеточного радиуса с центром на точке в пределах дистанции покрывается шипами и колючками. Эта местность становится труднопроходимой на время действия заклинания. Когда существо входит в область или передвигается внутри неё, оно получает 2d4 колющего урона за каждые 5 преодолеваемых футов.","Трансформация поверхности проходит практически незаметно, и шипы хорошо замаскированы. Существа, которые не видели эту местность в момент накладывания заклинания, должны совершить проверку Мудрости (Восприятие) против Сл ваших заклинаний, чтобы распознать местность опасной, перед тем как в неё войти."],"higher":[],"custom":true},{"id":"cmqwl58fdqa4","name":"Божественное оружие","level":2,"classes":["cleric"],"time":"1 бонусное действие","range":"12","dur":"1 минута","conc":false,"rit":false,"desc":["Вы создаёте в пределах дистанции парящее призрачное оружие, существующее, пока заклинание активно, или пока вы не накладываете это заклинание ещё раз. Когда вы накладываете это заклинание, вы можете совершить рукопашную атаку заклинанием по существу, находящемуся в пределах 1 клетки от оружия. При попадании цель получает урон силовым полем, равный 1d8 + модификатор вашей базовой характеристики.","Вы можете бонусным действием в свой ход переместить оружие на расстояние вплоть до 4 клетки и повторить атаку по существу, находящемуся в пределах 1 клетки от него.","Оружие может быть любой формы. Жрецы божеств, связанных с конкретным оружием (святой Катберт известен своей булавой, а Тор — молотом), создают эффект в виде именно такого оружия."],"higher":["Если вы накладываете это заклинание, используя ячейку 3-го уровня или выше, урон увеличивается на 1d8 за каждые две ячейки выше 2-го."],"custom":true},{"id":"cmqwl5d7755w","name":"Воздушный пузырь","level":2,"classes":["artificer","druid","ranger","sorcerer","wizard"],"time":"1 действие","range":"12","dur":"24 часа","conc":false,"rit":false,"de
