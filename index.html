function metaRow(s){
  const ab=isAbility(s);
  const tags=tagInfo(s);
  const tagsHtml=tags.map(t=>badgeHtml(t.text,TAG_COLORS[t.cls])).join("");

  if(ab){
    return `<div class="cmeta">${tagsHtml}</div>`;
  }
  const type=lvlShort(s.level);
  const lvlColor=LEVEL_COLORS[Math.min(Math.max(s.level|0,0),9)];
  const time=timeShort(s.time)||"—";
  const rl=rangeLabel(s.range);
  const range=(rl && rl!=="—")?rl:"—";
  const dur=ru(s.dur)||"—";
  const tagHTML=tags.length ? `<span class="mdiv"></span>${tagsHtml}` : "";
  const timeCat=categorizeTime(s.time);
  const iconHTML= timeCat==="action" ? `<img src="${DEMO_ICON}" class="spell-icon" alt="">`
    : timeCat==="bonus" ? `<img src="${DEMO_ICON_BONUS}" class="spell-icon" alt="">`
    : timeCat==="reaction" ? `<img src="${DEMO_ICON_REACTION}" class="spell-icon" alt="">` : "";
  return `<div class="cmeta">`
    +`${typeBadgeHtml(type,s.level)}<span class="mdiv"></span>`
    +`<span class="mcol mtime"><span class="mtime-inner">${iconHTML}${esc(time)}</span></span><span class="mdiv"></span>`
    +`<span class="mcol mrange">${esc(range)}</span><span class="mdiv"></span>`
    +`<span class="mcol mdur">${esc(dur)}</span>`
    +tagHTML
    +`</div>`;
}
function spellCard(s){
  const exp=state.expanded.has(s.id), star=prepared.has(s.id), pin=pinned.has(s.id);
  const ab=isAbility(s);
  const cls=(s.classes||[]).map(c=>CLASS_RU[c]||c).join(", ")||"—";
  const meta=metaRow(s);
  const tg=tagInfo(s);
  const type=lvlShort(s.level);
  const lvlColor=LEVEL_COLORS[Math.min(Math.max(s.level|0,0),9)];
  let body="";
  if(exp){
    body='<div class="cbody">';
    if(!ab) body+='<div class="grid g4">'
      +cell("Тип",type)+cell("Время",ru(s.time), (categorizeTime(s.time)==="action" ? `<img src="${DEMO_ICON}" class="cell-icon" alt="">` : categorizeTime(s.time)==="bonus" ? `<img src="${DEMO_ICON_BONUS}" class="cell-icon" alt="">` : categorizeTime(s.time)==="reaction" ? `<img src="${DEMO_ICON_REACTION}" class="cell-icon" alt="">` : ""))+cell("Дистанция",rangeLabel(s.range))
      +cell("Длительность",ru(s.dur))+'</div>';
    body+='<div class="desc">'+renderDesc(s.desc)+'</div>';
    if(!ab && s.higher&&s.higher.length)
      body+='<div class="higher"><div class="hk">На более высоких уровнях</div>'+renderDesc(s.higher)+'</div>';
    if((s.classes||[]).length)
      body+=`<div style="font-family:Inter,sans-serif;font-size:11px;color:var(--faint);margin-top:14px">${ab?'Классы':'Доступно'}: ${esc(cls)}</div>`;
    body+='</div>';
  }
  return `<div class="card ${exp?'exp':''}" data-id="${s.id}"><div class="chead">
    <div class="ctitle"><div class="cname-row"><div class="cname">${esc(s.name)}</div>${exp?tg.map(t=>badgeHtml(t.text,TAG_COLORS[t.cls])).join(""):""}</div></div>
    <div class="marks">
      <button class="pin ${pin?'on':''}" data-pin="${s.id}" title="Всегда доступно">
        <svg viewBox="0 0 24 24"><path d="M16 9V4h1a1 1 0 0 0 0-2H7a1 1 0 0 0 0 2h1v5a3 3 0 0 1-3 3v2h5.97v7l1 1 1-1v-7H19v-2a3 3 0 0 1-3-3z"/></svg></button>
      <button class="star ${star?'on':''}" data-star="${s.id}" title="Подготовить (выбрать на день)">
        <svg viewBox="0 0 24 24"><path d="M12 2l2.9 6.3 6.6.8-4.9 4.6 1.3 6.5L12 18l-5.9 2.8 1.3-6.5-4.9-4.6 6.6-.8z"/></svg></button>
    </div>
    <svg class="chev" viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></svg></div>${exp?"":meta}${body}</div>`;
}
function cell(k,v,icon){return `<div class="gcell"><div class="gk">${k}</div><div class="gv">${icon||""}${esc(v)||"—"}</div></div>`;}
function plural(n){const m=n%10,h=n%100;
  if(m===1&&h!==11)return"заклинание"; if(m>=2&&m<=4&&(h<10||h>=20))return"заклинания"; return"заклинаний";}

// ---------- render ----------
function render(){
  document.getElementById("condBubble").hidden=true;
  document.getElementById("pcount").textContent=new Set([...prepared,...pinned]).size;
  const editing=state.view==="edit";
  const condView=state.view==="conditions";
  document.getElementById("bar").style.display=(editing||condView)?"none":"flex";
  document.getElementById("count").style.display=(editing||condView)?"none":"block";
  if(editing){ document.getElementById("fpanel").classList.remove("show");
    document.getElementById("ftoggle").classList.remove("open"); renderEditor(); return; }
  if(condView){ document.getElementById("fpanel").classList.remove("show");
    document.getElementById("ftoggle").classList.remove("open"); renderConditions(); return; }
  renderList();
}

const CONDITIONS=[
  {name:"Ослеплён (Blinded)",desc:["Не видит и автоматически проваливает любую проверку, для которой нужно зрение.","Броски атаки по ослеплённому существу совершаются с преимуществом, а его собственные атаки — с помехой."]},
  {name:"Оглушён (Deafened)",desc:["Не слышит и автоматически проваливает любую проверку, для которой нужен слух."]},
  {name:"Очарован (Charmed)",desc:["Не может атаковать очаровавшего его и не может выбирать его целью вредоносных способностей или магии.","Очаровавший получает преимущество на любые социальные проверки характеристик, направленные на это существо."]},
  {name:"Испуган (Frightened)",desc:["Совершает с помехой проверки характеристик и броски атаки, пока источник испуга находится в поле зрения.","Не может по своей воле приближаться к источнику испуга."]},
  {name:"Схвачен (Grappled)",desc:["Скорость становится равной 0, бонус к скорости не действует.","Состояние оканчивается, если схвативший становится недееспособен, или если существо каким-то эффектом вырывается из пределов досягаемости захвата."]},
  {name:"Недееспособен (Incapacitated)",desc:["Не может совершать действия или реакции."]},

const COND_MATCHERS=[
  [13,/без\s+сознания/gi],
  [10,/сбит(?:а|о|ы)?\s+с\s+ног|ничком/gi],
  [0,/ослепл[а-яё]*/gi],
  [0,/(?<![а-яё])о?слеп[а-яё]*(?![а-яё])(?!\s*зрени)/gi],
  [1,/(?:оглуш|оглох)[а-яё]*/gi],
  [1,/(?<![а-яё])глух[а-яё]*/gi],
  [2,/очарова[а-яё]*/gi],
  [3,/испуг[а-яё]*/gi],
  [4,/схвач[а-яё]*/gi],
  [4,/схват(?:ить|ывает)\s+(?:другое\s+)?существ[а-яё]*/gi],
  [4,/захват[а-яё]*\s+(?:другого\s+)?существ[а-яё]*/gi],
  [5,/недееспособ[а-яё]*/gi],
  [6,/невидим[а-яё]*/gi],
  [7,/парализ[а-яё]*/gi],
  [7,/паралич[а-яё]*/gi],
  [8,/окамене[а-яё]*/gi],
  [9,/отравл[а-яё]*/gi],
  [11,/опутан[а-яё]*/gi],
  [12,/ошеломл[а-яё]*/gi],
  [14,/истощени[а-яё]*|истощен[а-яё]*/gi]
];
function highlightConditions(html){
  let parts=[html];
  COND_MATCHERS.forEach(([idx,re])=>{
    const next=[];
    parts.forEach(part=>{
      if(part.startsWith('<span')){ next.push(part); return; }
      const pieces=part.split(new RegExp("("+re.source+")","gi"));
      for(let i=0;i<pieces.length;i++){
        if(!pieces[i]) continue;
        if(i%2===1) next.push(`<span class="cond-hl" data-cond="${idx}">${pieces[i]}</span>`);
        else next.push(pieces[i]);
      }
    });
    parts=next;
  });
  return parts.join("");
}

// ---------- quick parse (вставка одного заклинания в формате заметок) ----------
const CLASS_FROM_RU={"волшебник":"wizard","изобретатель":"artificer","чародей":"sorcerer",
  "бард":"bard","жрец":"cleric","друид":"druid","паладин":"paladin","следопыт":"ranger","колдун":"warlock",
  "варвар":"barbarian","воин":"fighter","монах":"monk","плут":"rogue"};
const SCHOOL_WORDS=/(воплощени|вызов|вызыван|иллюзи|некромант|огражд|очарован|преобразован|прорицани)/i;
const HIGHER_RE=/(на\s+больших\s+уровнях|на\s+(более\s+)?высоких\s+уровнях|ячейк[а-яё]*\s+заклинания\s*\d+|использу[яюе][^.]{0,40}ячейк|когда\s+вы\s+достигаете\s+\d+-го\s+уровня|увеличивается[^.]*достигаете|за\s+каждый\s+уровень\s+ячейки|для\s+каждого\s+(круг|уровн))/i;
function stripHigherHead(p){ return (p||"").replace(/^на\s+(больших|(?:более\s+)?высоких)\s+уровнях\s*[.:]?\s*/i,"").trim(); }
function parseRange(v){ v=(v||"").trim();
  if(/^на себя/i.test(v)) return v.replace(/^на себя/i,"На себя");
  if(/касани/i.test(v)) return "Касание";
  const m=v.match(/(\d+)\s*фут/i); if(m) return String(Math.round(+m[1]/5));
  return v; }
function parseSpellBlock(raw){
  const lines=raw.split(/\r?\n/);
  let i=0; while(i<lines.length && !lines[i].trim()) i++;
  if(i>=lines.length) return null;
  let name=srcFix(lines[i].replace(/^[#*\s]+/,"").split("[")[0]).trim();
  if(!name) return null;
  let level=null,time="",range="",dur="",conc=false,rit=false,classes=[]; const body=[];
  for(let k=i+1;k<lines.length;k++){
    let c=lines[k].replace(/^\s*\*\s?/,"").trim(); if(!c) continue;
    if(/^заговор/i.test(c)){ level=0; if(/ритуал/i.test(c))rit=true; continue; }
    let lm=c.match(/^(\d+)\s*(?:-[а-яё]+)?\s*круг/i)||c.match(/^(\d+)\s*(?:-[а-яё]+)?\s*уровень\s*,/i);
    if(lm && SCHOOL_WORDS.test(c)){ level=+lm[1]; if(/ритуал/i.test(c))rit=true; continue; }
    if(/^врем[яи][^:]*:/i.test(c)){ time=timeClean(c.split(":").slice(1).join(":").trim()); continue; }
    if(/^дистанци[яи]\s*:/i.test(c)){ range=c.split(":").slice(1).join(":").trim(); continue; }
    if(/^компонент/i.test(c)){ continue; }
    if(/^длительност/i.test(c)){ let d=c.split(":").slice(1).join(":").trim(); if(/концентрац/i.test(d))conc=true; dur=durClean(d); continue; }
    if(/^класс/i.test(c)){ c.split(":").slice(1).join(":").split(/[,;]| и /).forEach(x=>{
        const key=CLASS_FROM_RU[x.trim().toLowerCase().replace(/[^а-яё]/gi,"")];
        if(key&&!classes.includes(key))classes.push(key); }); continue; }
    if(/^подкласс/i.test(c)){ continue; }
    if(/^ритуал/i.test(c)){ rit=true; continue; }
    body.push(c);
  }
  let desc=[],higher=[],hit=false;
  for(const p of body){ if(!hit && HIGHER_RE.test(p)) hit=true; (hit?higher:desc).push(p); }
  return {id:newId(),name,level:(level==null?0:level),classes,time,range:parseRange(range),
    dur,conc,rit,desc:desc.map(clean),higher:higher.map(p=>clean(stripHigherHead(p))).filter(Boolean),custom:true};
}

function exportObj(s){

    time:s.time||"",range:s.range||"",dur:s.dur||"",
    conc:!!s.conc,rit:!!s.rit,desc:s.desc||[],higher:s.higher||[]};}

function wireEditor(){
  const $=id=>document.getElementById(id);
  if($("quickBtn"))$("quickBtn").onclick=()=>{state.quickOpen=true;state.formOpen=false;state.draft=null;state.editId=null;state.exportOpen=false;render();};
  if($("newSpell"))$("newSpell").onclick=()=>{state.editId=null;state.draft=null;state.formOpen=true;state.quickOpen=false;state.exportOpen=false;render();};
  if($("exportBtn"))$("exportBtn").onclick=()=>{state.exportOpen=!state.exportOpen;state.formOpen=false;state.quickOpen=false;render();};
  if($("qclear"))$("qclear").onclick=()=>{const q=$("qin");if(q){q.value="";q.focus();}};
  if($("parseBtn"))$("parseBtn").onclick=()=>{
    const raw=$("qin")?$("qin").value:"";
    const parsed=parseSpellBlock(raw);
    if(!parsed||!parsed.name){const e=$("q_err");if(e)e.textContent="Не нашла название. Проверь, что первая строка — название заклинания.";return;}
    state.draft=parsed;state.editId=null;state.formOpen=true;render();
  };
  if($("cancelForm"))$("cancelForm").onclick=()=>{state.formOpen=false;state.editId=null;state.draft=null;render();};
  if($("closeExport"))$("closeExport").onclick=()=>{state.exportOpen=false;render();};
  if($("saveSpell"))$("saveSpell").onclick=saveSpellFromForm;
  if($("copyCode"))$("copyCode").onclick=()=>{const t=$("codeout");t.select();
    try{navigator.clipboard.writeText(t.value);}catch(e){document.execCommand("copy");}
    const b=$("copyCode");b.textContent="Скопировано ✓";setTimeout(()=>b.textContent="Скопировать",1500);};
  document.querySelectorAll("#f_classes .chip,#f_conc,#f_rit").forEach(c=>c.onclick=()=>c.classList.toggle("on"));
  const kindChips=document.querySelectorAll("#f_kind .chip");
  function applyKind(){
    const ab=[...kindChips].some(c=>c.classList.contains("on")&&c.dataset.k==="ability");
    ["spellOnly1","spellOnly2","spellOnly3"].forEach(id=>{const el=$(id);if(el)el.style.display=ab?"none":"";});
  }
  kindChips.forEach(c=>c.onclick=()=>{ kindChips.forEach(x=>x.classList.remove("on")); c.classList.add("on"); applyKind(); });
  if(kindChips.length) applyKind();
  document.querySelectorAll("[data-edit]").forEach(b=>b.onclick=()=>{state.editId=b.dataset.edit;state.draft=null;state.formOpen=true;state.quickOpen=false;state.exportOpen=false;render();});
  document.querySelectorAll("[data-del]").forEach(b=>b.onclick=async()=>{
    const s=customLocal.find(x=>x.id===b.dataset.del);
    const ok=await appConfirm("Удалить запись?", s?`«${s.name}» исчезнет из книги. Это действие нельзя отменить.`:"");
    if(ok){customLocal=customLocal.filter(x=>x.id!==b.dataset.del);
      prepared.delete(b.dataset.del);pinned.delete(b.dataset.del);await saveCustom();await savePrepared();await savePinned();render();}});
}
function appConfirm(title,msg){
  return new Promise(res=>{
    const bg=document.createElement("div"); bg.className="modal-bg";
    bg.innerHTML='<div class="modal"><div class="mt">'+esc(title)+'</div>'
      +(msg?'<div class="mm">'+esc(msg)+'</div>':'')
      +'<div class="factions"><button class="btn" data-no>Отмена</button>'
      +'<button class="btn danger" data-yes>Удалить</button></div></div>';
    document.body.appendChild(bg);
    const done=v=>{bg.remove();res(v);};
    bg.querySelector("[data-yes]").onclick=()=>done(true);
    bg.querySelector("[data-no]").onclick=()=>done(false);
    bg.onclick=e=>{if(e.target===bg)done(false);};
  });
}
async function saveSpellFromForm(){
  const name=gv("f_name").trim(); const err=document.getElementById("f_err");
  if(!name){err.textContent="Впиши хотя бы название.";return;}
  const wasEdit=!!state.editId;
  const kindEl=document.querySelector("#f_kind .chip.on");
  const ability = kindEl && kindEl.dataset.k==="ability";
  const classes=[...document.querySelectorAll("#f_classes .chip.on")].map(c=>c.dataset.c);
  const desc=gv("f_desc").split(/\n\s*\n/).map(t=>clean(t.trim())).filter(Boolean);
  let sp;
  if(ability){
    sp={id:state.editId||newId(),kind:"ability",name,classes,desc,custom:true};
  } else {
    sp={id:state.editId||newId(),name,level:+gv("f_level"),classes,
      time:timeClean(gv("f_time").trim()),range:gv("f_range").trim(),dur:durClean(gv("f_dur").trim()),
      conc:document.getElementById("f_conc").classList.contains("on")||/концентрац/i.test(gv("f_dur")),
      rit:document.getElementById("f_rit").classList.contains("on"),
      desc,
      higher:gv("f_higher").split(/\n\s*\n/).map(t=>clean(t.trim())).filter(Boolean),custom:true};
  }
  const i=customLocal.findIndex(x=>x.id===sp.id);
  if(i>=0)customLocal[i]=sp; else customLocal.push(sp);
  await saveCustom();
  state.formOpen=false; state.editId=null; state.draft=null;
  if(!wasEdit) state.quickOpen=true;
  render();
}

// ---------- wire global ----------
document.querySelectorAll(".tab").forEach(t=>t.addEventListener("click",()=>{
  document.querySelectorAll(".tab").forEach(x=>x.classList.remove("on"));
  t.classList.add("on"); state.view=t.dataset.view;
  state.expanded.clear(); state.formOpen=false; state.exportOpen=false;
  state.quickOpen=false; state.draft=null; render();
  t.classList.remove("bounce"); void t.offsetWidth; t.classList.add("bounce");
}));
document.getElementById("q").addEventListener("input",e=>{state.q=e.target.value.trim().toLowerCase();render();});
const qClearBtn=document.getElementById("qClear");
qClearBtn.addEventListener("mousedown",e=>e.preventDefault());
qClearBtn.addEventListener("touchstart",e=>e.preventDefault(),{passive:false});
qClearBtn.addEventListener("click",()=>{
  qClearBtn.classList.remove("bounce"); void qClearBtn.offsetWidth; qClearBtn.classList.add("bounce");
  const q=document.getElementById("q");
  if(!q.value) return;
  q.value=""; state.q=""; render();
});
document.getElementById("ftoggle").addEventListener("click",()=>{
  document.getElementById("fpanel").classList.toggle("show");
  document.getElementById("ftoggle").classList.toggle("open");
});

function applyTheme(t){
  if(!["dark","light","pink"].includes(t)) t="dark";
  document.documentElement.setAttribute("data-theme",t);
  document.querySelectorAll(".sw").forEach(b=>b.classList.toggle("on",b.dataset.theme===t));
}
document.querySelectorAll(".sw").forEach(b=>b.addEventListener("click",async()=>{
  applyTheme(b.dataset.theme);
  try{ await Store.set("theme",b.dataset.theme); }catch(e){}
}));

buildFilters(); updateFbtn(); loadAll().then(render);

document.addEventListener("click",function(e){
  const bubble=document.getElementById("condBubble");
  const hl=e.target.closest(".cond-hl");
  if(hl){
    e.stopPropagation();
    const cond=CONDITIONS[+hl.dataset.cond];
    if(!cond) return;
    document.getElementById("cbTitle").textContent=cond.name;
    document.getElementById("cbDesc").innerHTML=cond.desc.map(p=>"<p>"+esc(p)+"</p>").join("");
    bubble.hidden=false;
    const r=hl.getBoundingClientRect();
    bubble.style.left=Math.round(r.left)+"px";
    bubble.style.top=Math.round(r.bottom+8)+"px";
    requestAnimationFrame(()=>{
      const br=bubble.getBoundingClientRect();
      let nl=r.left, nt=r.bottom+8;
      if(br.right>window.innerWidth-10) nl-=(br.right-(window.innerWidth-10));
      if(nl<10) nl=10;
      if(br.bottom>window.innerHeight-10){ nt=r.top-br.height-8; if(nt<10) nt=10; }
      bubble.style.left=Math.round(nl)+"px";
      bubble.style.top=Math.round(nt)+"px";
    });
    return;
  }
  if(!bubble.hidden && !e.target.closest(".cond-bubble")) bubble.hidden=true;
});

if("serviceWorker" in navigator){
  window.addEventListener("load",()=>{
    navigator.serviceWorker.register("service-worker.js").catch(()=>{});
  });
}
