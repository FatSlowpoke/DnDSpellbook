<!DOCTYPE html>
<html lang="ru">
<head>
<!-- D&D 5e spellbook -->
<meta charset="utf-8">
<title>Spellbook</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#14121c">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Spellbook">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600&family=Spectral:ital,wght@0,400;0,500;0,600;1,400&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  :root{
    --bg:#14121c; --panel:#1c1928; --panel2:#231f31; --raise:#2a2538;
    --ink:#ece3cf; --muted:#9a91a6; --faint:#6f6880; --body:#ded5c2;
    --gold:#d6b06a; --gold-dim:#8c7339; --onAccent:#1a1410;
    --line:rgba(236,227,207,.10); --line2:rgba(236,227,207,.18);
  }
  html[data-theme="light"]{
    --bg:#f5efe2; --panel:#fffdf8; --panel2:#f1e9d8; --raise:#e9dec8;
    --ink:#3c3420; --muted:#8a7e64; --faint:#b3a787; --body:#4a4230;
    --gold:#a9772a; --gold-dim:#cBA46a; --onAccent:#fffaf0;
    --line:rgba(60,51,32,.12); --line2:rgba(60,51,32,.20);
  }
  html[data-theme="light"] .b-conc,html[data-theme="light"] .mtag.conc{color:#2f8a99}
  html[data-theme="light"] .b-rit,html[data-theme="light"] .mtag.rit{color:#a9772a}
  html[data-theme="light"] .b-own{color:#4f8a47}
  html[data-theme="pink"]{
    --bg:#fff0f6; --panel:#fffafc; --panel2:#ffe6f0; --raise:#ffd6e8;
    --ink:#6a2a4a; --muted:#b06a8a; --faint:#dfa3c0; --body:#7a3a58;
    --gold:#e25b97; --gold-dim:#f0a8c8; --onAccent:#fffafc;
    --line:rgba(160,60,110,.14); --line2:rgba(160,60,110,.24);
  }
  html[data-theme="pink"] .b-conc,html[data-theme="pink"] .mtag.conc{color:#3aa0b0}
  html[data-theme="pink"] .b-rit,html[data-theme="pink"] .mtag.rit{color:#c08a2e}
  html[data-theme="pink"] .b-own{color:#5a9a55}
  .themes{display:flex;gap:11px;justify-content:center;margin-top:13px}
  .sw{width:24px;height:24px;border-radius:50%;border:1px solid var(--line2);
    cursor:pointer;padding:0;transition:.15s}
  .sw[data-theme="dark"]{background:#1c1928}
  .sw[data-theme="light"]{background:#efe6d2}
  .sw[data-theme="pink"]{background:#ffd0e4}
  .sw.on{outline:2px solid var(--gold);outline-offset:2px;border-color:transparent}
  html,body{background:var(--bg);color:var(--ink);
    font-family:'Spectral',Georgia,serif;-webkit-font-smoothing:antialiased}
  html{overflow-y:scroll;scrollbar-gutter:stable}
  body{padding:18px 14px 60px;max-width:760px;margin:0 auto}
  .ui{font-family:'Inter',system-ui,sans-serif}
  ::selection{background:rgba(214,176,106,.3)}

  header{text-align:center;padding:6px 0 14px;position:relative}
  .rule{display:flex;align-items:center;gap:12px;justify-content:center;color:var(--gold-dim)}
  .rule:before,.rule:after{content:"";height:1px;flex:1;max-width:80px;
    background:linear-gradient(90deg,transparent,var(--gold-dim))}
  .rule:after{background:linear-gradient(90deg,var(--gold-dim),transparent)}
  h1{font-family:'Cinzel',serif;font-weight:600;letter-spacing:.16em;
    font-size:24px;color:var(--gold);text-transform:uppercase}
  .sub{font-size:13px;color:var(--muted);margin-top:7px;font-style:italic}

  .slots-block{display:flex;gap:112px;width:100%;box-sizing:border-box;padding:0 15%;margin-top:20px}
  .slots-col{flex:1;min-width:0;display:flex}
  .slots-col:last-child{justify-content:flex-end}
  .slotrow{display:flex;align-items:center;gap:10px;margin-bottom:9px}
  .slotrow:last-child{margin-bottom:0}
  .slotlvl{width:38px;flex:none;font-family:'Inter',sans-serif;font-size:12.5px;
    color:var(--muted);text-align:right}
  .slotcells{display:flex;gap:6px;flex-wrap:nowrap;overflow-x:auto;min-width:0}
  .slot{width:24px;height:24px;border-radius:6px;display:inline-flex;align-items:center;
    justify-content:center;cursor:pointer;user-select:none;-webkit-user-select:none;
    flex:none;box-sizing:border-box;transition:transform .12s ease}
  .slot:active{transform:scale(.88)}
  .slot.notget{border:1.5px solid var(--line2);background:transparent}
  .slot.used{border:1.5px solid var(--line2);background:transparent}
  .slot.ready{border:1.5px solid var(--line2);background:transparent}
  .slotx{color:var(--faint);font-size:15px;line-height:1;pointer-events:none}
  .slotdot{width:11px;height:11px;background:#161213;border-radius:2px;pointer-events:none}
  .tabs{display:flex;gap:6px;margin:16px 0 12px}
  .tab{flex:1;font-family:'Inter',sans-serif;font-size:13px;font-weight:500;
    padding:10px 6px;border:1px solid var(--line);background:var(--panel);
    color:var(--muted);border-radius:10px;cursor:pointer;text-align:center;
    transition:.15s;display:flex;align-items:center;justify-content:center;gap:6px}
  .tab:hover{border-color:var(--line2);color:var(--ink)}
  .tab.on{background:var(--panel2);color:var(--ink);border-color:var(--gold-dim)}
  .tab .cnt{font-size:11px;background:var(--gold);color:var(--onAccent);border-radius:20px;
    min-width:19px;padding:1px 6px;font-weight:600}
  .tab.on.prep{color:var(--gold)}
  .tab.bounce{animation:tabbounce .26s ease}
  @keyframes tabbounce{
    0%{transform:scale(1)}
    35%{transform:scale(.93)}
    65%{transform:scale(1.06)}
    100%{transform:scale(1)}
  }

  .bar{display:flex;gap:8px;margin-bottom:10px}
  .search{flex:1;position:relative}
  .search input{width:100%;font-family:'Inter',sans-serif;font-size:14.5px;
    padding:11px 34px 11px 38px;background:var(--panel);color:var(--ink);
    border:1px solid var(--line);border-radius:10px;outline:none}
  .search input:focus{border-color:var(--gold-dim)}
  .search input::placeholder{color:var(--faint)}
  .search svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);
    width:16px;height:16px;stroke:var(--faint);fill:none;stroke-width:2}
  .qclear{position:absolute;right:5px;top:50%;transform:translateY(-50%);
    width:26px;height:26px;border:none;background:none;cursor:pointer;padding:0;margin:0;
    border-radius:50%;line-height:0;appearance:none;-webkit-appearance:none}
  .qclear:hover{background:var(--raise)}
  .qclear svg{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
    width:14px;height:14px;stroke:var(--faint);fill:none;stroke-width:2.2;pointer-events:none}
  .qclear:hover svg{stroke:var(--ink)}
  .qclear.bounce{animation:qxbounce .28s ease}
  @keyframes qxbounce{
    0%{transform:translateY(-50%) scale(1)}
    35%{transform:translateY(-50%) scale(.7)}
    65%{transform:translateY(-50%) scale(1.18)}
    100%{transform:translateY(-50%) scale(1)}
  }
  .fbtn{font-family:'Inter',sans-serif;font-size:13.5px;font-weight:500;
    padding:0 15px;background:var(--panel);color:var(--muted);
    border:1px solid var(--line);border-radius:10px;cursor:pointer;
    display:flex;align-items:center;gap:7px;white-space:nowrap}
  .fbtn.act{color:var(--gold);border-color:var(--gold-dim)}
  .fbtn svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:2;transition:.2s}
  .fbtn.open svg{transform:rotate(180deg)}

  .filters{display:none;background:var(--panel);border:1px solid var(--line);
    border-radius:12px;padding:14px;margin-bottom:12px}
  .filters.show{display:block}
  .frow{margin-bottom:13px}.frow:last-child{margin-bottom:0}
  .flabel{font-family:'Inter',sans-serif;font-size:11px;font-weight:600;
    text-transform:uppercase;letter-spacing:.09em;color:var(--faint);margin-bottom:8px}
  .chips{display:flex;flex-wrap:wrap;gap:6px}
  .chip{font-family:'Inter',sans-serif;font-size:12.5px;padding:6px 12px;
    background:var(--panel2);color:var(--muted);border:1px solid var(--line);
    border-radius:20px;cursor:pointer;transition:.12s;user-select:none}
  .chip:hover{color:var(--ink)}
  .chip.on{background:var(--raise);color:var(--ink);border-color:var(--gold-dim)}
  .chip.lvl{min-width:34px;text-align:center;padding:6px 8px}
  .chip .dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;vertical-align:middle}
  .clearf{font-family:'Inter',sans-serif;font-size:12.5px;color:var(--gold);
    background:none;border:none;cursor:pointer;margin-top:12px;padding:0;text-decoration:underline;text-underline-offset:3px}

  .count{font-family:'Inter',sans-serif;font-size:12px;color:var(--faint);
    margin:4px 2px 12px;letter-spacing:.02em}

  .card{background:var(--panel);border:1px solid var(--line);border-radius:12px;
    margin-bottom:9px;overflow:hidden;transition:border-color .15s}
  .card:hover{border-color:var(--line2)}
  .card.exp{border-color:var(--gold-dim);background:var(--panel2)}
  .chead{display:flex;align-items:center;gap:10px;padding:13px 14px;cursor:pointer}
  .card:not(.exp) .chead{padding-bottom:6px}
  .card>.cmeta{padding:0 14px 13px;margin-top:0}
  .ctitle{flex:1;min-width:0}
  .cname-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .cname{font-size:18px;font-weight:600;line-height:1.2}
  .cmeta{font-family:'Inter',sans-serif;font-size:12.5px;color:var(--muted);
    margin-top:6px;display:flex;align-items:center;line-height:15px}
  .sdot{width:9px;height:9px;border-radius:50%;flex:none}
  .cmeta .sep{color:var(--faint)}
  .mdiv{width:1px;height:11px;background:var(--line);flex:none;margin:0 7px}
  .spell-icon{width:15px;height:15px;border-radius:4px;flex:none;
    object-fit:cover;vertical-align:middle}
  .mtime-inner{display:inline-flex;align-items:center;gap:3px}
  .cell-icon{width:20px;height:20px;border-radius:5px;object-fit:cover;
    vertical-align:middle;margin-right:6px}
  .mcol{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:none;text-align:center}
  .mtime{width:82px}
  .mrange{width:64px}
  .mdur{width:80px}
  .badge{font-family:'Inter',sans-serif;font-size:10px;font-weight:700;
    text-transform:uppercase;letter-spacing:.05em;padding:2px 7px;border-radius:5px;
    border:1px solid currentColor;flex:none;white-space:nowrap;text-align:center}
  .b-conc,.mtag.conc{color:#83cdd6}.b-rit,.mtag.rit{color:#d6b06a}
  .b-own{color:#7fb46a}.b-abil,.mtag.abil{color:#b08ad9}
  .badge.lvl9{background:linear-gradient(120deg,#4338ca 0%,#7c5cf0 22%,#c9a6ff 45%,#7c5cf0 68%,#4338ca 100%);
    background-size:220% 100%;animation:lvl9shine 2.6s linear infinite;
    color:#fff;border-color:#4338ca;text-shadow:0 0 5px rgba(255,255,255,.55)}
  @keyframes lvl9shine{0%{background-position:0% 50%}100%{background-position:220% 50%}}
  .cond-hl{color:var(--gold);text-decoration:underline dotted;text-underline-offset:2px;
    cursor:pointer;font-weight:600}
  .cond-hl:hover{color:var(--gold-dim)}
  .cond-bubble{position:fixed;z-index:300;max-width:260px;background:var(--panel2);
    border:1px solid var(--line2);border-radius:10px;padding:10px 12px;
    box-shadow:0 10px 28px rgba(0,0,0,.4);font-family:'Inter',sans-serif}
  .cond-bubble[hidden]{display:none}
  .cb-title{font-weight:700;font-size:13px;color:var(--gold);margin-bottom:4px}
  .cb-desc{font-size:12.5px;color:var(--body);line-height:1.42}
  .cb-desc p{margin:0 0 5px 0}
  .cb-desc p:last-child{margin-bottom:0}
  .star{flex:none;width:34px;height:34px;border:none;background:none;cursor:pointer;
    display:flex;align-items:center;justify-content:center;border-radius:8px;transition:.12s}
  .star:hover{background:var(--raise)}
  .star svg{width:21px;height:21px;stroke:var(--faint);fill:none;stroke-width:1.6;transition:.12s}
  .star.on svg{stroke:var(--gold);fill:var(--gold)}
  .marks{flex:none;display:flex;gap:1px}
  .pin{width:32px;height:34px;border:none;background:none;cursor:pointer;
    display:flex;align-items:center;justify-content:center;border-radius:8px;transition:.12s}
  .pin:hover{background:var(--raise)}
  .pin svg{width:17px;height:17px;fill:var(--faint);transition:.12s}
  .pin.on svg{fill:#8fb8e0}
  .sect{font-family:'Inter',sans-serif;font-size:11px;font-weight:600;text-transform:uppercase;
    letter-spacing:.08em;color:var(--faint);margin:18px 2px 9px;display:flex;align-items:center;gap:7px}
  .sect:first-child{margin-top:2px}
  .sect svg{width:13px;height:13px;fill:currentColor;stroke:currentColor}
  .chev{flex:none;align-self:center;width:16px;height:16px;stroke:var(--faint);
    fill:none;stroke-width:2;transition:transform .2s}
  .card.exp .chev{transform:rotate(180deg);stroke:var(--gold)}

  .cbody{display:none;padding:0 14px 16px}
  .card.exp .cbody{display:block}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--line);
    border:1px solid var(--line);border-radius:10px;overflow:hidden;margin:2px 0 14px}
  .grid.g3{grid-template-columns:repeat(3,1fr)}
  .grid.g4{grid-template-columns:repeat(4,1fr)}
  .gcell{background:var(--panel);padding:9px 11px}
  .gk{font-family:'Inter',sans-serif;font-size:10px;text-transform:uppercase;
    letter-spacing:.07em;color:var(--faint)}
  .gv{font-family:'Inter',sans-serif;font-size:13px;color:var(--ink);margin-top:3px}
  .desc p{font-size:15.5px;line-height:1.62;margin-bottom:10px;color:var(--body);white-space:pre-line}
  .desc p:last-child{margin-bottom:0}
  .higher{margin-top:13px;padding-top:13px;border-top:1px solid var(--line)}
  .higher .hk{font-family:'Inter',sans-serif;font-size:11px;font-weight:600;
    text-transform:uppercase;letter-spacing:.07em;color:var(--gold);margin-bottom:6px}
  .higher p{font-size:14.5px;line-height:1.55;color:var(--muted);white-space:pre-line}
  .sp-twrap{overflow-x:auto;-webkit-overflow-scrolling:touch;margin:6px 0 12px}
  .sp-tbl{width:100%;border-collapse:collapse;
    font-family:'Inter',sans-serif;font-size:13px;border-radius:9px}
  .sp-tbl th,.sp-tbl td{border:1px solid var(--line);padding:6px 10px;text-align:left;vertical-align:top}
  .sp-tbl th{background:var(--panel2);color:var(--gold);font-weight:600;white-space:nowrap;
    font-size:10.5px;text-transform:uppercase;letter-spacing:.05em}
  .sp-tbl td{color:var(--body);font-variant-numeric:tabular-nums}
  .sp-tbl tbody tr:nth-child(even) td{background:rgba(128,128,128,.06)}
  .sp-tcap{font-family:'Inter',sans-serif;font-size:12px;font-weight:600;
    text-transform:uppercase;letter-spacing:.05em;color:var(--gold);margin:10px 0 5px}

  .empty{text-align:center;padding:50px 20px;color:var(--muted)}
  .empty .big{font-size:34px;margin-bottom:12px;opacity:.5}
  .empty .t{font-size:17px;color:var(--ink);margin-bottom:6px}
  .empty .h{font-family:'Inter',sans-serif;font-size:13.5px;line-height:1.5}
  .savednote{font-family:'Inter',sans-serif;font-size:11.5px;color:var(--faint);
    text-align:center;margin:18px 0 4px}

  /* editor */
  .edintro{font-family:'Inter',sans-serif;font-size:13px;line-height:1.6;color:var(--muted);
    background:var(--panel);border:1px solid var(--line);border-left:3px solid var(--gold-dim);
    border-radius:8px;padding:12px 14px;margin-bottom:14px}
  .edintro b{color:var(--ink)}
  .edactions{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap}
  .form{background:var(--panel);border:1px solid var(--gold-dim);border-radius:12px;padding:16px;margin-bottom:16px}
  .ff{margin-bottom:13px}
  .ff>label{display:block;font-family:'Inter',sans-serif;font-size:11px;font-weight:600;
    text-transform:uppercase;letter-spacing:.08em;color:var(--faint);margin-bottom:7px}
  .ff .hint{text-transform:none;letter-spacing:0;color:var(--faint);font-weight:400}
  .inp{width:100%;font-family:'Inter',sans-serif;font-size:14px;padding:10px 12px;
    background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:9px;outline:none}
  .inp:focus{border-color:var(--gold-dim)}
  select.inp{appearance:none;cursor:pointer}
  textarea.ta{min-height:96px;resize:vertical;line-height:1.55;font-family:'Spectral',serif;font-size:15px}
  .frow2{display:flex;gap:10px}.frow2 .ff{flex:1;min-width:0}
  .factions{display:flex;gap:8px;margin-top:6px;flex-wrap:wrap}
  .btn{font-family:'Inter',sans-serif;font-size:13.5px;font-weight:500;padding:10px 18px;
    border-radius:9px;cursor:pointer;border:1px solid var(--line);background:transparent;color:var(--muted)}
  .btn:hover{color:var(--ink)}
  .btn.primary{background:var(--gold);color:var(--onAccent);border-color:var(--gold);font-weight:600}
  .btn.primary:hover{color:var(--onAccent)}
  .btn.danger{background:#e0664f;border-color:#e0664f;color:#1a1410;font-weight:600}
  .btn.danger:hover{color:#1a1410}
  .modal-bg{position:fixed;inset:0;background:rgba(10,8,16,.72);display:flex;
    align-items:center;justify-content:center;padding:24px;z-index:50}
  .modal{background:var(--panel2);border:1px solid var(--gold-dim);border-radius:14px;
    padding:20px;max-width:340px;width:100%}
  .modal .mt{font-size:18px;font-weight:600;margin-bottom:8px}
  .modal .mm{font-family:'Inter',sans-serif;font-size:13.5px;color:var(--muted);line-height:1.55;margin-bottom:18px}
  .modal .factions{justify-content:flex-end;margin-top:0}
  .ferr{color:#e0664f;font-family:'Inter',sans-serif;font-size:13px;margin-bottom:8px}
  .crow{display:flex;align-items:center;gap:10px;background:var(--panel);border:1px solid var(--line);
    border-radius:10px;padding:11px 13px;margin-bottom:8px}
  .crow .ci{flex:1;min-width:0}
  .crow .cn{font-size:16px;font-weight:600}
  .crow .cm{font-family:'Inter',sans-serif;font-size:12px;color:var(--muted);margin-top:3px}
  .iconbtn{font-family:'Inter',sans-serif;font-size:12.5px;padding:7px 12px;border-radius:8px;
    border:1px solid var(--line);background:var(--panel2);color:var(--muted);cursor:pointer}
  .iconbtn:hover{color:var(--ink)}
  .iconbtn.del:hover{color:#e0664f;border-color:#e0664f}
  .exportbox{background:var(--panel);border:1px solid var(--gold-dim);border-radius:12px;padding:16px;margin-bottom:16px}
  .exptitle{font-family:'Cinzel',serif;font-size:15px;color:var(--gold);letter-spacing:.08em;margin-bottom:10px}
  .exphelp{font-family:'Inter',sans-serif;font-size:13px;line-height:1.8;color:var(--muted);margin-bottom:12px}
  .exphelp code{background:var(--bg);padding:2px 6px;border-radius:4px;color:var(--ink);font-size:12px}
  .exphelp b{color:var(--ink)}
  .codeout{width:100%;min-height:120px;font-family:ui-monospace,Menlo,Consolas,monospace;
    font-size:11.5px;line-height:1.5;padding:11px;background:var(--bg);color:var(--ink);
    border:1px solid var(--line);border-radius:9px;resize:vertical;white-space:pre;overflow:auto}
@media (max-width:480px){
  .slots-block{gap:22px;padding:0 4px}
  .slotlvl{width:28px;font-size:11px}
  .slot{width:20px;height:20px;border-radius:5px}
  .slotrow{gap:6px}
  .slotcells{gap:4px}
  .slotx{font-size:12px}
  .cmeta{font-size:10.5px;flex-wrap:wrap;row-gap:4px}
  .mtime{width:58px}
  .mrange{width:50px}
  .mdur{width:58px}
  .mdiv{margin:0 4px}
  .badge{font-size:9px;padding:2px 5px}
  .cell-icon{width:16px;height:16px}
  .grid.g4{grid-template-columns:repeat(2,1fr)}
  .gcell{padding:8px 9px}
  .gk{font-size:9px}
  .gv{font-size:12.5px}
}
</style>
</head>
<body>

<div class="cond-bubble" id="condBubble" hidden>
  <div class="cb-title" id="cbTitle"></div>
  <div class="cb-desc" id="cbDesc"></div>
</div>

<header>

<script>
const OFFICIAL = [];
const SEED_SPELLS = [{"id":"cmqw21uo95wb","name":"Брызги кислоты","level":0,"classes":["artificer","sorcerer","wizard"],"time":"Действие","range":"12","dur":"Мгновенная","conc":false,"rit":false,"desc":["Вы кидаете кислотный шарик. Выберите одно существо, которое вы видите в пределах дистанции, или два существа, которых вы видите в пределах дистанции, находящихся в пределах 1 клетки друг от друга. Цель должна преуспеть в спасброске Ловкости, иначе получит 1d6 урона кислотой"],"higher":["Урон этого заклинания увеличивается на 1d6, когда вы достигаете 5-го уровня (2d6), 11-го уровня (3d6) и 17-го уровня (4d6)"],"custom":true},{"id":"cmqw24zkqdq3","name":"Власть над огнем","level":0,"classes":["druid","sorcerer","wizard"],"time":"Действие","range":"12","dur":"Мгновенная или 1 час","conc":false,"rit":false,"desc":["Вы выбираете немагическое пламя, которое вы можете видеть в пределах дистанции и которое помещается в куб с длиной ребра 1 клетка. Вы можете управлять им одним из нижеперечисленных способов:","Вы можете мгновенно распространить огонь на 1 клетку в одном направлении, если там присутствует дерево или другое топливо.\nВы можете мгновенно потушить огонь в кубе.\nВы можете увеличить или уменьшить вдвое область яркого и тусклого света, излучаемого пламенем, а также поменять его цвет. Эффект действует 1 час.\nВы можете сотворить в огне изображение, которое будет отдалённо напоминать существо, предмет или место, и двигаться согласно вашим указаниям. Эффект действует 1 час.\nЕсли вы накладываете это заклинание несколько раз, то вы не можете поддерживать более 3 длительных эффектов одновременно. Вы можете действием отменить один из действующих эффектов"],"higher":[],"custom":true},{"id":"cmqw2byqscg8","name":"Волшебная рука","level":0,"classes":["artificer","bard","sorcerer","warlock","wizard"],"time":"Действие","range":"6","dur":"1 минута","conc":false,"rit":false,"desc":["В точке, выбранной вами в пределах дистанции, появляется призрачная парящая рука. Рука существует, пока заклинание активно или пока вы не отпустите её действием. Рука исчезает, если окажется более чем в 6 клетках от вас или если вы повторно наложите это заклинание","Вы можете действием контролировать руку. С её помощью вы можете манипулировать предметами, открывать незапертые двери и контейнеры, убирать предметы в открытые контейнеры и доставать их оттуда или выливать содержимое флаконов. При каждом использовании руки вы можете переместить её на 6 клеток","Рука не может совершать атаки, активировать магические предметы и переносить более 4,5 кг"],"higher":[],"custom":true},{"id":"cmqw2fvl628v","name":"Волшебный камень","level":0,"classes":["artificer","druid","warlock"],"time":"Бонусное действие","range":"Касание","dur":"1 минута","conc":false,"rit":false,"desc":["Вы касаетесь от 1 до 3 камней и наделяете их магической силой. Вы или кто-либо ещё можете совершить дальнобойную атаку заклинанием, кинув один из этих камней или запустив его при помощи пращи. Дальность броска рукой составляет 12 клеток. Если кто-либо другой атакует этим камнем, он использует для броска атаки ваш модификатор базовой характеристики вместо своего. При попадании цель получает дробящий урон в размере 1d6 + ваш модификатор базовой характеристики. Вне зависимости от того, попал камень или нет, это заклинание перестаёт на него действовать","Если вы накладываете это заклинание ещё раз, его эффект преждевременно заканчивается на тех камнях, что были зачарованы прежде"],"higher":[],"custom":true},{"id":"cmqw4ztxeq1k","name":"Вспышка мечей","level":0,"classes":["artificer","sorcerer","warlock","wizard"],"time":"Действие","range":"На себя","dur":"Мгновенная","conc":false,"rit":false,"desc":["Вы на мгновение создаёте круг из вращающихся вокруг вас призрачных лезвий. Все остальные существа в пределах 1 клетки от вас должны преуспеть в спасброске Ловкости, иначе получат 1d6 урона силовым полем"],"higher":["Урон этого заклинания увеличивается на 1d6, когда вы достигаете 5-го уровня (2d6), 11-го уровня (3d6) и 17-го уровня (4d6)"],"custom":true},{"id":"cmqw54zrtfhv","name":"Громовой клинок","level":0,"classes":["artificer","sorcerer","warlock","wizard"],"time":"Действие","range":"На себя","dur":"1 раунд","conc":false,"rit":false,"desc":["Вы взмахиваете оружием, выбранным в качестве материального компонента, и совершаете им рукопашную атаку оружием против одного существа в пределах 1 клетки от вас. При попадании цель подвергается обычному эффекту от атаки этим оружием и покрывается бушующей энергией до начала вашего следующего хода. Если цель добровольно перемещается на1 клетку или более до окончания действия заклинания, она получает 1d8 урона звуком, и действие заклинания заканчивается"],"higher":["Урон этого заклинания увеличивается, когда вы достигаете определённых уровней. На 5-м уровне рукопашная атака наносит дополнительно 1d8 урона звуком при попадании, а урон, получаемый при перемещении, увеличивается до 2d8. Оба броска урона снова увеличиваются на 1d8 на 11-м уровне (2d8 и 3d8) и на 17-м уровне (3d8 и 4d8)"],"custom":true},{"id":"cmqw568weu9x","name":"Дружба","level":0,"classes":["bard","sorcerer","warlock","wizard"],"time":"Действие","range":"На себя","dur":"До 1 минуты","conc":true,"rit":false,"desc":["Пока заклинание активно, вы совершаете с преимуществом все проверки Харизмы, направленные на одно выбранное вами существо, не враждебное по отношению к вам. Когда заклинание оканчивается, существо понимает, что вы влияли на её отношение с помощью магии, и становится враждебным по отношению к вам. Существо, склонное к насилию, может напасть на вас. Другие могут требовать другого возмездия (решает Мастер), в зависимости от отношений, сложившихся между вами"],"higher":[],"custom":true},{"id":"cmqw59upykw8","name":"Дубинка","level":0,"classes":["druid"],"time":"Бонусное действие","range":"Касание","dur":"1 минута","conc":false,"rit":false,"desc":["Дерево дубинки или боевого посоха, который вы держите, наполняется силой природы. Пока заклинание активно, вы можете использовать свою базовую заклинательную характеристику вместо Силы для бросков рукопашной атаки и урона при использовании этого оружия, и кость урона становится равной d8. Если оружие не было магическим, оно становится им. Заклинание оканчивается, если вы наложите его ещё раз или выпустите оружие из рук"],"higher":[],"custom":true},{"id":"cmqw5b0is57u","name":"Защита от оружия","level":0,"classes":["bard","sorcerer","warlock","wizard"],"time":"Действие","range":"На себя","dur":"1 раунд","conc":false,"rit":false,"desc":["Вы протягиваете руку и рисуете в воздухе ограждающий знак. Вы получаете до конца своего следующего хода сопротивление дробящему, колющему и рубящему урону, причиненному атаками оружием"],"higher":[],"custom":true},{"id":"cmqw5c9mjmsa","name":"Злая насмешка","level":0,"classes":["bard"],"time":"Действие","range":"12","dur":"Мгновенная","conc":false,"rit":false,"desc":["Вы испускаете на существо, видимое в пределах дистанции, поток оскорблений вперемешку с тонкой магией. Если цель слышит вас (при этом она не обязана вас понимать), она должна преуспеть в спасброске Мудрости, иначе получит урон психической энергией 1d4, и следующий бросок атаки до конца своего следующего хода совершит с помехой"],"higher":["Урон этого заклинания увеличивается на 1d4, когда вы достигаете 5-го уровня (2d4), 11-го уровня (3d4) и 17-го уровня (4d4)"],"custom":true},{"id":"cmqw5dfhznyy","name":"Искусство друидов","level":0,"classes":["druid"],"time":"Действие","range":"6","dur":"Мгновенная","conc":false,"rit":false,"desc":["Пошептавшись с духами природы, вы создаёте один из следующих эффектов в пределах дистанции:","Вы создаёте крохотный безвредный ощутимый эффект, предсказывающий погоду в текущем месте в течение следующих 24 часов. Это может быть золотистый шарик, означающий ясную погоду, облачко, означающее дождь, снежинка, и так далее. Эффект длится 1 раунд.\nВы мгновенно заставляете цветок распуститься, семечко прорасти, или почку раскрыться.\nВы создаёте мгновенный безвредный ощутимый эффект, такой как падающие листья, порыв ветра, звук маленького животного, или слабый запах скунса. Эффект должен находиться в кубе с длиной ребра 1 клетка.\nВы мгновенно зажигаете или тушите свечу, факел или небольшой костёр"],"higher":[],"custom":true},{"id":"cmqw5f5o4yxf","name":"Иссушающий укол","level":0,"classes":[],"time":"Действие","range":"6","dur":"Мгновенная","conc":false,"rit":false,"desc":["Вы вытягиваете жизненные силы одного видимого существа в пределах дистанции. Цель должна преуспеть в спасброске Телосложения, иначе получит 1d4 урона некротической энергией и упадёт ничком"],"higher":["Урон этого заклинания увеличивается на 1d4, когда вы достигаете 5-го уровня (2d4), 11-го уровня (3d4) и 17-го уровня (4d4)"],"custom":true},{"id":"cmqw5gmapb0u","name":"Клинок зелёного пламени","level":0,"classes":["artificer","sorcerer","warlock","wizard"],"time":"Действие","range":"На себя (радиус 1 клетка)","dur":"Мгновенная","conc":false,"rit":false,"desc":["Вы взмахиваете оружием, выбранным в качестве материального компонента, и совершаете им рукопашную атаку оружием против одного существа в пределах 1 клетки от вас. При попадании цель подвергается обычному эффекту атаки этим оружием, и вы можете заставить зелёный огонь перекинуться от цели к другому существу по вашему выбору, которое вы можете видеть в пределах 1 клетки от цели. Второе существо получает урон огнём, равный вашему модификатору базовой характеристики"],"higher":["Урон этого заклинания увеличивается, когда вы достигаете определенных уровней. На 5-м уровне рукопашная атака наносит дополнительно 1d8 урона огнём, а урон, получаемый вторым существом, увеличивается до 1d8 + ваш модификатор базовой характеристики. Оба этих урона увеличиваются на 1d8 на 11-м уровне (2d8 и 2d8) и 17-м уровне (3d8 и 3d8)"],"custom":true},{"id":"cmqw5hwls3l2","name":"Кодировка мыслей","level":0,"classes":[],"time":"Действие","range":"На себя","dur":"До 8 часов","conc":false,"rit":false,"desc":[],"higher":["Прикладывая палец к своей голове, вы извлекаете воспоминание, идею или сообщение из своего разума и трансформируете её в осязаемую ленту светящейся энергии — ленту мысли. Она существует в течение всей длительности заклинания или пока вы не наложите это заклинание снова. Лента мысли появляется в свободном пространстве в пределах 1 клетки от вас как Крошечный невесомый полутвёрдый предмет, который можно держать и нести как ленту. В остальном она неподвижна.","Если вы накладываете это заклинание, пока концентрируетесь на заклинании или умении, позволяющем читать мысли других существ или манипулировать ими (например, обнаружение мыслей [detect thoughts] или изменение памяти [modify memory]), вы можете трансформировать в ленту мысли читаемые вами мысли или воспоминания.","Если вы накладываете это заклинание, пока держите ленту мысли, вы мгновенно получаете ту информацию, что содержит лента (накладывание заклинания обнаружение мыслей [detect thoughts] на ленту имеет тот же эффект)"],"custom":true},{"id":"cmqw5j7nbtx4","name":"Лассо молнии","level":0,"classes":["artificer","sorcerer","warlock","wizard"],"time":"Действие","range":"На себя (радиус 3 клетки)","dur":"Мгновенная","conc":false,"rit":false,"desc":["Вы создаёте хлыст из молний, поражающий одно существо по вашему выбору, которое вы можете видеть в пределах 3 клеток от вас. Цель должна преуспеть в спасброске Силы, иначе будет притянута на 2 клетки по прямой к вам, после чего получит 1d8 урона электричеством, если окажется в пределах 1 клетки от вас"],"higher":["Урон этого заклинания увеличивается на 1d8, когда вы достигаете 5-го уровня (2d8), 11-го уровня (3d8) и 17-го уровня (4d8)"],"custom":true},{"id":"cmqw5kcf9wq4","name":"Леденящее прикосновение","level":0,"classes":["sorcerer","warlock","wizard"],"time":"Действие","range":"24","dur":"1 раунд","conc":false,"rit":false,"desc":["ы создаете призрачную руку скелета в пространстве существа, находящегося в пределах дистанции. Совершите дальнобойную атаку заклинанием по существу, чтобы окутать его могильным холодом. При попадании цель получает 1d8 урона некротической энергией и не может восстанавливать хиты до начала вашего следующего хода. Все это время рука держится за цель.","Если вы попадаете по Нежити, то она также совершает по вам броски атаки с помехой до конца вашего следующего хода"],"higher":["Урон этого заклинания увеличивается на 1d8, когда вы достигаете 5-го уровня (2d8), 11-го уровня (3d8) и 17-го уровня (4d8)"],"custom":true},{"id":"cmqw5lk621av","name":"Лепка земли","level":0,"classes":["druid","sorcerer","wizard"],"time":"Действие","range":"6","dur":"Мгновенная или 1 час","conc":false,"rit":false,"desc":["Выберите область земли или камня, видимую в пределах дистанции и помещающуюся в куб с длиной ребра 1 клетка. Вы можете управлять ей одним из нижеперечисленных способов:","Если вы нацелились на область рыхлой земли, вы можете мгновенно извлечь её и переместить на расстояние до 1 клетка по земле. Это перемещение не обладает достаточной силой, чтобы причинить урон.\nВы можете создавать узоры или цвета на поверхности земли или камня, для передачи слов, изображений или форм. Эффект действует 1 час.\nЕсли выбранная область находится на поверхности земли, вы можете сделать её труднопроходимой. В качестве альтернативы вы можете сделать труднопроходимую местность нормальной. Эффект действует 1 час.\nЕсли вы накладываете это заклинание несколько раз, вы не можете поддерживать более 2 длительных эффектов одновременно. Вы можете действием отменить один из действующих эффектов"],"higher":[],"custom":true},{"id":"cmqw5qlxmc4h","name":"Луч холода","level":0,"classes":["artificer","sorcerer","wizard"],"time":"Действие","range":"12","dur":"Мгновенная","conc":false,"rit":false,"desc":["Холодный сине-белый луч устремляется к существу, находящемуся в пределах дистанции. Совершите по цели дальнобойную атаку заклинанием. При попадании она получает урон холодом 1d8, а скорость до начала вашего следующего хода уменьшается на 2 клетки"],"higher":["Урон от заклинания увеличивается на 1d8, когда вы достигаете 5-го уровня (2d8), 11-го уровня (3d8) и 17-го уровня (4d8)"],"custom":true},{"id":"cmqw5rken6iy","name":"Малая иллюзия","level":0,"classes":["bard","sorcerer","warlock","wizard"],"time":"Действие","range":"6","dur":"До 1 минуты","conc":false,"rit":false,"desc":["Вы создаёте звук или образ предмета в пределах дистанции, существующий, пока активно заклинание. Иллюзия также оканчивается, если вы отпустите её действием или используете это заклинание ещё раз.","Если вы создаёте звук, его громкость может быть как шепотом, так и криком. Это может быть ваш голос, чей-то другой голос, львиный рык, бой барабанов или любой другой звук по вашему выбору. Звук звучит всю длительность заклинания, или вы можете создавать отдельные звуки в разное время, пока заклинание активно.","Если вы создаёте образ предмета — например, стул, отпечаток в грязи, или небольшой сундук — он должен помещаться в куб с длиной ребра 1 клетка. Образ не может издавать звуки, свет, запах или прочие сенсорные эффекты. Физическое взаимодействие с образом даёт понять, что это иллюзия, потому что сквозь него все проходит.","Если существо действием исследует звук или образ, оно может понять, что это иллюзия, совершив успешную проверку Интеллекта (Расследование) против Сл ваших заклинаний. Если существо распознает иллюзию, она для него становится нечёткой"],"higher":[],"custom":true},{"id":"cmqw5sikmuaw","name":"Меткий удар","level":0,"classes":["bard","sorcerer","warlock","wizard"],"time":"Действие","range":"6","dur":"До 1 минуты","conc":true,"rit":false,"desc":["Вы вытягиваете руку и указываете пальцем на цель, находящуюся в пределах дистанции. Ваша магия даёт краткое понимание защиты цели. В своем следующем ходу вы совершаете с преимуществом первый бросок атаки по цели, при условии, что заклинание к тому моменту не окончится"],"higher":[],"custom":true},{"id":"cmqw7uprf8r4","name":"Мистический заряд","level":0,"classes":["warlock"],"time":"Действие","range":"24","dur":"Мгновенная","conc":false,"rit":false,"desc":["К существу, находящемуся в пределах дистанции, устремляется луч потрескивающей энергии. Совершите дальнобойную атаку заклинанием по цели. При попадании цель получает урон силовым полем 1d10"],"higher":["Заклинание создаёт ещё один луч, когда вы достигаете больших уровней: два луча на 5-м уровне, три луча на 11-м уровне и четыре луча на 17-м уровне.","Вы можете направить лучи в одну цель или в разные. Для каждого луча совершите свой бросок атаки"],"custom":true},{"id":"cmqw7wahhudf","name":"Нашествие","level":0,"classes":["druid","sorcerer","warlock","wizard"],"time":"Действие","range":"6","dur":"Мгновенная","conc":false,"rit":false,"desc":["Вы вызываете клещей, блох и других паразитов, которые мгновенно обволакивают одно существо, которое вы можете видеть в пределах дистанции. Цель должна преуспеть в спасброске Телосложения, иначе получит 1d6 урона ядом и переместится на 1 клетка в случайном направлении, если она может двигаться и её скорость составляет не менее 1 клетка. Бросьте d4 для определения направления: 1, север; 2, юг; 3, восток; или 4, запад. Это перемещение не провоцирует атаки и, если выпавшее направление заблокировано, цель не перемещается"],"higher":["Урон заклинания увеличивается на 1d6, когда вы достигаете 5-го уровня (2d6), 11-го уровня (3d6) и 17-го уровня (4d6)"],"custom":true},{"id":"cmqw7x9umrx1","name":"Обморожение","level":0,"classes":["artificer","druid","sorcerer","warlock","wizard"],"time":"Действие","range":"12","dur":"Мгновенная","conc":false,"rit":false,"desc":["Сильный холод окружает одно существо, которое вы можете видеть в пределах дистанции. Цель должна совершить спасбросок Телосложения. При провале цель получает 1d6 урона холодом и совершает с помехой следующий бросок атаки оружием до конца своего следующего хода"],"higher":["Урон этого заклинания увеличивается на 1d6, когда вы достигаете 5-го уровня (2d6), 11-го уровня (3d6) и 17-го уровня (4d6)"],"custom":true},{"id":"cmqw7yek12wk","name":"Огненный снаряд","level":0,"classes":["artificer","sorcerer","wizard"],"time":"Действие","range":"24","dur":"Мгновенная","conc":false,"rit":false,"desc":["Вы кидаете сгусток огня в существо или предмет в пределах дистанции. Совершите по цели дальнобойную атаку заклинанием. При попадании цель получает урон огнём 1d10. Горючие предметы, по которым попало это заклинание, воспламеняются, если их никто не несет и не носит"],"higher":["Урон этого заклинания увеличивается на 1d10, когда вы достигаете 5-го уровня (2d10), 11-го уровня (3d10), 17-го уровня (4d10)"],"custom":true},{"id":"cmqw816uhl20","name":"Первобытная дикость","level":0,"classes":["druid"],"time":"Действие","range":"На себя","dur":"Мгновенная","conc":false,"rit":false,"desc":["Вы направляете первобытную магию, затачивающую ваши зубы или ногти, и готовитесь к агрессивной атаке. Совершите рукопашную атаку заклинанием против одного существа в пределах 1 клетки от вас. При попадании цель получает 1d10 урона кислотой. После того, как вы совершите атаку, ваши зубы или ногти вернутся в нормальное состояние"],"higher":["Урон заклинания увеличивается на 1d10, когда вы достигаете 5-го уровня (2d10), 11-го уровня (3d10) и 17-го уровня (4d10)"],"custom":true},{"id":"cmqw824ancjz","name":"Пляшущие огоньки","level":0,"classes":["artificer","bard","sorcerer","wizard"],"time":"Действие","range":"24","dur":"До 1 минуты","conc":true,"rit":false,"desc":["Вы создаете до четырёх огоньков размером с факел в пределах дистанции, делая их похожими на факелы, фонари или светящиеся сферы, парящие в воздухе. Вы можете также объединить четыре огонька в одну светящуюся человекоподобную фигуру Среднего размера. Какую бы форму вы ни выбрали, каждый огонёк излучает тусклый свет в радиусе 2 клеток.","Вы можете бонусным действием в свой ход переместить огоньки на 12 клеток в новое место в пределах дистанции. Каждый огонёк должен находиться в пределах 4 клеток от другого огонька, созданного этим заклинанием, и огонёк тухнет, если оказывается за пределами дистанции заклинания"],"higher":[],"custom":true},{"id":"cmqw82xkso9s","name":"Погребальный звон","level":0,"classes":["cleric","warlock","wizard"],"time":"Действие","range":"12","dur":"Мгновенная","conc":false,"rit":false,"desc":["Вы указываете на одно существо, которое можете видеть в пределах дистанции, и воздух вокруг него на мгновение наполняется скорбным звучанием колокола. Цель должна преуспеть в спасброске Мудрости, иначе получит 1d8 урона некротической энергией. Если хиты цели были не полные, то вместо 1d8 она получает 1d12 урона некротической энергией"],"higher":["Урон заклинания увеличивается на одну кость, когда вы достигаете 5-го уровня (2d8 или 2d12), 11-го уровня (3d8 или 3d12) и 17-го уровня (4d8 или 4d12)"],"custom":true},{"id":"cmqw84dgyba1","name":"Починка","level":0,"classes":["artificer","bard","cleric","druid","sorcerer","wizard"],"time":"1 минута","range":"Касание","dur":"Мгновенная","conc":false,"rit":false,"desc":["Это заклинание чинит одно повреждение или разрыв на предмете, которого касаетесь, например, разорванное звено цепи, две половинки сломанного ключа, порванный плащ или протекающий бурдюк. Если повреждение или разрыв не больше 1 фута в любом измерении, вы чините его, не оставляя следов.","Это заклинание может физически починить магический предмет или Конструкта, но не может восстановить магию в таких предметах"],"higher":[],"custom":true},{"id":"cmqw85eqs267","name":"Раскат грома","level":0,"classes":["artificer","bard","druid","sorcerer","wizard"],"time":"Действие","range":"1","dur":"Мгновенная","conc":false,"rit":false,"desc":["Вы вызываете оглушительный раскат грома, который слышен на расстоянии до 20 клеток. Все существа кроме вас в пределах дистанции должны совершить спасбросок Телосложения. При провале существо получает 1d6 урона звуком"],"higher":["Урон заклинания увеличивается на 1d6, когда вы достигаете 5-го уровня (2d6), 11-го уровня (3d6) и 17-го уровня (4d6)"],"custom":true},{"id":"cmqw86la2cja","name":"Расщепление разума","level":0,"classes":["sorcerer","warlock","wizard"],"time":"Действие","range":"12","dur":"1 раунд","conc":false,"rit":false,"desc":["Вы отправляете дезориентирующий луч психической энергии в разум одного существа, которое видите в пределах дистанции. Цель должна преуспеть в спасброске Интеллекта, иначе получит 1d6 урона психической энергией и вычтет 1d4 из следующего спасброска, совершаемого ею до конца вашего следующего хода"],"higher":["Урон этого заклинания увеличивается на 1d6, когда вы достигаете следующих уровней: 5-го уровня (2d6), 11-го уровня (3d6) и 17-го уровня (4d6)"],"custom":true},{"id":"cmqw87l383d8","name":"Свет","level":0,"classes":["artificer","bard","cleric","sorcerer","wizard"],"time":"Действие","range":"Касание","dur":"1 час","conc":false,"rit":false,"desc":["Вы касаетесь одного предмета, длина которого ни по одному из измерений не превышает 2 клетки. Пока заклинание активно, предмет испускает яркий свет в радиусе 4 клеток и тусклый свет в пределах ещё 4 клетки. Свет может быть любого выбранного вами цвета. Полное покрытие предмета чем-то непрозрачным блокирует свет. Заклинание оканчивается, если вы наложите его ещё раз или окончите действием.","Если вы нацелились на предмет, несомый или носимый враждебным существом, это существо должно преуспеть в спасброске Ловкости, чтобы увернуться от заклинания."],"higher":[],"custom":true},{"id":"cmqw88d8zyfr","name":"Священное пламя","level":0,"classes":["cleric"],"time":"Действие","range":"12","dur":"Мгновенная","conc":false,"rit":false,"desc":["На существо, которое вы видите в пределах дистанции, нисходит сияние, похожее на огонь. Цель должна преуспеть в спасброске Ловкости, иначе получит 1d8 урона излучением. Для этого спасброска цель не получает преимуществ от укрытия"],"higher":["Урон этого заклинания увеличивается на 1d8, когда вы достигаете 5-го уровня (2d8), 11-го уровня (3d8) и 17-го уровня (4d8)"],"custom":true},{"id":"cmqw8ab1bry9","name":"Слово сияния","level":0,"classes":["cleric"],"time":"Действие","range":"1","dur":"Мгновенная","conc":false,"rit":false,"desc":["Вы произносите божественное слово и исторгаете из себя обжигающее сияние. Каждое существо по вашему выбору, которое вы можете видеть в пределах дистанции, должно преуспеть в спасброске Телосложения, иначе получит 1d6 урона излучением"],"higher":["Урон заклинания увеличивается на 1d6, когда вы достигаете 5-го уровня (2d6), 11-го уровня (3d6), и 17-го уровня (4d6)"],"custom":true},{"id":"cmqw8beysmm8","name":"Сообщение","level":0,"classes":["artificer","bard","sorcerer","wizard"],"time":"Действие","range":"24","dur":"1 раунд","conc":false,"rit":false,"desc":["Вы указываете пальцем в направлении существа, находящегося в пределах дистанции, и шепчете послание. Цель (и только цель) слышит его, и может ответить шепотом, который услышите только вы.","Вы можете использовать это заклинание сквозь твердые препятствия, если вы знакомы с целью и знаете, что она находится за барьером. Магическая тишина, 1 фут камня, 1 дюйм обычного металла, тонкий лист свинца или 3 фута дерева блокируют заклинание. Заклинание не обязано идти по прямой линии, и может огибать углы и проходить через отверстия"],"higher":[],"custom":true},{"id":"cmqwb7tb4nof","name":"Сопротивление","level":0,"classes":["artificer","cleric","druid"],"time":"1 действие","range":"Касание","dur":"До 1 минуты","conc":true,"rit":false,"desc":["Вы касаетесь одного согласного существа. Пока заклинание активно, цель может один раз бросить d4 и добавить выпавшее число к одному спасброску на свой выбор. Кость можно кидать до или после спасброска. После этого заклинание оканчивается."],"higher":[],"custom":true},{"id":"cmqwbdxwmm7w","name":"Сотворение костра","level":0,"classes":["artificer","druid","sorcerer","warlock","wizard"],"time":"1 действие","range":"12","dur":"До 1 минуты","conc":true,"rit":false,"desc":["Вы создаёте огонь на поверхности земли в точке, которую можете видеть в пределах дистанции. Пока заклинание действует, огонь занимает область в кубе с длиной ребра 1 клетка. Все существа, оказавшиеся в этом пространстве в момент накладывания заклинания, должны преуспеть в спасброске Ловкости, иначе получат 1d8 урона огнём. Существо также должно совершать спасбросок, когда впервые за ход перемещается в область действия заклинания или заканчивает свой ход в ней. Пламя поджигает все никем не носимые и не переносимые горючие предметы."],"higher":["Урон заклинания увеличивается на 1d8, когда вы достигаете 5-го уровня (2d8), 11-го уровня (3d8) и 17-го уровня (4d8)."],"custom":true},{"id":"cmqwbk8tk5h4","name":"Сотворение пламени","level":0,"classes":["druid"],"time":"1 действие","range":"На себя","dur":"10 минут","conc":false,"rit":false,"desc":["В вашей ладони появляется мерцающее пламя. Оно остаётся там, пока заклинание активно, и не вредит ни вам, ни вашему снаряжению. Огонь испускает яркий свет в радиусе 2 клеток и тусклый свет в пределах ещё 2 клетки. Заклинание оканчивается, если вы оканчиваете его действием или накладываете ещё раз.","Вы можете атаковать этим пламенем, но это тоже оканчивает заклинание. Когда вы накладываете это заклинание, или другим действием в одном из последующих ходов вы можете метнуть пламя в существо, находящееся в пределах 6 клеток от вас. Совершите дальнобойную атаку заклинанием. При попадании цель получает 1d8 урона огнём."],"higher":["Урон этого заклинания увеличивается на 1d8, когда вы достигаете 5-го уровня (2d8), 11-го уровня (3d8) и 17-го уровня (4d8)"],"custom":true},{"id":"cmqwbkrnhi5l","name":"Терновый кнут","level":0,"classes":["artificer","druid"],"time":"1 действие","range":"6","dur":"Мгновенная","conc":false,"rit":false,"desc":["Вы создаёте длинный, похожий на лозу кнут, покрытый шипами, бьющий по вашей команде существо, находящееся в пределах дистанции. Совершите рукопашную атаку заклинанием по цели. Если атака попадает, существо получает колющий урон 1d6, и, если размер существа не больше Большого, вы подтягиваете существо на расстояние до 2 клетки к себе."],"higher":["Урон этого заклинания увеличивается на 1d6, когда вы достигаете 5 уровня (2d6), 11 уровня (3d6) и 17 уровня (4d6)."],"custom":true},{"id":"cmqwblf7errg","name":"Указание","level":0,"classes":["artificer","cleric","druid"],"time":"1 действие","range":"Касание","dur":"До 1 минуты","conc":true,"rit":false,"desc":["Вы касаетесь одного согласного существа. Один раз, пока заклинание активно, цель может бросить 1d4 и добавить выпавшее число к одной проверке характеристики на свой выбор. Эту кость можно бросить до или после совершения проверки. После этого заклинание оканчивается."],"higher":[],"custom":true},{"id":"cmqwbljh4x1p","name":"Уход за умирающим","level":0,"classes":["artificer","cleric"],"time":"1 действие","range":"Касание","dur":"Мгновенная","conc":false,"rit":false,"desc":["Вы касаетесь живого существа, у которого 0 хитов. Оно становится стабилизированным. Это заклинание не оказывает никакого эффекта на Нежить и Конструктов."],"higher":[],"custom":true},{"id":"cmqwbloa9pot","name":"Фокусы","level":0,"classes":["artificer","bard","sorcerer","warlock","wizard"],"time":"1 действие","range":"2","dur":"Вплоть до 1 часа","conc":false,"rit":false,"desc":["Это заклинание — небольшой магический трюк, на котором практикуются начинающие заклинатели. Вы создаете один из следующих магических эффектов в пределах дистанции:","Вы создаете мгновенный безвредный сенсорный эффект, такой как сноп искр, порыв ветра, тихую мелодию, или необычный запах.","Вы мгновенно зажигаете или тушите свечу, факел или небольшой костер.","Вы мгновенно чистите или мараете предмет, размерами не превышающий 1 кубического фута.","Вы остужаете, нагреваете или придаете вкус 1 кубическому футу неживой материи на 1 час.","Вы создаёте на поверхности или предмете цвет, метку или символ, существующую 1 час.","Вы создаёте немагическую безделушку или иллюзорное изображение, помещающееся в вашу ладонь, и существующее до конца вашего следующего хода.","Если вы накладываете это заклинание несколько раз, вы можете иметь не более трёх немгновенных эффектов одновременно. Вы можете действием окончить один из этих эффектов."],"higher":[],"custom":true},{"id":"cmqwbltlynbk","name":"Формование воды","level":0,"classes":["druid","sorcerer","wizard"],"time":"1 действие","range":"6","dur":"Мгновенная или 1 час","conc":false,"rit":false,"desc":["Выберите область воды, которую вы видите в пределах дистанции, и которая помещается в куб с длиной ребра 1 клетка. Вы можете управлять ей одним из нижеперечисленных способов:","Вы мгновенно перемещаете или иным образом изменяете течение воды до 1 клетка в любом направлении. Этого воздействия недостаточно, чтобы причинить урон.","Вы можете заставить воду принимать простые формы и двигаться согласно вашим указаниям. Этот эффект действует 1 час.","Вы можете изменить цвет или прозрачность воды. Вся область воды должна быть одного цвета и прозрачности. Эффект действует 1 час.","Вы замораживаете воду, если в ней нет никаких существ. Вода размораживается через 1 час.","Если вы накладываете это заклинание несколько раз, вы не можете поддерживать более двух длительных эффектов одновременно. Вы можете действием отменить один из действующих эффектов."],"higher":[],"custom":true},{"id":"cmqwblyrc8qz","name":"Чудотворство","level":0,"classes":["cleric"],"time":"1 действие","range":"6","dur":"Вплоть до 1 минуты","conc":false,"rit":false,"desc":["Вы создаёте небольшое чудо, знак сверхъестественной силы. Вы создаёте один из следующих магических эффектов в пределах дистанции:","Ваш голос в течение 1 минуты звучит в три раза громче.","Вы заставляете пламя в течение 1 минуты мерцать, светить ярче или тусклее, или изменять цвет.","Вы вызываете безвредную дрожь в полу в течение 1 минуты.","Вы создаёте мгновенный звук, исходящий из выбранной вами точки в пределах дистанции, такой как раскат грома, крик ворона или зловещий шёпот.","Вы мгновенно заставляете незапертое окно или дверь распахнуться или захлопнуться.","Вы на 1 минуту изменяете внешний вид своих глаз.","Если вы накладываете это заклинание несколько раз, у вас может быть до трёх активных эффектов с длительностью в 1 минуту, и вы можете оканчивать такие эффекты действием."],"higher":[],"custom":true},{"id":"cmqwbm611aro","name":"Шквал","level":0,"classes":["druid","sorcerer","wizard"],"time":"1 действие","range":"6","dur":"Мгновенная","conc":false,"rit":false,"desc":["Вы контролируете окружающий воздух и можете создать один из нижеперечисленных эффектов в точке, которую видите в пределах дистанции:","Одно существо с размером не больше Среднего должно преуспеть в спасброске Силы, иначе его оттолкнёт на 1 клетка от вас.","Вы создаёте небольшой порыв ветра, способный переместить предмет, который никто не несёт и не носит, и который весит не более 5 фунтов. Объект толкается на расстояние до 2 клетки от вас. Этого толчка недостаточно, чтобы причинить урон.","Вы создаёте безвредный эффект с использованием воздуха, например заставляете листву шелестеть, ветром захлопнуть ставни или вашу одежду колыхаться на ветру."],"higher":[],"custom":true},{"id":"cmqwbmc5a8ue","name":"Электрошок","level":0,"classes":["artificer","sorcerer","wizard"],"time":"1 действие","range":"Касание","dur":"Мгновенная","conc":false,"rit":false,"desc":["Молния спрыгивает с вашей руки и ударяет существо, которого вы пытались коснуться. Совершите по цели рукопашную атаку заклинанием. Вы совершаете бросок атаки с преимуществом, если цель носит доспех из металла. При попадании цель получает 1d8 урона электричеством и до начала своего следующего хода не может совершать реакции."],"higher":["Урон заклинания увеличивается на 1d8, когда вы достигаете 5-го уровня (2d8), 11-го уровня (3d8) и 17-го уровня (4d8)."],"custom":true},{"id":"cmqwbmhzvjmn","name":"Ядовитые брызги","level":0,"classes":["artificer","druid","sorcerer","warlock","wizard"],"time":"1 действие","range":"2","dur":"Мгновенная","conc":false,"rit":false,"desc":["Вы простираете руку к существу, видимому в пределах дистанции, и выпускаете из ладони клубы токсичного газа. Это существо должно преуспеть в спасброске Телосложения, иначе оно получит урон ядом 1d12."],"higher":["Урон этого заклинания увеличивается на 1d12, когда вы достигаете 5-го уровня (2d12), 11-го уровня (3d12) и 17-го уровня (4d12)."],"custom":true},{"id":"cmqwbpm1lca4","name":"Адское возмездие","level":1,"classes":["warlock"],"time":"Реакция","range":"12","dur":"Мгновенная","conc":false,"rit":false,"desc":["Вы указываете пальцем, и существо, причинившее вам урон, мгновенно окружается пламенем. Существо должно совершить спасбросок Ловкости. Оно получает 2d10 урона огнём при провале, или половину этого урона при успехе."],"higher":["Если вы накладываете это заклинание, используя ячейку 2-го уровня или выше, урон увеличивается на 1d10 за каждый уровень ячейки выше первого."],"custom":true},{"id":"cmqwbpsaenad","name":"Безмолвный образ","level":1,"classes":["bard","sorcerer","wizard"],"time":"1 действие","range":"12","dur":"До 10 минут","conc":true,"rit":false,"desc":["Вы создаёте образ предмета, существа или другого видимого явления, помещающийся в объеме в куб с длиной ребра 3 клетки. Образ появляется в точке, которую вы видите в пределах дистанции, и существует, пока активно заклинание. Это исключительно зрительная иллюзия, не сопровождаемая звуками, запахами и прочими сенсорными эффектами.","Вы можете действием заставить образ переместиться в любое место в пределах дистанции. Пока образ меняет местоположение, вы можете изменять его внешность, чтобы перемещение выглядело естественным. Например, если вы создаете образ существа и перемещаете его, вы можете изменить образ, чтобы казалось, что оно идет.","Физическое взаимодействие с образом даёт понять, что это иллюзия, потому что сквозь него всё проходит. Существа, исследующие образ действием, могут определить, что это иллюзия, совершив успешную проверку Интеллекта (Расследование) против Сл ваших заклинаний. Если существо распознает иллюзию, оно может видеть сквозь неё."],"higher":[],"custom":true},{"id":"cmqwbpxb0ndh","name":"Благословение","level":1,"classes":["cleric","paladin"],"time":"1 действие","range":"6","dur":"До 1 минуты","conc":true,"rit":false,"desc":["Вы благословляете до трёх существ на свой выбор в пределах дистанции. Каждый раз, когда до окончания заклинания цель совершает бросок атаки или спасбросок, она может бросить d4 и добавить выпавшее число к результату."],"higher":["Если вы накладываете это заклинание, используя ячейку 2-го уровня или выше, вы можете сделать целью одно дополнительное существо за каждый уровень ячейки выше 1-го."],"custom":true},{"id":"cmqwbq1xbdl7","name":"Ведьмин снаряд","level":1,"classes":["sorcerer","warlock","wizard"],"time":"1 действие","range":"6","dur":"До 1 минуты","conc":true,"rit":false,"desc":["Луч потрескивающей синеватой энергии устремляется к существу в пределах дистанции, формируя между вами и целью непрерывный дуговой разряд. Совершите дальнобойную атаку заклинанием по этому существу. При попадании цель получает 1d12 урона электричеством, и, пока заклинание активно, вы можете в каждый свой ход действием автоматически причинять цели 1d12 урона электричеством. Это заклинание оканчивается, если вы действием сделаете что-то иное. Заклинание также оканчивается, если цель окажется за пределами дистанции заклинания или получит от вас полное укрытие."],"higher":["Если вы накладываете это заклинание, используя ячейку 2-го уровня или выше, первичный урон увеличивается на 1d12 за каждый уровень ячейки выше первого."],"custom":true},{"id":"cmqwbq6rhv8x","name":"Волна грома","level":1,"classes":["bard","druid","sorcerer","wizard"],"time":"1 действие","range":"На себя (15-футовый куб)","dur":"Мгновенная","conc":false,"rit":false,"desc":["От вас исходит волна громовой силы. Все существа в кубе с длиной ребра 3 клетки, исходящего от вас, должны совершить спасбросок Телосложения. При провале существо получает 2d8 урона звуком и отталкивается на 2 клетки от вас. При успехе существо получает половину урона и не толкается.","Кроме того, незакреплённые предметы, оказавшиеся полностью в области эффекта, автоматически толкаются на 2 клетки от вас эффектом заклинания, и заклинание издает громовой рокот, слышимый на расстоянии 60 клеток."],"higher":["Если вы накладываете это заклинание, используя ячейку 2-го уровня или выше, урон увеличивается на 1d8 за каждый уровень ячейки выше первого."],"custom":true},{"id":"cmqwbqb1maxv","name":"Волшебная стрела","level":1,"classes":["sorcerer","wizard"],"time":"1 действие","range":"24","dur":"Мгновенная","conc":false,"rit":false,"desc":["Вы создаете три светящихся дротика из магической силы. Каждый дротик попадает в существо на ваш выбор, видимое в пределах дистанции. Каждый дротик причиняет 1d4 + 1 урона силовым полем. Все дротики поражают одновременно, и вы можете направить их как в одно существо, так и в разных."],"higher":["Если вы накладываете это заклинание, используя ячейку 2-го уровня или выше, заклинание создает по одному дополнительному дротику за каждый уровень ячейки выше первого."],"custom":true},{"id":"cmqwbqfwnkzm","name":"Героизм","level":1,"classes":["bard","paladin"],"time":"1 действие","range":"Касание","dur":"До 1 минуты","conc":true,"rit":false,"desc":["Согласное существо, которого вы касаетесь, наполняется храбростью. Пока заклинание активно, существо получает иммунитет к состоянию испуга, и в начале каждого своего хода получает временные хиты, равные модификатору вашей базовой характеристики. Когда это заклинание оканчивается, цель теряет все временные хиты, оставшиеся от этого заклинания."],"higher":["Если вы накладываете это заклинание, используя ячейку 2-го уровня или выше, вы можете сделать целью одно дополнительное существо за каждый уровень ячейки выше первого."],"custom":true},{"id":"cmqwbqlale1f","name":"Гневная кара","level":1,"classes":["paladin"],"time":"1 бонусное действие","range":"На себя","dur":"До 1 минуты","conc":true,"rit":false,"desc":["В следующий раз, когда вы попадёте рукопашной атакой оружием, пока активно это заклинание, ваша атака причиняет дополнительный 1d6 урона психической энергией. Кроме того, если цель — существо, оно должно совершить спасбросок Мудрости, иначе оно станет испуганным до окончания действия заклинания. Существо может действием совершить проверку Мудрости против Сл ваших заклинаний, чтобы успокоиться и окончить это заклинание."],"higher":[],"custom":true},{"id":"cmqwbqsomlqy","name":"Дар готовности","level":1,"classes":[],"time":"1 минута","range":"Касание","dur":"8 часов","conc":false,"rit":false,"desc":["Вы касаетесь согласного существа. На время действия заклинания цель может прибавлять 1d8 к своим броскам инициативы."],"higher":[],"custom":true},{"id":"cmqwbr5208t1","name":"Диссонирующий шёпот","level":1,"classes":["bard"],"time":"1 действие","range":"12","dur":"Мгновенная","conc":false,"rit":false,"desc":["Вы шёпотом пропеваете нестройную мелодию, которую слышит только выбранное вами существо в пределах дистанции, и которая причиняет ему жуткую боль. Цель должна совершить спасбросок Мудрости. В случае провала она получает урон психической энергией 3d6 и должна немедленно реакцией, если она доступна, переместиться прочь от вас настолько далеко, насколько позволяет её скорость. Существо не будет входить в очевидно опасные места, такие как огонь или яма. В случае успеха цель получает половину урона и не должна отходить. Глухое существо автоматически преуспевает в спасброске."],"higher":["Если вы накладываете это заклинание, используя ячейку 2-го уровня или выше, урон увеличивается на 1d6 за каждый уровень ячейки выше первого."],"custom":true},{"id":"cmqwbracgeng","name":"Доспех Агатиса","level":1,"classes":["warlock"],"time":"1 действие","range":"На себя","dur":"1 час","conc":false,"rit":false,"desc":["Вас окружает защитное магическое поле, проявляющееся в виде призрачной изморози, покрывшей вас и ваше снаряжение. Вы получаете 5 временных хитов на период действия заклинания. Если существо попадает по вам рукопашной атакой, пока у вас есть эти хиты, оно получает 5 урона холодом."],"higher":["Если вы накладываете это заклинание, используя ячейку 2-го уровня или выше, и временные хиты и урон холодом увеличиваются на 5 за каждый уровень ячейки выше первого."],"custom":true},{"id":"cmqwchgxs2i1","name":"Едкое варево Таши","level":1,"classes":["artificer","sorcerer","wizard"],"time":"1 действие","range":"На себя (30-футовая линия)","dur":"До 1 минуты","conc":true,"rit":false,"desc":["Вы испускаете струю кислоты вдоль линии длиной 6 клеток и шириной 1 клетка в выбранном вами направлении. Каждое существо, находящееся на этой линии должно преуспеть в спасброске Ловкости, иначе станет покрыто кислотой на время действия заклинания или до тех пор, пока кто-то действием не соскребёт или смоет кислоту с себя или другого существа. Существо, покрытое кислотой, получает 2d4 урона кислотой в начале каждого своего хода."],"higher":["Когда вы накладываете это заклинание, используя ячейку 2-го уровня или выше, урон увеличивается на 2d4 за каждый уровень ячейки выше первого."],"custom":true},{"id":"cmqwchpjtux6","name":"Жуткий смех Таши","level":1,"classes":["bard","wizard"],"time":"1 действие","range":"6","dur":"До 1 минуты","conc":true,"rit":false,"desc":["Существо на ваш выбор, видимое в пределах дистанции, воспринимает всё невероятно смешным и корчится от смеха, если заклинание на него действует. Цель должна преуспеть в спасброске Мудрости, иначе она падает ничком, становится недееспособной и в течение действия заклинания не может встать. Существа со значением Интеллекта 4 и ниже не попадают под действие этого заклинания.","В конце каждого своего хода и каждый раз при получении урона цель может совершать новый спасбросок Мудрости. Спасбросок совершается с преимуществом, если он был вызван получением урона. При успехе заклинание оканчивается."],"higher":[],"custom":true},{"id":"cmqwchx6kz0n","name":"Защита от зла и добра","level":1,"classes":["cleric","druid","paladin","warlock","wizard"],"time":"1 действие","range":"Касание","dur":"До 10 минут","conc":true,"rit":false,"desc":["Пока заклинание активно, одно согласное существо, которого вы коснулись, защищено от существ следующих видов: Аберрации, Исчадия, Небожители, Нежить, Феи и Элементали.","Защита предоставляет несколько преимуществ. Данные существа совершают с помехой броски атаки по цели. Цель также не может быть очарована, испугана и одержима ими. Если цель уже очарована, испугана или одержима таким существом, цель совершает последующие спасброски от таких эффектов с преимуществом."],"higher":[],"custom":true},{"id":"cmqwci50wesz","name":"Искажение цены","level":1,"classes":["bard","sorcerer","warlock","wizard"],"time":"1 минута","range":"Касание","dur":"8 часов","conc":false,"rit":false,"desc":["Вам нужно выжать ещё несколько золотых из торговца, которому вы пытаетесь продать странную статую осьминога, «освобождённую» вами из храма хаоса? Или занизить стоимость кое-каких магических ценностей, когда к вам заглянет сборщик налогов? Искажение цены вам в этом поможет.","Выберите один предмет длиной не больше 1 фута в любом из измерений. В можете удвоить его видимую ценность, добавив иллюзорные блеск и привлекательность, или уменьшить на половину, добавив иллюзорных царапин, вмятин и других неприглядных черт. Любой, кто внимательно изучит предмет и совершит проверку Интеллекта (Расследование) против Сл ваших заклинаний, узнает настоящую цену."],"higher":["Если вы накладываете это заклинание, используя ячейку 2-го уровня или выше, максимальная длина предмета увеличивается на 1 фут за каждый уровень ячейки выше первого."],"custom":true},{"id":"cmqwcic7fgn8","name":"Катапульта","level":1,"classes":["artificer","sorcerer","wizard"],"time":"1 действие","range":"12","dur":"Мгновенная","conc":false,"rit":false,"desc":["Выберите один предмет весом от 1 до 5 фунтов в пределах дистанции, который никто не несёт и не носит. Предмет пролетает до 18 клеток по прямой в выбранном вами направлении, прежде чем упасть на землю, и останавливается раньше, если ударится о твёрдую поверхность. Если предмет ударяется о существо, оно должно совершить спасбросок Ловкости. При провале предмет ударяет цель и останавливается. Если предмет ударяет что-то, то и предмет и то, во что он ударился, получают 3d8 дробящего урона."],"higher":["Если вы накладываете это заклинание, используя ячейку 2-го уровня или выше, максимальный вес предметов, которые вы можете использовать, увеличивается на 5 фунтов, а урон увеличивается на 1d8 за каждый уровень ячейки выше 1-го."],"custom":true},{"id":"cmqwciiyy9dp","name":"Ледяной кинжал","level":1,"classes":["druid","sorcerer","wizard"],"time":"1 действие","range":"12","dur":"Мгновенная","conc":false,"rit":false,"desc":["Вы создаёте осколок льда и метаете его в одно существо, находящееся в пределах дистанции. Совершите по цели дальнобойную атаку заклинанием. При попадании цель получает 1d10 колющего урона. После этого, вне зависимости от попадания или промаха, осколок взрывается. Цель и все существа в пределах 1 клетки от места взрыва осколка должны преуспеть в спасброске Ловкости, иначе получат 2d6 урона холодом."],"higher":["Если вы накладываете это заклинание, используя ячейку 2-го уровня или выше, то урон холодом увеличивается на 1d6 за каждый уровень ячейки выше 1."],"custom":true},{"id":"cmqwcipcr8h0","name":"Ледяные пальцы","level":1,"classes":["wizard"],"time":"1 действие","range":"На себя (15-футовый конус)","dur":"Мгновенная","conc":false,"rit":false,"desc":["Из ваших пальцев в 3-клеточном конусе вырывается леденящий холод. Каждое существо в этой области должно совершить спасбросок Телосложения, получая 2d8 урона холодом при провале и половину этого урона при успехе.","В области воздействия холод замораживает немагические жидкости, которые никто не несёт и не носит."],"higher":["Если вы накладываете это заклинание, используя ячейку 2-го уровня или выше, урон увеличивается на 1d8 за каждый уровень ячейки выше первого."],"custom":true},{"id":"cmqwcix1mb83","name":"Лечащее слово","level":1,"classes":["bard","cleric","druid"],"time":"1 бонусное действие","range":"12","dur":"Мгновенная","conc":false,"rit":false,"desc":["Существо на ваш выбор, видимое в пределах дистанции, восстанавливает количество хитов, равное 1d4 + ваш модификатор базовой характеристики. Это заклинание не оказывает никакого эффекта на Нежить и Конструктов."],"higher":["Если вы накладываете это заклинание, используя ячейку 2-го уровня или выше, количество восстанавливаемых хитов увеличивается на 1d4 за каждый уровень ячейки выше первого."],"custom":true},{"id":"cmqwcj3x62aq","name":"Маскировка","level":1,"classes":["artificer","bard","sorcerer","wizard"],"time":"1 действие","range":"На себя","dur":"1 час","conc":false,"rit":false,"desc":["Вы заставляете себя — включая одежду, доспехи, оружие и прочее имущество — выглядеть иначе, пока заклинание не окончится, или пока вы не окончите его преждевременно, действием. Вы можете выглядеть на 1 фут (30 сантиметров) выше или ниже, а также стать худым, толстым или получить среднее телосложение. Вы не можете менять основу тела, поэтому у новой формы должен быть такой же набор конечностей. Во всем остальном характер иллюзии определяете вы.","Изменения, вызванные этим заклинанием, не выдерживают проверку физическим исследованием. Например, если вы добавили к своему снаряжению шляпу, предметы будут проходить сквозь нее, и все, кто к ней прикоснутся, либо ничего не почувствуют, либо почувствуют вашу голову и волосы. Если вы становитесь худее, то рука того, кто к вам тянется, наткнется на вас на полпути, ещё в воздухе.","Для обнаружения того, что вы замаскированы, существо должно действием обследовать вашу внешность и преуспеть в проверке Интеллекта (Расследование) против вашей Сл заклинаний."],"higher":[],"custom":true},{"id":"cmqwcjauj9gm","name":"Нанесение ран","level":1,"classes":["cleric"],"time":"1 действие","range":"Касание","dur":"Мгновенная","conc":false,"rit":false,"desc":["Совершите рукопашную атаку заклинанием по существу в пределах досягаемости. При попадании цель получает 3d10 урона некротической энергией."],"higher":["Если вы накладываете это заклинание, используя ячейку 2-го уровня или выше, урон увеличивается на 1d10 за каждый уровень ячейки выше первого."],"custom":true},{"id":"cmqwcjgxppyb","name":"Направляющий снаряд","level":1,"classes":["cleric"],"time":"1 действие","range":"24","dur":"1 раунд","conc":false,"rit":false,"desc":["Вспышка света устремляется к выбранному вами существу в пределах дистанции. Совершите по цели дальнобойную атаку заклинанием. При попадании цель получает 4d6 урона излучением, и следующий бросок атаки по цели, совершённый до конца вашего следующего хода, совершается с преимуществом благодаря мистическому тусклому свету, недолго остающемуся на цели."],"higher":["Если вы накладываете это заклинание, используя ячейку 2-го уровня или выше, урон увеличивается на 1d6 за каждый уровень ячейки выше 1-го."],"custom":true},{"id":"cmqwcjn25v0t","name":"Обнаружение болезней и яда","level":1,"classes":["cleric","druid","paladin","ranger"],"time":"1 действие","range":"На себя","dur":"До 10 минут","conc":true,"rit":true,"desc":["Пока заклинание активно, вы можете ощущать присутствие и местонахождение ядов, ядовитых существ и болезней в пределах 6 клеток от себя. Вы также распознаёте вид яда, ядовитого существа или болезни.","Заклинание проницает большую часть барьеров, но блокируется 1 футом камня, 1 дюймом обычного металла, тонким листом свинца или 3 футами дерева или земли."],"higher":[],"custom":true},{"id":"cmqwcjuujpn8","name":"Обнаружение зла и добра","level":1,"classes":["cleric","paladin"],"time":"1 действие","range":"На себя","dur":"До 10 минут","conc":true,"rit":false,"desc":["Пока заклинание активно, вы знаете, есть ли в пределах 6 клеток от вас Аберрации, Исчадия, Небожители, Нежить, Феи или Элементали, а также их местоположение. Кроме того, вы знаете, есть ли в пределах 6 клеток от вас место или предмет, который был магически освящён или осквернён.","Заклинание проницает большую часть барьеров, но блокируется 1 футом камня, 1 дюймом обычного металла, тонким листом свинца или 3 футами дерева или земли."],"higher":[],"custom":true},{"id":"cmqwck6dqxq1","name":"Обнаружение магии","level":1,"classes":["artificer","bard","cleric","druid","paladin","ranger","sorcerer","wizard"],"time":"1 действие","range":"На себя","dur":"До 10 минут","conc":true,"rit":true,"desc":["Пока заклинание активно, вы чувствуете присутствие магии в пределах 6 клеток. Если вы почувствовали за счет этого заклинания присутствие магии, вы можете действием увидеть слабую ауру вокруг видимого существа или предмета, несущего на себе магию, а также узнать школу этой магии, если она есть.","Заклинание проницает большую часть барьеров, но блокируется 1 футом камня, 1 дюймом обычного металла, тонким листом свинца или 3 футами дерева или земли."],"higher":[],"custom":true},{"id":"cmqwckd2zlys","name":"Огненные ладони","level":1,"classes":["sorcerer","wizard"],"time":"1 действие","range":"На себя (15-футовый конус)","dur":"Мгновенная","conc":false,"rit":false,"desc":["Соединив ладони и растопырив пальцы веером, вы испускаете из них тонкие языки пламени. Все существа в пределах 3-клеточного конуса должны совершить спасбросок Ловкости. Существо получает 3d6 урона огнём при провале и половину этого урона при успехе.","Пламя поджигает все горючие предметы, которые никто не несёт и не носит."],"higher":["Если вы накладываете это заклинание, используя ячейку 2-го уровня или выше, урон увеличивается на 1d6 за каждый уровень ячейки выше первого."],"custom":true},{"id":"cmqwckist12i","name":"Огонь фей","level":1,"classes":["artificer","bard","druid"],"time":"1 действие","range":"12","dur":"До 1 минуты","conc":true,"rit":false,"desc":["Все предметы в кубе с длиной ребра 4 клетки в пределах дистанции подсвечиваются синим, зелёным или фиолетовым цветом (на ваш выбор). Все существа в этой области тоже подсвечиваются, если проваливают спасбросок Ловкости. На время длительности заклинания подсвеченные предметы и существа испускают тусклый свет в радиусе 2 клеток.","Все броски атаки по затронутым существам и предметам совершаются с преимуществом, если атакующий видит их, и эти существа и предметы не получают преимуществ от невидимости."],"higher":[],"custom":true},{"id":"cmqwckp224kv","name":"Падение пёрышком","level":1,"classes":["artificer","bard","sorcerer","wizard"],"time":"Реакция","range":"12","dur":"1 минута","conc":false,"rit":false,"desc":["Выберите до пяти падающих существ в пределах дистанции. До окончания действия заклинания их скорость падения уменьшается до 12 клеток в раунд. Если такое существо приземлится до окончания заклинания, оно не получает урон от падения и может приземлиться на ноги, и тогда заклинание оканчивает действие на него."],"higher":[],"custom":true},{"id":"cmqwckvoyeoc","name":"Палящая кара","level":1,"classes":["paladin","ranger"],"time":"1 бонусное действие","range":"На себя","dur":"До 1 минуты","conc":true,"rit":false,"desc":["Когда вы в следующий раз попадёте по существу рукопашной атакой оружием, пока заклинание активно, ваше оружие вспыхивает ярким белым светом, и атака причиняет цели дополнительный 1d6 урона огнём и поджигает её. Пока заклинание активно, цель в начале каждого своего хода должна совершать спасбросок Телосложения. При провале она получает 1d6 урона огнём. При успехе заклинание заканчивается. Если цель или существо, находящееся в пределах 1 клетки от неё, потратит действие на тушение пламени, или если какой-то другой эффект потушит пламя (например, погружение в воду), заклинание тоже закончится."],"higher":["Если вы накладываете это заклинание, используя ячейку 2-го уровня или выше, первичный дополнительный урон от атаки увеличивается на 1d6 за каждый уровень ячейки выше первого."],"custom":true},{"id":"cmqwcl2lqcp2","name":"Поглощение стихий","level":1,"classes":["artificer","druid","ranger","sorcerer","wizard"],"time":"Реакция","range":"На себя","dur":"1 раунд","conc":false,"rit":false,"desc":["Заклинание поглощает часть энергии, направленной на вас, ослабляя эффект и запасая эту энергию для использования во время следующей рукопашной атаки. До начала своего следующего хода вы получаете сопротивление тому виду урона, который спровоцировал данное заклинание. Кроме того, когда вы впервые попадаете рукопашной атакой в своём следующем ходу, цель получает дополнительно 1d6 урона этого вида, после чего заклинание заканчивается."],"higher":["Если вы накладываете это заклинание, используя ячейку 2-го уровня или выше, то дополнительный урон увеличивается на 1d6 за каждый уровень ячейки выше 1-го."],"custom":true},{"id":"cmqwclfe535a","name":"Поиск фамильяра","level":1,"classes":["wizard"],"time":"1 час","range":"2","dur":"Мгновенная","conc":false,"rit":true,"desc":["Вы получаете в услужение фамильяра — духа, принимающего облик выбранного вами животного: ворона [raven], кошки [cat], краба [crab], крысы [rat], летучей мыши [bat], лягушки (жабы) [frog], морского конька [sea horse], осьминога [octopus], паука [spider], рыбы (пираньи) [quipper], совы [owl], куницы [weasel], ядовитой змеи [poisonous snake], ястреба [hawk] или ящерицы [lizard]. Появившись в свободном пространстве в пределах дистанции, фамильяр приобретает характеристики выбранного облика, хотя он не Зверь, а Исчадие, Небожитель или Фея (по вашему выбору).","Ваш фамильяр действует независимо от вас, но всегда повинуется вашим командам. В сражении он определяет свою инициативу и действует в свой ход. Фамильяр не может атаковать, но может совершать другие действия как обычно.","Когда хиты фамильяра опускаются до 0, он исчезает, не оставляя физического тела. Он возвращается, когда вы используете это заклинание ещё раз. Вы можете действием временно отпустить своего фамильяра. Тот исчезает в карманном измерении, где будет ждать, пока вы его не призовете. В качестве альтернативы, вы можете отпустить его насовсем. Пока фамильяр временно отпущен, вы можете действием вернуть его в свободное пространство в пределах 6 клеток от себя. Всякий раз, когда хиты фамильяра опускаются до 0 или он исчезает в карманном измерении, он оставляет в своём пространстве всё, во что он был одет или нёс.","Пока ваш фамильяр находится в пределах 20 клеток, вы можете общаться с ним телепатически. Кроме того, вы можете действием начать смотреть глазами фамильяра и слушать его ушами до начала своего следующего хода, получая преимущество от особых чувств, которыми может обладать фамильяр. В это время для своих собственных чувств вы слепы и глухи.","У вас не может быть больше одного фамильяра одновременно. Если вы накладываете это заклинание, уже имея фамильяра, вы заставляете принять его новый облик. Выберите один из описанных выше обликов. Ваш фамильяр становится этим существом.","Если вы накладываете заклинание с дистанцией «касание», его может передать фамильяр, как если бы это он его накладывал. Ваш фамильяр должен при этом находиться в пределах 20 клеток от вас, и он использует свою реакцию, когда вы накладываете его. Если заклинание требует броска атаки, вы используете свой модификатор атаки."],"higher":[],"custom":true},{"id":"cmqwclodo4wb","name":"Понимание языков","level":1,"classes":["bard","sorcerer","warlock","wizard"],"time":"1 действие","range":"На себя","dur":"1 час","conc":false,"rit":true,"desc":["Пока заклинание активно, вы понимаете буквальный смысл всех услышанных речей на любых языках. Вы также понимаете письмена на любых языках, но вы должны касаться поверхности, на которой записаны слова. Требуется примерно 1 минута для чтения одной страницы текста.","Это заклинание не расшифровывает тайные послания в текстах и символы, такие как магические знаки, не являющиеся частью текста."],"higher":[],"custom":true},{"id":"cmqwclvhcwag","name":"Порча","level":1,"classes":["bard","cleric"],"time":"1 действие","range":"6","dur":"До 1 минуты","conc":true,"rit":false,"desc":["До трёх существ в пределах дистанции, которы
