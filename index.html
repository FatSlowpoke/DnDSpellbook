большая цитадель. Цитадель имеет квадратное основание со стороной 10 клеток и состоит из 3 этажей с высотой потолка 2 клетки. Каждый из этажей может быть разделён на любое количество комнат по вашему желанию, при условии, что длина каждой из сторон комнаты будет не менее 1 клетка.","Этажи цитадели соединены каменными лестничными пролётами, толщина её стен составляет 6 дюймов, а внутренние комнаты могут иметь каменные двери или открытые арки по вашему желанию. Цитадель меблирована и украшена так, как вам нравится, и содержит достаточное количество еды для обслуживания банкета на девять блюд вплоть до 100 человек на каждый день. Мебель, украшения, еда и другие предметы, созданные этим заклинанием, рассыпаются в пыль, если оказываются за пределами крепости.","Сто невидимых слуг в крепости подчиняются любой команде, данной им существами, которых вы указываете, когда накладываете заклинание. Каждый слуга действует так, как будто создан заклинанием невидимый слуга [unseen servant].","Стены, башни и цитадель сделаны из камня, который может быть разрушен. Каждая каменная секция размером 10 на 2 клетки имеет КД 15 и 30 хитов на каждый дюйм толщины. Секция обладает иммунитетом к яду и урону психической энергией. Снижение хитов секции до 0 разрушает её и может вызвать разрушение ближайших секций по усмотрению Мастера.","Через 7 дней или когда вы накладываете это заклинание где-то ещё, крепость рушится без вреда для существ, находящихся внутри неё, и опускается обратно под землю, оставляя существ на земле. Накладывание заклинания на одну и ту же точку каждые семь дней в течение года делает крепость постоянной."],"higher":[],"custom":true},{"id":"cmqxeuaei59p","name":"Находчивость","level":8,"classes":["bard","warlock"],"time":"1 действие","range":"На себя","dur":"1 час","conc":false,"rit":false,"desc":["Пока заклинание не окончится, каждый раз, когда вы совершаете проверку Харизмы, вы можете заменить выпавший результат числом «15». Кроме того, что бы вы ни говорили, магия, проверяющая, говорите ли вы правду, показывает, что вы искренни."],"higher":[],"custom":true},{"id":"cmqxeufnh203","name":"Одуряющая тьма","level":8,"classes":["warlock","wizard"],"time":"1 действие","range":"30","dur":"До 10 минут","conc":true,"rit":false,"desc":["Из точки, выбранной вами в пределах дистанции, расползается и остаётся в течение времени действия заклинания магическая тьма сферой с радиусом 12 клеток. Тьма огибает углы. Существа с тёмным зрением не могут видеть сквозь эту тьму. Немагический свет, а также свет, созданный заклинаниями 8-го уровня или ниже, не могут осветить эту область.","В этой сфере можно услышать крики, бормотание и безумный смех. Всякий раз, когда существо начинает свой ход в сфере, оно должно совершить спасбросок Мудрости, получая 8d8 урона психической энергией при провале или половину этого урона при успехе."],"higher":[],"custom":true},{"id":"cmqxeuk6fyl8","name":"Подчинение чудовища","level":8,"classes":["bard","sorcerer","warlock","wizard"],"time":"1 действие","range":"12","dur":"До 1 часа","conc":true,"rit":false,"desc":["Вы пытаетесь взять под контроль существо, которого видите в пределах дистанции. Существо должно преуспеть в спасброске Мудрости, иначе оно станет очарованным вами на время действия заклинания. Если вы или дружественные вам существа сражаются с ним, оно совершает спасбросок с преимуществом.","Пока существо очаровано, вы обладаете телепатической связью с ним, пока вы оба находитесь на одном плане существования. При помощи этой связи вы можете отдавать ему команды, пока находитесь в сознании (действие не требуется), и оно должно будет их выполнять. Вы можете указать общее действие, такое как «атакуй вон то существо», «беги отсюда» или «принеси вот это». Если существо выполняет приказ и не получает дальнейших указаний от вас, оно в меру своих сил обороняется и защищает себя.","Вы можете действием захватить полный контроль над целью. До конца вашего следующего хода существо совершает только выбранные вами действия, и не делает ничего, что вы ему не позволяете. В это время вы можете заставлять существо совершать реакции, но при этом вы тратите и свою реакцию тоже.","Каждый раз, когда цель получает урон, она совершает новый спасбросок Мудрости от этого заклинания. При успехе заклинание оканчивается."],"higher":["Если вы накладываете это заклинание ячейкой 9-го уровня, длительность становится «Концентрация, вплоть до 8 часов»."],"custom":true},{"id":"cmqxeuqok5rv","name":"Превращение в животных","level":8,"classes":["druid"],"time":"1 действие","range":"6","dur":"До 24 часов","conc":true,"rit":false,"desc":["Ваша магия превращает существ в животных. Выберите любое количество согласных существ, которых видите в пределах дистанции. Вы меняете облик каждой цели на облик Зверя Большого или меньшего размера с показателем опасности не больше 4. В последующие ходы вы можете действием дать этим существам новый облик.","Превращение держится всю длительность заклинания, или пока хиты цели не опустятся до 0, или она не умрёт. У каждой цели может быть свой облик. Игровые параметры целей меняются на параметры выбранных Зверей, но у них остаётся своё мировоззрение и значения Интеллекта, Мудрости и Харизмы. Цель принимает хиты нового облика, а по возвращении в свой облик у неё будут хиты как перед превращением. Если свой облик возвращается в результате опускания хитов до 0, весь излишний урон переносится на хиты естественного облика. Если излишний урон не опустил хиты естественного облика ниже 0, существо не теряет сознание. Действия существа ограничены теми, что доступны новому облику, и оно не может разговаривать и накладывать заклинания.","Снаряжение цели сливается с новым обликом. Цель не может активировать, использовать своё снаряжение и получать от него преимущества."],"higher":[],"custom":true},{"id":"cmqxeuydavoc","name":"Преграда магии","level":8,"classes":["cleric","wizard"],"time":"1 действие","range":"На себя (10-футовый радиус)","dur":"До 1 часа","conc":true,"rit":false,"desc":["Вас окружает невидимая сфера антимагии с радиусом 2 клеток. Эта область отделена от магической энергии, пронизывающей мультивселенную. В пределах этой сферы нельзя накладывать заклинания, призванные существа исчезают, и даже магические предметы становятся обычными. Пока заклинание активно, сфера перемещается вместе с вами, оставаясь с центром на вас.","В этой сфере подавляются заклинания и прочие магические эффекты, кроме тех, что созданы артефактами и божествами, а также они не могут в неё проникать. Ячейка, потраченная на накладывание подавленного заклинания, всё равно тратится. Пока эффект подавлен, он не действует, но время в подавленном состоянии всё равно учитывается при определении его длительности.","Эффекты с целью. Заклинания и прочие магические эффекты, такие как волшебная стрела [magic missile] и очарование личности [charm person], нацеленные на существо или предмет, находящиеся в сфере, не оказывают на цель никакого эффекта.","Области магии. Область магических эффектов и других заклинаний, таких как огненный шар [fireball], не может проникать в сферу. Если сфера оказывается в области магии, область, находящаяся в сфере, подавляется. Например, пламя, созданное огненной стеной [wall of fire], подавляется внутри сферы, создавая брешь в стене, если позволяют габариты.","Заклинания. Все активные заклинания и прочие магические эффекты на существах и предметах подавляются, пока они находятся в сфере.","Магические предметы. Свойства и особенности магических предметов в сфере подавляются. Например, длинный меч +1 в сфере будет обычным длинным мечом.","Свойства и особенности магического оружия подавляются, если используются против цели в сфере или используются атакующим, находящимся в сфере. Если магическое оружие или боеприпас полностью покидает сферу (например, если вы выстрелите магической стрелой или метнёте магическое копьё в цель, находящуюся вне сферы), магия предмета возвращается.","Магическое перемещение. В сфере не работают телепортация и перемещение между планами, вне зависимости от того, в сферу или из сферы пытаются перенестись. Порталы в другие места, миры и планы существования, а также входы в межпространство, такие как созданные заклинанием трюк с верёвкой [rope trick], временно закрываются, пока они находятся в сфере.","Существа и предметы. Существа и предметы, призванные или созданные магией, временно прекращают существовать, пока они находятся в сфере. Существа возвращаются обратно, когда сфера покидает место, занимаемое ими до исчезновения.","Рассеивание магии. Заклинания и магические эффекты, такие как рассеивание магии [dispel magic], не оказывают на сферу никакого воздействия. Сферы, созданные разными заклинаниями преграда магии, не отменяют друг друга."],"higher":[],"custom":true},{"id":"cmqxev8zdu4j","name":"Слабоумие","level":8,"classes":["bard","druid","warlock","wizard"],"time":"1 действие","range":"30","dur":"Мгновенная","conc":false,"rit":false,"desc":["Вы врываетесь в сознание существа, которое видите в пределах дистанции, пытаясь подавить его интеллект и сознание. Цель получает 4d6 урона психической энергией и должна совершить спасбросок Интеллекта.","При провале Интеллект и Харизма существа становятся равны 1. Оно не может накладывать заклинания, активировать магические предметы, понимать языки и вразумительно общаться. Однако существо признаёт друзей, следует за ними и даже защищает их.","В конце каждых 30 дней существо может повторять спасбросок от этого заклинания. Если оно преуспевает, заклинание оканчивается.","Это заклинание также оканчивается заклинаниями высшее восстановление [greater restoration], исполнение желаний [wish] и полное исцеление [heal]."],"higher":[],"custom":true},{"id":"cmqxevbmcnmn","name":"Слово силы: ошеломление","level":8,"classes":["bard","sorcerer","warlock","wizard"],"time":"1 действие","range":"12","dur":"Мгновенная","conc":false,"rit":false,"desc":["Вы произносите слово силы, способное захлестнуть сознание одного существа, которое вы можете видеть в пределах дистанции, делая его ошарашенным. Если у существа не больше 150 хитов, оно становится ошеломлённым. В противном случае это заклинание не оказывает никакого эффекта.","Ошеломлённая цель должна в конце каждого своего хода совершать спасбросок Телосложения. При успехе ошеломление проходит."],"higher":[],"custom":true},{"id":"cmqxevozl2s4","name":"Сокрытие разума","level":8,"classes":["bard","wizard"],"time":"1 действие","range":"Касание","dur":"24 часа","conc":false,"rit":false,"desc":["Пока заклинание активно, одно согласное существо, которого вы касаетесь, получает иммунитет к урону психической энергией и всем эффектам, которые должны чувствовать его эмоции или читать мысли, заклинаниям школы Прорицания и состоянию «очарованный». Это заклинание помогает даже от заклинания исполнение желаний [wish], а также от заклинаний и эффектов аналогичной силы, использованных для воздействия на сознание цели или получение информации о ней."],"higher":[],"custom":true},{"id":"cmqxevttbklv","name":"Солнечный ожог","level":8,"classes":["cleric","druid","sorcerer","wizard"],"time":"1 действие","range":"30","dur":"Мгновенная","conc":false,"rit":false,"desc":["Яркий солнечный свет освещает всё в 12-клеточном радиусе с центром на точке, выбранной вами в пределах дистанции. Все существа, находящиеся в нём, должны совершить спасбросок Телосложения. При провале существо получает 12d6 урона излучением и становится ослеплённым на 1 минуту. При успехе оно получает половину урона и не становится ослеплённым. Нежить и Слизи совершают этот спасбросок с помехой.","Существо, ослеплённое этим заклинанием, совершает повторные спасброски Телосложения в конце каждого своего хода. В случае успеха оно перестаёт быть ослеплённым.","В своей области это заклинание рассеивает любую тьму, созданную заклинанием."],"higher":[],"custom":true},{"id":"cmqxevz40hgv","name":"Телепатия","level":8,"classes":["wizard"],"time":"1 действие","range":"Без ограничений","dur":"24 часа","conc":false,"rit":false,"desc":["Вы создаёте телепатическую связь между собой и знакомым согласным существом. Это существо может находиться где угодно на том же плане существования, что и вы. Заклинание оканчивается, если вы с целью перестанете находиться на одном плане.","Пока заклинание активно, вы и цель можете мгновенно обмениваться словами, образами, звуками и прочими сенсорными посланиями, и цель воспринимает вас как существо, с которым она общается. Это заклинание позволяет существу с Интеллектом как минимум 1 понимать смысл ваших слов и воспринимать посылаемые вами сенсорные послания."],"higher":[],"custom":true},{"id":"cmqxew3x2e0x","name":"Тёмная звезда","level":8,"classes":[],"time":"1 действие","range":"30","dur":"До 1 минуты","conc":true,"rit":false,"desc":["Вы создаёте сферу с центром в точке выбранной в пределах дистанции. Сфера может иметь радиус до 8 клеток. Область внутри сферы наполнена магической тьмой и сокрушительной силой притяжения. На время действия заклинания область внутри сферы становится труднопроходимой местностью. Существа с темным зрением не могут видеть сквозь эту тьму, и немагический свет не может её осветить. Никакие звуки не могут раздаться в пределах сферы, а также не могут проходить сквозь неё. Все существа и предметы, полностью находящиеся в сфере, получают иммунитет к урону звуком, и существа считаются оглохшими, когда полностью находятся в ней. Там невозможно накладывать заклинания с вербальным компонентом. Все существа, впервые за ход входящие в пространство сферы или начинающие ход внутри должны совершить спасбросок Телосложения. При провале существо получает 8d10 урона силовым полем, и половину этого урона при успехе. Если этот урон опускает хиты цели до 0, она распадается. Распавшееся существо, а также всё, что оно несло и носило, кроме магических предметов, превращается в кучку мелкого серого порошка."],"higher":[],"custom":true},{"id":"cmqxew8typue","name":"Ужасное увядание Аби-Далзима","level":8,"classes":["sorcerer","wizard"],"time":"1 действие","range":"30","dur":"Мгновенная","conc":false,"rit":false,"desc":["Вы вытягиваете влагу из всех существ в кубе с длиной ребра 6 клеток с центром на указанной вами точке в пределах дистанции. Каждое существо в этой области должно совершить спасбросок Телосложения. Это заклинание не действует на Конструктов и Нежить, а Растения и водяные элементали [water elemental] совершают спасбросок с помехой. Существо получает 12d8 урона некротической энергией при провале или половину этого урона при успехе.","Немагические растения в области действия заклинания, не являющиеся существами, такие как деревья и кусты, мгновенно увядают и умирают."],"higher":[],"custom":true},{"id":"cmqxewdokpps","name":"Цунами","level":8,"classes":["druid"],"time":"1 минута","range":"В пределах видимости","dur":"До 6 раундов","conc":true,"rit":false,"desc":["В выбранной точке в пределах дистанции появляется стена из воды. Вы можете создать стену длиной до 60 клеток, высотой 60 клеток и толщиной 10 клеток. Стена существует, пока заклинание активно.","Когда стена появляется, все существа в её области должны совершить спасбросок Силы. При провале они получают дробящий урон 6d10 или половину этого урона при успехе.","В начале каждого вашего хода, после того как стена появилась, стена, вместе со всеми находящимися в ней существами, перемещается на 10 клеток от вас. Все существа с размером не больше Огромного, находящиеся внутри стены, или те, в чьё пространство стена входит при перемещении, должны преуспеть в спасброске Силы, иначе они получают дробящий урон 5d10. Существо может получить этот урон только один раз за раунд. В конце хода высота стены уменьшается на 10 клеток, а получаемый существами урон в последующие раунды уменьшается на 1d10. Когда высота стены достигает 0 футов, заклинание оканчивается.","Существа, оказавшиеся в стене, могут перемещаться, плавая. Однако, из-за того, что волна очень сильная, существо должно совершить успешную проверку Силы (Атлетика) против Сл ваших заклинаний, чтобы получить возможность перемещаться. Провалив проверку, существо не может перемещаться. Существо, выбравшееся из области цунами, падает на землю."],"higher":[],"custom":true},{"id":"cmqxj19sppk8","name":"Врата","level":9,"classes":["cleric","sorcerer","warlock","wizard"],"time":"1 действие","range":"12","dur":"До 1 минуты","conc":true,"rit":false,"desc":["Вы создаёте портал, соединяющий свободное пространство, видимое вами в пределах дистанции, с точным местом на другом плане существования. Портал представляет собой круглое отверстие, которое может быть диаметром от 5 до 4 клетки. Вы можете ориентировать портал в любом направлении. Портал существует, пока заклинание активно.","На каждом плане у портала есть передняя и задняя сторона. Путешествовать через портал можно только проходя через его переднюю часть. Всё, что так проходит, мгновенно перемещается на другой план, появляясь в свободном пространстве рядом с порталом.","Божества и другие планарные правители могут предотвращать создание порталов этим заклинанием в их присутствии или где угодно в пределах их домена.","Когда вы накладываете это заклинание, вы можете назвать имя конкретного существа (псевдоним, титул или прозвище не подходят). Если это существо находится на другом плане, портал открывается непосредственно возле него, и это существо втягивается, оказываясь в ближайшем свободном пространстве с вашей стороны портала. Вы не получаете над ним никакого особого контроля, и оно может действовать так, как сочтёт нужным Мастер. Оно может уйти, может напасть на вас, а может помочь вам."],"higher":[],"custom":true},{"id":"cmqxj1ga0a11","name":"Гроза гнева","level":9,"classes":["druid"],"time":"1 действие","range":"В пределах видимости","dur":"До 1 минуты","conc":true,"rit":false,"desc":["Появляются клубящиеся облака с центром на точке, видимой вами, распространяющиеся в радиусе 72 клеток. В этой области бьют молнии, грохочет гром и дует сильный ветер. Все существа, находящиеся под облаками (на расстоянии не больше 5 000 футов под облаком), когда те появляются, должны совершить спасбросок Телосложения. При провале существо получает 2d6 урона звуком и становится оглохшим на 5 минут.","Каждый раунд, в котором вы поддерживаете концентрацию на этом заклинании, гроза в ваш ход создаёт иной эффект:","Раунд 2. Из облаков выпадает кислотный дождь. Все существа и предметы под облаками получают 1d6 урона кислотой.","Раунд 3. Вы создаёте шесть разрядов молний из облаков, ударяющих в шесть существ или предметов на ваш выбор под облаками. Существа и предметы не могут стать целью более одной молнии. Ударенное существо должно совершить спасбросок Ловкости. Существо получает 10d6 урона электричеством при провале или половину этого урона при успехе.","Раунд 4. Из облаков выпадает град. Все существа под облаками получают 2d6 дробящего урона.","Раунд 5-10. Под облаками бушует сильный ветер и идёт мокрый снег. Местность становится труднопроходимой и сильно заслонённой. Все находящиеся там существа получают 1d6 урона холодом. Дальнобойные атаки оружием в этой местности невозможны. Ветер и дождь считаются сильным отвлекающим фактором при концентрации на заклинаниях. И наконец, порывы сильного ветра (скорость от 20 до 50 миль в час) автоматически рассеивают туман, испарения и подобные явления, как естественной, так и магической природы."],"higher":[],"custom":true},{"id":"cmqxj1njr5xf","name":"Заточение","level":9,"classes":["warlock","wizard"],"time":"1 минута","range":"6","dur":"Пока не рассеяно","conc":false,"rit":false,"desc":["Вы создаёте магические оковы, удерживающие существо, видимое вами в пределах дистанции. Цель должна преуспеть в спасброске Мудрости, иначе она станет скованной заклинанием; при успехе цель получает иммунитет к этому заклинанию, если вы будете накладывать его повторно. Находясь под действием этого заклинания, существо не обязано дышать, есть и пить, и оно не стареет. Заклинания школы Прорицания не могут найти или почувствовать цель.","При накладывании этого заклинания вы выбираете один из следующих видов заточения:","Захоронение. Цель становится заточённой глубоко под землёй в сфере из магической силы, достаточно большой, чтобы цель могла в ней поместиться. Ничто не может проникнуть сквозь эту сферу, и никакие существа не могут при помощи телепортации или путешествий между планами проникнуть внутрь или наружу.","Особым компонентом для этой версии заклинания является небольшая мифриловая сфера.","Миниатюризация. Цель уменьшается до высоты 1 дюйм (2,5 сантиметра), и становится заточённой в драгоценном камне или подобном предмете. Свет проходит через камень как обычно (что позволяет цели видеть, а другим существам видеть её), но больше сквозь него ничто не проходит, даже за счёт телепортации и планарных путешествий. Пока заклинание активно, этот камень нельзя ни разрезать, ни сломать.","Особым компонентом для этой версии заклинания является большой прозрачный драгоценный камень, такой как корунд, алмаз или рубин.","Ограждённая тюрьма. Заклинание переносит цель в крохотный демиплан, защищённый от телепортации и планарных путешествий. Это может быть лабиринт, клетка, башня или другое подобное укреплённое строение или местность.","Особым компонентом для этой версии заклинания является миниатюрная копия тюрьмы, изготовленная из нефрита.","Оцепенение. Цель засыпает, и её нельзя разбудить. Особым компонентом для этой версии заклинания являются редкие снотворные травы.","Сковывание. Цель удерживают на месте толстые цепи, крепко связанные с землёй. Цель опутана, пока заклинание активно, и в это время она не может перемещаться и каким-либо образом быть перемещенной.","Особым компонентом для этой версии заклинания является тонкая цепочка из драгоценного металла.","Окончание заклинания. Во время накладывания этого заклинания, какую бы версию вы не выбрали, вы можете указать условие, оканчивающее заклинание и отпускающее цель. Условие может быть простым или замысловатым, но Мастер должен признать условие разумным и вероятным. Условия могут основываться на имени существа, его личности или его божестве, но во всём остальном должны полагаться на обозримые действия или качества, и не должны основываться на таких неосязаемых факторах как уровень, класс или хиты.","Заклинание рассеивание магии [dispel magic] может окончить это заклинание, только если будет наложено ячейкой 9-го уровня, нацеливаясь либо на тюрьму, либо на особый компонент, использовавшийся для её создания.","Вы можете использовать конкретный особый компонент для создания только одной тюрьмы одновременно. Если вы наложите это заклинание ещё раз, используя тот же компонент, предыдущая цель тут же освобождается."],"higher":[],"custom":true},{"id":"cmqxj1u8ky9y","name":"Исполнение желаний","level":9,"classes":["sorcerer","wizard"],"time":"1 действие","range":"На себя","dur":"Мгновенная","conc":false,"rit":false,"desc":["Исполнение желаний — это самое мощное заклинание, которое могут накладывать смертные. Высказав вслух свои пожелания, вы можете изменить основы мироздания.","Базовое применение этого заклинания — это дублирование любого заклинания с уровнем не больше 8-го. Вы не обязаны соответствовать требованиям этих заклинаний, включая стоимость дорогих компонентов. Заклинание просто начинает оказывать свой эффект.","В качестве альтернативы вы можете создать один из следующих эффектов на свой выбор:","Вы создаёте один предмет, стоящий до 25 000 зм, не являющийся волшебным. Этот предмет не может превышать ни в одном измерении 60 клеток и он появляется в свободном пространстве, видимом вами, на земле.","Вы позволяете до двадцати другим существам, видимым вами, восстановить все хиты, и вы оканчиваете все действующие на них эффекты, описанные в заклинании высшее восстановление [greater restoration].","Вы даруете до десяти существам, видимым вами, сопротивление урону выбранного вами вида.","Вы на 8 часов даруете до десяти существам, которых можете видеть, иммунитет к одному заклинанию или другому магическому эффекту. Например, вы можете даровать себе и всем своим спутникам иммунитет к вытягивающей жизнь атаке лича [lich].","Вы отменяете одно недавно произошедшее событие, заставив перебросить любой бросок, совершённый в последнем раунде (включая ваш последний ход). Реальность будет сформирована заново, согласно новому результату. Например, заклинание исполнение желаний может отменить успешный спасбросок противника, его критическое попадание, или проваленный спасбросок друга. Вы можете даровать помеху или преимущество к броску, и можете либо выбрать новый результат, либо оставить старый.","Вы можете попытаться получить эффект, отличный от приведённых примеров. Максимально точно передайте желание Мастеру. Мастер обладает широкой свободой выбора при вынесении суждения о том, что произошло; чем больше желание, тем больше вероятность того, что что-то пойдёт не так. Это заклинание может просто провалиться, желаемый эффект может осуществиться лишь частично, или же вы можете претерпеть непредвиденные последствия из-за формулировки желания. Например, желание, чтобы злодей был мёртв, может зашвырнуть вас вперёд во времени, фактически, выводя вас из игры. Желание получить легендарный магический предмет или артефакт может мгновенно перенести вас к его текущему обладателю.","Создание этим заклинанием любого эффекта, кроме дублирования другого заклинания, требует огромных усилий и ослабляет вас. Получив это ослабление, каждый раз, когда до окончания продолжительного отдыха, когда вы накладываете заклинание, вы получаете 1d10 урона некротической энергией за каждый уровень этого заклинания. Этот урон никак нельзя отменить или уменьшить. Кроме того, ваша Сила на 2d4 дня опускается до 3, если она была больше 3. За каждый день, в течение которого вы только отдыхаете и не делаете ничего, кроме лёгкой деятельности, оставшееся время сокращается на 2 дня. Кроме того, получив это ослабление, существует 33-процентный шанс, что вы больше никогда не сможете накладывать исполнение желаний."],"higher":[],"custom":true},{"id":"cmqxj2dmoebp","name":"Истинное превращение","level":9,"classes":["bard","warlock","wizard"],"time":"1 действие","range":"6","dur":"До 1 часа","conc":true,"rit":false,"desc":["Выберите существо или немагический предмет, видимый в пределах дистанции. Вы превращаете существо в другое существо, существо в немагический предмет или предмет в существо (предмет не должно носить и нести другое существо). Превращение длится, пока активно заклинание, или пока хиты цели не опустятся до 0, или она не умрёт. Если вы концентрируетесь на заклинании его полную длительность, превращение длится, пока не будет рассеяно.","Перевёртыши не попадают под действие этого заклинания. Несогласные существа могут совершить спасбросок Мудрости, и в случае успеха они не попадают под действие заклинания. Это заклинание не может подействовать на цель, у которой 0 хитов.","Существо в существо. Если вы превращаете существо в другой вид существа, новый облик может быть любым, лишь бы его показатель опасности не превышал ПО цели (или её уровня, если у цели нет показателя опасности). Игровая статистика цели, включая значения ментальных характеристик, заменяются статистикой нового облика. У цели остаются мировоззрение и характер.","Цель принимает хиты нового облика. При возвращении в естественный облик количество его хитов будет как до превращения. Если оно возвращается в свой облик от того, что хиты опустились до 0, весь «лишний» урон перенесётся на естественный облик. Если «лишний» урон не опускает хиты естественного облика существа до 0, оно не теряет сознание.","Действия существа в новом облике ограничены теми, что доступны ей, и она не может говорить, накладывать заклинания и совершать другие действия, требующие рук или речи, если только новый облик не способен выполнять такие действия.","Снаряжение цели сливается с её новым обликом. Существо не может активировать, использовать, надевать или получать какие-то иные преимущества от своего снаряжения.","Предмет в существо. Вы можете превратить предмет в любое существо, чей размер не превышает размер предмета, и чей показатель опасности не превышает 9. Существо будет дружелюбным по отношению к вам и вашим спутникам. Оно будет действовать в ваш ход. Вы сами решаете, какие действия оно будет совершать, и как будет перемещаться. Статистика существа есть у Мастера, и он же решает, что получилось из его действий и перемещений.","Если заклинание становится постоянным, вы перестаёте контролировать существо. Оно может остаться дружественным по отношению к вам, в зависимости от того, как вы с ним обращались.","Существо в предмет. Если вы превращаете существо в предмет, оно превращается вместе с тем, что оно несёт и носит, если размер предмета не превышает размер существа. Его параметрами становятся параметры предмета, и существо не помнит о времени, проведённом в этом облике, когда заклинание оканчивается и оно обретает свой естественный облик."],"higher":[],"custom":true},{"id":"cmqxj2j3fk8r","name":"Клинок разрушения","level":9,"classes":["sorcerer","warlock","wizard"],"time":"1 бонусное действие","range":"12","dur":"До 1 минуты","conc":true,"rit":false,"desc":["oF","Вы создаете пространственный разлом в форме клинка длиной около 3 футов в свободном пространстве, которое вы можете видеть в пределах дистанции заклинания. Клинок существует до окончания действия заклинания. Когда вы накладываете это заклинание, то можете совершить до двух рукопашных атак заклинанием этим клинком против существа, неудерживаемого предмета или постройки в пределах 1 клетки от клинка. При попадании цель получает 4d12 урона силовым полем. Эта атака считается критическим попаданием при выпадении на d20 значений «18–20». При критическом попадании клинок дополнительно наносит 8d12 урона силовым полем (в общей сложности 12d12 урона силовым полем).","Вы можете бонусным действием в свой ход переместить клинок на расстояние до 6 клеток в свободное пространство, которое вы можете видеть, а затем снова совершить до двух рукопашных атак заклинанием этим клинком.","Клинок может беспрепятственно перемещаться через любые барьеры, в том числе созданные заклинанием силовая стена [wall of force]."],"higher":[],"custom":true},{"id":"cmqxj2nznm61","name":"Метеоритный дождь","level":9,"classes":["sorcerer","wizard"],"time":"1 действие","range":"1 миля","dur":"Мгновенная","conc":false,"rit":false,"desc":["Пылающие шары ударяют о землю в четырёх разных точках, видимых в пределах дистанции. Все существа в сфере с радиусом 8 клеток с центром на каждой из точек должны совершить спасбросок Ловкости. Сфера огибает углы. Существо получает 20d6 урона огнём и 20d6 дробящего урона при провале или половину этого урона при успехе. Существо, находящееся в области нескольких взрывов, получает урон только один раз.","Заклинание причиняет урон предметам и воспламеняет горючие предметы, которые никто не несёт и не носит."],"higher":[],"custom":true},{"id":"cmqxj2t25ckg","name":"Множественное полное исцеление","level":9,"classes":["cleric"],"time":"1 действие","range":"12","dur":"Мгновенная","conc":false,"rit":false,"desc":["От вас к раненым существам перетекает поток целительной энергии. Вы восстанавливаете до 700 хитов, разделённых на ваш выбор между любым количеством существ, видимых вами в пределах дистанции. Существа, вылеченные этим заклинанием, также исцеляются от всех эффектов, делающих их ослеплёнными или оглушёнными, а также от всех болезней. Это заклинание не оказывает никакого эффекта на Нежить и Конструктов."],"higher":[],"custom":true},{"id":"cmqxj2yqi3c0","name":"Множественное превращение","level":9,"classes":["bard","sorcerer","wizard"],"time":"1 действие","range":"24","dur":"До 1 часа","conc":true,"rit":false,"desc":["Вы преобразуете до десяти существ по вашему выбору, которых вы можете видеть в пределах дистанции. Несогласная цель должна преуспеть в спасброске Мудрости, чтобы противостоять преображению. Несогласный перевёртыш автоматически преуспевает в спасброске.","Каждая цель принимает облик Зверя по вашему выбору. Для каждой цели вы можете выбрать один и тот же облик или разные. Новый облик может представлять собой любого Зверя, которого вы видели, чей показатель опасности равен или меньше показателя опасности цели (или половины уровня цели, если у неё нет показателя опасности). Игровая статистика цели, включая значения ментальных характеристик, заменяются статистикой выбранного Зверя, но цель сохраняет хиты, мировоззрение и личность.","Каждая цель получает временные хиты в количестве, равном количеству хитов её нового облика. Эти временные хиты не могут быть замещены временными хитами, полученными из другого источника. Цель возвращается к своему обычному облику, когда у неё кончаются временные хиты, или когда она умирает. Если заклинание оканчивается раньше этого момента, существо теряет все свои временные хиты и возвращается к обычному облику.","Действия существа в новом облике ограничены теми, что доступны его новому облику, и оно не может говорить, накладывать заклинания и совершать другие действия, требующие рук или речи.","Снаряжение цели сливается с её новым обликом. Существо не может активировать, использовать и надевать своё снаряжение или получать от него какие-то иные преимущества."],"higher":[],"custom":true},{"id":"cmqxj33uvii6","name":"Неуязвимость","level":9,"classes":["wizard"],"time":"1 действие","range":"На себя","dur":"До 10 минут","conc":true,"rit":false,"desc":["Вы обладаете иммунитетом ко всему урону, пока заклинание активно."],"higher":[],"custom":true},{"id":"cmqxj39fo3ch","name":"Остановка времени","level":9,"classes":["sorcerer","wizard"],"time":"1 действие","range":"На себя","dur":"Мгновенная","conc":false,"rit":false,"desc":["Вы ненадолго останавливаете поток времени для всех, кроме себя. Для всех остальных существ время перестаёт течь, а вы получаете 1d4 + 1 ход подряд, во время которых можете совершать действия и перемещаться как обычно.","Это заклинание оканчивается, если одно из ваших действий, совершённых за этот период, или любой из эффектов, созданных вами за этот период, воздействует на других существ или предмет, несомый или носимый кем-то другим. Кроме того, заклинание оканчивается, если вы перемещаетесь в место, находящееся более чем в 1 000 футов от того места, где вы его наложили."],"higher":[],"custom":true},{"id":"cmqxj3fjsexx","name":"Полное превращение","level":9,"classes":["druid","wizard"],"time":"1 действие","range":"На себя","dur":"До 1 часа","conc":true,"rit":false,"desc":["Вы принимаете на время действия заклинания облик другого существа. Новый облик может принадлежать существу с показателем опасности не больше вашего уровня. Это не может быть Конструкт или Нежить, и вы должны хотя бы раз видеть такое существо. Вы превращаетесь в среднестатистического представителя таких существ, без уровней классов и умения Использование заклинаний.","Ваши игровые параметры заменяются параметрами выбранного существа, хотя у вас остаётся мировоззрение и значения Интеллекта, Мудрости и Харизмы. Вы также сохраняете все владения навыками и спасбросками, но также получаете те, что есть у нового облика. Если у вас и существа есть совпадающие владения, и указанный для него бонус выше вашего, вы используете бонус существа. Вы не можете использовать легендарные действия и действия в логове нового облика.","Вы принимаете хиты и Кость Хитов нового облика. Когда вы возвращаете свой облик, ваши хиты будут такими же, как до превращения. Если вы возвращаете облик из-за того, что хиты опустились до 0, весь излишний урон переносится на ваш облик. Если излишний урон не опустил ваши хиты до 0, вы не теряете сознание.","Вы сохраняете все преимущества от умений класса, расы и прочих источников, и можете использовать их, при условии, что новый облик физически на это способен. Вы не можете использовать особые чувства (например, тёмное зрение), если их нет и у нового облика. Вы можете говорить только если существо в естественных условиях может говорить.","Когда вы превращаетесь, вы выбираете, свалится ли ваше снаряжение на землю, сольётся с новым обликом или окажется на него надетым. Носимое снаряжение функционирует как обычно. Мастер определяет, сможет ли новый облик использовать тот или иной предмет снаряжения, в зависимости от формы и размера существа. Ваше снаряжение не меняет форму и размер, и снаряжение, которое не может быть надето на новый облик, должно либо свалиться на землю, либо слиться с новым обликом. Слившееся снаряжение не оказывает никакого эффекта.","Пока это заклинание активно, вы можете действием принимать новые облики, подчиняющиеся тем же самым ограничениям, с одним исключением: если у нового облика больше хитов чем у вашего текущего, количество хитов остаётся прежним."],"higher":[],"custom":true},{"id":"cmqxj3l0dmge","name":"Предвидение","level":9,"classes":["bard","druid","warlock","wizard"],"time":"1 минута","range":"Касание","dur":"8 часов","conc":false,"rit":false,"desc":["Вы касаетесь согласного существа, даруя ограниченную способность предвидеть будущее. Пока заклинание активно, цель нельзя застать врасплох, и она совершает с преимуществом броски атаки, проверки характеристик и спасброски. Кроме того, пока заклинание активно, другие существа совершают по цели броски атаки с помехой.","Это заклинание мгновенно оканчивается, если вы наложите его ещё раз до окончания длительности."],"higher":[],"custom":true},{"id":"cmqxj3qqm5na","name":"Проекция в астрал","level":9,"classes":["cleric","warlock","wizard"],"time":"1 час","range":"2","dur":"Особая","conc":false,"rit":false,"desc":["Вы и до восьми согласных существ в пределах дистанции проецируете свои астральные тела в Астральный план (заклинание проваливается, если вы уже находитесь на этом плане). Оставленные вами материальные тела лежат без сознания в состоянии приостановленной жизнедеятельности; им не нужна пища, воздух, и они не стареют.","Ваше астральное тело во всём похоже на смертное тело, оно обладает теми же параметрами и снаряжением. Единственным отличием является серебряная нить, исходящая у вас между лопаток и торчащая наружу, становясь невидимой через 1 фут. Эта нить связывает вас с материальным телом. Пока эта нить цела, вы можете найти путь домой. Если нить перерезать (это могут сделать только эффекты, явно указывающие, что они могут это) ваши душа и тело разделяются, и вы мгновенно умираете.","Ваше астральное тело может свободно перемещаться по Астральному плану и проходить сквозь порталы, ведущие на другие планы. Если вы входите на новый план или возвращаетесь на свой, ваши тело и снаряжение переносятся по серебряной нити, позволяя вернуться в своё тело при входе на другой план.","Ваше астральное тело — отдельное воплощение. Урон и прочие эффекты, применимые к нему, не оказывают воздействие на физическое тело и не остаются при вашем возвращении в тело.","Заклинание оканчивается для вас и ваших спутников, если вы оканчиваете его действием. При этом существа возвращаются в свои тела и просыпаются.","Заклинание может окончиться для отдельных существ преждевременно. Успешное заклинание рассеивание магии [dispel magic], использованное либо на астральное, либо на физическое тело, оканчивает это заклинание для этого существа. Если хиты физического или астрального тела существа опускаются до 0, заклинание для этого существа оканчивается. Если заклинание оканчивается, и серебряная нить нетронута, она возвращает астральное тело в физическое, оканчивая состояние приостановленной жизнедеятельности.","Если вы вернулись в своё тело, а спутники остались в астральных телах, но хотят вернуться, они сами должны найти способ вернуться, что обычно происходит в результате опускания хитов до 0."],"higher":[],"custom":true},{"id":"cmqxj3vy51vw","name":"Психический крик","level":9,"classes":["bard","sorcerer","warlock","wizard"],"time":"1 действие","range":"18","dur":"Мгновенная","conc":false,"rit":false,"desc":["Вы высвобождаете силу своей мысли, чтобы выжечь разум до десяти существ по вашему выбору, которых вы можете видеть в пределах дистанции. Существа, у которых Интеллект равен 2 или ниже, не попадают под действие этого заклинания.","Каждая цель должна совершить спасбросок Интеллекта. При провале цель получает 14d6 урона психической энергией и становится ошеломлённой. При успехе цель получает только половину урона и не ошеломлена. Если этот урон убивает цель, её голова взрывается, при наличии таковой.","Ошеломлённая цель может совершать спасбросок Интеллекта в конце каждого своего хода. При успехе ошеломление спадает."],"higher":[],"custom":true},{"id":"cmqxj43aynrj","name":"Радужная стена","level":9,"classes":["bard","wizard"],"time":"1 действие","range":"12","dur":"10 минут","conc":false,"rit":false,"desc":["Мерцающая разноцветная плоскость формирует вертикальную непрозрачную стену с длиной 18 клеток, высотой 6 клеток и толщиной 1 дюйм, с центром на точке, видимой в пределах дистанции. В качестве альтернативы, вы можете свернуть стену в сферу до 30-футов диаметром с центром на точке, видимой в пределах дистанции. Стена существует, пока активно заклинание. Если вы размещаете стену так, что она пройдёт по пространству, занятому существом, заклинание проваливается, а ваше действие и ячейка заклинания тратятся.","Стена испускает яркий свет в пределах 20 клеток и тусклый свет в пределах ещё 20 клеток. Вы и существа, указанные вами при накладывании заклинания, можете без вреда проходить сквозь стену и оставаться возле неё. Если другое существо, способное видеть, перемещением оказывается в пределах 4 клеток от стены или начинает там ход, оно должно преуспеть в спасброске Телосложения, иначе оно станет ослеплённым на 1 минуту.","Стена состоит из семи слоёв разного цвета. Когда существо пытается коснуться стены или пройти сквозь неё, оно проходит по одному слою за раз, пока не пройдёт сквозь все. Коснувшись очередного слоя, существо должно совершить спасбросок Ловкости, чтобы защититься от его эффектов, описанных ниже.","Стену можно уничтожить по одному слою за раз в порядке от красного к фиолетовому средствами, специфичными для каждого слоя. Уничтоженный слой остаётся уничтоженным на период всего действия заклинания. Преграда магии [antimagic field] не оказывает на стену эффекта, а рассеивание магии [dispel magic] уничтожает только фиолетовый слой.","1. Красный. Существо получает 10d6 урона огнём при провале или половину этого урона при успехе. Пока этот слой существует, немагические дальнобойные атаки не могут проходить сквозь стену. Этот слой можно уничтожить, нанеся ему 25 урона холодом.","2. Оранжевый. Существо получает 10d6 урона кислотой при провале или половину этого урона при успехе. Пока этот слой существует, магические дальнобойные атаки не могут проходить сквозь стену. Этот слой можно уничтожить сильным ветром.","3. Жёлтый. Существо получает 10d6 урона электричеством при провале или половину этого урона при успехе. Этот слой можно уничтожить, нанеся ему 60 урона силовым полем.","4. Зелёный. Существо получает 10d6 урона ядом при провале или половину этого урона при успехе. Заклинание создание прохода [passwall], а также другие заклинания, с не меньшим уровнем, открывающие проходы в твёрдой поверхности, уничтожают этот слой.","5. Голубой. Существо получает 10d6 урона холодом при провале или половину этого урона при успехе. Этот слой можно уничтожить, нанеся ему 25 урона огнём.","6. Синий. При провале существо становится опутанным. После этого оно в конце каждого своего хода должно совершать спасброски Телосложения. Если оно успешно спасётся три раза, заклинание оканчивается. Если оно провалит спасбросок три раза, оно превращается в камень и получает состояние окаменевшее на время длительности заклинания. Успехи и провалы не обязаны быть последовательными; отслеживайте их отдельно, пока не накопится три вида чего-то одного.","Пока этот слой существует, сквозь стену нельзя накладывать заклинания. Этот слой уничтожается ярким светом от заклинания дневной свет [daylight] или подобного заклинания с не меньшим уровнем.","7. Фиолетовый. При провале существо становится ослеплённым. После этого оно в начале вашего следующего хода должно совершить спасбросок Мудрости. В случае успеха состояние слепота оканчивается. При провале существо переносится на другой план, выбранный Мастером, и перестаёт быть ослеплённым (обычно существа на неродных планах изгоняются домой, а остальные существа обычно выбрасываются на Астральный или Эфирный планы). Этот слой уничтожается заклинанием рассеивание магии [dispel magic] или подобными заклинаниями с не меньшим уровнем, оканчивающими заклинания и магические эффекты."],"higher":[],"custom":true},{"id":"cmqxj48u49ww","name":"Ревущая бездна","level":9,"classes":[],"time":"1 действие","range":"200","dur":"До 1 минуты","conc":true,"rit":false,"desc":["Вы создаёте сферу разрушительной гравитации радиусом 4 клеток с центром в видимой точке в пределах дистанции. На время действия заклинания пространство сферы и область радиусом 20 клеток вокруг неё является труднопроходимой местностью. Все немагические предметы, не носимые и не несомые, полностью находящиеся в сфере, уничтожаются.","Сразу после появления, а также в начале каждого вашего хода до окончания заклинания, все незакрепленные предметы в пределах 20 клеток от сферы притягиваются к центру, оканчивая движение как можно ближе к центру. Существа должны совершить спасбросок Силы, при провале подвергаясь этому эффекту.","Существо, начинающее ход внутри или впервые за ход входящее в пространство сферы получает 5d10 урона силовым полем и остаётся опутанным до тех пор, пока не покинет пространство сферы. Если сфера находится в воздухе, опутанное существо парит в её пространстве. Существо внутри сферы может действием совершить проверку Силы против Сл ваших заклинаний, оканчивая на себе состояние опутанный или другом существе в пределах досягаемости. Если хиты существа уменьшаются до 0, оно бесследно уничтожается со всеми немагическими предметами, которое оно несёт или носит."],"higher":[],"custom":true},{"id":"cmqxj4ewtrwg","name":"Слово силы: исцеление","level":9,"classes":["bard","cleric"],"time":"1 действие","range":"Касание","dur":"Мгновенная","conc":false,"rit":false,"desc":["Волна целительной энергии окутывает существо, которого вы касаетесь. Цель восстанавливает все свои хиты. Если существо испугано, очаровано, ошеломлено или парализовано, это состояние оканчивается. Если существо лежит ничком, оно может реакцией встать. Это заклинание не оказывает никакого эффекта на Нежить и Конструктов."],"higher":[],"custom":true},{"id":"cmqxj4jo3btc","name":"Слово силы: смерть","level":9,"classes":["bard","sorcerer","warlock","wizard"],"time":"1 действие","range":"12","dur":"Мгновенная","conc":false,"rit":false,"desc":["Вы произносите слово силы, заставляющее существо, которое вы видите в пределах дистанции, мгновенно умереть. Если у выбранного вами существа 100 хитов или меньше, оно умирает. В противном случае это заклинание не оказывает никакого эффекта."],"higher":[],"custom":true},{"id":"cmqxj4ophiwb","name":"Смертный ужас","level":9,"classes":["warlock","wizard"],"time":"1 действие","range":"24","dur":"До 1 минуты","conc":true,"rit":false,"desc":["Воззвав к сильнейшим страхам группы существ, вы создаёте иллюзорных существ в их сознаниях, видимых только для них. Все существа в сфере с радиусом 6 клеток с центром на выбранной точке в пределах дистанции, должны совершить спасбросок Мудрости. При провале существо становится испуганным на время длительности заклинания. Иллюзия взывает к самым потаённым страхам, проявляясь в виде худших кошмаров и неумолимой угрозы. В конце каждого своего хода испуганное существо должно преуспевать в спасброске Мудрости, иначе оно получает урон психической энергией 4d10. При успехе для этого существа заклинание оканчивается."],"higher":[],"custom":true},{"id":"cmqxj4ui1m78","name":"Утрата времени","level":9,"classes":[],"time":"1 действие","range":"18","dur":"Мгновенная","conc":false,"rit":false,"desc":["Вы нацеливаетесь на существо, видимое в пределах дистанции, и подвергаете его процессу опустошающего старения. Существо должно совершить спасбросок Телосложения. При провале существо получает 10d12 урона некротической энергией, и половину этого урона при успехе. При провале существо стареет до той степени, при которой оно умрет от старости через 30 суток. В таком состоянии цель совершает броски атаки, проверки характеристик и спасброски с помехой, и её скорость уменьшена вдвое. Только заклинания исполнение желаний [wish] и высшее восстановление [greater restoration], наложенное как заклинание 9-го уровня, могут обратить вспять эти эффекты и вернуть цели её предыдущий возраст."],"higher":[],"custom":true},{"id":"cmr5uxk1cwe1","kind":"ability","name":"Сотворение заклинаний","classes":["cleric","artificer","paladin"],"desc":["Вы научились использовать молитву и медитацию для сотворения заклинаний.\nКогда вы достигаете 4-го и 10-го уровней Жреца, вы изучаете ещё по одному заговору из списка заклинаний Жреца по вашему выбору, как\nпоказано в столбце «Заговоры» в таблице «Умения Жреца»."],"custom":true},{"id":"cmr5v0xpqmrr","kind":"ability","name":"Божественный орден: Чудотворец","classes":["cleric"],"desc":["Вы знаете один дополнительный заговор из списка заклинаний Жреца. Кроме того, ваша мистическая связь с божественным даёт вам бонус к вашим проверкам Интеллекта (Тайная магия или Религия). Бонус равен вашему модификатору Мудрости (минимум +1)."],"custom":true},{"id":"cmr5v2pwzil6","kind":"ability","name":"Проведение божественности","classes":["cleric"],"desc":["Вы восстанавливаете одно потраченное использование после окончания Короткого отдыха, и все потраченные использования после окончания Долгого отдыха. Вы получаете дополнительные использования,\nкогда достигаете определённых уровней Жреца, как показано в столбце «Проведение божественности» таблицы «Умения Жреца».","Божественная искра. Выберите существо, бросьте 1d8 и добавьте свой модификатор Мудрости. Вы либо восстанавливаете этому существу количество Хитов, равное этой сумме, либо заставляете существо совершить спасбросок Телосложения. При провале существо получает\nурон Некротической энергией или Излучением, равный этой сумме. При\nуспехе существо получает половину этого урона (округляя в меньшую сторону).\nВы бросаете дополнительную d8, когда достигаете 7-го (2d8), 13-го (3d8) и 18-го (4d8) уровней Жреца.","Изгнание нежити. Действие. Каждая Нежить по вашему выбору в\nпределах 6 клеток должна совершить спасбросок Мудрости. При провале существо становится Испуганным и Недееспособным на 1 минуту. В\nтечение этого времени каждый свой ход существо пытается переместиться как можно дальше от вас. Этот эффект заканчивается на существе досрочно, если оно получает урон, вы становитесь Недееспособным или умираете."],"custom":true},{"id":"cmr5vmpo8mdh","kind":"ability","name":"Коварная атака","classes":["rogue"],"desc":["Один раз за ход вы можете нанести дополнительно 1d6 урона одному существу, по которому вы попали броском атаки, совершённым с Преимуществом, используя Дальнобойное или Фехтовальное оружие. Тип\nдополнительного урона совпадает с типом урона вашего оружия.\nВам не нужно совершать бросок атаки с Преимуществом, если хотя бы один из ваших союзников находится в 1 клетке от цели, он не является Недееспособным, и вы совершаете бросок атаки без Помехи.\nДополнительный урон увеличивается, по мере получения уровней Плута, как показано в столбце «Коварная атака» таблицы «Умения Плута»."],"custom":true},{"id":"cmr5vrffdg31","kind":"ability","name":"Искусное владение оружием","classes":["rogue"],"desc":["Надрез — позволяет сделать дополнительную атаку вторым лёгким оружием без траты бонусного действия (для кинжалов)\nУязвимость — если попал по цели, следующая атака по ней до конца твоего следующего хода совершается с преимуществом (для лука)"],"custom":true},{"id":"cmr5vubpxobr","kind":"ability","name":"Хитрое действие","classes":[],"desc":["В свой ход вы можете Бонусным действием совершить одно из следующих действий: Засада, Отход или Рывок\nРывок: получаете дополнительное перемещение, равное вашей скорости, до конца хода.\nОтход: ваше перемещение до конца хода не провоцирует атаки по возможности.\nЗасада: пытаетесь скрыться, совершая проверку Ловкости (Скрытность), если есть условия, чтобы спрятаться."],"custom":true},{"id":"cmr5w4m2iu7n","kind":"ability","name":"Дикий атакующий","classes":["paladin"],"desc":["Один раз за ход, когда вы попадаете по цели оружием, вы можете бросить кость урона оружия дважды и использовать любой из выпавших результатов по этой цели."],"custom":true},{"id":"cmr5wa8vbw70","kind":"ability","name":"Возложение рук","classes":[],"desc":["У вас есть запас целительной силы, который восстанавливается после окончания Долгого отдыха. С его помощью вы можете восстановить количество Хитов, равное вашему пятикратному уровню Паладина.\nБонусным действием вы можете прикоснуться к существу (включая себя) и, зачерпнув целительную силу из запаса, восстановить существу Хиты в количестве, не превышающем оставшихся в запасе.\nВы также можете потратить 5 Хитов из запаса целительной силы и снять с существа состояние Отравленный вместо восстановления его Хитов."],"custom":true},{"id":"cmr5wihz4hlv","kind":"ability","name":"Искусное владение оружием","classes":["paladin"],"desc":["Вы можете использовать свойства искусности двух типов оружия, которыми вы владеете, по вашему выбору\nОслабление: при попадании цель получает помеху на следующий бросок атаки, который совершит до начала вашего следующего хода\nЗамедление: при попадании и нанесении урона скорость цели уменьшается на 2 клетки до начала вашего следующего хода"],"custom":true},{"id":"cmr5wlprsrrx","kind":"ability","name":"Кара Паладина","classes":["paladin"],"desc":["У вас всегда подготовлено заклинание Божественная кара. Кроме того, вы можете сотворить его без траты ячейки заклинания и должны закончить\nДолгий отдых, прежде чем сможете сотворить его таким образом повторно."],"custom":true},{"id":"cmr5wv6j3z6z","kind":"ability","name":"Дварфийская устойчивость","classes":[],"desc":["Вы имеете Сопротивление урону Ядом. Вы также совершаете с Преимуществом спасброски, чтобы избежать или окончить состояние Отравленное."],"custom":true},{"id":"cmr5wwhe2afu","kind":"ability","name":"Дварфийская крепость.","classes":[],"desc":["Ваш максимум Хитов увеличивается на 1, и каждый раз, когда вы получаете уровень, снова увеличивается на 1."],"custom":true},{"id":"cmr5wxedge3u","kind":"ability","name":"Знание камня","classes":[],"desc":["Бонусным действием вы получаете Чувство вибрации в пределах 12 клеток на\n10 минут. Вы должны находиться на каменной поверхности или прикасаться к ней, чтобы воспользоваться этим чувством."],"custom":true},{"id":"cmr5wyt26bpt","kind":"ability","name":"Кошачье проворство","classes":[],"desc":["Ваши рефлексы и проворство позволяют вам двигаться с увеличением скорости. Когда вы двигаетесь в бою в свой ход, вы можете удвоить свою скорость до конца хода\nИспользовав эту особенность, вы не можете использовать её снова, до тех пор пока вы не переместитесь на 0 футов в один из ваших ходов"],"custom":true},{"id":"cmr5x022kgob","kind":"ability","name":"Кошачьи когти","classes":[],"desc":["Из-за ваших когтей у вас есть скорость лазания 4 клетки. Кроме того, ваши когти — это природное оружие, которое вы можете использовать, совершая безоружные удары.","Если вы совершаете атаку ими, вы наносите рубящий урон, равный 1d4 + ваш модификатор Силы, вместо дробящего урона, обычного для безоружного удара"],"custom":true},{"id":"cmr5x2i4kukp","kind":"ability","name":"Гномья хитрость","classes":[],"desc":["Вы совершаете с Преимуществом спасброски Интеллекта, Мудрости и\nХаризмы"],"custom":true},{"id":"cmr5x3wwuebd","kind":"ability","name":"Скальный гном","classes":[],"desc":["Вы знаете заговоры Починка\nи Фокусы. Кроме того, вы можете сотворять\nв течение 10 минут заклинание Фокусы, чтобы\nсоздать Крошечное заводное устройство (КЗ 5,\n1 Хит), такое как игрушка, зажигалка или музыкальная шкатулка. Когда вы создаете устройство, вы определяете его функцию, выбрав\nодин из эффектов заклинания Фокусы. Каждый\nраз, когда вы или другое существо прикасаетесь к устройству и включаете его Бонусным\nдействием, оно создаёт выбранный эффект.\nЕсли у этого эффекта есть различные виды,\nвы выбираете его при создании устройства.\nНапример, если вы выбираете эффект зажечь/\nпогасить пламя, вы также должны выбрать, создаёт ли устройство огонь или гасит его. Оно не\nможет делать и то, и другое. Вы можете иметь\nтри таких устройства одновременно, но каждое\nиз них разваливается на части спустя 8 часов\nпосле создания, или когда вы прикасаетесь и\nразбираете его действием Использование"],"custom":true},{"id":"cmr5x67lnk37","kind":"ability","name":"Магический мастеровой","classes":["artificer"],"desc":["Вы научились вкладывать искру магии в обычные предметы. Чтобы использовать это умение, вы должны держать в руках воровские инструменты или инструменты ремесленника. Затем действием вы касаетесь Крошечного немагического объекта и наделяете его одним из следующих магических свойств на ваш выбор:","Зачарованный объект излучает яркий свет в радиусе 1 клетки и тусклый свет в радиусе еще 1 клетка.\nОбъект проигрывает записанное сообщение, которое можно услышать в пределах 2 клеток каждый раз, когда до него дотрагивается существо. Вы произносите это сообщение, когда наделяете объект данным свойством, а сама запись не может быть длиннее 6 секунд.\nОбъект непрерывно испускает запах или издаёт звук на ваш выбор (ветер, волны, стрекотание и прочее). Выбранное явление можно ощутить на расстоянии 2 клеток.\nСтатичный визуальный эффект появляется на одной из поверхностей объекта. Этот эффект может быть изображением, текстом до 25 слов, линиями и формами или совмещением этих элементов по вашему выбору.\nВыбранное свойство навсегда остается присущим объекту. Действием вы можете коснуться объекта и лишить его этого свойства.","Таким образом можно наделить магическими свойствами несколько предметов, касаясь одного предмета каждый раз, когда вы используете это умение, но не больше, чем одно свойство на один предмет. Максимальное количество объектов, которые вы можете наделить магическими свойствами этим умением одновременно, равно вашему модификатору Интеллекта (минимум один объект). Если вы пытаетесь превысить свой максимум, самое старое свойство немедленно заканчивается, а затем начинает действовать новое свойство."],"custom":true},{"id":"cmr5x6zofwti","kind":"ability","name":"Инфузирование предмета","classes":[],"desc":["Вы получаете способность вливать в обычные предметы определённую магию и превращать их в магические.","ИЗВЕСТНЫЕ ИНФУЗИИ\nПолучив это умение, выберите четыре инфузии из раздела Инфузии изобретателя. При достижении определённых уровней вы изучаете дополнительные инфузии на ваш выбор, как показано в столбце «Известные инфузии» таблицы Изобретатель.","Всякий раз, когда вы получаете уровень в этом классе, можете заменить одну из уже изученных инфузий на новую.","НАСЫЩЕНИЕ ПРЕДМЕТА МАГИЕЙ\nЗаканчивая продолжительный отдых, вы можете дотронуться до немагического объекта и с помощью инфузии сделать его магическим предметом. Инфузия действует только на те виды предметов, которые указаны в её описании. Если созданный предмет требует настройки, вы можете настроиться на него сразу же. Если вы решили настроиться на предмет позже, то должны будете сделать это, используя обычный процесс настройки (см. раздел «Настройка» в «Руководстве Мастера»).","Ваша инфузия остаётся в предмете бесконечно долго, но если вы умираете, она исчезает через количество дней, равное вашему модификатору Интеллекта (минимум 1 день). Исчезает она также, если вы отказываетесь от знания этой инфузии, чтобы изучить другую.","Заканчивая продолжительный отдых, вы можете наполнить магией более одного немагического объекта. Максимальное их количество отображено в столбце «Инфузии предметов» таблицы «Изобретатель». Вы должны касаться предмета, и каждая из ваших инфузий может быть применена только к одному объекту единовременно. Более того, ни один предмет не выдержит попытки наполнения его более чем одной инфузией. Если вы попытаетесь превысить максимальное количество инфузий, самая старая из них немедленно заканчивается, а затем применяется новая.","Если на предмете, в котором содержатся другие вещи, например, сумке хранения [bag of holding], заканчивается действие инфузии, его содержимое просто появляется вокруг него."],"custom":true},{"id":"cmr6617cpf90","kind":"ability","name":"Самоделкин","classes":[],"desc":["Скидка. Каждый раз, когда вы покупаете немагический предмет, вы получаете на него 20-процентную скидку.\nБыстрое изготовление. После окончания Долгого отдыха вы можете изготовить один предмет\nснаряжения из таблицы «Быстрое изготовление»,\nесли у вас есть необходимые Ремесленные инструменты, и вы владеете ими. Предмет существует до завершения вашего следующего Долгого отдыха, после чего разваливается на части.","Быстрое изготовление\nРемесленные инструменты Изготавливаемое снаряжение\nИнструменты плотника - Лестница, Факел\nИнструменты кожевника - Кошель, Тубус для карт и свитков, Футляр для арбалетных болтов\nИнструменты каменщика - Блок и лебедка\nИнструменты гончара - Кувшин, Лампа\nИнструменты кузнеца - Ведро, Железный горшок, Калтропы, Крюк-кошка,\nМеталлические шарики\nИнструменты ремонтника - Колокольчик, Лопата, Трутница\nИнструменты ткача - Верёвка, Корзина, Палатка, Сеть\nИнструменты резчика по дереву - Боевой посох, Дубинка, Палица"],"custom":true}];

function ru(s){
  if(!s) return s;
  const d=[[/Concentration, up to /gi,"Концентрация, до "],[/Up to /gi,"До "],
    [/Instantaneous/gi,"Мгновенная"],[/Until dispelled or triggered/gi,"Пока не рассеется/сработает"],
    [/Until dispelled/gi,"Пока не рассеется"],[/^Self/gi,"На себя"],[/^Touch$/gi,"Касание"],
    [/\bSight\b/gi,"Видимость"],[/\bUnlimited\b/gi,"Без предела"],[/\bSpecial\b/gi,"Особая"],
    [/1 action(?!\w)/gi,"1 действие"],[/1 bonus action/gi,"1 бонусное действие"],
    [/1 reaction/gi,"1 реакция"],[/(\d+)-foot/gi,"$1-фт"],[/(\d+) feet/gi,"$1 фт"],
    [/(\d+) mile(s)?/gi,"$1 миль"],[/(\d+) minute(s)?/gi,"$1 мин"],[/(\d+) hour(s)?/gi,"$1 ч"],
    [/(\d+) day(s)?/gi,"$1 дн"],[/(\d+) round(s)?/gi,"$1 раунд"]];
  let r=s; for(const [re,rep] of d) r=r.replace(re,rep); return r;
}

// Хранилище: на настоящем сайте/файле — localStorage; в предпросмотре Claude — window.storage.
const Store=(function(){
  let ls=null;
  try{ const k="__t"+Math.random(); window.localStorage.setItem(k,"1"); window.localStorage.removeItem(k); ls=window.localStorage; }catch(e){ ls=null; }
  return {
    async get(key){ if(ls){ const v=ls.getItem(key); return v==null?null:{value:v}; }
      try{ return await window.storage.get(key); }catch(e){ return null; } },
    async set(key,val){ if(ls){ try{ ls.setItem(key,val); }catch(e){} return; }
      try{ await window.storage.set(key,val); }catch(e){} }
  };
})();
async function loadAll(){
  try{ const r=await Store.get("theme"); applyTheme(r&&r.value?r.value:"dark"); }catch(e){ applyTheme("dark"); }
  try{ const r=await Store.get("prepared"); if(r&&r.value) prepared=new Set(JSON.parse(r.value)); }catch(e){}

  try{ const r=await Store.get("customSpells"); if(r&&r.value) customLocal=JSON.parse(r.value); }catch(e){}
  try{ const r=await Store.get("slots"); slots = (r&&r.value)?JSON.parse(r.value):defaultSlots(); }catch(e){ slots=defaultSlots(); }
  Object.keys(SLOT_MAX).forEach(l=>{
    if(!Array.isArray(slots[l])) slots[l]=new Array(SLOT_MAX[l]).fill(0);
    else{ slots[l]=slots[l].slice(0,SLOT_MAX[l]); while(slots[l].length<SLOT_MAX[l]) slots[l].push(0); }
  });
  renderSlots();
  let seedV=0; try{ const r=await Store.get("seedVersion"); if(r&&r.value) seedV=+r.value; }catch(e){}

    customLocal=SEED_SPELLS.map(s=>Object.assign({},s));

}
function diceFix(s){ return (s||"")
  .replace(/(\d+)\s?[кКkK](\d+)/g,"$1d$2")
  .replace(/[кКkK](100|20|12|10|8|6|4)\b/g,"d$1"); }
function srcFix(s){ return (s||"")
  .replace(/\[[^\]]*\]\([^)]*\)/g,"")       // ссылки [текст](url)
  .replace(/[A-Z]{2,5}\d{0,3}/g,"")          // коды источников: PH14, PH24, PHB, XGE…
  .replace(/\s{2,}/g," ").replace(/\s+([.,;:!?])/g,"$1").trim(); }
function clean(s){ return diceFix(feetText(srcFix(s))); }
function feetText(s){
  if(!s) return s;
  // прилагательные: 15-футовый конус → 3-клеточный конус
  s=s.replace(/(\d+)\s*-?\s*футов(ый|ого|ому|ом|ая|ую|ое|ые|ых|ыми|ым|ой)/gi,(m,n,end)=>{
    if(+n<5) return m; return Math.round(n/5)+"-клеточн"+end; });
  // существительные: «30 футов», «30 футах»
  s=s.replace(/(\d+)\s+фут(ов|а|ах)?(?![а-яёa-z])/gi,(m,n,end,off,str)=>{
    if(+n<5) return m;
    const c=Math.round(n/5), one=(c%10===1&&c%100!==11);
    if(end==="ах") return c+" "+(one?"клетке":"клетках");
    const before=str.slice(Math.max(0,off-20),off).toLowerCase();
    const gen=/(предел|радиус|расстоян|дистанц)[а-яё]*\s*$|\bдо\s*$|\bна\s*$/.test(before);
    return c+" "+(gen?(one?"клетки":"клеток"):cellsPlural(c)); });
  return s;
}
function durClean(s){ s=(s||"").trim();
  s=s.replace(/^концентрац[а-яё]*,?\s*(?:вплоть\s+)?до\s+/i,"До ");
  s=s.replace(/^концентрац[а-яё]*$/i,"");
  return s; }
function timeClean(s){ s=(s||"").trim(); return /реакц/i.test(s)?"Реакция":s; }
async function migrateDice(){
  let changed=false;
  for(const s of customLocal){
    const desc=(s.desc||[]).filter(p=>!/^\s*подкласс/i.test(p)).map(p=>feetText(diceFix(p)));
    const higher=(s.higher||[]).map(p=>feetText(diceFix(p)));
    if(JSON.stringify(desc)!==JSON.stringify(s.desc||[])){ s.desc=desc; changed=true; }
    if(JSON.stringify(higher)!==JSON.stringify(s.higher||[])){ s.higher=higher; changed=true; }
    if(s.dur && /концентрац/i.test(s.dur)){ const cd=durClean(s.dur); if(cd!==s.dur){ s.dur=cd; s.conc=true; changed=true; } }
    if(s.time && /реакц/i.test(s.time) && s.time!=="Реакция"){ s.time="Реакция"; changed=true; }
    // старые записи: абзац про усиление мог остаться в описании — вынесем в «высокие уровни»
    if(!isAbility(s) && (!s.higher||!s.higher.length) && (s.desc||[]).length){
      let di=-1;
      for(let j=0;j<s.desc.length;j++){ if(HIGHER_RE.test(s.desc[j])){ di=j; break; } }
      if(di>=0){
        const high=s.desc.slice(di).map(p=>stripHigherHead(p)).filter(Boolean);
        s.desc=s.desc.slice(0,di); s.higher=high; changed=true;
      }
    }
  }
  if(changed) await saveCustom();
}
async function savePrepared(){ try{ await Store.set("prepared",JSON.stringify([...prepared])); }catch(e){} }
async function savePinned(){ try{ await Store.set("pinned",JSON.stringify([...pinned])); }catch(e){} }
async function saveCustom(){ try{ await Store.set("customSpells",JSON.stringify(customLocal)); }catch(e){} }
async function saveSlots(){ try{ await Store.set("slots",JSON.stringify(slots)); }catch(e){} }
function renderSlots(){
  const wrap=document.getElementById("slotsWrap");
  if(!wrap) return;
  function rowsFor(levels){
    return levels.map(lvl=>{
      const n=SLOT_MAX[lvl], arr=slots[lvl]||new Array(n).fill(0), color=LEVEL_COLORS[+lvl]||"var(--gold)";
      let cells="";
      for(let i=0;i<n;i++){
        const st=arr[i]||0;
        const cls= st===1?"ready": st===2?"used":"notget";
        const inner= st===0?'<span class="slotx">✕</span>' : st===2?'<span class="slotdot"></span>' : "";
        cells+=`<span class="slot ${cls}" data-lvl="${lvl}" data-i="${i}" style="--sc:${color}">${inner}</span>`;
      }
      return `<div class="slotrow"><span class="slotlvl">${lvl} ур.</span><span class="slotcells">${cells}</span></div>`;
    }).join("");
  }
  wrap.innerHTML=`<div class="slots-block">
    <div class="slots-col"><div class="slots-inner">${rowsFor([1,2,3])}</div></div>
    <div class="slots-col"><div class="slots-inner">${rowsFor([4,5,6])}</div></div>
  </div>`;
}
(function(){
  let pressTimer=null, longFired=false;
  function getSlot(e){ return e.target.closest(".slot"); }
  function clearTimer(){ if(pressTimer){ clearTimeout(pressTimer); pressTimer=null; } }
  function startPress(e){
    const el=getSlot(e); if(!el) return;
    longFired=false;
    clearTimer();
    pressTimer=setTimeout(()=>{
      longFired=true;
      const lvl=el.dataset.lvl, i=+el.dataset.i;
      if((slots[lvl][i]||0)!==0){ slots[lvl][i]=0; renderSlots(); saveSlots(); }
    },2000);
  }
  function endPress(){ clearTimer(); }
  let lastClickAt={};
  document.addEventListener("pointerdown",e=>{ if(getSlot(e)) startPress(e); });
  document.addEventListener("pointerup",endPress);
  document.addEventListener("pointercancel",endPress);
  document.addEventListener("pointerleave",endPress,true);
  document.addEventListener("click",e=>{
    const el=getSlot(e); if(!el) return;
    if(longFired){ longFired=false; return; }
    const lvl=el.dataset.lvl, i=+el.dataset.i;
    const key=lvl+":"+i, now=Date.now();
    if(lastClickAt[key] && now-lastClickAt[key]<350) return;
    lastClickAt[key]=now;
    const cur=slots[lvl][i]||0;
    slots[lvl][i]= cur===0?2 : cur===2?1 : 2;
    renderSlots(); saveSlots();
  });
})();

// ---------- merged list (official + baked + local; local wins on same id) ----------
function isAbility(s){ return s && s.kind==="ability"; }
function allSpells(){
  const m=new Map();
  for(const s of OFFICIAL) m.set(s.id,s);
  for(const s of CUSTOM_SPELLS_BAKED) m.set(s.id,Object.assign({},s,{custom:true}));
  for(const s of customLocal) m.set(s.id,Object.assign({},s,{custom:true}));
  return [...m.values()].sort((a,b)=>{
    const ka=isAbility(a)?1:0, kb=isAbility(b)?1:0;
    if(ka!==kb) return ka-kb;                                   // умения в самый низ
    if(ka===1) return a.name.localeCompare(b.name,"ru");        // умения по имени
    return (a.level-b.level)||a.name.localeCompare(b.name,"ru");// заклинания по уровню
  });
}

  h+='</div></div><div class="frow"><div class="flabel">Время накладывания</div><div class="chips" data-grp="times">';
  for(const t of TIME_FILTERS) h+=`<div class="chip" data-v="${t[0]}">${t[1]}</div>`;
  h+='</div></div><div class="frow"><div class="flabel">Тип</div><div class="chips" data-grp="kinds">'
    +'<div class="chip" data-v="spell">Заклинания</div><div class="chip" data-v="ability">Умения</div></div></div>';
  h+='<div class="frow"><div class="flabel">Свойства</div><div class="chips" data-grp="flags">'
    +'<div class="chip" data-v="conc">Концентрация</div><div class="chip" data-v="ritual">Ритуал</div></div></div>';
  h+='<button class="clearf" id="clearf">Сбросить фильтры</button>';
  p.innerHTML=h;
  p.querySelectorAll(".chip").forEach(ch=>ch.addEventListener("click",()=>{
    const grp=ch.parentElement.dataset.grp,v=ch.dataset.v;
    if(grp==="levels")toggle(state.levels,+v);
    else if(grp==="classes")toggle(state.classes,v);
    else if(grp==="times")toggle(state.times,v);
    else if(grp==="kinds")toggle(state.kinds,v);
    else if(grp==="flags"){ if(v==="conc")state.conc=!state.conc; else state.ritual=!state.ritual; }
    ch.classList.toggle("on"); updateFbtn(); render();
  }));
  document.getElementById("clearf").addEventListener("click",()=>{
    state.levels.clear();state.classes.clear();state.times.clear();state.kinds.clear();state.conc=false;state.ritual=false;
    p.querySelectorAll(".chip.on").forEach(c=>c.classList.remove("on")); updateFbtn(); render();
  });
}
const TIME_FILTERS=[["action","Действие"],["bonus","Бонусное действие"],["reaction","Реакция"],["minute","Минуты"],["hour","Часы"]];
function categorizeTime(t){t=(t||"").toLowerCase();
  if(/бонусн/.test(t))return"bonus"; if(/реакц/.test(t))return"reaction";
  if(/действие/.test(t))return"action"; if(/мину/.test(t))return"minute";
  if(/час/.test(t))return"hour"; return"other";}
function timeShort(t){
  if(!t) return "";
  const c=categorizeTime(t);
  if(c==="action") return "Действие";
  if(c==="bonus") return "Бонус. действие";
  if(c==="reaction") return "Реакция";
  return t;
}
const LEVEL_COLORS=["#1ab6f0","#22c55e","#eec91f","#ff8a1e","#ef4136",
  "#f0459e","#a3123a","#a855f7","#4f46e5","#5b4fe0"];
const TAG_COLORS={conc:"#12b6c4",rit:"#dba321",abil:"#a463e8"};
function contrastText(hex){
  const c=hex.replace("#","");
  const r=parseInt(c.substr(0,2),16),g=parseInt(c.substr(2,2),16),b=parseInt(c.substr(4,2),16);
  const l=(0.299*r+0.587*g+0.114*b)/255;
  return l>0.58 ? "#241a08" : "#fff";
}
function badgeHtml(text,bg){
  if(!text) return "";
  return `<span class="badge" style="background:${bg};border-color:${bg};color:${contrastText(bg)}">${esc(text)}</span>`;
}
function typeBadgeHtml(text,level){
  if(!text) return "";
  if(level===9) return `<span class="badge lvl9">${esc(text)}</span>`;
  return badgeHtml(text,LEVEL_COLORS[Math.min(Math.max(level|0,0),9)]);
}
function toggle(set,v){ set.has(v)?set.delete(v):set.add(v); }
function activeFilterCount(){return state.levels.size+state.classes.size+state.times.size+state.kinds.size+(state.conc?1:0)+(state.ritual?1:0);}
function updateFbtn(){const b=document.getElementById("ftoggle"),n=activeFilterCount();
  b.querySelector("span").textContent=n?`Фильтры · ${n}`:"Фильтры"; b.classList.toggle("act",n>0);}

function matches(s){
  if(state.view==="prep" && !prepared.has(s.id) && !pinned.has(s.id)) return false;
  if(state.q){
    const hay=(s.name+" "+(s.desc||[]).join(" ")+" "+(s.higher||[]).join(" ")+" "+(s.time||"")+" "+(s.range||"")+" "+(s.dur||"")).toLowerCase();
    if(!hay.includes(state.q)) return false;
  }
  if(state.kinds.size && !state.kinds.has(isAbility(s)?"ability":"spell")) return false;
  if(state.classes.size && !(s.classes||[]).some(c=>state.classes.has(c))) return false;
  if(!isAbility(s)){
    if(state.levels.size && !state.levels.has(s.level)) return false;
    if(state.times.size && !state.times.has(categorizeTime(s.time))) return false;
    if(state.conc && !s.conc) return false;
    if(state.ritual && !s.rit) return false;
  } else if(state.levels.size || state.times.size || state.conc || state.ritual){
    return false;   // умения не подходят под фильтры, специфичные для заклинаний
  }
  return true;
}

// ---------- helpers ----------
function esc(t){return (t||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}
function splitRow(l){ l=(l||"").trim();
  let i=l.indexOf("\t"); if(i>=0) return [l.slice(0,i).trim(), l.slice(i+1).replace(/\t/g," ").trim()];
  i=l.search(/\s[-—–]\s/); if(i>=0) return [l.slice(0,i).trim(), l.slice(i).replace(/^\s[-—–]\s/,"").trim()];
  return null; }
function rowLine(l){ l=(l||"").trim();
  if(l.indexOf("\t")>=0) return true;                         // таб = таблица
  const f=l.split(/\s[-—–]\s/);
  if(f.length>=3) return true;                                // 3+ колонок через тире — заголовок/строка
  if(f.length===2) return /^(d\d+|\d+([-–—]\d+)?)$/i.test(f[0].trim()); // 2 колонки — только числовой ключ
  return false; }
function isTableBlock(p){
  if(!p||p.indexOf("\n")<0) return false;
  const lines=p.split("\n").map(l=>l.trim()).filter(Boolean);
  if(lines.length<2) return false;
  const rows=lines.filter(rowLine).length;
  return rows>=2 && rows/lines.length>=0.6;
}
function tableCells(line){ line=(line||"").trim();
  if(line.indexOf("\t")>=0) return line.split("\t").map(c=>c.trim());
  if(/\s[-—–]\s/.test(line)) return line.split(/\s[-—–]\s/).map(c=>c.trim());
  return [line]; }
function renderTable(block){
  let lines=block.split("\n").map(l=>l.trim()).filter(Boolean);
  let caption="";
  if(tableCells(lines[0]).length<2 && lines.length>1){ caption=lines[0]; lines=lines.slice(1); }
  const rows=lines.map(tableCells);
  const ncol=Math.max.apply(null,rows.map(r=>r.length));
  rows.forEach(r=>{ while(r.length<ncol) r.push(""); });
  let h=(caption?'<div class="sp-tcap">'+esc(caption)+'</div>':'')
    +'<div class="sp-twrap"><table class="sp-tbl"><thead><tr>';
  rows[0].forEach(c=>h+='<th>'+esc(c)+'</th>');
  h+='</tr></thead><tbody>';
  for(let i=1;i<rows.length;i++){ h+='<tr>'; rows[i].forEach(c=>h+='<td>'+esc(c)+'</td>'); h+='</tr>'; }
  return h+'</tbody></table></div>';
}
function renderDesc(paras,noHighlight){
  paras=paras||[]; const out=[]; let k=0;
  while(k<paras.length){ const p=paras[k];
    if(isTableBlock(p)){ out.push(renderTable(p)); k++; continue; }      // таблица одним блоком
    if(p.indexOf("\n")<0 && rowLine(p)){                                 // таблица из отдельных строк
      let g=[p],j=k+1;
      while(j<paras.length && paras[j].indexOf("\n")<0 && rowLine(paras[j])){ g.push(paras[j]); j++; }
      if(g.length>=2){ out.push(renderTable(g.join("\n"))); k=j; continue; }
    }
    out.push("<p>"+(noHighlight?esc(p):highlightConditions(esc(p)))+"</p>"); k++;
  }
  return out.join("");
}
function attr(t){return (t||"").replace(/&/g,"&amp;").replace(/"/g,"&quot;").replace(/</g,"&lt;");}
function gv(id){return document.getElementById(id).value;}
function newId(){return "c"+Date.now().toString(36)+Math.random().toString(36).slice(2,5);}

function tagInfo(s){
  const ab=isAbility(s);
  if(ab) return [{text:"Умение",cls:"abil"}];
  const tags=[];
  if(s.conc) tags.push({text:"Конц.",cls:"conc"});
  if(s.rit) tags.push({text:"Ритуал",cls:"rit"});
  return tags;
}
